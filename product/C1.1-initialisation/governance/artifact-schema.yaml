# WP-01 — Registre canonique et configuration projet · artifact-schema.yaml
#
# Sections portées : Entrées d'artefacts · Mapping d'arborescence · Mapping d'identifiants
#
# PROJECTION DU REGISTRE. Chaque entrée est dérivée de work_products.base + files de
# core/method.yaml au commit épinglé du plugin ; l'attribution d'une section à son
# fichier vient de core/templates.yaml. Aucun chemin n'est inventé ici — un chemin
# absent de ce fichier n'existe pas pour la gouvernance (K2).

# ── Mapping d'arborescence ────────────────────────────────────────────────
arborescence:
  convention_preexistante: aucune
  # Dépôt ouvert vide : ni monorepo, ni dossier docs/, ni arborescence applicative
  # antérieure. La convention de la méthode s'applique sans adaptation.
  racine_produit: product/
  racine_run: runs/
  racine_plugin: .factoryzen/   # sous-module épinglé, hors frontière d'écriture produit
  segments_variables:
    "{release-id}": voir identifiants.REL
    "{sprint-id}": voir identifiants.S
    "{version}": voir identifiants.v

# ── Mapping d'identifiants ────────────────────────────────────────────────
identifiants:
  nomenclature_preexistante: aucune
  # Aucun outil de ticketing ni code projet imposé à l'ouverture : la chaîne de
  # traçabilité reste celle de la méthode, sans correspondance à maintenir.
  REL: { local: "—", exemple: "REL-1", note: "identifiant de release" }
  S:   { local: "—", exemple: "S-01", note: "sprint, numéroté par release" }
  v:   { local: "—", exemple: "v0.1", note: "version déployée" }
  WP:  { local: "—", exemple: "WP-01", note: "imposé par le registre" }
  EPI: { local: "—", exemple: "EPI-01", note: "epic de backlog de release" }
  STO: { local: "—", exemple: "STO-014", note: "story de backlog" }
  AC:  { local: "—", exemple: "AC-014-1", note: "critère d'acceptation" }
  RUN: { local: "—", exemple: "RUN-2026-09-21", note: "run de la fabrique" }

# ── Entrées d'artefacts ───────────────────────────────────────────────────
# clé logique · chemin · catégorie · activité productrice · gate · baseline ·
# cumulatif ou figé (lifecycle) · structure
