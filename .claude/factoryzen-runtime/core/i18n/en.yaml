  - entity: Deployment
    produced_at: "21"
    traces_to: delivered STO
    controlled_at: "G4"

routing:
  classes:
    - id: ÉCONOMIQUE
      usage: >-
        Mechanical translation. Reduced window, effort often not adjustable: disqualified for any
        agent that must load a baseline.
      relative_cost: ≈ 0.5×
    - id: INTERMÉDIAIRE
      usage: Routine build, test generation, synthesis.
      relative_cost: 1× (reference)
    - id: AVANCÉE
      usage: Orchestration, design, specification, critique.
      relative_cost: ≈ 2.5×
    - id: POINTE
      usage: >-
        Long-horizon adversarial reasoning. A single proposed use: adversarial security review at
        tier R3.
      relative_cost: ≈ 5×
  rules:
    - id: R1
      rule: The judge is never on a lower class than the producer of the artifact it judges.
      rationale: >-
        A critic weaker than the builder structurally cannot see what the builder missed. Direct
        extension of P2.
    - id: R2
      rule: Lower the effort before lowering the class.
      rationale: >-
        On recent models, a lower effort often matches the previous generation at high effort.
        Moving down the range without having tested the lower effort is optimising blind.
    - id: R3
      rule: At most two classes per cadence, among the agents that share a context prefix.
      rationale: >-
        The prompt cache is scoped per model. Multiplying models can cost more than the downgrade
        saves.
    - id: R4
      rule: >-
        Triggering a critic is CONDITIONAL — by irreversibility and by risk tier, never systematic.
        ALWAYS judged: a work product with a FOUNDATION baseline (frozen at G0), any work product at
        tier R2 or R3, any work product whose gate has already been refused once, and any work
        product whose completion criterion carries an eliminating point — WP-06 and WP-11 are among
        them. On the others, the critic is triggered by the factory-lead and its NON-CONVOCATION is
        written to the Run Ledger with its reason. A critic neither triggered nor recorded is a
        skipped control, not a saving.
      rationale: >-
        Six critic dimensions at class R1 and high effort, convened systematically, consume the
        reasoning budget that production lacks. On a real C1 cadence, eight review reports were
        returned on work products whose content was invented: adversarial capacity spent where
        there was nothing to contradict. The depth of evidence follows risk (P5); so does the depth
        of CRITIQUE, and it did not.
    - id: R5
      rule: >-
        The judge runs on a MODEL different from those of the producers it judges, as soon as the
        adapter serves two models of the required class. Otherwise its verdict is CORRELATED: it is
        rendered and recorded, but it does not count as an independent judgment in tier R2 or R3,
        where the gate authority knows it and weighs it.
      rationale: >-
        P2 separates ROLES; a distinct role on the same model still shares the builder's blind
        spots — same readings, same omissions, same misplaced confidence. The BatiZen run settled
        it through its adjudication: one model proposes, ANOTHER verifies, and the errors the
        second catches are those the first could not see. Two models from the same maker remain
        correlated; less so than a model with itself. R1 comes first: the difference is never
        bought with a lower class.
    - id: R6
      rule: >-
        A modulation is APPLIED at invocation, not just read: the tower computes for each role the
        model and effort of the context — cadence of the open activity, tier, reopening, EXPRESS
        path — and the guard refuses a method role invoked on another model or another effort. A
        class increase that would leave the judge with no distinct model (R5), or that would
        exceed the highest class, carries over to EFFORT, by one level; a decrease never goes
        below INTERMÉDIAIRE.
      rationale: >-
        A modulation written in the registry and never executed was satisfied only by
        coincidence: an agent file carries a single model, and a security review at tier R3 ran
        on the model of a routine slice. Carrying over to effort what the class can no longer give
        follows R2 — effort is the first lever — and keeps the judge's model independence where
        the method always judges: the foundation.
  modulation:
    - id: M1
      trigger: Cadence C1 — work on the foundation
      effect: +1 class on all agents involved, except the critics (MCR-004)
    - id: M2
      trigger: Tier R2 or R3
      effect: +1 class on security-engineer, critic(pentest), principal-engineer
    - id: M3
      trigger: Reopening of a gate already refused
      effect: +1 class on the producer AND on its critic
    - id: M4
      trigger: EXPRESS path
      effect: −1 class allowed, except quality-engineer, and without ever violating R1

adapter_obligations:
  - obligation: >-
      No implicit decision leaves activity 2: each branch is settled with a reason, or named HYP-nn
      labelled UNVALIDATED with a falsification criterion and a test point.
    written_at: Exit criterion of activity 2
    tooling: >-
      grilling — external interrogation primitive, adopted and pinned — driven by the
      interrogatoire skill: one question at a time, through the harness's structured-questions
      mechanism.
  - obligation: >-
      A design brief is filled in before activities 8 and 14; missing questions go out in a single
      burst of at most four.
    written_at: WP-16
    tooling: The harness's structured-questions mechanism.
  - obligation: Aesthetic direction, token system, executable prototype.
    written_at: Activities 8, 10, 15, 20
    tooling: >-
      The harness's artboard canvas and design skills, under the craft floor of the impeccable
      capability.
  - obligation: >-
      The design stack is settled by ADR BEFORE the first visual decision, and the product's tokens
      and components are a DELTA on the chosen base. A component rewritten from scratch is so
      because the base does not cover it, and the reason is written.
    written_at: WP-08 — section "Design stack and component base"; activity 8 — entry criterion
    tooling: >-
      The adapter's assisted interface design. The core names the capability; the adapter names
      the tool that satisfies it.
  - obligation: >-
      Every design work product carries a DEPLOYED preview URL, openable without installation. A
      local file to open from a repository is not a preview: it is not reviewed, and a work product
      that is not reviewed proves nothing.
    written_at: Activities 10, 15 and 20 — exit criteria; WP-11, WP-19, WP-26
    tooling: The adapter's preview deployment. The plugin deploys nothing itself.
  - obligation: >-
      No interface edit starts before the craft floor has been read, and verification happens in
      bounded passes — one grouped desktop and mobile inspection, one batch fix, one confirmation,
      then stop. The surface mode — Persuade, Operate, Read, Experience — is declared before the
      first visual decision.
    written_at: Activities 8, 10, 15, 17 and 20 — verification criteria
    tooling: impeccable — external design craft floor, adopted as guidance only and pinned.
  - obligation: >-
      When a product opens, a workspace readable by a non-developer exists, modelled on the
      method's cadences and steps, and it is COMPUTED from the registry — never drawn by hand.
    written_at: Activity 1 — exit criterion
    tooling: The core renders the plan with "apf notion plan"; the adapter executes it through its connector.
  - obligation: >-
      Every work product produced carries, besides its declared path, the address of its page in
      the workspace — and that page carries back the path and the commit.
    written_at: Verification before handover of each skill
    tooling: '"apf notion link" records the pointer and checks it; the adapter writes the page.'
  - obligation: >-
      Activities 3, 4 and 6 establish external facts — approved sources of the domain, observed
      needs, the product's REAL CORPUS — that the human does not hold. An agent must be able to go
      and fetch them and report them SOURCED, rather than return them as UNVALIDATED for lack of
      access — or, worse, fabricate a fixture to unblock downstream work.
    written_at: Activities 3, 4 and 6 — verification criteria
    tooling: The adapter's web search and reading tool, granted to researcher profiles only.
  - obligation: >-
      An agent's activity is OBSERVABLE while it happens: tools called, files touched, guard
      verdicts, sub-agents convened, model actually served and tokens consumed. A run that cannot
      be watched cannot be steered: it is told after the fact, by the very one who executed it.
    written_at: observability
    tooling: >-
      The harness's lifecycle hooks for emission, a projection platform for display. The plugin
      only emits lines and talks to no one else.
  - obligation: >-
      An agent's declared capability class can be CONFRONTED with the model that served it. As long
      as the served model was recorded nowhere, R1 and R3 were intentions.
    written_at: R1, R3 — and observability.events → session_end
    tooling: The harness transcript, read at the end of the turn. No interception.
  - obligation: >-
      An interrogation conduct declared by a skill is ENFORCEABLE, not only read: during the
      activity that carries it, a call to the structured-questions mechanism that asks several
      questions is refused before the human sees them, and a turn whose text asks several is sent
      back once to keep only one. The control fails open and never sends the same turn back twice;
      every deviation is traced.
    written_at: interrogatoire skill — "one question at a time" conduct, activity 2
    tooling: >-
      The adapter's hooks: before the structured-questions mechanism, and at the end of the turn on
      the transcript. The rule stays in the registry; the hook reads it.
  - obligation: An evaluator role cannot write into what it evaluates.
    written_at: K6
    tooling: The adapter's hooks, as prevention. The floor remains CI.
  - obligation: A critic's capability class is never lower than the producer's.
    written_at: R1
    tooling: The adapter's class → model mapping table, and a check before invocation.

adoption_gate:
  - criterion: Writes no file and executes no code. Conversational or analytical.
    gate: NO gate. Immediate installation. One line in the registry, after the fact.
  - criterion: Writes files.
    gate: >-
      THREE QUESTIONS, two minutes: where does it write · does it carry its own state · what does
      it depend on transitively. Then pinning and entry in the registry.
  - criterion: Executes code, accesses the network, or touches the foundation or production.
    gate: "Full ritual: reading, sandbox, pinning, recorded human approval."

control_tower:
  logic: >-
    lib/tower.mjs — no rule lives in the MCP handler; the CLI, the hooks and CI call the same
    operations
  state: runs/tower.json — run state; runs/ledger.ndjson — append-only ledger
  powers:
    - Refuse to open an activity whose cadence is not reachable — an earlier gate remains open.
    - Refuse to open an activity for a role that is not responsible for it — P5, separation of duties.
    - Refuse the declaration of a work product foreign to the open activity, or of a path outside the write boundary.
    - Refuse to pass a gate whose pack is incomplete or one of whose controls is failing.
    - "Refuse to let an agent pass a human gate: the authority must be named."
    - "Refuse to freeze a foundation after G0: a CORE INVARIANT can then only be modified by a declared exception."
  limits:
    - >-
      DOES NOT SEE the harness's native writes. An agent that writes a file without going through
      it is not stopped. No MCP server can prevent what it does not expose.
    - IS NOT the enforceable evidence. The evidence remains CI, which replays the same controls on the repository.
    - >-
      DOES NOT REPLACE hooks: only a PreToolUse hook stops a write before it happens, and it is
      specific to the harness.
  enforcement_model: >-
    It does not prevent, it makes bypassing PROVABLE and COSTLY. Provable: any work product present
    on disk with no matching entry in the ledger is a hole K8 sees. Costly: an agent that does not
    call it has neither its fragment, nor its boundary, nor its exit criterion — it loses the
    information, not just the compliance.
  operations:
    - purpose: >-
        Where the run stands: current activity, gates passed, foundations frozen, reachable
        cadences.
    - purpose: >-
        Opens an activity and returns its compiled fragment, its write boundary, its exit
        criterion, the skeleton of each of its work products, the open reserves routed to it and
        the routing of its roles — model and effort of each holder and each critic in the context:
        cadence, tier, reopening of a refused gate, EXPRESS path (R6). The only source of the fragment: refuses if an earlier
        gate is open or if the role does not match.
    - purpose: >-
        The model and effort of a method role in the context of the open activity, or in the one
        given, with each modulation applied and its reason — in class, in effort when R5 or the
        highest class requires it, or without effect (R6). A finding, never a decision: the guard
        is what refuses an invocation that departs from it.
    - purpose: >-
        Declares a produced work product. Refuses a work product foreign to the activity, a path
        outside the boundary, a tacit completion, and a "complet" whose form is not complete:
        declared files present, required front-matter, a non-empty H2 per registry section.
        "partiel" records the gaps without refusing.
    - purpose: >-
        Reports the state of a gate: pack, missing work products, failing controls. A finding,
        never a decision.
    - purpose: >-
        Passes a gate. Requires a complete pack, zero failing controls, and a named human
        authority. G4 also requires the authorized build (commit or digest accepted in QA), a
        registry decision and, in tier R3, a second, distinct authority; it is valid for 7 days
        for that build.
    - purpose: >-
        Can this build go to production? Read back by the production release workflow before any
        deployment (apf release-check): G4 passed for THIS build, an authorizing decision, within
        its validity. A finding, never a decision: an approval of the « prod » environment does not
        replace the gate.
    - purpose: >-
        Records a human DIRECTION given outside a gate — platform, repository, channel,
        environment, scope withdrawal. Word for word, dated, with its scope-budget test — what
        changes, what stays unchanged — and its impact: AUCUN · PÉRIMÈTRE DE RELEASE · CANAL DE
        VALIDATION · PRODUIT, which calls for a formal decision · MÉTHODE, which records an
        observation on the method by default. An unrecorded direction does not exist for the
        method: the memory of a run never lives in the conversation.
    - purpose: >-
        Records a FINDING on the method — what was missing, costly or misleading in this run —,
        dated and evidenced (file, commit, direction, verdict), at the first level of the evolution
        ladder. No effect on the method: it rises to the Launchpad with those of the other
        projects, and only an MCR turns it into a proposed method. A human direction with impact
        MÉTHODE records one by default.
    - purpose: Freezes a foundation as CORE INVARIANT. Refused after G0.
    - purpose: Runs the eight deterministic controls and the vendoring integrity check.
    - purpose: Resolves a skill to its shipped path and its integrity verdict — external ones included.
    - purpose: >-
        Derives the data model from the executed schema and links it to the glossary. Returns the
        list of unresolved fields: a field without a glossary term is a semantic drift that K4
        refuses.
    - purpose: >-
        Recomposes the living prototype — foundation ⊕ release deltas ⊕ slice deltas, in order.
        Returns the non-subordinate screens and the steps that have become unreachable.
    - purpose: >-
        Returns the PLAN of the readable workspace. The product name is READ from the identity
        collected at activity 1, it is not passed as an argument: a product named from a command
        line is named outside any activity.
    - purpose: Links a produced work product to its page in the workspace. Bidirectional pointer.
    - purpose: >-
        Dates the projection of a work product at the current commit, AFTER writing the page.
        Linking says a page exists; dating says at WHICH state of the repository it was written.
        Without that date, the page's freshness cannot be verified.
    - purpose: >-
        Admissibility of a claim drawn from research: address, date consulted, literal quotation.
        Without all three, a third party can neither replay nor contradict — it is not a source, it
        is a memory. The claim is then downgraded to UNVALIDATED and carries an HYP-nn; it is never
        deleted.
    - purpose: >-
        The body of the project row: current step, progress of each step, gates passed and open.
        COMPUTED from the control tower's ledger. Since the row's status only moves at gates, the
        project would stay inert for a whole cadence; this block makes it readable without writing
        a third column into a database the organisation owns.
    - purpose: >-
        What was produced in Git and did not follow in the workspace — never projected, projection
        undated, or stale. Computed OFFLINE by Git comparison: the control tower makes no call to
        the third-party service. A drift stops an ACTIVITY; it NEVER stops a gate.
    - purpose: >-
        Reports which work products are linked. REPORTS, does not refuse: the workspace never
        blocks a gate.
    - purpose: >-
        Where this work product goes, and above all: UPDATE or CREATE. The row has existed since
        the bootstrap; creating a second one would give two pages for one work product, hence two
        truths.
    - purpose: >-
        Starts the autopilot of cadence C1, on behalf of the person who will ratify at G0
        (MCR-002). The tower computes each action; the Stop hook refuses the end of turn while
        one remains and the run is progressing.
    - purpose: >-
        Stops the autopilot. Nothing is undone: state, verdicts and decision queue remain.
    - purpose: >-
        The autopilot's next action — INTERROGER, OUVRIR, PRODUIRE, JUGER, REPRENDRE, CORRIGER, or
        a stop STOP_DECISION, STOP_G0 —, with the model and effort of each role to invoke. A
        finding, never a decision.
    - purpose: >-
        Records a critic's critiques, read from the deposited file: each CRIT-n — severity,
        recommendation — enters the queue as a CRITIQUE decision that the owner keeps or sets
        aside, and the summary line must give their exact count. No critique: the work product
        converges. The critic decides nothing (MCR-004).
    - purpose: >-
        Queues a decision that belongs to the human. Blocking — intent, irreversible, real corpus —
        it stops the autopilot; otherwise it waits for G0 without stopping it.
    - purpose: >-
        The human decides an item of the queue, by name. Decided differently from the default
        applied, it reopens the activity that had applied it. The Launchpad deposits the same
        answer as a file, ingested at the next action.
    - purpose: >-
        Removes from the queue the reopening caused by a decision taken differently, once the
        activity has been reopened and its work products redeclared, and returns the next action.
    - purpose: >-
        The autopilot's state: active or not, decision queue, producer ↔ critic loops, what remains
        to ratify and to decide.
    - purpose: >-
        Creates the rows of an instance that now exists. A release does not create the rows of its
        slices.

plugin_layout:
  context_budget:
    rationale: >-
      A SKILL.md is loaded as soon as the skill is selected. Beyond the ceiling, it bills its
      detail to every activity that touches it, including those that do not read half of it. The
      detail moves down into references/, loaded on demand.
    estimator: >-
      bytes ÷ 3.6 — a deliberately pessimistic approximation; K6 refuses an overrun rather than
      rounding it.
  directories:
    - discovery: auto — Claude Code
      source: registry → agents, one instance per critic
    - discovery: auto — Claude Code
      source: registry → skills of core origin
    - discovery: on demand, never loaded by default
      source: >-
        registry → tooled activities, work products, and how to hand back — Office format and
        projection into the workspace, shared by all skills and irrelevant in a pulled workspace.
        It is what keeps SKILL.md under the ceiling.
    - discovery: auto — Claude Code
      source: registry → control tower operations
    - discovery: plugin.json → hooks
      source: >-
        registry → project-scope controls. The hook only calls apf guard: no rule lives in a hook.
    - discovery: none — instantiated by the project, never by the plugin
      source: >-
        templates the project instantiates. domain-critic is NOT in agents/: an uninstantiated
        domain critic would quote the model's memory instead of dated sources.
    - discovery: plugin.json → skills
      source: verbatim copies of pinned commits, rehashed at every check
    - discovery: plugin.json → mcpServers
      source: control tower — exposes lib/tower.mjs without carrying any rule
    - discovery: none — web application, deployed separately
      source: >-
        PULLED projection of the readable workspace — see notion_workspace.pull_projection. Imports
        lib/ and core/ by relative path: no rule is rewritten there, progress comes from
        stepProgress and controls from runAll.
    - discovery: none
      source: >-
        method.yaml — the single source of which everything else is a projection. presets.yaml —
        DEFAULT contents, also subordinate: they fill in what is already known and leave a QUESTION
        for decisions, which the form check refuses to treat as filled in. templates.yaml —
        writing templates for the work products, SUBORDINATE to the registry: a guide and an
        example per section, never one more section, rule or criterion; the conformance suite
        refuses any section title that diverges from the registry. "apf template <WP-nn>" renders
        the skeleton.

notion_workspace:
  contract: >-
    PROJECTION, never source. What a gate freezes lives in Git and is projected here; what lives
    between gates — backlog, risks — is written here and frozen into Git at the gate. A type of
    object has exactly one home, never both: two homes is the divergence P4 forbids.
  shape: >-
    The product is a project ROW in a projects database the organisation already owns, not a
    standalone page. A governed product that does not appear where the organisation looks at its
    projects is governed beside it. Steps and work products are databases ATTACHED to that row:
    this is what makes progress visible at a glance and work products browsable by view rather
    than by navigation.
  never_blocks: >-
    An unavailable workspace NEVER blocks a GATE. Hanging a control on it would put a third-party
    service on the critical path of governance. The eight controls stay on Git; "apf notion status"
    reports, it does not refuse.
  may_block_an_activity: >-
    The clause above concerns gates, NOT activities. Activity 1 has the workspace as its output:
    with no connector, it returns BLOCKED — missing input, like any required input (P5, EX2).
    Stopping an activity is not preventing a human decision. Confusing the two would turn an
    obligation into a decoration.
  execution: >-
    The core COMPUTES the plan — deterministic, offline, replayable, hence verifiable. The adapter
    EXECUTES it: it alone holds the access. No token and no network call in the plugin or in
    continuous integration.
  connector:
    on_absence: >-
      BLOCKED — missing input. Never improvise a location, never produce a partial tree, never fall
      back on a file export.
  root_location:
    what: >-
      The organisation's PROJECTS DATABASE, in which to create the product's row. The plan computes
      the structure, never its anchor point: a project row is always created in a database that
      pre-exists and does not belong to us.
    on_absence: BLOCKED — missing input. Never guessed.
  page_body:
    mode: full mirror
    rule: >-
      The page body of a row reproduces the content of the Git file in full, front-matter removed.
      The committee reads the whole work product without opening a repository — that is the reason
      the space exists.
    comments: >-
      A comment is an INPUT to the next activity, never the work product. This is what allows the
      page to be overwritten without losing anything.
  execution_order:
    phases:
      - id: 1
        name: project row
        note: created in the host database provided; without it, BLOCKED
      - id: 2
        name: databases
        note: created in the project row's page, before any row
      - id: 3
        name: step rows
        note: before the work products, because a work product references its step
      - id: 4
        name: work product rows
        note: only those whose base and files are not parameterised
      - id: 5
        name: views
        note: last — a view filters rows that must exist
  navigation:
    principle: >-
      No tree. The STEP is a constant of the method, the RELEASE and the SLICE are variables of the
      project; a variable in a tree makes a space unreadable within six months. Steps are therefore
      ROWS and not pages, and work products are browsed by VIEW — filtered, grouped, sorted —
      rather than by descending into folders.
    growth: none — the number of databases does not change, whatever the number of releases, slices and versions
  databases:
    - id: etapes
      writes: Git to workspace
    - id: livrables
      writes: Git to workspace
    - id: squelette
      writes: Git to workspace
    - id: gates
      writes: Git to workspace
    - id: journal
      writes: Git to workspace, append-only
    - id: backlog
      writes: workspace to Git, frozen at the gate
      frozen_at: >-
        G1 — committed export, controlled by K3. Without this freeze, the traceability chain would
        no longer be verifiable offline and CI would cease to be the evidence.
    - id: risques
      writes: workspace to Git, frozen at the gate
      frozen_at: G0 then G1
  templates:
    rule: >-
      The page template of a work product has AS SECTION TITLES its content outline in the
      registry, the rule of each section as a caption, and the registry excerpt as an example when
      it exists. A template drawn by hand would be the first non-generated projection of the
      system: it would diverge by the third work product.
  instantiation:
    rationale: >-
      Same rule as the Git bootstrap: a parameterised path is not materialised empty. Ghost rows
      would pre-empt decisions G0 has not taken.
    idempotent: Replayed, it completes and overwrites nothing.
  link:
    shape: >-
      bidirectional pointer — the work product's front-matter carries "notion", the workspace row
      carries the Git path and the commit
    rationale: >-
      A work product readable from one side only is linked to nothing: from the workspace you
      cannot find the evidence, from Git you cannot find the reader.

external_capabilities:
  adopted:
    - id: grilling
      role: >-
        Interrogation primitive. Decision tree, frontier, turns, one recommendation per question.
        Invocable by the model.
      audit:
        writes: no file write — it conducts an interview, produces no artifact
        state: no persistent state outside the session
        dependencies: none
        verdict: ADOPTED WITHOUT RESERVATION
      method_gap: >-
        Its tree knows only two node states, settled or open. The method requires a third —
        UNVALIDATED, with a falsification criterion and a test point. This rule is carried by the
        exit criterion of activity 2, never by a fork of the skill.
    - id: grill-me
      role: >-
        Shim invoked by the human, routes to grilling. Its description is not loaded into context
        until it is called: the human entry point costs nothing.
      audit:
        writes: none
        state: none
        dependencies: grilling
        verdict: ADOPTED WITHOUT RESERVATION
    - id: impeccable
      role: >-
        Craft floor for interface design. Four surface modes — Persuade, Operate, Read, Experience —
        twenty-three playbooks including critique, audit, polish, layout, typeset, adapt and
        harden, and a craft floor to read immediately before any interface edit. It is the
        capability that was missing: the method controlled the SUBORDINATION of a design work
        product — exportable tokens, seven states, AA contrast, no dead screen — and never its
        QUALITY. A foundation compliant with the eight controls could be ugly, and was.
      audit:
        writes: >-
          PRODUCT.md, DESIGN.md and its sidecar, surface briefs, project configuration and hook —
          at paths IT DEFINES ITSELF, absent from the registry. That is the exact reason
          domain-modeling was rejected. The reservation is lifted differently: the commands that
          write those files — init, document, doctor, hooks, live, pin — are outside the adoption
          scope, and the product context as well as the visual truth remain held by the declared
          work products (design-brief.md, WP-08, WP-11, WP-19), which the agent reads in their
          place. A file written outside the registry makes K2 fail: the guardrail remains the
          control, never the instruction.
        state: >-
          No persistent state outside the session within the adopted scope. The only state carrier
          — the launcher, its cache, its configuration and its sidecar — is not shipped.
        dependencies: >-
          A deterministic engine binary downloaded from GitHub Releases on first call: not shipped,
          unreachable here. Four finishing sub-agents: not shipped, their degraded equivalents are
          in reference/degraded/. No npm dependency, no skill dependency.
        verdict: >-
          ADOPTED WITH RESERVATION — the guidance is adopted, the execution is not. The
          deterministic detector is missing: what the method gains is a floor of JUDGEMENT, not a
          control. It therefore replaces none of the eight controls, enters no evidence pack, and a
          verdict given under this skill remains a human or agent appraisal, never a PASS.
      method_gap: >-
        Three gaps, carried by the activities' criteria and never by a fork of the skill. (1) Its
        verification floor is "bounded passes, never in a loop"; the method adds multi-device
        captures and the classification of findings in ITS single taxonomy — the heuristic scoring
        of critique.md is not a findings taxonomy. (2) It allows a redesign to replace the visual
        world and DESIGN.md; the method refuses this after G0 as soon as a CORE INVARIANT is
        touched — navigation, IA or vocabulary go through EX3, never through a redesign. (3) It
        does not know evidence labels: "representative" content it judges acceptable remains here
        invented data presented as real if it does not carry its truth category.
  rejected:
    - id: domain-modeling
      reason: >-
        REGISTRY AND FOUNDATION CONFLICT. Writes to paths it defines itself — a context file at the
        root, a decisions folder — absent from the registry: K2 fails. Rewrites the glossary, which
        is a CORE INVARIANT frozen at G0: risk of K4 failing after the gate. Its function is taken
        over by the sovereign domain-critic skill.
      revisit: "no"
    - id: grill-with-docs
      reason: >-
        Transitive dependency not declared in its description: calls grilling AND domain-modeling.
        Three adopted skills would have installed four.
      revisit: after a decision on domain-modeling
    - id: triage
      reason: >-
        Competing state machine — moves tickets through a progression of triage roles. Violates P3.
      revisit: "no"
    - id: to-tickets
      reason: Its own state progression, outside cadences and gates. Violates P3.
      revisit: "no"
    - id: to-spec
      reason: Overlaps activities 19 and 20 with its format and its publication to a tracker. Violates P3.
      revisit: "no"
    - id: wayfinder
      reason: Planning as a map of decision tickets on a tracker. Violates P3.
      revisit: "no"
    - id: implement
      reason: "Drives spec, TDD and review end to end: a second Sprint Delivery Factory. Violates P3."
      revisit: "no"
  harness_native:
    - id: harness-design-skills
      note: >-
        Artboard canvas and design skills provided by the harness. Native, hence outside the
        adoption gate — but named, so that the obligation does not cite a paraphrase. They carry NO
        quality floor: that is what let a compliant but ugly foundation through. The floor is
        carried by the impeccable capability, and these natives are now only the execution medium.
    - id: harness-assisted-design
      note: >-
        Assisted interface design provided by the adapter — generation of a direction and of
        executable surfaces from a brief, importable into the repository, and deployment of a
        preview. Native, hence outside the adoption gate, but NAMED: it is its absence from the
        registry that let the method de facto mandate doing everything by hand. The core names no
        product and no API: it names the CAPABILITY, and the adapter declares the tool that
        satisfies it. It replaces neither the design brief, nor the competition of three
        directions, nor impeccable's craft floor, nor the accessibility check: it changes what must
        be WRITTEN to satisfy them, never what must be PROVEN.
    - id: harness-preview-deploy
      note: >-
        Deployment of a preview at a URL openable without installation. Native, outside the
        adoption gate. Required by the exit criteria of activities 10, 15 and 20: a design work
        product the business has to clone to see is not reviewed, and a work product that is not
        reviewed proves nothing. The plugin deploys nothing itself — it is the agent that calls,
        and the distinction holds: no deterministic control depends on a third party.
    - id: harness-hooks
      note: >-
        Loop interception before a write. Accelerator: moves K6 from detection to prevention. The
        floor remains CI.
    - id: harness-telemetry
      note: >-
        The harness's lifecycle hooks — session start, prompt submission, tool call before and
        after, sub-agent end, turn end — and the transcript it already writes. Native, hence
        outside the adoption gate, but NAMED: their absence from the registry left the agents'
        execution entirely out of sight, and a run was then judged on the word of whoever had
        executed it. The plugin instruments no model and intercepts no network: it reads what the
        harness already gives its hooks, and it fails OPEN — observability.fail_open. The
        transcript is the ONLY source that says which model actually served, without which R1 and
        R3 remain unverifiable.
    - id: harness-model-mapping
      note: Capability class → model table, specific to the adapter. The core names no model.
    - id: harness-questions
      note: >-
        The harness's structured-questions mechanism. Serves the single burst of the design brief,
        and the interrogation of activity 2, one question per call. Native, hence outside the
        adoption gate.
    - id: harness-web-research
      note: >-
        Reading of external sources by the adapter — search and page consultation. The plugin still
        makes NO network call: it is the AGENT that does, and the distinction holds, because a
        deterministic control must never depend on a third party. Granted to ACTIVITIES (3, 4, 6,
        10, 13) and never to roles: the same role searches legitimately at activity 3 and
        abusively at activity 21, where searching serves to justify what was just written. Every
        claim drawn from it carries address, date and literal quotation, otherwise it is
        downgraded to UNVALIDATED.
    - id: harness-browser
      note: >-
        Driving a real browser — Playwright and Chromium, or equivalent — by the agent: one action,
        one capture. Native, outside the adoption gate, and a CANDIDATE MECHANISM, never canonical:
        the SUX protocol requires real interaction with the deployed foundation, not a tool. The
        plugin drives nothing itself; it checks the bytes the session leaves behind (SUX4).
    - id: harness-notion-connector
      note: >-
        The adapter's workspace connector. The PLAN is computed by the core — deterministic,
        offline, verifiable; its EXECUTION belongs to the adapter, which alone holds the access.
        The core names no API.
