    sections:
      - guide: >-
          The trade's vernacular, not the category: "Karim's list of job sites at 7 a.m.", not "a
          dashboard".
        example: The list of job sites Karim opens at 7 a.m. in his car before his first visit
      - guide: >-
          PER-nn, device, light, hands, network, attention span. A job site screen in sunlight ≠ an
          office dashboard.
        example: >-
          PER-01 · mid-range Android · full sunlight · one hand · intermittent 3G · 10 seconds of
          attention
      - guide: "One sentence: what the user must be able to decide or do on leaving the screen."
        example: Choose which job site to go to first, without calling
      - guide: >-
          NON-NEGOTIABLE — navigation, glossary, components and truth categories concerned, cited by
          identifier. The answer is in the repository, not in the imagination.
        example: '"My job sites" entry · TRM-03 slip, TRM-07 report · truth-badge (7 states) · job-site-card'
      - guide: What has already been set aside (in WP-19 or upstream) so as not to explore it again.
        example: >-
