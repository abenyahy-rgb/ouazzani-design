  WP-23:
    layout: >-
      test-plan.md — protocol written BEFORE, then results added AFTER, in the same file, dated
      sections · sux/ — the blind synthetic users campaign, the same seven pieces as before G0
      (protocole.md, plan-de-campagne.yaml, pare-feu.yaml, resultats/, annotations/, synthese.md,
      patterns.yaml)
    specimen: |-
      Protocol   written on 04/06, before the test — 3 tasks
      Version    commit 7f2a91c, frozen
      Panel      PER-01 and PER-03 simulated · SYNTHETIC
                  embodied by critic(product), which did not
                  design the prototype
      Level      SYNTHETIC · DOCUMENTARY
      HYP-02     weakened — PER-01 stumbles on "ESTIMATED";
                  S-07 confirms it. Label corrected (C-2).
      HYP-04     postponed — measurement in production: reports
                  per foreman per day, threshold 0.8 at 4 weeks,
                  below the threshold → weekly report.
    sections:
      - guide: >-
          Written and dated BEFORE the test: T-nn tasks, identical instructions, success criteria per
          task. Identical for each simulated persona as for each real participant.
        example: >-
          written on 2026-04-04 · T-1 "Find the job site to go to first" · success: choice without
          going back · T-2 "Flag a delay on job site C"
      - guide: Frozen commit and URL, cited. Any fix during the test invalidates the comparison.
        example: f08b6d2 · https://…/rel-pilotage/f08b6d2 · frozen on 2026-04-08
      - guide: >-
          Without real participants: the simulated PER-nn personas, each labelled SYNTHETIC, and the
          agent that embodies them — never the one that designed the prototype. With participants:
          recruitment, number, profiles, declared biases.
        example: >-
          PER-01 (multi-site works manager) and PER-03 (managing director) simulated · SYNTHETIC ·
          embodied by critic(product), which did not design the prototype · no real participant for
          this pass
      - guide: >-
          Per persona — or participant — and per task: success, blocking point, reported reasoning.
          NOT filtered, including what contradicts the thesis. Each blockage is confronted with the
          documented verbatims that confirm or refute it.
        example: |-
          PER-01 · T-1 · succeeded · the first job site in the list is the right one
          PER-01 · T-2 · blocked · "ESTIMATED" does not say who estimated — confirmed by S-07 ("a figure with no origin, I don't believe it") — contradicts HYP-02
      - guide: >-
          EMPIRICAL · DOCUMENTARY · SYNTHETIC · AXR · SYNTHETIC · SUX · UNVALIDATED, mandatory, per
          result. A synthetic review or documentary research presented as empirical is a BLOCKER; so
          is an expert review presented as a user test.
        example: >-
          SYNTHETIC · AXR (expert review per persona) · SYNTHETIC · SUX (5 blind synthetic sessions)
          · DOCUMENTARY (confrontation with the S-nn verbatims)
      - guide: >-
          Each HYP: settled by real participants, weakened or strengthened by the review — never
          validated by it —, or postponed with its measurement in production: metric, event
          instrumented by the release, threshold, decision if the threshold is not reached.
        example: |-
          HYP-02  weakened — PER-01 stumbles on ESTIMATED, S-07 confirms it → label "estimated by Karim" (C-2)
          HYP-04  postponed — measurement in production: reports per foreman per day (event releve_cree), threshold 0.8 at 4 weeks; below the threshold, weekly report
      - guide: >-
          Each fix traces to a labelled finding (persona or participant, task, level). No fix "by
          intuition".
        example: >-
          C-2  show the author of an ESTIMATED · PER-01 · T-2 · SYNTHETIC + S-07 DOCUMENTARY · carried
          into WP-19 @ 2c7d0e1
      - guide: >-
          critic(product), which KNOWS the intent and did not design the prototype: coverage plan
          written beforehand — journeys, states, negative paths, persistence —, then one result per
          unit, findings expected / observed, reproduced k out of n. It fixes nothing and never
          presents itself as a user test.
        example: |-
          Plan written on 2026-04-07: 3 journeys, 14 states, 9 negative paths. 26 units walked, 0 not reached.
          AXR-04  "estimated" displayed without an author on S-12 · expected: author named (WP-10, propagation) · observed 3 out of 3 → C-2
      - guide: >-
          The blind synthetic users, on the frozen version: the detail lives under sux/ (the same
          seven pieces as before G0); here, the candidate, the number of synthetic sessions, the
          patterns kept and their triage. K7 replays the campaign.
        example: >-
          Candidate f08b6d2 · 5 synthetic sessions, correlated (same model) · PAT-01 "estimated" read
          as "guaranteed" (S-02, S-03, S-05; contradicted by S-01) → C-2 · regression on candidate
          2c7d0e1: 0 sessions out of 5

  WP-24:
    layout: >-
      epics/EPC-nn.md · stories/STO-nn.md (story + AC) · traceability.md · priorities.md ·
      dependencies.md · risk-map.md
    specimen: |-
      STO-014  Consult a job site's progress
        epic     EPC-03  ·  journey JRN-07  ·  screen S-12
        tier     R2
        AC-014.1  The displayed progress carries its truth category
        AC-014.2  An ESTIMATED is never presented as OBSERVED
        AC-014.3  Data older than 24 h flagged as such
    sections:
      - guide: "One epic per journey or capability: name as a user verb, JRN, REL, stories contained, priority."
        example: >-
          EPC-03  Consult a job site's progress · JRN-07 · REL-pilotage · STO-011..016 · priority 1
          (OUT-01)
      - guide: >-
          Format "As PER-nn, when …, I …, so that …". Trace: epic, JRN, Strategic Design screen S-nn,
          dependencies, tier. A story without a screen cannot be implemented.
        example: |-
          STO-014  Consult a job site's progress · EPC-03 · JRN-07 · S-12 · depends on STO-010 · R2
            As a works manager (PER-01), when I open a job site, I see its progress with its date and its truth category, so that I know whether I need to call.
      - guide: >-
          Each one verifiable and unambiguous: an observable, a threshold, a condition. Name the
          planned evidence (type of test). "The screen is clear" is not an AC.
        example: |-
          AC-014.1  The displayed progress carries its truth category as a text label, not only by color · e2e
          AC-014.2  An ESTIMATED is never presented as OBSERVED (WP-10 propagation) · unit + e2e
          AC-014.3  A report older than 24 h is flagged "reported N days ago" · e2e
      - guide: By value (OUT served) and by risk (HYP lifted), total order on the epics, partial on the stories.
        example: 1 EPC-03 (OUT-01) · 2 EPC-04 (OUT-02) · 0 EPC-02 (technical prerequisite)
      - guide: >-
          Story → story, taken from WP-21, validated by principal-engineer. None towards a later
          release.
        example: STO-014 → STO-010 · STO-015 → STO-014 · STO-017 → STO-014 · validated principal-engineer 2026-04-22
      - guide: Taken from WP-21, never decided here. A disagreement is routed to activity 16.
        example: reading progress R2 · flagging R2 · provisional entry R1 (WP-21 @ e5a7c31)
      - guide: >-
          Each slice S-nn named by its user outcome — the future "Slice outcome" —, with its
          dependencies, the evidence that will accept it, the demonstration in QA and the tier.
          Vertical: data, API, screens and tests together; no platform slice. Order: dependencies,
          then value, risk lifted, learning; only one in progress at a time. First release: a small
          S-00 foundation slice. Milestones are named slices, not dates.
        example: |-
          S-00  foundation — the mobile → API → database path end to end, isolation per SME proven · R2
          S-01  "A works manager sees their job sites with a dated progress status and its truth category" · STG-04 · R2 · depends on S-00 · demo: the list in QA on a phone
          S-02  "A works manager spots a slip and flags it without calling" · STG-05 · R2 · depends on S-01 · "pilot" milestone
      - guide: >-
          Each story of the backlog: its slice, or "postponed" with the decision (ADR-nn, authority,
          date). No story forgotten, no new release created here.
        example: STO-008..014 → S-01 · STO-015..018 → S-02 · STO-019 postponed (ADR-12, PO, 2026-04-22)
      - guide: >-
          Versions and commits: foundation (tag), Release Baseline (tag), Design System + delta,
          technical foundation. It is what a slice cannot modify.
        example: >-
          spine-v1 c90f2a7 · rel-pilotage-v1 f08b6d2 · design/system @ c90f2a7 + delta @ f08b6d2 ·
          tech-spine-v1 d13e884
      - guide: >-
          NC-nn: question, what it blocks (AC), owner, deadline, the FIRST slice that needs it, and
          its class — to decide before the contract (only if the contract cannot say how to build
          without it), to decide before acceptance (the prototype's value is the default proposal,
          carried as a named parameter), outside v1, technical. An NC to decide before the contract,
          still open, prevents the K1 of its slice.
        example: |-
          NC-02  Can a closed slip be reopened? · blocks AC-017.3 · Product Owner · S-02 · to decide before the contract · open
          NC-03  Delay threshold of a slip · blocks AC-015.2 · Product Owner · S-02 · to decide before acceptance — default: 5 days, parameter ecart.seuil_jours

  WP-25:
    layout: g1-{release-id}.md (the ten sections) · release-baseline.yaml (frozen tags and commits)
    sections:
      - guide: What cost, what surprised, what an agent should have detected — each tied and routed.
        example: >-
          cost   2 rounds on WP-19 · surprised   ESTIMATED misunderstood without an author (P6, P8) ·
          to detect   critic(design) should have flagged the badge without an author → MCR-03
  WP-26:
    layout: >-
      slice-contract.md (outcome, budget, exit criteria and evidence, tier, open points, amendments,
      entry conditions, KEEP / DISCARD) · design/ (Baseline Delta Declaration, prototype, DS delta) ·
      spec/ (tests defined before the code, rules, data, API, migrations)
    specimen: |-
      S-02  A works manager spots a slip and flags it without calling
        EXIT-1   the slip appears at the top of the list        automatic · e2e/ecart-tri.spec
        EXIT-2   the flag reaches the foreman in < 1 min         mixed · e2e + QA review
        EXIT-3   no ESTIMATED presented as OBSERVED              automatic · unit/propagation.test
        budget   secondary sort, photos → S-04; the slice does not grow
        tier     R2 → K1 escalation
    sections:
      - guide: >-
          One user outcome in one sentence, demonstrable in QA. G3 acceptance will be pronounced
          against this sentence, not against the list of stories.
        example: A works manager spots a slip and flags it without calling.
      - guide: >-
          The stories kept (ACs written in WP-24) and what is excluded. Budget rule: what no exit
          criterion requires is postponed to a later slice. The slice does not grow.
        example: |-
          kept: STO-015 (spot), STO-016 (sort), STO-017 (flag) · 11 ACs
          excluded: secondary sort by age, photos → S-04 — no exit criterion requires them
      - guide: >-
          EXIT-n, each with its evidence: mode (automatic · manual · mixed), channel (unit ·
          integration · emulator · simulator · web · physical device · QA environment), who produces
          it, procedure, success condition, failure condition, artifact kept. No criterion without
          evidence, no evidence without a procedure. Evidence is only valid for its channel: the
          simulator proves the launch, not the device. A leg that will not run in this slice is
          DEFERRED to a named gate, or out of scope — never PASS.
        example: |-
          EXIT-1  the slip appears at the top of the list · automatic · web, QA · e2e/ecart-tri.spec · success: 1st rank on 5 data sets · artifact: e2e report
          EXIT-2  the foreman receives the flag in < 1 min · mixed · QA environment · e2e + review in QA by release-engineer · failure: > 1 min on 1 attempt out of 5
          EXIT-3  no ESTIMATED presented as OBSERVED · automatic · unit · unit/propagation.test
          EXIT-4  notification received on a phone · manual · physical device · DEFERRED to the mobile readiness gate
      - guide: >-
          Each material AC → ≥ 1 named test (type, file), written BEFORE the implementation. Changing
          a test means amending the contract — not adjusting it to the code.
        example: >-
          AC-015.1 → e2e/ecart-tri.spec · AC-017.2 → e2e/signalement.spec, unit/notification.test ·
          11/11 ACs covered
      - guide: >-
          Produced BEFORE any modification: MUST PRESERVE (what does not move) vs AUTHORISED DELTAS,
          each justified by a story. Foundation gap: none, otherwise EX3.
        example: |-
          MUST PRESERVE   global navigation · glossary · truth categories · job-site-card, states 1 to 7
          AUTHORISED DELTAS   slip badge (STO-015) · flag button (STO-017)
          FOUNDATION GAP   none
      - guide: >-
          For each story, the clickable path that demonstrates it on the living prototype, at the
          three widths, empty, error and loading states included.
        example: >-
          STO-015: /chantiers → SLIP badge at the top · STO-017: /chantiers/C-03 → Flag → confirmation
          · 360 / 768 / 1280
      - guide: >-
          Justified story by story, 7 states per addition, no silent modification of an existing
          component (empty diff on the foundation).
        example: "+ slip-badge 7/7 states (STO-015) · diff on existing design/system: empty"
      - guide: >-
          Business rules citing their source (baseline, ADR-nn, domain critic RG-nn); tables,
          endpoints, numbered migrations with the rollback command of each. A rule without a source
          is an invention.
        example: >-
          rule: a slip = an ESTIMATED report late by more than 5 days (ADR-14) · POST /ecarts ·
          migration 0043 create ecart · rollback: drop table
      - guide: The highest tier among the stories kept, with the story that carries it. R2 or R3 → human escalation at K1.
        example: R2 (STO-017 notifies a third party) → K1 escalation PO + Tech authority
      - guide: >-
          NEEDS CLARIFICATION resolved (answer, who, when) or routed (owner, deadline). An open NC does
          not pass K1. At most ONE decision request to the Product Owner, consolidated, asked before
          acceptance, with a default value — "confirm everything" must be a complete answer.
        example: >-
          NC-02 resolved 2026-05-02 (PO): a closed slip is not reopened · decision request: 5-day
          threshold — proposed default 5
      - guide: >-
          A gap discovered during construction is a dated amendment — AMD-n: what changes, why, who
          accepted it —, never growth. What exceeds the outcome goes to a later slice.
        example: >-
          AMD-1  2026-05-06 · EXIT-2 measured in QA and not locally · accepted by the Tech authority
          · no scope added
      - guide: >-
          ENTRY-n: what must be true before the GO, its status (MET · PENDING · DEFERRED) and what
          lifts it. Put EXTERNAL prerequisites here — the right to create the repository, host
          credentials, store membership and signing, imposed toolchain, a stable QA account for the
          Product Owner, whose password they set themselves outside Git and outside the chat — and
          every "material" learning from the previous closure. An external prerequisite is not a
          product decision, but it is checked before the GO.
        example: |-
          ENTRY-1  S-01 accepted, closure read · MET 2026-05-01
          ENTRY-2  QA account of the pilot works manager, password set by them · PENDING — lifted by the Product Owner before the GO
          ENTRY-3  learning S-01-L2: the notification requires a verified sending domain · MET — DNS verified 2026-05-02
      - guide: >-
          For Slice 0 and any technical proof: each artifact classified KEEP (it enters the product)
          or DISCARD (it serves the proof and will be removed), BEFORE being written; the dependency
          check that forbids KEEP → DISCARD; what the closure will remove, forward-only migration
          included. For any other slice: "not applicable", and why.
        example: "not applicable — S-02 writes no technical proof; everything it produces is KEEP"

  WP-27:
    layout: >-
      status.md (version identity) · scope-changes.md (classified gaps) · quality/test-strategy.md
      (results, VERDICT, oracles) · quality/test-healing-decisions.md ·
      acceptance/traceability-matrix.md · acceptance/preview-report.md (journeys in QA, state ×
      behaviour matrix)
    sections:
      - guide: >-
          Each gap classified: missing · partial · contradicted · not requested · intentionally
          superseded, with the decision, the amendment or the routing. Silent absorption is the fault
          to prevent.
        example: |-
          E-01  AC-017.3 (offline notification) · partial · routed AMD-2, S-03
          E-02  secondary sort by age · not requested · removed from the diff
      - guide: >-
          Per EXIT and per AC: test, GREEN / RED, date, commit. Observable fact, without
          interpretation. Produced by quality-engineer.
        example: |-
          EXIT-1  e2e/ecart-tri.spec · GREEN · 2026-05-09 · 3c1e0aa
          EXIT-3  unit/propagation.test · RED · 2026-05-09 · 3c1e0aa
      - guide: >-
          PASS · PRODUCT FAILURE · TEST FAILURE · CANNOT VERIFY, per red test, returned by
          critic(quality) only, with the demonstrated cause.
        example: >-
          EXIT-3  PRODUCT FAILURE — the computation raises OBSERVED from an ESTIMATED
          (src/progress.ts:41) · critic(quality) · routed to activity 21 · healing forbidden (EX4)
      - guide: >-
          Only for TEST FAILURE: cause (selector, fixture, timing), fix, author, then re-verification
          by an independent pass. A product defect is never healed; three healings on the same AC = an
          undiagnosed product defect.
        example: >-
          AC-016.1  TEST FAILURE — non-deterministic fixture · regenerated · re-verified
          critic(quality) 2026-05-10 · GREEN
      - guide: >-
          One line per story: EXIT, AC, files, tests, ADR, amendments. Each gap classified. Nothing
          absorbed.
        example: >-
          STO-017 · EXIT-2 · AC-017.1..3 · src/api/ecarts, src/web/signaler · e2e/signalement.spec ·
          ADR-14 · AMD-1
      - guide: >-
          JRN journeys played by hand in QA, on the recomposed living prototype — a single URL and
          its commit —, with result and date. Not only in automated tests.
        example: >-
          JRN-08 played on https://qa.example/current @ 2026-05-12 · succeeded · release-engineer ·
          composed foundation c90f2a7 ⊕ rel-pilotage-v1 ⊕ S-02 3c1e0aa
      - guide: Named, with deadline and owner. A debt without an owner is not accepted, it is ignored.
        example: D-01  offline notification deferred (AC-017.3 partial) · owner principal-engineer · deadline S-03
      - guide: >-
          Played in QA, on the deployed version, at the reference mobile width, BEFORE any
          presentation to the Product Owner. One line per inventory element touched — question,
          screen, state; in columns: reached · forward · Back · restored after reload · edited ·
          persistent · rest unchanged · downstream. Each cell PASS, or N/A with its reason — never
          empty.
        example: |-
          | Element | Reached | Forward | Back | Restored | Edited | Persistent | Rest unchanged | Downstream |
          |---|---|---|---|---|---|---|---|---|
          | Job sites list, SLIP badge | PASS | PASS | PASS | PASS | N/A — read only | N/A — read only | PASS | PASS |
          | Flag a slip | PASS | PASS | PASS | PASS | PASS | PASS | PASS | PASS — received by the foreman |
      - guide: >-
          Each Product Owner observation from a previous slice turned into an ORACLE — a general
          question asked of every reachable state. For each: the question, the states swept, the
          hits. Hits grouped by root cause, and the fix made to the mechanism, never to the instance.
          An oracle stays in regression.
        example: |-
          OR-01  "where does this number come from?" · 14 states swept · 0 hits
          OR-02  "the same everywhere for the same state?" · 14 states · 2 hits → root cause: progress recomputed on the screen side (src/web/progress.ts) · fixed in the shared computation · 0 hits on replay
      - guide: >-
          What runs behind the QA URL: commit, artifact fingerprint, migration version, configuration
          fingerprint, pinned versions. The artifact validated in DEV is the one promoted to QA —
          same fingerprint, read on /version. Hosted CI golden path: GREEN with its link, or NOT RUN
          and why — never PASS.
        example: |-
          commit 3c1e0aa · image sha256:9d4c…e1 · migration 0043 · config sha256:51ab…07 · lockfile pinned
          /version in QA = DEV · hosted CI: golden path GREEN, run 1184
  WP-28:
    layout: >-
      reviews/engineering-review.md · reviews/design-conformance.md · security/security-review.md ·
      security/threat-model.md · security/pentest-summary.md — each track its own pass, its FNDs in
      the single format
    sections:
      - guide: >-
          Grounded on the real diff (commit range, files). AC → Evidence map verified as EFFECTIVE:
          each piece of evidence executed, not only present.
        example: diff 7f2a91c..3c1e0aa (14 files) · 23/23 ACs with executed evidence · FND-07 MAJOR (see Findings)
      - guide: Screen-by-screen comparison of prototype vs implementation, visual diffs attached, gaps classified.
        example: S-11 diff 0.4 % (shadow) OBSERVATION · S-12 compliant · S-14 outside the scope of S-01
      - guide: >-
          Threat model updated, secrets, auth, data access, dependencies (versions, CVEs). No secret
          in clear text: say so with the tool used.
        example: >-
          threat-model.md v2 · gitleaks 0 secrets · auth per tenant verified (contract test) · 0
          critical CVEs across 41 dependencies
      - guide: >-
          If tier R2 or R3: scope, method, DEMONSTRATED findings (request, response), no destructive
          action. Otherwise "not required, tier R1".
        example: >-
          R2 · scope api/chantiers, api/releves · IDOR tested on 40 identifiers: 0 leaks · FND-09 MINOR
          (verbose server header)
      - guide: >-
          FND-nn: severity · domain (PRODUCT, a defect of the judged artifact, or CONTROL, a defect of
          a template, a K control, a validator) · surface tier · entity (STO/AC/DSN/ADR) · what it
          blocks (this gate, acceptance, going to production, or debt) and its deadline ·
          demonstrated by · issued by · pass · closure by the issuing critic only. Two counts: product
          eligibility is read on PRODUCT alone.
        example: |-
          FND-07  MAJOR · PRODUCT · R2 · AC-014.2 · blocks the acceptance of S-02 · diff src/progress.ts:41 · critic(engineering) pass 1 · closure: pass 2 required
          FND-08  MINOR · CONTROL · review template without a channel column · blocks the next review, not G3 · conformance-auditor
          PRODUCT  BLOCKER 0 · MAJOR 1 · MINOR 1 · OBSERVATION 1    CONTROL  MINOR 1
      - guide: >-
          One line per finding and per challenge objection: ACCEPTED (the change and its commit) ·
          REDUCED (the part kept, the part routed as an open point) · REJECTED (reason and evidence) ·
          UNVERIFIED (pointer, no effect). Each disposition checked against the source by someone
          other than its author; only what is verified changes the state. Publish the counts.
        example: |-
          FND-07  ACCEPTED · computation moved to the server side · 4be21f0 · verified by critic(quality)
          OBJ-03  REDUCED · sort by age kept, filter by foreman routed NC-05
          OBJ-04  REJECTED · the 5-day threshold is a Product Owner option, not a fix
          counts  3 objections: 1 accepted · 1 reduced · 1 rejected

  WP-29:
    layout: g3-{slice-id}.md
    sections:
      - guide: >-
          What cost, surprised, should have been detected — tied and routed. Each "material" learning
          becomes an entry condition of the next slice.
        example: |-
          cost   1 PRODUCT FAILURE on propagation · to detect   a propagation test should have been in the slice contract → MCR-05 (rule: mandatory propagation test)
          S-02-L1 material   the sending domain must be verified before any notification → ENTRY-2 of S-03
      - guide: >-
          One page at most, for the Product Owner: at the top, the consolidated decision request,
          each item with its default value — "confirm everything" is a complete answer; then the
          journeys to play, the channel, the URL, the version read on /version, their stable QA
          account, and the expected result of each. Only the moments the machine cannot judge.
        example: |-
          decision   slip threshold: 5 days (default) — confirm or correct
          channel    mobile web · https://qa.example/current · version 3c1e0aa · account conducteur.pilote
          1  open the list: job site C-03 carries the SLIP badge at the top
          2  flag the slip: the foreman receives it in under a minute
      - guide: >-
          After acceptance, both directions, quantified. Direction A: each ACTIVE element of the
          lineage has a destination in the current product. Direction B: each element of the original
          experience has a disposition. An absence in a later work product is not a supersession:
          only recorded supersessions remove an element. Zero unexplained disappearances.
        example: |-
          direction A   41 ACTIVE elements · 41 with a destination
          direction B   23 original elements · 22 kept · 1 superseded by ADR-15 · 0 unexplained disappearances
      - guide: >-
          One line: the next activity, the input it lacks, who lifts it. An agent with no history must
          be able to restart from there.
        example: activity 20 — contract of S-03 · lacks ENTRY-2 (sending domain) · lifted by principal-engineer

  WP-30:
    layout: >-
      release-readiness.md (quality, security, re-review, observability, window, authorities) ·
      rollback-plan.md (plan AND evidence of execution)
    sections:
      - guide: "One line per domain: evidence (path, commit) and status. No checkbox without a path."
        example: >-
          quality   G3 S-01, S-02 accepted · security   security-review S-02 @ 9d4c… · migrations
          0040..0042 tested on staging · doc   runbook v1.2
      - guide: >-
          Plan (strategy, command, target duration) THEN evidence: environment, commit deployed →
          restored, measured duration, data restored, executed by, verified by a distinct role, date,
          raw log. An empty field = not tested = automatic refusal.
        example: |-
          plan       progressive rollout 10 → 50 → 100 %, rollback < 5 min
          evidence   staging · 7f2a91c → 3c1e0aa · 4 min 12 s · migration 0042 reversed, restore point 2026-06-14T09:00Z verified · executed by release-engineer · verified by critic(engineering) · log deployments/v1.2.0/rollback-run.log
      - guide: "R2/R3: pentest and threat model up to date, cited. R0/R1: standard review cited."
        example: R2 · pentest-summary S-02 @ 9d4c… · threat-model v2
      - guide: >-
          For each finding fixed since the last pass: FND, fix, re-review by the issuing critic,
          verdict.
        example: FND-09  fixed 2026-06-10 · re-review security-engineer pass 2 · closed
      - guide: Signals monitored, quantified thresholds, where they are visible, who is alerted.
        example: >-
          5xx > 0.5 % / 5 min · p95 > 800 ms · reports / h < 50 % of the median · observability
          dashboard v1.2 · alert release-engineer
      - guide: Time window and quantified abort criteria, decided beforehand, not during.
        example: >-
          Tuesday 09:00–11:00, outside the monthly closing · abort if a threshold above is crossed or
          if JRN-07 fails in production
      - guide: 'Two names, two dates, recorded separately. At R2 or below: "not applicable" with the tier.'
        example: not applicable — tier R2

  WP-31:
    layout: >-
      deployment-record.md (strategy, DEP, keep / rollback decision) · post-deploy-verification.md
      (verification, signals) · also learning/{release-id}/outcomes.md (product decision)
    sections:
      - guide: >-
          Actual stages with timestamps, and the verification of the rollback point BEFORE the
          switch (reference to WP-30).
        example: rollback point verified 08:52 · 10 % 09:04 · 50 % 09:40 · 100 % 10:25 · 2026-06-16
      - guide: Deployment identifier, build hash, stories included (K3 trace to G3).
        example: DEP-v1.2.0 · build 9d4c… · STO-008..018 (S-01, S-02) · G3 S-01 2026-05-12, G3 S-02 2026-06-09
      - guide: >-
          Over the defined window: health, metrics, errors, security, critical journeys played in
          production. Dated results.
        example: >-
          48 h window · 5xx 0.1 % · p95 620 ms · JRN-07 and JRN-08 played in production 2026-06-16
          11:00 · 0 security alerts
      - guide: KEEP or ROLLBACK, reason, authority, date, time.
        example: KEEP · thresholds met over 48 h · release authority N. Rami · 2026-06-18 10:30
      - guide: >-
          For each MET-nn: observed value, source, gap to the target. Conclusions are separated from
          the data, explicitly.
        example: |-
          MET-01  observed 2.3 h / week at 28 d (log, 9 pilots) · target < 1 h at 90 d · data: drop from 4.8 to 2.3 · conclusion: trend on track, not reached
          MET-02  observed 0.8 d median · target < 1 d · reached
      - guide: >-
          CONTINUE · CORRECT · RE-SLICE · PIVOT · STOP, with reason, authority (HUMAN OWNER), date, and
          the resulting updates to the backlog and to WP-15.
        example: >-
          CONTINUE · review MET-01 at 90 d · HUMAN OWNER S. Alaoui · 2026-07-14 · WP-15: REL-terrain
          confirmed in 2nd position
