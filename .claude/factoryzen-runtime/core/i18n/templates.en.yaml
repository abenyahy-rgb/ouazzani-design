      investor-shortlist.md:
        titre: The targeted investors
        phrase: >-
          Three people know the product's sector and geography; two can be reached through an
          introduction.
        essentiel:
          - "People, not funds: each judged on four criteria, each sourced."
          - A direct competitor in the portfolio disqualifies.
          - The ticket is compared with the amount asked; access is declared.
        verifier: "A list is not a commitment: no investor is contacted on the product owner's behalf without their agreement."
      g0-product-architecture.md:
        titre: The passage decision
        phrase: >-
          The framing is ready to be decided; the recommendation is to pass the gate, subject to the
          four-week pilot that settles the daily report.
        essentiel:
          - All the framing work products are produced; two are partial, with their reservations written down.
          - Nothing irreversible is committed before the pilot.
          - The decision belongs to the Product Owner, and to them alone.
        verifier: "The decision has not been pronounced: this document prepares the passage, it does not make it."
    sections:
      - guide: >-
          Three entries: what cost, what surprised, what a control should have detected earlier. Each
          says where it is handled.
        example: |-
          | | What happened | Where it is handled |
          |---|---|---|
          | Cost | Three weeks to get the job sites export | Added to the framing prerequisites |
          | Surprised | Nobody complains about data entry; everyone complains about not knowing | Product thesis rewritten |
          | Should have been seen | The market size rests on an undated source | Control added on sources |
        reponse: what cost, what surprised, what we should have seen earlier

      - reponse: who to pitch to, and why each one
        guide: >-
          Front-matter, "investisseurs" format: the round's target (amount, geography, sector), then at
          least three people, each judged on sector, geography, portfolio and track record, with
          evidence and source. The body states, for each, the angle of the first message.
        example: |-
          Alice — ran a software publisher for tradespeople, invests in France, two construction SaaS in portfolio; introduction through the sponsor's former partner.
          Bruno — twenty years in building-materials distribution, two exits; introduction through a pilot owner.
          Chloe — vertical SaaS, Paris office; cold access, to prepare.
      - reponse: why this product, why now, why this team, how much and for which milestone
        guide: >-
          Front-matter, "pitch" format: the company, the one-liner, the mantra, the two-sentence
          positioning, then ten slides — the YC order and the learnings. Each title is the idea; every
          figure cites what grounds it or says HYP-nn. The body carries the speaker's script.
        example: |-
          Problem — "A works manager spends a third of the week piecing together where the job sites stand." 4 to 6 h of calls a week, according to the user research.
          Traction — 11 % of visitors signed up at the displayed price, measured by the market test. No revenue: the pilot starts in January.
          The ask — €600k, 18 months: 50 paying SMEs and 90-day retention, amount decided by the product owner.
