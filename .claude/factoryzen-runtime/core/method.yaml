      - "LE CANARI AVANT LE BALAYAGE. Un contrôle de résidu exécute d'abord son canari — des termes connus, accents compris, qui DOIVENT correspondre à leur motif — avant de balayer quoi que ce soit. Un canari qui échoue arrête le balayage et rend FAIL, jamais un avertissement : un défaut d'encodage ou de correspondance rend tout balayage vert en silence."
