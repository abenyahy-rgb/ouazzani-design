      - "Promotion en QA par empreinte ; /version égale à DEV ; matrice état × comportement et oracles verts en QA."
      - "Revues indépendantes, dispositions tenues, zéro BLOCKER de domaine PRODUIT."
      - "Acceptation : script du Product Owner — parcours, canal, URL, compte, attendu ; jambes non exécutées REPORTÉES à une gate nommée ; verdict consigné mot pour mot."
      - "Clôture : DISCARD retiré, état cumulatif et audit de non-perte, apprentissages « material », prochaine action."
  - id: synthetic-users
    activities: 12, 18
    mandate: "Conduire une campagne SUX — test d'expérience par utilisateurs synthétiques AVEUGLES — sur un candidat figé et déployé : le socle avant G0 (activité 12), le prototype de release en validation (activité 18). Protocole du run BatiZen sans affaiblissement : orchestrateur, agent utilisateur aveugle, observateur, chercheur et triage séparés ; persona, mission et point d'entrée seuls donnés à l'agent, écrits dans un manifeste haché AVANT la session ; filtre déterministe sur la liste fermée du vocabulaire interne ; interaction réelle, une capture par action ; observations immuables liées au sha256 du candidat. Ne fait pas : une revue experte qui connaît l'intention — c'est critic(product), étiquetée SYNTHETIC · AXR ; un score ou un seuil ; un comptage en « utilisateurs » ; une correction sur le candidat testé."
