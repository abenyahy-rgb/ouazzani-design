renumbered_work_products:
  contract: >-
    Un identifiant renuméroté est INSCRIT, comme un livrable retiré. Des dépôts ouverts avant
    une renumérotation portent les anciens identifiants dans leur journal, leur état de tour,
    leurs front-matter et leurs fichiers Office ; le même « WP-04 » n'y désigne pas le même
    livrable qu'aujourd'hui. Sans ces tables, une déclaration ancienne se lirait comme celle
    d'un autre livrable.
  rule: >-
    Chaque version s'applique en une seule passe, simultanément — jamais en chaîne à
    l'intérieur d'une version — et les versions s'enchaînent dans l'ordre : un dépôt en
    numérotation 1 passe par la 2 puis la 3. La migration d'un dépôt réécrit son état de
    tour, ses front-matter et ses fichiers Office, puis inscrit au journal un IDS_RENUMBERED
    par version appliquée ; le journal, lui, n'est jamais réécrit : un événement se lit à
    travers les tables de chaque IDS_RENUMBERED qui le SUIT, dans l'ordre.
