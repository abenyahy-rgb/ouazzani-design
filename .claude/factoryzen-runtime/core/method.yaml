retired_work_products:
  contract: >-
    Un livrable retiré est INSCRIT, jamais effacé. Des dépôts l'ont déjà déclaré, des
    fichiers portent son nom, un journal garde ses décisions : le supprimer en silence
    rendrait ce travail illisible du jour au lendemain, et une méthode qui efface son
    passé demande qu'on lui fasse confiance sur parole.
  numerotation: >-
    Les identifiants de cette liste (id) sont ceux de la numérotation 2, sauf mention
    « numerotation » sur l'entrée ; leur hôte (into)
    est donné dans la numérotation courante. Depuis la numérotation 3, un ancien identifiant
    retiré se traduit par renumbered_work_products — plusieurs de ces numéros sont
    aujourd'hui ceux de livrables vivants.
  rule: >-
    Une déclaration ancienne se lit comme une déclaration de son HÔTE. Aucun fichier n'est
    déplacé et aucun chemin ne change : la fusion recalcule les entrées du registre pour que
    « base + fichier » reste identique au caractère près.
  list:
    - id: WP-04
      name: Outcomes
      fate: fusionné
      into: WP-02
      on: '2026-09-22'
      why: >-
        Un outcome sans thèse est un chiffre orphelin. Les deux se répondaient sans jamais
        être lus ensemble, au prix d'un livrable, d'une déclaration et d'une revue de plus.
    - id: WP-05
      name: Hypothèses critiques
      fate: fusionné
      into: WP-02
      on: '2026-09-22'
      why: >-
        Une hypothèse critique est la thèse mise en doute ; l'en séparer laissait juger la
        thèse sans ses points faibles, et lister les points faibles sans ce qu'ils menacent.
    - id: WP-07
      name: Définition du critic métier
      fate: fusionné
      into: WP-03
      on: '2026-09-22'
      partial: >-
        Deux de ses sept sections rejoignent WP-03 : les sources adossées et le cas de test
        connu. Les cinq autres définissaient un agent — identité, outils, frontière
        d'écriture, contrat d'entrée, séparation des devoirs — que l'adaptateur GÉNÈRE déjà
        depuis le registre. Les faire écrire à la main créait une seconde définition,
        périmée dès la première régénération.
    - id: WP-39
      name: Prototype vivant
      fate: fusionné
      into: WP-11
      on: '2026-09-22'
      why: >-
        Le socle figé en G0 et le produit au sprint 5 ne sont pas deux livrables : c'est le
        même artefact vu à deux dates. Les tenir séparés obligeait à maintenir deux vérités.
    - id: WP-27
      name: Plan de sprints et readiness de delivery
      fate: fusionné
      into: WP-24
      on: '2026-09-22'
      why: >-
        Mettre le backlog en ordre EST le plan de sprints. Le second document n'avait pour
        seule matière que le tri du premier.
    - id: WP-20
      name: Discovery ciblée et parcours cibles
      fate: fusionné
      into: WP-18
      on: '2026-09-22'
      why: >-
        Le brief se rédigeait à l'étape du cadrage et la recherche à la suivante : on arrêtait
        donc un périmètre AVANT d'avoir cherché ce qui devait le déterminer. La fusion remet
        les deux dans l'ordre, et l'activité de discovery rejoint celle du cadrage.
    - id: WP-35
      name: Matrice de réconciliation et rapport de preview
      fate: fusionné
      into: WP-27
      on: '2026-09-22'
      why: >-
        Même étape, même rôle porteur. La réconciliation EST le contrôle de complétude du
        rapport de test, et le rapport de preview en est la preuve d'exécution.
    - id: WP-25
      numerotation: 3
      name: Design de sprint et Baseline Delta Declaration
      fate: fusionné
      into: WP-26
      on: '2026-10-08'
      why: >-
        Le design d'une slice n'a pas d'existence hors de son contrat : la Baseline Delta
        Declaration, les écrans et le delta de Design System en sont des sections. Les chemins
        design/ restent, sous slices/{slice-id}/.
    - id: WP-26
      numerotation: 3
      name: Spécification fonctionnelle et technique
      fate: fusionné
      into: WP-26
      on: '2026-10-08'
      why: >-
        La spécification d'une slice EST son contrat : critères de sortie, tests définis avant
        le code, règles, données, API et migrations. La séparer obligeait à lire deux documents
        pour savoir ce que la slice devait prouver.
    - id: WP-28
      numerotation: 3
      name: Stratégie, résultats et classification de tests
      fate: fusionné
      into: WP-27
      on: '2026-10-08'
      why: >-
        Les preuves de test sont la preuve des critères de sortie : elles rejoignent le
        journal de construction. La classification reste rendue par critic(quality), jamais par
        le producteur du test.
  shrunk:
    contract: >-
      Trois livrables n'ont pas été retirés mais RAMENÉS à ce qu'eux seuls portent. Leur
      assemblage est dérivé : les éléments de charte viennent des livrables qui les portent,
      les résultats de contrôle des contrôles, les verdicts des critics, et la décision —
      motif, autorité, date, commit — du Run Ledger où la tour l'inscrit au franchissement.
      Recopier à la main ce que la machine sait produire donnait un document capable de
      CONTREDIRE ses propres sources, et c'est le seul document qu'un gate lit.
    list:
      - id: WP-14
        from: 6
        to: 1
      - id: WP-23
        from: 10
        to: 1
      - id: WP-27
        from: 8
        to: 1
      - id: WP-25
        from: 4
        to: 7
        note: >-
          Ramené d'abord à son seul écart contrat / implémentation, puis fusionné à la
          numérotation 4 avec la preuve de tests : sept sections, dont une seule — l'écart —
          que la machine ne sait pas écrire. Ce qui suit vaut toujours pour elle.
          Trois de ses quatre sections se CALCULENT : l'avancement par story vient du journal
          de la tour, les points de clarification levés viennent de la trace des agents, le
          respect de la frontière d'écriture vient de la garde. Reste ce qu'aucune machine ne
          juge — l'écart entre ce qui était spécifié et ce qui a été construit — qui est
          précisément ce que ce livrable existe pour empêcher d'absorber en silence.

conditions:
  contract: >-
    Un livrable CONDITIONNÉ ne s'impose que si sa condition est vraie. Sans objet, il n'est
    ni manquant ni à produire, il ne compte pas dans un pack de gate et aucun contrôle ne le
    réclame. Confondre « sans objet » avec « manquant » fait porter au projet une dette qui
    n'existe pas — et c'est ainsi qu'une méthode complète devient une méthode qu'on contourne.
  defect_it_closes: >-
    Tout livrable du registre s'imposait à tout projet. Un produit neuf devait donc décrire
    l'architecture d'un existant qui n'existe pas, et ce livrable restait « à produire »
    jusqu'à ce que quelqu'un le remplisse de plausible ou apprenne à ignorer la liste. Les
    deux issues sont mauvaises, et la seconde est la pire : une liste qu'on apprend à
    ignorer ne protège plus de rien.
  declared_absence: >-
    Un livrable sans objet est CONSIGNÉ comme tel, avec la condition et le fait qui la rend
    fausse. Un silence ne vaut pas une dispense : la différence entre « nous avons regardé
    et cela ne s'applique pas » et « personne n'y a pensé » est exactement ce qu'un gate
    doit pouvoir lire.
  evaluated_at: "à l'ouverture du projet et à chaque instantané — sur des faits du dépôt, ou à défaut sur une déclaration portée par SOC-01"
  list:
    - id: brownfield
      question: Le produit reprend-il un système existant ?
      detected_by: >-
        Présence de sources applicatives dans le dépôt à son ouverture — manifeste de
        dépendances, dossier de code — en excluant les artefacts de la méthode elle-même.
      declared_in: "SOC-01, quand la détection ne tranche pas"
      when_false: "Produit NEUF : il n'y a ni système à reprendre, ni contrainte héritée. Les contraintes de ce produit naissent de ses propres décisions, et elles se déclarent là où elles naissent."
  extends: >-
    Cette liste porte aujourd'hui la seule condition établie. Les niveaux de risque —
    données personnelles, mouvement d'argent, domaine régulé, irréversibilité — s'y
    brancheront par le même mécanisme : une condition, un fait qui la tranche, et des
    livrables qui s'ajoutent au lieu de s'imposer.

presets:
  contract: >-
    Un contenu par défaut remplit ce qui est DÉJÀ SU, et rend visible ce qui ne l'est pas.
    Il fait gagner du temps de SAISIE, jamais du temps de DÉCISION. Les contenus vivent dans
    core/presets.yaml, subordonné au registre comme core/templates.yaml : il ne crée aucune
    section, n'en supprime aucune, n'en reformule aucun titre.
  defect_it_closes: >-
    L'activité 1 demandait quatorze sections. DIX étaient déjà connues au moment où le projet
    s'ouvre : calculables depuis le registre, conventions standard, ou recueillies au
    lancement. Le guide des « Entrées d'artefacts » disait lui-même « ne rien inventer :
    chaque chemin vient de work_products.base + files » — et faisait pourtant recopier cent
    vingt-quatre lignes à la main. Ce cérémonial n'était pas seulement cher : un travail
    perçu comme inutile se bâcle, et un livrable bâclé se déclare complet sans être lu.
    C'est ce mécanisme, et non un manque de rigueur, qui produit un socle sur fixtures.
  kinds:
    - id: derive
      means: "CALCULÉ depuis le registre, l'adaptateur ou le dépôt. Le retaper créerait une seconde source de vérité, donc une divergence en attente."
      human_input: aucun
    - id: default
      means: "CONVENTION STANDARD, vraie tant que le projet ne s'en écarte pas. Écrite en clair pour pouvoir être CONTREDITE : un défaut qu'on peut lire se corrige, un défaut implicite se subit."
      human_input: relecture, et correction si le projet s'en écarte
    - id: decision
      means: "Ni calculable ni standard. La section reçoit la QUESTION, jamais une réponse."
      human_input: obligatoire
  never: >-
    UNE DÉCISION NE SE PRÉ-REMPLIT JAMAIS. Qui décide un gate, quelle personne porte quel
    rôle, ÉQUIPE ou SOLO : un défaut plausible y serait exactement le défaut que la méthode
    existe pour empêcher — du contenu vraisemblable et invérifié, produit à l'échelle. Le
    pré-remplissage industrialiserait alors la faute au lieu de la prévenir.
  enforcement: >-
    Une section qui porte encore le marqueur « À DÉCIDER » est INCOMPLÈTE au sens du contrôle
    de forme, en Markdown comme en YAML. « complet » y est donc refusé par la tour, et K7 le
    rejoue sur le dépôt. C'est ce qui rend la promesse tenable : le preset ne peut pas, même
    par accident, faire passer un livrable pour fini.
  traceability: >-
    Un livrable pré-rempli le DIT — « preset: standard » dans son front-matter, et ses
    questions ouvertes en réserves. Un pré-remplissage qui ne s'annonce pas est indiscernable
    d'un travail fait, ce qui est précisément la confusion à éviter.
  never_overwrites: >-
    Le preset comble ce qui manque ; il ne rediscute jamais ce qui est là. Sur un fichier
    YAML il fusionne clé par clé, sur un Markdown il ne touche pas un fichier existant —
    même règle que le bootstrap, et pour la même raison.

plugin_layout:
  contract: "L'arborescence est DÉCLARÉE ici et vérifiée par K6. Un dossier que le harness découvre sans que le registre le connaisse est une capacité hors gouvernance ; un dossier déclaré et absent est une promesse non tenue."
  context_budget:
    skill_md_tokens: 2000
    rationale: "Un SKILL.md est chargé dès que le skill est retenu. Au-delà du plafond, il facture son détail à toute activité qui le touche, y compris celles qui n'en lisent pas la moitié. Le détail descend en references/, chargé à la demande."
    estimator: "octets ÷ 3.6 — approximation volontairement pessimiste ; K6 refuse un dépassement plutôt que de l'arrondir."
    external: "Un SKILL.md EXTERNE est chargé exactement comme celui du noyau : le plafond s'y applique aussi. Il ne se découpe pas — la copie est verbatim, et redescendre son détail en references/ serait un fork. Son dépassement est donc légal à une seule condition : la capacité adoptée déclare son coût de contexte, chiffré et motivé, et K6 confronte ce chiffre à l'octet du fichier vendoré. Un dépassement non déclaré est facturé en silence, ce qui est le défaut que le plafond existe pour empêcher."
  directories:
    - path: agents/
      discovery: auto — Claude Code
      generated: true
      source: registre → agents, une instance par critic
      controlled_by: K5, K6
    - path: skills/
      discovery: auto — Claude Code
      generated: true
      source: registre → skills d'origine core
      controlled_by: K2, K6
    - path: skills/{id}/references/
      discovery: à la demande, jamais chargé d'office
      generated: true
      source: "registre → activités outillées, livrables, et la façon de rendre la main — format Office et projection dans l'espace de travail, communs à tous les skills et sans objet en espace tiré. C'est ce qui garde SKILL.md sous le plafond."
      controlled_by: K6
    - path: commands/
      discovery: auto — Claude Code
      generated: true
      source: registre → opérations de la tour de contrôle
      controlled_by: K6
    - path: hooks/
      discovery: plugin.json → hooks
      generated: true
      source: "registre → contrôles de portée projet. Le hook n'appelle qu'apf guard : aucune règle ne vit dans un hook."
      controlled_by: K6
    - path: templates/
      discovery: aucune — instancié par le projet, jamais par le plugin
      generated: false
      source: "gabarits que le projet instancie. domain-critic n'est PAS dans agents/ : un critic de domaine non instancié citerait la mémoire du modèle au lieu de sources datées."
      controlled_by: K6
    - path: vendor/
      discovery: plugin.json → skills
      generated: false
      source: copies verbatim de commits épinglés, rehachées à chaque contrôle
      controlled_by: K6
    - path: mcp/
      discovery: plugin.json → mcpServers
      generated: false
      source: tour de contrôle — expose lib/tower.mjs sans porter de règle
      controlled_by: K6
    - path: launchpad/
      discovery: aucune — application web, déployée à part
      generated: false
      source: "projection TIRÉE de l'espace de travail lisible — voir notion_workspace.pull_projection. Importe lib/ et core/ par chemin relatif : aucune règle n'y est réécrite, l'avancement vient de stepProgress et les contrôles de runAll."
      controlled_by: K6
    - path: core/
      discovery: aucune
      generated: false
      source: "method.yaml — la source unique dont tout le reste est une projection. presets.yaml — contenus PAR DÉFAUT, subordonnés eux aussi : ils remplissent ce qui est déjà su et laissent une QUESTION aux décisions, que le contrôle de forme refuse de tenir pour remplies. templates.yaml — gabarits de rédaction des livrables, SUBORDONNÉS au registre : un guide et un exemple par section, jamais une section, une règle ni un critère de plus ; la suite de conformité refuse tout titre de section qui diverge du registre. « apf template <WP-nn> » rend le squelette."
      controlled_by: K2

control_tower:
  id: factory-control-tower
  name: Tour de contrôle
  transport: MCP stdio, JSON-RPC 2.0
  entrypoint: mcp/server.mjs
  declared_in: .claude-plugin/plugin.json → mcpServers
  logic: lib/tower.mjs — aucune règle ne vit dans le handler MCP ; la CLI, les hooks et la CI appellent les mêmes opérations
  state: runs/tower.json — état du run ; runs/ledger.ndjson — journal append-only
  mandate: "Jonction unique entre les agents et les étapes. Seule source du fragment d'activité, de la frontière d'écriture et du critère de sortie ; seule voie vers une gate ; seul point de gel d'un socle."
  powers:
    - "Refuser l'ouverture d'une activité dont la cadence n'est pas atteignable — une gate antérieure reste ouverte."
    - "Refuser l'ouverture d'une activité à un rôle qui n'en est pas responsable — P5, séparation des devoirs."
    - "Refuser la déclaration d'un livrable étranger à l'activité ouverte, ou d'un chemin hors frontière d'écriture."
    - "Refuser le franchissement d'une gate au pack incomplet ou dont un contrôle est en échec."
    - "Refuser le franchissement d'une gate humaine par un agent : l'autorité doit être nommée."
    - "Refuser le gel d'un socle après G0 : un CORE INVARIANT ne se modifie plus que par exception déclarée."
  limits:
    - "NE VOIT PAS les écritures natives du harness. Un agent qui écrit un fichier sans passer par elle n'est pas arrêté. Aucun serveur MCP ne peut prévenir ce qu'il n'expose pas."
    - "N'EST PAS la preuve opposable. La preuve reste la CI, qui rejoue les mêmes contrôles sur le dépôt."
    - "NE REMPLACE PAS les hooks : seul un hook PreToolUse arrête une écriture avant qu'elle ait lieu, et il est spécifique au harness."
  enforcement_model: "Elle ne prévient pas, elle rend le contournement PROUVABLE et COÛTEUX. Prouvable : tout livrable présent sur disque sans entrée correspondante au journal est un trou que K8 voit. Coûteux : un agent qui ne l'appelle pas n'a ni son fragment, ni sa frontière, ni son critère de sortie — il perd l'information, pas seulement la conformité."
  operations:
    - name: factory_state
      args: []
      purpose: "Où en est le run : activité courante, gates franchies, socles gelés, cadences atteignables."
    - name: factory_open_activity
      args: [activity, actor, tier, reprise, express]
      purpose: "Ouvre une activité et rend son fragment compilé, sa frontière d'écriture, son critère de sortie, le squelette de chacun de ses livrables, les réserves ouvertes qui lui sont routées et le routage de ses rôles — modèle et effort de chaque porteur et de chaque critic dans le contexte : cadence, tier, réouverture d'un gate refusé, chemin EXPRESS (R6). Unique source du fragment : refuse si une gate antérieure est ouverte ou si le rôle ne correspond pas."
    - name: factory_route
      args: [agent, activity, tier, reprise, express]
      purpose: "Le modèle et l'effort d'un rôle de la méthode dans le contexte de l'activité ouverte, ou dans celui donné, avec chaque modulation appliquée et son motif — en classe, en effort quand R5 ou la classe la plus haute l'impose, ou sans effet (R6). Constat, jamais décision : c'est la garde qui refuse l'invocation qui s'en écarte."
    - name: factory_declare
      args: [activity, work_product, path, evidence, completion, reserves, instance]
      purpose: "Déclare un livrable produit. Refuse un livrable étranger à l'activité, un chemin hors frontière, une complétude tacite, et un « complet » dont la forme ne l'est pas : fichiers déclarés présents, front-matter requis, un H2 non vide par section du registre. « partiel » consigne les écarts sans refuser."
    - name: factory_request_gate
      args: [gate]
      purpose: "Constate l'état d'une gate : pack, livrables manquants, contrôles en échec. Constat, jamais décision."
    - name: factory_clear_gate
      args: [gate, human, decision, build, tier, second]
      purpose: "Franchit une gate. Exige un pack complet, zéro contrôle en échec, et une autorité humaine nommée. G4 exige en plus le build autorisé (commit ou empreinte acceptés en QA), une décision du registre et, en tier R3, une seconde autorité distincte ; elle vaut 7 jours pour ce build."
    - name: factory_release_check
      args: [build]
      purpose: "Ce build peut-il partir en production ? Relu par le workflow de mise en production avant tout déploiement (apf release-check) : G4 franchie pour CE build, décision d'autoriser, dans sa validité. Constat, jamais décision : une approbation de l'environnement « prod » ne remplace pas la gate."
    - name: factory_record_direction
      args: [by, verbatim, scope, impact, changes, unchanged]
      purpose: "Consigne une DIRECTION humaine donnée hors gate — plateforme, dépôt, canal, environnement, retrait de périmètre. Mot pour mot, datée, avec son test de budget de périmètre — ce qui change, ce qui reste inchangé — et son impact : AUCUN · PÉRIMÈTRE DE RELEASE · CANAL DE VALIDATION · PRODUIT, qui appelle une décision formelle · MÉTHODE, qui consigne d'office une observation sur la méthode. Une direction non consignée n'existe pas pour la méthode : la mémoire d'un run ne vit jamais dans la conversation."
    - name: factory_record_observation
      args: [par, constat, preuve, concerne, proposition]
      purpose: "Consigne un CONSTAT sur la méthode — ce qui a manqué, coûté ou trompé dans ce run —, daté et prouvé (fichier, commit, direction, verdict), au premier niveau de l'échelle d'évolution. Sans effet sur la méthode : il remonte au Launchpad avec ceux des autres projets, et seule une MCR en fait une méthode proposée. Une direction humaine d'impact MÉTHODE en consigne une d'office."
    - name: factory_freeze_baseline
      args: [baseline, elements, human]
      purpose: "Gèle un socle en CORE INVARIANT. Refusé après G0."
    - name: factory_check
      args: []
      purpose: "Exécute les huit contrôles déterministes et l'intégrité du vendoring."
    - name: factory_resolve_skill
      args: [id]
      purpose: "Résout un skill vers son chemin livré et son verdict d'intégrité — externe compris."
    - name: factory_derive_model
      args: []
      purpose: "Dérive le modèle de données du schéma exécuté et le lie au glossaire. Rend la liste des champs non résolus : un champ sans terme de glossaire est une dérive sémantique que K4 refuse."
    - name: factory_compose_prototype
      args: []
      purpose: "Recompose le prototype vivant — socle ⊕ deltas de release ⊕ deltas de slice, dans l'ordre. Rend les écrans non subordonnés et les étapes devenues inatteignables."
    - name: factory_workspace_plan
      args: []
      purpose: "Rend le PLAN de l'espace de travail lisible. Le nom du produit se LIT dans l'identité recueillie à l'activité 1, il ne se passe pas en argument : un produit nommé depuis une ligne de commande est nommé hors de toute activité."
    - name: factory_workspace_link
      args: [work_product, url]
      purpose: "Relie un livrable produit à sa page dans l'espace de travail. Pointeur bidirectionnel."
    - name: factory_workspace_sync
      args: [work_product]
      purpose: "Date la projection d'un livrable au commit courant, APRÈS avoir écrit la page. Relier dit qu'une page existe ; dater dit à QUEL état du dépôt elle a été écrite. Sans cette date, la fraîcheur de la page est invérifiable."
    - name: factory_source_claim
      args: [url, consulted_at, verbatim]
      purpose: "Recevabilité d'une affirmation issue d'une recherche : adresse, date de consultation, citation littérale. Sans les trois, un tiers ne peut ni rejouer ni contredire — ce n'est pas une source, c'est un souvenir. L'affirmation est alors rétrogradée en UNVALIDATED et porte un HYP-nn ; elle n'est jamais effacée."
    - name: factory_workspace_project
      args: []
      purpose: "Le corps de la ligne de projet : étape courante, avancement de chaque étape, gates franchies et ouvertes. CALCULÉ depuis le journal de la tour. Le statut de la ligne ne bougeant qu'aux gates, le projet resterait inerte pendant toute une cadence ; ce bloc le rend lisible sans écrire une troisième colonne dans une base que l'organisation possède."
    - name: factory_workspace_drift
      args: []
      purpose: "Ce qui a été produit dans Git et n'a pas suivi dans l'espace de travail — jamais projeté, projection non datée, ou périmée. Calculé HORS LIGNE par comparaison Git : la tour ne fait aucun appel au service tiers. Une dérive arrête une ACTIVITÉ ; elle n'arrête JAMAIS une gate."
    - name: factory_workspace_status
      args: []
      purpose: "Rapporte quels livrables sont reliés. RAPPORTE, ne refuse pas : l'espace de travail ne bloque jamais un gate."
    - name: factory_workspace_where
      args: [work_product]
      purpose: "Où va ce livrable, et surtout : UPDATE ou CREATE. La ligne existe depuis le bootstrap ; en créer une seconde donnerait deux pages pour un livrable, donc deux vérités."
    - name: factory_autopilot_start
      args: [par, mode]
      purpose: "Démarre l'autopilote de la cadence C1, au nom de la personne qui ratifiera en G0 (MCR-002), en conduite « atelier » ou « decideur » (MCR-007). La tour calcule chaque action ; le hook Stop refuse la fin de tour tant qu'il en reste une et que le run progresse."
    - name: factory_autopilot_stop
      args: [raison, par]
      purpose: "Arrête l'autopilote. Rien n'est défait : état, verdicts et file de décisions restent."
    - name: factory_next
      args: []
      purpose: "L'action suivante de l'autopilote — INTERROGER, OUVRIR, PRODUIRE, JUGER, REPRENDRE, CORRIGER, ou un arrêt STOP_DECISION, STOP_G0 —, avec le modèle et l'effort de chaque rôle à invoquer. Constat, jamais décision."
    - name: factory_record_verdict
      args: [work_product, critic, path]
      purpose: "Enregistre les critiques d'un critic, lues dans le fichier déposé : chaque CRIT-n — sévérité, recommandation — entre en file comme décision CRITIQUE que le porteur retient ou écarte, et la synthèse doit en donner le compte exact. Aucune critique : le livrable converge. Le critic ne tranche rien (MCR-004)."
    - name: factory_queue_decision
      args: [type, activite, objet, question, options, bloquante, engageante, rayon, par]
      purpose: "Met en file une décision qui revient à l'humain. Bloquante — intention, irréversible, corpus réel — elle arrête l'autopilote ; sinon elle attend G0 sans l'arrêter. En mode décideur, une décision d'intention avec options est appliquée sur la recommandée ; seule une décision engageante arrête le run."
    - name: factory_answer_decision
      args: [id, by, choix, note]
      purpose: "L'humain tranche une décision de la file, nommément. Tranchée autrement que le défaut appliqué, elle rouvre l'activité qui l'avait appliqué. Le Launchpad dépose la même réponse en fichier, ingéré à l'action suivante."
    - name: factory_autopilot_resume
      args: [activite]
      purpose: "Sort de la file la reprise d'une décision tranchée autrement, une fois l'activité rouverte et ses livrables redéclarés, et rend l'action suivante."
    - name: factory_autopilot_state
      args: []
      purpose: "L'état de l'autopilote : actif ou non, file des décisions, boucles producteur ↔ critic, ce qui reste à ratifier et à trancher."
    - name: factory_workspace_instance
      args: [kind, instance]
      purpose: "Crée les lignes d'une instance qui existe désormais. Une release ne crée pas les lignes de ses slices."

runtime_dependencies:
  contract: "Ce dont l'EXÉCUTION dépend est LIVRÉ avec le plugin, jamais espéré d'une installation. Claude Code installe un plugin par CLONE : il copie les fichiers du dépôt et n'exécute aucune étape d'installation de dépendances. Une dépendance déclarée dans package.json est donc absente à l'exécution."
  defect_it_closes: "js-yaml était une dépendance npm et node_modules/ est ignoré par Git. Sur toute installation réelle, la CLI et la tour de contrôle ne démarraient pas, et la garde en boucle sortait en 1 au lieu de 2 — donc n'arrêtait plus aucune écriture : elle échouait en OUVRANT. Aucun des huit contrôles ne le voyait, tous s'exécutant après un « npm ci »."
  entrypoint_rule: "Un module vendoré est importé par UN SEUL point d'entrée sous lib/. Cinq fichiers importaient js-yaml directement : cinq occasions de retomber sur la dépendance absente."
  packages:
    - id: js-yaml
      version: 4.3.2
      licence: MIT
      upstream: https://github.com/nodeca/js-yaml
      why: "Le registre est en YAML, et les fichiers de projet lus à l'exécution le sont aussi — project.yaml, front-matter des livrables. Un parseur est donc requis au RUNTIME, pas seulement au build."
      entrypoint: lib/yaml.mjs
      vendor:
        root: vendor/js-yaml
        strategy: "Copie verbatim du bundle ESM publié, jamais éditée. Mise à jour : « npm i js-yaml@<version> », recopier dist/js-yaml.mjs et LICENSE, puis « apf vendor --relock »."
        files:
          "LICENSE": a07bc24468b9654ce76a547d47a2db282d07733b715db4c73a98bd63961f9550
          "js-yaml.mjs": cea276c7e15f409a1adbe5d177aba7824398a474f7cf702bd57962c7d570636f
    - id: office
      version: "pptxgenjs 4.0.1 · docx 9.8.1 · jszip 3.10.2"
      licence: "MIT (pptxgenjs, docx) · MIT OR GPL-3.0-or-later (jszip, retenue sous MIT)"
      upstream: "https://github.com/gitbrent/PptxGenJS · https://github.com/dolanmiu/docx · https://github.com/Stuk/jszip"
      why: "Chaque livrable se lit dans le format Office que son gabarit déclare — PowerPoint ou Word — et la tour l'écrit à chaque déclaration. Les bibliothèques laissées en dépendance npm du dossier render/ étaient absentes de tout projet installé : aucun livrable Office n'y était jamais produit."
      entrypoint: lib/office.mjs
      vendor:
        root: vendor/office
        strategy: "Bundle ESM unique, minifié, sans dépendance, construit par « node build/build-office-vendor.mjs » depuis render/package-lock.json ; jamais édité à la main. Mise à jour : relever les versions dans render/, reconstruire, puis « apf vendor --relock »."
        files:
          "LICENSE-docx": b5b2364c0c95a26b2a2399d7e706a61acac680be1d5b180b00592ee85830bffb
          "LICENSE-jszip.md": 566c953c6090b1218ca6217dd7359d45dde46581968586dc607d59a78af6a9c4
          "LICENSE-pptxgenjs": 7a2bfe96150786ed1908b8e63f98ebab88875c1e79e28faff6649e0f11f77e52
          "office.mjs": 5367774aff0a7c00eeb6b6b7ebdfe01468683de82dc0077d80187c1de90efc44

external_capabilities:
  note: "Toute capacité externe référencée par un adaptateur figure ICI. Un outillage cité par une obligation mais absent de cette collection est une référence pendante — contrôlé par K6."
  sources:
    - id: mattpocock-skills
      repository: https://github.com/mattpocock/skills
      pinned_commit: 3cca18b368ae95cdbdebbff572ccafa662551015
      pinned_date: "2026-09-04"
      licence: à confirmer avant publication du plugin
      vendor:
        root: vendor/mattpocock-skills
        strategy: "Copie verbatim du commit épinglé, jamais éditée. L'intégrité est recalculée à chaque contrôle : une modification locale, même d'un octet, fait échouer K6. Une copie non contrôlée serait une seconde source de vérité ; une copie contrôlée n'en est pas une."
        discovery: "plugin.json → skills. Ce champ S'AJOUTE au dossier skills/ par défaut : le skill externe est donc livré avec le plugin et disponible sans installation séparée."
        files:
          "grill-me/SKILL.md": caaf8b8de1684f96e26b28f3c29189db5c89cce4b73e1c93d86164f66ef88637
