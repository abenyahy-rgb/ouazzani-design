    mandate: "Plancher de métier de la conception d'interface : mode de surface, playbook de la demande, plancher de craft lu immédiatement avant toute édition, vérification en passes bornées. Adopté en GUIDANCE SEULE — le lanceur et son moteur déterministe ne sont pas livrés, et le skill prévoit ce cas. Ne fait pas : écrire PRODUCT.md, DESIGN.md ou un hook de projet — ces chemins sont hors registre, et le contexte produit est tenu par design-brief.md, WP-08, WP-11 et WP-19. Ne fait pas : rendre un PASS — son verdict est une appréciation, jamais un contrôle."
controls:
  - id: K1
    name: Couverture du squelette
    blocks: G0
    verifies: "Chaque étape de parcours porte exactement un lien INTRODUCES · aucun DEPENDS-ON vers une étape introduite plus tard · aucun ENRICHES vers une étape non introduite."
    rationale: "Le contrôle le plus rentable de la méthode : il garantit que le découpage en releases est exhaustif et sans recouvrement."
    implemented: false
    scope: projet
    status: algorithme écrit, exige une instance de projet
  - id: K2
    name: Intégrité du registre
    blocks: tout gate
    verifies: "Tout chemin cité par une activité existe dans artifact-schema.yaml · tout chemin du registre est produit par exactement une activité · toute activité citée par un rôle ou un skill existe, et chaque rôle cite les activités qu'il porte."
    rationale: "Sans lui, un skill peut écrire à des chemins qu'il définit lui-même et produire des artefacts invisibles à la gouvernance."
    implemented: true
    scope: méthode
    status: actif sur le registre
  - id: K3
    name: Intégrité de la chaîne de traçabilité
    blocks: G1, K1, G3
    verifies: "Aucune entité orpheline · toute Story trace vers un Epic et un parcours cible · tout AC matériel pointe vers au moins une Evidence exécutée."
    rationale: C'est ce qui rend « chaque AC est prouvé » vérifiable plutôt que déclaré.
    implemented: false
    scope: projet
    status: algorithme écrit, exige une instance de projet
  - id: K4
    name: Intégrité du socle
    blocks: merge, K1
    verifies: "Aucun commit hors cadence C1 ne modifie un CORE INVARIANT — socle de design, socle technique, noyau du modèle de données · subordination Design ⊂ Release ⊂ Spine vérifiée sur les artefacts de design ET sur le prototype vivant recomposé · aucune entité ni aucun champ non résolu dans la table de liaison · aucun écran non subordonné dans le prototype composé."
    rationale: "La contrepartie du découpage en releases. Sans lui, le socle se dégrade release après release et le bénéfice du découpage disparaît."
    implemented: false
    scope: projet
    status: algorithme écrit, exige une instance de projet
  - id: K5
    name: Builder ≠ Judge
    blocks: tout gate
    verifies: "L'Accountable d'une activité n'est jamais son Responsible · aucun critic n'apparaît en Responsible ou Accountable d'un livrable · aucun rôle interdit n'est combiné dans un même contexte de raisonnement."
    rationale: P2 cesse d'être une consigne de prompt et devient une propriété du dépôt.
    implemented: true
    scope: méthode
    status: actif sur le registre
  - id: K6
    name: Restriction d'outillage
    blocks: build du plugin
    verifies: "Tout agent évaluateur est déclaré en lecture seule au niveau de son outillage · l'evidence boundary du quality-engineer est déclarée et respectée · les 5 blocs de définition d'agent et ses règles de travail sont présents, et chaque instance de critic porte ses contrôles du domaine · un évaluateur n'exécute que les commandes de contrôle de la méthode."
    rationale: "Une interdiction écrite dans un prompt est une consigne ; une restriction d'outillage est un contrôle. Seul mécanisme qui prévient au lieu de détecter."
    implemented: true
    scope: méthode
    status: actif sur le registre
  - id: K7
    name: Complétude du pack de preuves
    blocks: soumission de gate
    verifies: "Chaque élément listé par la charte du gate est présent avant soumission · chaque résultat de validation porte son niveau d'evidence · aucun BLOCKER ouvert · les gabarits (core/templates.yaml) portent exactement les sections du registre · tout livrable déclaré complet porte ses fichiers, son front-matter et un H2 non vide par section, au titre exact — la tour le refuse à la déclaration, K7 le rejoue sur le dépôt."
    rationale: "Un pack incomplet n'est pas soumis, il est renvoyé — automatiquement, sans mobiliser l'autorité du gate."
    implemented: true
    scope: mixte
    status: actif sur le registre
  - id: K8
    name: Run Ledger et déclarations
    blocks: tout gate
    verifies: "Run Ledger ouvert avant toute activité · cadence déclarée · chemin EXPRESS déclaré avant démarrage · compteur de tours de convergence tenu · aucune approbation expirée · aucun gate décidé sans ledger."
    rationale: L'état du Run devient durable et opposable, au lieu de vivre dans la mémoire d'une session.
    implemented: false
    scope: projet
    status: algorithme écrit, exige une instance de projet
principles:
  - id: P1
    name: Spine before slices
    controlled_by: K1, K4
    rule: "Ce qui est cher à changer est conçu une fois, globalement, avant tout découpage, et figé en G0. Une release remplit le socle ; elle ne le réinvente pas. Seul un CORE INVARIANT rouvre G0."
  - id: P2
    name: Builder ≠ Judge
    controlled_by: K5, K6
    rule: "Production et évaluation sont confiées à des rôles distincts. Chaque activité nomme un Accountable qui n'est pas son producteur. Tout rôle évaluateur est en lecture seule au niveau de son outillage."
  - id: P3
    name: Un seul plan de contrôle
    controlled_by: K8
    rule: "Aucun outil, skill ou plugin n'introduit une state machine concurrente. Un agent ne franchit jamais silencieusement une transition matérielle : une autorisation d'outil n'est pas une autorisation de gate."
  - id: P4
    name: Le registre fait foi
    controlled_by: K2, K3
    rule: "Décisions, ADR, baselines, risques et validations sont versionnés dans Git. Les chemins sont déclarés dans artifact-schema.yaml. Ce qui n'est pas dans Git n'est pas opposable ; ce qui n'est pas au registre n'existe pas."
  - id: P5
    name: Preuve proportionnelle, inconnu assumé
    controlled_by: K7
    rule: "La profondeur de preuve augmente avec le tier de risque, jamais réduite sans décision humaine enregistrée. Un input requis absent produit BLOCKED, jamais une inférence. Une approximation n'est jamais présentée comme une mesure."
  - id: P6
    name: Aucune règle sans contrôle
    controlled_by: sunset 90 j
    rule: "Une règle qui ne dispose pas d'un contrôle déterministe dans les 90 jours est retirée, pas conservée en attente. Un agent ne modifie jamais la méthode qu'il exécute : il ouvre une MCR."
  - id: P7
    name: Le produit tire la factory
    controlled_by: coût de la gouvernance, mesuré à chaque synchronisation
    rule: "La gouvernance existe pour le produit, jamais l'inverse. Son coût se MESURE — jours avant le premier code, part de la gouvernance dans le dépôt — et s'affiche avec le projet ; un budget dépassé est une alerte portée au Product Owner, qui décide d'alléger ou de continuer, jamais un silence."
scales:
  - name: Tier de risque
    levels:
      - id: R0
        definition: Réversible, aucun effet externe, aucune surface sensible.
        consequence: Autonome. Journalisé au Run Ledger.
      - id: R1
        definition: Réversible, couvert par un test, périmètre de la slice, donnée non sensible.
        consequence: Autonome dans les limites de la slice. Revue standard.
      - id: R2
        definition: "Matériel : change une intention, un contrat ou une baseline. Ou touche auth, autorisation, accès données, dépendances, migrations."
        consequence: Approbation humaine avant exécution. Revue complète, threat model, pentest proportionnel.
      - id: R3
        definition: "Irréversible ou engageant. Ou secrets, données personnelles, paiement, production. Inclut tout CORE INVARIANT du socle."
        consequence: "Autorité explicite, evidence renforcée, pentest obligatoire, rollback testé, DEUX autorités humaines distinctes."
    note: "Fusion des anciennes échelles D0-D3 (réversibilité) et S0-S3 (surface de sécurité). Elles co-variaient en pratique, et la v4 consacrait une section entière à expliquer qu'elles étaient indépendantes."
  - name: Sévérité
    domain_note: "Chaque finding porte aussi un DOMAINE : PRODUIT, défaut de l'artefact jugé, ou CONTRÔLE, défaut d'un gabarit, d'un contrôle K ou d'un validateur. Deux verdicts, jamais confondus : l'éligibilité produit se calcule sur PRODUIT seul, la santé de la méthode sur CONTRÔLE seul. Un CONTRÔLE BLOCKER bloque la transition qui dépend du contrôle cassé, jamais la gate produit — lire un défaut de la machinerie comme un défaut du produit est le défaut que ce domaine existe pour empêcher."
    levels:
      - id: BLOCKER
        definition: Empêche le franchissement du gate.
        consequence: Gate infranchissable. Correction puis nouvelle passe du critic.
      - id: MAJOR
        definition: Crée une dette explicite acceptée nommément par l'autorité du gate.
        consequence: ACCEPTER SOUS CONDITION, avec échéance datée et porteur nommé.
      - id: MINOR
        definition: Amélioration sans risque matériel.
        consequence: Portée au backlog. N'ouvre jamais un tour de convergence à elle seule.
      - id: OBSERVATION
        definition: Constat ou signal faible sans demande de correction.
        consequence: Enregistrée. Alimente la fermeture de gate.
    note: "Le tier qualifie une SURFACE et commande la profondeur d'evidence. La sévérité qualifie un FINDING et commande le franchissement. « Un finding R2 » est une formulation interdite."
  - name: Niveau d'evidence utilisateur
    levels:
      - id: EMPIRICAL
        definition: "Test avec de vrais utilisateurs représentatifs, version figée par commit, protocole écrit avant le test, biais déclarés."
        consequence: Une observation. Le seul niveau qui établit un fait sur le comportement d'un utilisateur.
      - id: DOCUMENTARY
        definition: "Paroles et comportements d'utilisateurs réels relevés dans des sources publiques — avis, forums, communautés, études, statistiques —, chacun avec adresse, date de consultation et citation littérale, deux sources indépendantes au moins sur tout trait retenu."
        consequence: "Un indice sur des personnes réelles, non sollicitées et auto-sélectionnées. Fonde un proto-persona, un irritant, un parcours as-is ; ne tranche pas une question de comportement qu'un test seul établit — celle-là reste une hypothèse HYP-nn, testée en discovery de release (13) ou en validation (17)."
      - id: SYNTHETIC
        definition: "Preuve produite par des agents, en DEUX sous-classes déclarées, jamais confondues. SYNTHETIC · AXR — revue experte : un agent qui CONNAÎT l'intention du produit le parcourt dans la posture d'un persona documenté. SYNTHETIC · SUX — test aveugle : des agents utilisateurs qui IGNORENT l'intention pilotent l'artefact déployé avec leur seul persona et leur mission, derrière un pare-feu."
        consequence: "Une hypothèse structurée. AXR révèle des défauts de conformité et de conception ; SUX révèle des risques de compréhension et de navigation. Aucune des deux n'établit un fait sur un utilisateur réel. Toujours comptée en « sessions synthétiques », jamais en « utilisateurs »."
      - id: UNVALIDATED
        definition: Conviction issue de l'expérience ou du raisonnement, sans test ni revue.
        consequence: Rien d'autre qu'une direction à tester. Marquée comme telle partout où elle apparaît.
    note: "Étiquette obligatoire, pas une échelle de pilotage. Une revue synthétique présentée sans étiquette est un finding MAJOR ; présentée comme empirique, un BLOCKER ; une revue experte (AXR) présentée comme un test d'utilisateur (SUX), un BLOCKER. Une recherche documentaire présentée comme empirique est un BLOCKER : lire ce qu'un utilisateur a écrit n'est pas l'avoir observé."
  - name: Catégories du socle
    levels:
      - id: CORE INVARIANT
        definition: "Ce dont la modification casse des artefacts déjà livrés : sémantique, statuts, structure du squelette, identifiants persistés, terme employé dans une release livrée."
        consequence: Tier R3. Réouverture de G0 avec analyse d'impact sur toutes les releases. EX3.
      - id: EXTENSION
        definition: "Ce qui n'invalide rien de livré : nouvel écran sous une étape existante, nouveau composant, nouveau terme sans homonyme, libellé modifié avant livraison."
        consequence: R1 ou R2. Aucun gate supplémentaire. Traité en G1 ou K1 selon le niveau.
    note: "Le classement se fait par rayon d'impact, jamais par nature apparente de l'objet. C'est le nombre d'artefacts invalidés qui décide."
exceptions:
  protocol:
    - step: DÉCLARER
      rule: "enregistrer au Run Ledger avec le déclencheur observable. Une exception n'est jamais résolue par l'agent qui l'a déclenchée."
    - step: BORNER
      rule: une échéance datée. Une exception sans échéance est une exception permanente déguisée.
    - step: NOMMER UN PORTEUR
      rule: une personne ou un rôle identifié, distinct de celui qui a déclaré. Jamais « l'équipe ».
    - step: ROUTER
      rule: "au niveau le plus bas qui a l'autorité de trancher : N1 factory-lead · N2 Product Owner · N3 autorité Tech · N4 HUMAN OWNER."
    - step: FERMER OU REPORTER
      rule: le silence n'est jamais une résolution. Le coût est relevé dans les deux cas.
  named:
    - id: EX1
      situation: "Non-convergence producteur/critic après deux tours, ou gate refusé deux fois sur le même périmètre."
      behaviour: "Arrêt de la boucle — pas du run : sous autopilote, le critic ne tranche plus, le porteur trie chaque critique (autopilote.satisfaction.tri) ; un désaccord qui subsiste après son tri lui revient en arbitrage. Le factory-lead consigne les deux positions et les soumet en l'état, sans arbitrer sur le fond. Interdiction d'une troisième soumission à l'identique : réduire le périmètre, changer d'approche, ou escalader. Chaque objection reçoit sa disposition au registre de dispositions — acceptée, réduite, rejetée ou non vérifiée —, vérifiée contre la source par un autre que l'émetteur : seule une disposition vérifiée change l'état."
      authority: factory-lead sur la procédure ; HUMAN OWNER sur le fond.
    - id: EX2
      situation: "Input requis ABSENT ou SOUS-SPÉCIFIÉ, ou contexte de raisonnement indépendant indisponible pour un critic."
      behaviour: "ABSENT : BLOCKED, arrêt, jamais de reconstruction par inférence. SOUS-SPÉCIFIÉ : une seule salve de quatre questions au maximum ; sans réponse, hypothèses explicitement nommées et étiquetées UNVALIDATED, chacune devenant un point de test. INDÉPENDANCE : déclarer INDEPENDENCE NOT AVAILABLE, ne jamais présenter le verdict comme indépendant."
      run_mode_solo: >-
        En RUN MODE SOLO déclaré (SOC-01), un input ABSENT ne produit plus un arrêt dans le cas
        général : il produit une HYPOTHÈSE nommée, étiquetée UNVALIDATED, avec son critère de
        falsification et son point de test, et l'activité continue. TROIS CAS RESTENT BLOCKED,
        sans exception et quel que soit le mode : un input qui n'est pas une information mais une
        DÉCISION que seul l'humain qui répond du produit peut prendre — intention, arbitrage de
        périmètre, critère d'abandon ; un input dont l'absence rendrait IRRÉVERSIBLE une erreur —
        tout ce qui est figé par un gate ou classé CORE INVARIANT ; et le CORPUS RÉEL, parce
        qu'aucune hypothèse ne remplace un fait que le produit affichera à un utilisateur.
        Motif : BLOCKED est la bonne règle face à des parties prenantes réelles. Face à une seule
        personne, elle convertit chaque input manquant en arrêt total, et la méthode se fait alors
        contourner par une lettre de délégation écrite hors cadence — un contournement qui, lui,
        ne laisse aucune trace de ce qui était supposé. Une hypothèse nommée est traçable ; une
        délégation improvisée ne l'est pas.
      authority: "factory-lead : produire l'input, répondre, ou replanifier. La bascule en SOLO appartient au Product Owner, à l'ouverture du Run, et jamais à un agent en cours d'activité."
    - id: EX3
      situation: "Le socle doit changer — une release en conception l'exige, ou plusieurs releases demandent la même modification."
      behaviour: "Interdiction absolue de modifier le socle depuis C2 ou C3. Émettre un finding, suspendre la conception sur le point concerné, ouvrir une réouverture de G0 avec analyse d'impact. Plusieurs releases demandant la même modification = défaut du socle, et MCR si le défaut vient de la méthode d'élaboration."
      authority: HUMAN OWNER — tier R3.
    - id: EX4
      situation: Test rouge causé par un défaut produit, ou écart entre baseline, spécification et code.
      behaviour: "La CLASSIFICATION est un verdict : elle appartient à critic(quality), jamais au mode qui a écrit le test. Un PRODUCT FAILURE interdit absolument de réparer le test pour obtenir un vert. Tout healing exige une re-vérification indépendante. Un écart est classé : manquant · partiel · contredit · non demandé · superseded."
      authority: critic(quality) pour la classification ; autorité du gate pour la décision.
traceability:
  - prefix: OUT
    entity: Outcome
    produced_at: "2"
    traces_to: —
    controlled_at: G0
  - prefix: HYP
    entity: Hypothèse
    produced_at: "2"
    traces_to: OUT
    controlled_at: G0
  - prefix: PER
    entity: Persona
    produced_at: "4"
    traces_to: OUT
    controlled_at: G0
  - prefix: STG
