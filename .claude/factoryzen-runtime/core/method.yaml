      - title: Étapes hors périmètre du produit
        rule: nommées, pour prouver l'exhaustivité
    completion: "Exhaustif : aucune étape du parcours réel absente. Enchaînement validé par le critic de domaine. Chaque étape porte exactement un lien INTRODUCES (K1). Chaque étape déclare sa famille, et chaque opérateur du canevas a la sienne (K1)."
