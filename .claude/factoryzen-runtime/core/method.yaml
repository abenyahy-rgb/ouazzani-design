      - "Synthétiser par regroupement d'affinités : verbatims → thèmes → insights. Un insight est une TENSION dite en une phrase — ce que la personne veut, et ce qui l'en empêche —, avec ses sources et sa solidité ; un thème qu'une seule source porte est faible et le dit."
      - "Construire les personas sur des VARIABLES DE COMPORTEMENT : quatre à six axes tirés des verbatims (fréquence, outil, autonomie, rapport au risque…), placer chaque auteur, retenir les groupes qui se distinguent. Deux à quatre personas, un fichier PER-nn chacun ; leurs curseurs montrent ce qui les sépare. Deux personas qui parlent de la même voix n'en font qu'un."
