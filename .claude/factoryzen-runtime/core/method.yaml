        - "Retour du porteur de la méthode, 17 octobre 2026, sur le run TennisCoach : « c'est fatigant, parce que ce n'est pas autonome […] je me retrouve à faire le boulot de l'équipe moi-même » ; le persona de FactoryZen est un membre de comité exécutif qui veut une équipe d'agents qui vient lui présenter quelque chose qu'il peut faire avancer."
        - "Run TennisCoach, état de la tour au 17 octobre 2026 : 126 décisions tranchées par le porteur avant G0, dont les 93 déléguées ratifiées d'un bloc (DEC-114 à DEC-121) ; atelier et interrogatoire conduits une question à la fois ; G0 non franchie (ITÉRER, DEC-110)."
        - "Essai « magicien d'Oz » du 17 octobre 2026 : un mandat d'une phrase, deux sous-agents en parallèle, aucune question au porteur, un dossier COMEX de douze planches et un prototype de cinq écrans en une heure environ ; le porteur juge le travail « très bien » et corrige le cap par ses contraintes — temps, canaux, cofondateur, géographie, segment —, que l'équipe ne connaissait pas."
        - "Direction du porteur, 18 octobre 2026 : ajuster FactoryZen à la marge sans jeter la recherche et le design thinking ; prioriser les pays et les segments qui paient le plus ; tester d'abord le service rendu par le coach cofondateur ; le persona utilisateur de FactoryZen est un décideur."

retired_activities:
  contract: >-
    Une activité retirée est INSCRITE comme un livrable l'est. Des journaux la citent, des
    rôles la revendiquent : l'effacer rendrait illisible ce qui a été fait sous son numéro.
    Ses numéros — id et into — sont ceux de la numérotation où elle a été retirée (champ
    numerotation) ; la table d'activités de la numérotation 5 lit chacune sur l'activité qui
    l'a absorbée (12 → 12, 19 et 20 → 18, 22 → 19).
