          build est un finding, jamais deux vérités qu'on réconcilie à la première slice.
      - title: Classement
        rule: CORE INVARIANT si sa remise en cause invalide du livré, EXTENSION sinon
      - title: Conditions de réexamen
        rule: ce qui, si observé, rouvrirait la décision
    completion: "Chaque ADR nomme au moins une alternative rejetée et ce que la décision exclut. Chaque décision est classée, l'ADR de stack de conception compris."
