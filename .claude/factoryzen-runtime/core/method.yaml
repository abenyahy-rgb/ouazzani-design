  - id: 20
    cadence: C3
    step: C3.1
    name: Contrat de slice
    entry: "G1 franchi ; carte des slices à jour ; slice précédente acceptée — une seule slice en cours à la fois."
    task: "Écrire le contrat de la slice, AVANT tout code : le résultat utilisateur en une phrase ; le périmètre et son budget ; les critères de sortie EXIT-n, chacun avec sa preuve ; les tests définis avant le code ; la Baseline Delta Declaration, les écrans et le delta de Design System ; les règles, données, API et migrations ; le tier ; les points ouverts. Le prototype vivant est recomposé avec le delta de la slice."
    verification: "Résultat formulé en résultat utilisateur, pas en liste de tâches. Aucune story sans AC ni sans écran ; le prototype exerce chaque story. Chaque AC testable. Chaque critère de sortie a sa preuve et sa procédure. Chaque AC matériel a son test, défini avant le code. Inventaire MUST PRESERVE produit AVANT toute modification ; aucune modification silencieuse d'un composant existant ; plancher de craft lu avant toute modification d'un écran existant. Chaque règle cite la baseline, la décision produit ou le critic de domaine. Migrations et rollback décrits, chaque migration rattachée à sa story. Modèle dérivé régénéré : chaque entité et chaque champ créés par la slice résolvent vers un terme du glossaire et une catégorie de vérité. Tier proposé et justifié. Chaque condition d'entrée ENTRY-n porte son statut — MET · PENDING · DEFERRED — et ce qui la lève ; les prérequis EXTERNES — dépôt, hôtes, stores et signature, chaîne d'outils, compte QA stable du Product Owner — sont vérifiés AVANT le GO, et chaque apprentissage « material » de la slice précédente y est reporté. Slice 0 et toute preuve technique : chaque artefact classé KEEP ou DISCARD avant d'être écrit. RÉFÉRENCÉ, PAS RECOPIÉ : le contrat cite chaque input par chemin, rang d'autorité, commit de base et empreinte, sans recopier son contenu, et tient dans 600 lignes rendues — au-delà, la slice est trop grosse ou le contrat recopie. Avant K1, au moins 20 citations, ou toutes s'il y en a moins, sont confrontées à leur source par un critic, et « n confirmées / m corrigées » est inscrit au contrat."
    exit: "slice-contract.md, design/ et spec/ commités ; prototype vivant recomposé socle ⊕ deltas de release ⊕ deltas de slice, manifeste daté ; NEEDS CLARIFICATION résolus ou routés ; Run Ledger ouvert. C'est ce pas qui fait que le prototype suit les slices au lieu de les précéder puis de périmer. Un champ non résolu ou un NC ouvert ne passe pas K1."
    responsible: product-lead · product-designer · principal-engineer
    accountable: Product Owner et autorité Tech
