      - title: Manifeste de composition
        rule: "commit du socle, baseline de release, liste ordonnée des deltas de slice appliqués, horodatage"
      - title: Couverture du squelette
        rule: "chaque STG reste atteignable après composition — un delta qui casse une étape est un défaut de subordination"
      - title: Écarts non subordonnés
