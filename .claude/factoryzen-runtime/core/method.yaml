  - id: 21
    cadence: C3
    step: C3.2
    name: Construction et tests
    entry: "K1 franchi ; branche de travail créée ; environnement isolé ; critic(quality) disponible et indépendant."
    task: "Implémenter la slice depuis le contrat figé, dans la mutation boundary déclarée ; exécuter les tests définis au contrat, produire la preuve de chaque critère de sortie, réparer les tests obsolètes en mode HEAL ; déployer en QA et jouer les parcours critiques sur le prototype vivant. Tout écart est un amendement daté : la slice ne grandit pas."
    verification: "Aucune modification hors mutation boundary. Commits atomiques. Chaque règle du produit qui se mécanise — invariant, décision d'architecture, critère de sortie — devient un CONTRÔLE DU PROJET (controles/controles.yaml), avec sa source et au moins un test négatif sur une copie de fixture ; « apf check » les exécute. Tests locaux verts avant push, ET golden path vert au moins une fois sur la CI hébergée : une slice n'est pas DEV-validée tant que ses chemins CI-only — build d'image, émulateur, promotion — n'ont pas tourné ; CI hébergée indisponible, le dire — NOT RUN, jamais PASS. Une preuve ne vaut que pour son CANAL : un simulateur prouve le build et le lancement, jamais l'appareil ; le web ne prouve jamais le natif. Tout écart classé. NEEDS CLARIFICATION marqué plutôt qu'un comportement inventé. LA CLASSIFICATION d'un test rouge est rendue par critic(quality), jamais par le producteur du test ou du code. Tout healing exige une re-vérification indépendante. Parcours critiques exécutés en QA, sur le prototype vivant recomposé, pas seulement en test automatisé. AVANT toute présentation au Product Owner, la campagne E2E est jouée sur la version déployée en QA, à la largeur mobile de référence : pour chaque élément d'inventaire touché par la slice — question, écran, état —, atteignable, atteint, saisie, avant, Back, restauré après rechargement, édition persistée, le reste inchangé, conséquences conditionnelles, sortie puis ré-entrée, aval ; chaque cellule est PASS, ou N/A avec sa raison. Chaque observation du Product Owner d'une slice précédente est devenue un ORACLE — une question générale posée à tous les états atteignables — et rejoue sans touche."
    exit: "Code poussé ; status.md et scope-changes.md à jour ; preuve de chaque critère de sortie retenue, avec son canal ; quality/ et acceptance/ commités ; aucun PRODUCT FAILURE masqué ; identité de la version construite enregistrée — commit, empreinte de l'artefact, version de migration, empreinte de configuration —, la même en QA qu'en DEV ; matrice état × comportement et oracles verts en QA ; URL de QA enregistrée — celle du prototype vivant, une seule."
    responsible: principal-engineer · quality-engineer produit · critic(quality) classe
    accountable: autorité Tech
