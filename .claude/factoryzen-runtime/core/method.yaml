    produced_at: "5"
    traces_to: PER, OUT
    controlled_at: G0
  - prefix: SRC
    entity: Source du corpus
    produced_at: "6"
    traces_to: "WP-03 — une source du corpus est une source approuvée du domaine, ou c'est un écart"
    controlled_at: G0
  - prefix: REC
    entity: Enregistrement du corpus
    produced_at: "6"
    traces_to: "SRC, STG — un enregistrement sans source est UNVALIDATED ; un enregistrement qu'aucune étape n'affiche est hors périmètre"
    controlled_at: G0
