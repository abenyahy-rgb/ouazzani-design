  - id: WP-06
    name: Corpus réel et provenance
    category: pre
    cadence: C1
    step: C1.3
    activity: "6"
    controlled_at: G0
    baseline: produit — cumulatif
    lifecycle: vivant, enrichi à chaque release ; sa PROVENANCE ne se réécrit jamais
    responsible_accountable: data-steward / Product Owner
    purpose: "Le contenu que le produit affiche à un utilisateur, avec de quoi le contredire. Dans un produit de données, le corpus EST le produit : un socle, un Design System et une architecture peuvent être justes tandis que le produit ne dit rien de vrai. Ce livrable existe parce que ce cas s'est produit — une cadence C1 complète, dix-sept livrables, huit revues, et un corpus de trente-deux enregistrements inventés étiquetés FIXTURE qui a franchi G0."
    sections:
      - title: Périmètre du corpus
        rule: "le minimum qui rend le squelette parcourable de bout en bout, dérivé des STG et non d'une ambition d'exhaustivité"
      - title: Sources retenues et écartées
        rule: "chacune tracée vers WP-03 ; une source hors sources approuvées est un écart, pas un raccourci"
      - title: Provenance par enregistrement
        rule: "adresse, date de lecture, citation littérale. Les trois, ou l'enregistrement est UNVALIDATED"
      - title: Catégorie de vérité par champ
        rule: "SOURCÉ · DÉRIVÉ · ABSENT. Aucune quatrième valeur, et surtout pas une valeur vraisemblable"
      - title: Couverture mesurée contre le squelette
        rule: "chiffrée par STG, jamais appréciée en prose"
      - title: Écarts et champs non sourçables
        rule: "nommés un à un ; un champ ABSENT est une information sur le monde, pas un trou à combler"
      - title: Fixtures de test et leur confinement
        rule: "s'il en existe, elles vivent hors des chemins servis au produit et le disent ; une fixture atteignable depuis un livrable de design est un défaut, pas une commodité"
    completion: "Chaque enregistrement sourcé porte ses trois champs de recevabilité. Couverture chiffrée par STG et écarts nommés. Verdict de recevabilité de critic(domaine) présent. AUCUNE fixture sur un chemin servi à un livrable de design ou de produit — ce point est éliminatoire, il ne se solde pas en dette."
    base: "C1.3-parcours/corpus/"
    files:
      - corpus-scope.md
      - provenance.yaml
      - truth-map.yaml
      - coverage.md
      - records/
  - id: WP-07
    name: Tests de marché et apprentissages
    category: pre
    cadence: C1
    step: C1.3
    activity: "7"
    controlled_at: G0
    baseline: produit — cumulatif
    lifecycle: vivant ; une carte d'apprentissage ne se réécrit jamais, elle se complète
    responsible_accountable: product-lead / Product Owner
    purpose: "La preuve que le marché veut le produit, avant de dépenser pour le construire. Un socle, un Design System et une architecture peuvent être justes pour un produit que personne n'achète : ce livrable existe pour qu'une hypothèse critique soit tranchée par ce que des personnes réelles ont FAIT — s'inscrire, cliquer pour acheter, payer —, pas par ce qu'elles ont dit ni par ce qu'un agent a simulé."
    sections:
      - title: Plan de tests
        rule: "les trois à cinq hypothèses les plus critiques, le test le moins cher qui tranche chacune, son coût, sa durée, son critère de réussite écrit avant — repris des cartes de test de WP-02"
      - title: Décisions du porteur
        rule: "aucune page publiée, aucun message envoyé au nom du porteur, aucun euro dépensé sans sa décision nommée et datée"
      - title: Cartes d'apprentissage
        rule: "nous pensions · nous avons fait · nous avons observé · échelon de fiabilité · donc nous décidons ; chacune avec son HYP-nn et sa source E-nn"
      - title: Résultats bruts
        rule: "exports, réponses, paiements tels quels, sous results/ ; jamais seulement le chiffre résumé"
      - title: Ce que les tests changent
        rule: "chaque hypothèse infirmée routée vers WP-02 et la thèse reprise ; chaque hypothèse non tranchée gardée UNVALIDATED avec son prochain test"
    completion: "Le format « apprentissages » vérifié. Au moins une hypothèse critique tranchée à l'échelon de l'acte ou du paiement, ou une réserve qui dit pourquoi et quand elle le sera. Aucune carte sans critère écrit avant le test, ni sans source."
    base: "C1.3-parcours/tests-marche/"
    files:
      - test-plan.md
      - learning-cards.md
      - results/
  - id: WP-08
    name: Fondations du Design System
    category: des
    cadence: C1
    step: C1.4
    activity: "8"
    controlled_at: G0
    baseline: produit — cumulatif
    lifecycle: cumulatif, jamais forké
    responsible_accountable: product-designer / Product Owner
    purpose: "Les éléments visuels réutilisables et leurs règles. Enrichis à chaque release ; jamais réinventés."
    sections:
      - title: Brief de conception
        rule: "renseigné AVEC l'humain qui répond du produit AVANT la première décision visuelle — public prioritaire, barre de craft, interdits, direction épinglée ou ouverte ; son absence produit BLOCKED"
      - title: Design system de départ et décision
        rule: "le départ servi par la tour, montré sur un vrai écran du produit ; la décision de l'humain — gardé, adapté ou écarté —, ce qui a changé s'il est adapté, qui a tranché et quand"
      - title: Stack de conception et base de composants
        rule: >-
          ADR arrêté AVANT la première décision visuelle : framework d'interface, base de
          composants accessibles retenue, moteur de styles, cible de déploiement de la
          preview, et l'outillage de conception assistée employé. La méthode est agnostique
          de stack ; elle n'est pas agnostique du COÛT d'en écrire une. Ne rien déclarer ne
          laisse pas le choix ouvert : cela mandate de fait le tout-à-la-main. Le
          tout-à-la-main a produit, sur un produit de quatorze écrans, un socle mono-fichier
          de 345 ko, quatorze composants réécrits depuis zéro et une chaîne de rendu
          propriétaire — du budget de conception dépensé en plomberie. L'ADR nomme la base
          retenue et surtout CE QU'ELLE DISPENSE D'ÉCRIRE ; les tokens et les composants de
          ce produit en sont alors un DELTA, jamais une création ex nihilo.
      - title: Directions concurrentes et direction retenue
        rule: "départ gardé : il est la direction retenue et l'ADR le dit. Adapté ou écarté : au moins trois directions construites, le départ compris, conservées dans explorations/ ; l'ADR nomme les écartées et ce qui les a départagées"
      - title: Brief de surface et contrat de direction
        rule: "un brief par surface ; contrat de direction en six blocs — THESIS, OWN-WORLD, STORY, FIRST VIEWPORT, FORM, FINISH — écrit AVANT le code et jamais recopié dans un artefact livré au navigateur"
      - title: Tokens
        rule: "dérivés du départ retenu — couleurs avec leur rôle, typographies et échelle, espacements, rayons, ombres, surfaces —, grilles et responsive ; exportables en CSS et JSON ; color.role → livrables Office"
      - title: Composants et variantes
        rule: "chacun exposant les 7 états : normal, hover, focus, erreur, vide, loading, disabled"
      - title: Accessibilité
        rule: contraste WCAG AA vérifié par outil, pas à l'œil
      - title: Catalogue navigable
        rule: exécutable hors environnement de développement
    completion: "La décision sur le design system de départ — gardé, adapté ou écarté — est consignée avec qui l'a prise. Stack de conception arrêtée par ADR AVANT la première décision visuelle. Contraste AA vérifié par outil. Les 7 états couverts pour chaque composant. Catalogue ouvrable. Chaque composant écrit à la main l'est parce que la base retenue ne le couvre pas, et le dit — un composant réécrit sans motif est du budget de conception dépensé en plomberie."
    base: "C1.4-socle/design-system/"
    files:
      - design-brief.md
      - explorations/
      - surface-briefs/
      - tokens.css
      - tokens.json
      - fonts/
      - icons/
      - components/
      - component-catalog.html
