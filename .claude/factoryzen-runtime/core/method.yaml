      fate: fusionné
      into: 11
      on: '2026-09-22'
      why: >-
        Elle ne portait qu'un livrable, et ce livrable a rejoint le cadrage de release parce
        qu'une recherche qui suit le brief ne peut plus l'informer. L'activité d'accueil
        devient un binôme : responsable produit pour le périmètre, designer pour la recherche.
    - id: 19
      numerotation: 4
      name: Design de sprint et prototype
      fate: fusionné
      into: 18
      on: '2026-10-08'
      why: >-
        La boucle sprint demandait, à chaque itération, sept activités, sept livrables et
        deux décisions humaines — dont un Sprint Ready Gate qui ne jugeait rien qu'un contrôle
        ne sache vérifier. Le run BatiZen a montré plus simple et plus sûr : une slice
        verticale à la fois, un contrat écrit avant le code, la preuve de chaque critère de
        sortie, une seule acceptation humaine, en QA.
    - id: 20
