routing:
  classes:
    - id: ÉCONOMIQUE
      usage: "Traduction mécanique. Fenêtre réduite, effort souvent non réglable : disqualifiée pour tout agent devant charger une baseline."
      relative_cost: ≈ 0,5×
    - id: INTERMÉDIAIRE
      usage: Build routinier, génération de tests, synthèse.
      relative_cost: 1× (référence)
    - id: AVANCÉE
      usage: Orchestration, conception, spécification, critique.
      relative_cost: ≈ 2,5×
    - id: POINTE
      usage: "Raisonnement adverse de long horizon. Un seul emploi proposé : revue de sécurité adverse en tier R3."
      relative_cost: ≈ 5×
  rules:
    - id: R1
      rule: Le juge n'est jamais sur une classe inférieure au producteur de l'artefact qu'il juge.
      rationale: "Un critic plus faible que le builder ne peut structurellement pas voir ce que le builder a raté. Prolongement direct de P2."
      scope: "Lie tout évaluateur dont le verdict est un JUGEMENT — les instances de critic(·). Ne lie pas un évaluateur qui rapporte le résultat d'un contrôle déterministe : là, le verdict appartient au contrôle, pas au modèle, et exiger la classe du producteur ferait payer une capacité sans effet. C'est le cas de conformance-auditor, dont l'essentiel du travail est exécuté par les contrôles K."
      controlled_by: K6
      mechanism: "L'adaptateur DÉRIVE la classe de chaque instance de critic du maximum des classes des producteurs qu'elle juge ; K6 refuse un fichier de critic dont le modèle est en dessous. Tant que la classe était une valeur par défaut de l'adaptateur, R1 n'était satisfaite que par coïncidence — tous les producteurs se trouvaient dans la même classe."
    - id: R2
      rule: Baisser l'effort avant de baisser la classe.
      rationale: "Sur les modèles récents, un effort plus bas égale souvent la génération précédente à effort élevé. Descendre de gamme sans avoir testé l'effort inférieur, c'est optimiser à l'aveugle."
    - id: R3
      rule: Deux classes au maximum par cadence, parmi les agents qui partagent un préfixe de contexte.
      rationale: "Le cache de prompt est scopé par modèle. Multiplier les modèles peut coûter plus que le downgrade ne rapporte."
    - id: R4
      rule: >-
        Le déclenchement d'un critic est CONDITIONNEL — par irréversibilité et par tier de
        risque, jamais systématique. Sont TOUJOURS jugés : un livrable de baseline SOCLE
        (figé en G0), tout livrable en tier R2 ou R3, tout livrable dont le gate a déjà été
        refusé une fois, et tout livrable dont le critère de complétude porte un point
        éliminatoire — WP-06 et WP-11 en sont. Sur les autres, le critic est déclenché par
        le factory-lead et sa NON-CONVOCATION est écrite au Run Ledger avec son motif. Un
        critic non déclenché et non consigné est un contrôle sauté, pas une économie.
      rationale: >-
        Six dimensions de critic en classe R1 et effort élevé, convoquées systématiquement,
        consomment le budget de raisonnement qui manque à la production. Sur une cadence C1
        réelle, huit rapports de revue ont été rendus sur des livrables dont le contenu
        était inventé : de la capacité adverse dépensée là où il n'y avait rien à contredire.
        La profondeur de preuve suit le risque (P5) ; la profondeur de CRITIQUE aussi, et
        elle ne le faisait pas.
      controlled_by: K8
      scope: "Ne relâche RIEN sur P2 : quand un critic est convoqué, il reste un rôle distinct en lecture seule. R4 règle QUAND, jamais QUI."
    - id: R5
      rule: >-
        Le juge tourne sur un MODÈLE différent de ceux des producteurs qu'il juge, dès que
        l'adaptateur sert deux modèles de la classe requise. Sinon son verdict est CORRÉLÉ :
        il est rendu et consigné, mais il ne compte pas comme jugement indépendant en tier
        R2 ou R3, où l'autorité du gate le sait et le pèse.
      rationale: >-
        P2 sépare les RÔLES ; un rôle distinct sur le même modèle partage encore les angles
        morts du builder — mêmes lectures, mêmes oublis, même confiance mal placée. Le run
        BatiZen l'a tranché par son adjudication : un modèle propose, un AUTRE vérifie, et
        les erreurs que le second relève sont celles que le premier ne pouvait pas voir.
        Deux modèles d'un même fabricant restent corrélés ; ils le sont moins qu'un modèle
        avec lui-même. R1 reste première : la différence ne s'achète jamais par une classe
        inférieure.
      controlled_by: K6
      mechanism: >-
        L'adaptateur tient la table des modèles qu'il sait servir, par classe et par ordre de
        préférence — le noyau n'en nomme aucun. Un producteur prend le premier modèle de sa
        classe ; chaque instance de critic, le premier modèle de la classe dérivée par R1 (ou
        d'une classe supérieure) qui n'est celui d'AUCUN producteur. L'adaptateur l'écrit dans
        le fichier du critic avec « Indépendance de modèle : DISTINCT » ou « CORRÉLÉ » et les
        modèles des producteurs. K6 refuse un critic sur le modèle d'un producteur qui ne se
        déclare pas CORRÉLÉ, et un modèle absent de la table. Le classement d'un modèle dans
        une classe est une DÉCLARATION de l'adaptateur, à recalibrer sur preuve ; un modèle
        qu'un compte ne sert pas casse le sous-agent qui le nomme — le retirer de la table
        suffit à revenir à un verdict CORRÉLÉ.
      scope: "Lie les instances de critic(·) — les JUGEMENTS. Comme R1, ne lie pas un évaluateur qui rapporte un contrôle déterministe."
      choix_du_porteur: "MCR-004 : l'adaptateur ne sert plus qu'un modèle pour les classes avancée et pointe ; sans second modèle, les critics sont CORRÉLÉS et le disent. L'indépendance ne vient plus du modèle : elle vient du porteur, qui tranche chaque critique."
    - id: R6
      rule: >-
        Une modulation s'APPLIQUE à l'invocation, elle ne se lit pas : la tour calcule pour
        chaque rôle le modèle et l'effort du contexte — cadence de l'activité ouverte, tier,
        réouverture, chemin EXPRESS — et la garde refuse un rôle de la méthode invoqué sur un
        autre modèle ou un autre effort. Une montée de classe qui ôterait au juge tout modèle
        distinct (R5), ou qui dépasserait la classe la plus haute, se reporte sur l'EFFORT, d'un
        niveau ; une descente ne passe jamais sous INTERMÉDIAIRE.
      rationale: >-
        Une modulation écrite au registre et jamais exécutée n'était satisfaite que par
        coïncidence : un fichier d'agent porte un seul modèle, et une revue de sécurité en tier
        R3 tournait sur le modèle d'une slice routinière. Reporter sur l'effort ce que la classe
        ne peut plus donner suit R2 — l'effort est le premier levier — et garde au juge son
        indépendance de modèle là où la méthode juge toujours : le socle.
      controlled_by: K6
      mechanism: >-
        lib/routage.mjs calcule ; factory_open_activity consigne le contexte et rend le routage
        de chaque porteur et de son critic ; factory_route le rend pour un rôle ; la garde, sur
        l'outil d'invocation des sous-agents, refuse un écart en nommant le modèle et l'effort
        attendus. K6 rejoue R1 et R5 sur tous les contextes que les modulations peuvent produire.
      scope: "Lie les rôles de la méthode invoqués pendant une activité ouverte. Hors activité ouverte, chaque rôle tourne sur son fichier."
  efforts: [faible, moyen, élevé, très élevé, maximal]
  modulation:
    - id: M1
      trigger: Cadence C1 — travail sur le socle
      effect: +1 classe sur tous les agents mobilisés, sauf les critics (MCR-004)
      quand: { cadence: C1 }
      agents: "*"
      sauf: ["critic(·)"]
      delta: 1
    - id: M2
      trigger: Tier R2 ou R3
      effect: +1 classe sur security-engineer, critic(pentest), principal-engineer
      quand: { tier: [R2, R3] }
      agents: [security-engineer, critic-pentest, principal-engineer]
      delta: 1
    - id: M3
      trigger: Réouverture d'un gate déjà refusé
      effect: +1 classe sur le producteur ET sur son critic
      quand: { reprise: true }
      agents: "*"
      delta: 1
    - id: M4
      trigger: Chemin EXPRESS
      effect: −1 classe autorisé, sauf quality-engineer, et sans jamais violer R1
      quand: { express: true }
      agents: "*"
      sauf: [quality-engineer, "critic(·)"]
      delta: -1
adapter_obligations:
  - obligation: "Aucune décision implicite ne sort de l'activité 2 : chaque branche est tranchée avec motif, ou nommée HYP-nn étiquetée UNVALIDATED avec critère de falsification et point de test."
    written_at: Critère de sortie de l'activité 2
    tooling: "grilling — primitif d'interrogation externe, adopté et épinglé — conduit par le skill interrogatoire : une question à la fois, par le mécanisme de questions structurées du harness."
    capability: grilling
  - obligation: "Un brief de conception est renseigné avant les activités 8 et 14 ; les questions manquantes partent en une salve unique de quatre au maximum."
    written_at: WP-16
    tooling: Mécanisme de questions structurées du harness.
    capability: harness-questions
  - obligation: Direction esthétique, système de tokens, prototype exécutable.
    written_at: Activités 8, 10, 15, 20
    tooling: "Canvas d'artboards et skills de conception du harness, sous le plancher de métier de la capacité impeccable."
    capability: harness-design-skills
  - obligation: "La stack de conception est arrêtée par ADR AVANT la première décision visuelle, et les tokens comme les composants du produit sont un DELTA sur la base retenue. Un composant réécrit depuis zéro l'est parce que la base ne le couvre pas, et le motif est écrit."
    written_at: "WP-08 — section « Stack de conception et base de composants » ; activité 8 — critère d'entrée"
    tooling: "Conception d'interface assistée de l'adaptateur. Le noyau nomme la capacité ; l'adaptateur nomme l'outil qui la satisfait."
    capability: harness-assisted-design
  - obligation: "Tout livrable de design porte une URL de preview DÉPLOYÉE, ouvrable sans installation. Un fichier local à ouvrir depuis un dépôt n'est pas une preview : il n'est pas relu, et un livrable non relu ne prouve rien."
    written_at: "Activités 10, 15 et 20 — critères de sortie ; WP-11, WP-19, WP-26"
    tooling: "Déploiement de preview de l'adaptateur. Le plugin ne déploie rien lui-même."
    capability: harness-preview-deploy
  - obligation: "Aucune édition d'interface ne commence avant que le plancher de craft ait été lu, et la vérification se fait en passes bornées — une inspection groupée desktop et mobile, une correction en lot, une confirmation, puis arrêt. Le mode de surface — Persuade, Operate, Read, Experience — est déclaré avant la première décision visuelle."
    written_at: Activités 8, 10, 15, 17 et 20 — critères de vérification
    tooling: "impeccable — plancher de métier de conception externe, adopté en guidance seule et épinglé."
    capability: impeccable
  - obligation: "À l'ouverture d'un produit, un espace de travail lisible par un non-développeur existe, calqué sur les cadences et les étapes de la méthode, et il est CALCULÉ depuis le registre — jamais dessiné à la main."
    written_at: Activité 1 — critère de sortie
    tooling: "Le noyau rend le plan par « apf notion plan » ; l'adaptateur l'exécute via son connecteur."
    capability: harness-notion-connector
  - obligation: "Tout livrable produit porte, en plus de son chemin déclaré, l'adresse de sa page dans l'espace de travail — et cette page porte en retour le chemin et le commit."
    written_at: Vérification avant handover de chaque skill
    tooling: "« apf notion link » enregistre le pointeur et le vérifie ; l'adaptateur écrit la page."
    capability: harness-notion-connector
  - obligation: "Les activités 3, 4 et 6 établissent des faits extérieurs — sources approuvées du domaine, besoins observés, CORPUS RÉEL du produit — que l'humain ne détient pas. Un agent doit pouvoir aller les chercher et les rapporter SOURCÉS, plutôt que de les rendre en UNVALIDATED faute d'accès — ou, pire, de fabriquer une fixture pour débloquer l'aval."
    written_at: Activités 3, 4 et 6 — critères de vérification
    tooling: "Outil de recherche et de lecture web de l'adaptateur, accordé aux seuls profils researcher."
    capability: harness-web-research
  - obligation: >-
      L'activité d'un agent est OBSERVABLE pendant qu'elle a lieu : outils appelés, fichiers
      touchés, verdicts de la garde, sous-agents convoqués, modèle réellement servi et
      tokens consommés. Un run qu'on ne peut pas regarder ne se pilote pas : il se raconte
      après coup, par celui-là même qui l'a exécuté.
    written_at: observability
    tooling: "Hooks de cycle de vie du harness pour l'émission, plateforme de projection pour l'affichage. Le plugin n'émet que des lignes et ne parle à personne d'autre."
    capability: harness-telemetry
  - obligation: >-
      La classe de capacité déclarée d'un agent est CONFRONTABLE au modèle qui l'a servi.
      Tant que le modèle servi n'était consigné nulle part, R1 et R3 étaient des intentions.
    written_at: "R1, R3 — et observability.events → session_end"
    tooling: "Transcript du harness, lu à la fin du tour. Aucune interception."
    capability: harness-telemetry
  - obligation: >-
      Une conduite d'interrogatoire déclarée par un skill est OPPOSABLE, pas seulement lue :
      pendant l'activité qui la porte, un appel au mécanisme de questions structurées qui
      pose plusieurs questions est refusé avant que l'humain ne les voie, et un tour dont le
      texte en pose plusieurs est renvoyé une fois pour n'en garder qu'une. Le contrôle échoue
      en ouvrant et ne renvoie jamais deux fois le même tour ; chaque écart est tracé.
    written_at: "Skill interrogatoire — conduite « une question à la fois », activité 2"
    tooling: "Hooks de l'adaptateur : avant le mécanisme de questions structurées, et à la fin du tour sur le transcript. La règle reste au registre ; le hook la lit."
    capability: harness-hooks
  - obligation: Un rôle évaluateur ne peut pas écrire dans ce qu'il évalue.
    written_at: K6
    tooling: Hooks de l'adaptateur, en prévention. Le plancher reste la CI.
    capability: harness-hooks
  - obligation: La classe de capacité d'un critic n'est jamais inférieure à celle du producteur.
    written_at: R1
    tooling: Table de correspondance classe → modèle de l'adaptateur, et contrôle avant invocation.
    capability: harness-model-mapping
adoption_gate:
  - level: LIBRE
    criterion: N'écrit aucun fichier et n'exécute aucun code. Conversationnel ou analytique.
    gate: AUCUNE porte. Installation immédiate. Une ligne au registre, a posteriori.
  - level: DÉCLARÉ
    criterion: Écrit des fichiers.
    gate: "TROIS QUESTIONS, deux minutes : où écrit-il · porte-t-il un état propre · de quoi dépend-il transitivement. Puis épinglage et inscription au registre."
  - level: AUDITÉ
    criterion: Exécute du code, accède au réseau, ou touche au socle ou à la production.
    gate: "Rituel complet : lecture, sandbox, épinglage, approbation humaine enregistrée."
