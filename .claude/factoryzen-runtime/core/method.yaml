skills:
  - id: atelier-produit
    activities: "1"
    origin: core
    generated: true
    mandate: "Conduire l'atelier produit de l'ouverture UNE QUESTION À LA FOIS : ce qu'on veut faire du produit, pour qui, quelle valeur, comment elle arrive et se paie, bloc par bloc du canevas, jusqu'à un récapitulatif confirmé. Ne fait pas : poser une question technique — stack, dépôt, conventions, arborescence se calculent —, répondre à la place de l'humain, ni rédiger le canevas avant la confirmation finale."
    conduite:
      id: une-question-a-la-fois
      nom: Une question à la fois
      motif: >-
        Un atelier mené en questionnaire se remplit en diagonale : le canevas ressemble à un
        produit sans en être un. Une seule question, avec sa réponse recommandée, obtient une
        décision ; la suivante se choisit en sachant ce qui vient d'être tranché.
      lieu: "Dans la conversation principale, jamais dans un sous-agent : un sous-agent ne peut pas attendre la réponse de l'humain. Le product-lead rédige ensuite le canevas à partir du journal."
      regles:
        - "UNE seule question par message : ni liste numérotée, ni « et aussi », ni post-scriptum."
        - "Le produit d'abord, la technique jamais : aucune question sur la stack, le dépôt, l'hébergement ou les conventions — cela se calcule."
        - "Ordre : intention, segment, OPÉRATEURS — qui fait tourner le service au quotidien : coach, préparateur, support, administrateur ? —, problème, proposition de valeur, puis canaux, relation, revenus, ressources, activités, partenaires, coûts, avantage, indicateurs. Sauter un bloc déjà tranché."
        - "Chaque question : titre court, pourquoi elle compte maintenant, la question, la réponse recommandée et son motif."
        - "Réponse fermée — deux à quatre options — : questions structurées du harness, une par appel, la recommandée en premier. Sinon en texte, une seule."
        - "Attendre la réponse ; ne jamais la supposer pour gagner un tour."
        - "Après chaque réponse, une ligne d'accusé — tranché, ou HYP-nn UNVALIDATED — au Journal d'atelier, avant la question suivante."
        - "« Je ne sais pas » : proposer une HYP-nn et ce qui la trancherait, validée par une question fermée."
        - "Afficher la place : « Question 4 · Proposition de valeur · 9 blocs restants »."
        - "Canevas complet : un récapitulatif unique, puis une seule demande de confirmation. Rien n'est rédigé avant."
