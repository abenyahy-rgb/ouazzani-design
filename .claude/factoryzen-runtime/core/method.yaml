  - id: WP-10
    name: Modèle de données vivant
    category: spec
    cadence: C1
    step: C1.4
    activity: "9"
    controlled_at: G0
    baseline: "SOCLE — noyau sémantique figé, couche dérivée vivante"
    lifecycle: "vivant sous contrôle — noyau CORE INVARIANT figé en G0, couche dérivée régénérée à chaque slice"
    responsible_accountable: product-lead / Product Owner
    purpose: "Le modèle de données du produit en trois couches, dont une seule est écrite à la main. La sémantique — catégories de vérité, statuts, règles financières — est arrêtée au socle et figée en G0. Le modèle dérivé est extrait du schéma exécuté, jamais rédigé. La table de liaison rattache chaque entité et chaque champ à un terme du glossaire et à une catégorie de vérité : c'est elle qui rend une dérive sémantique visible à la slice où elle survient plutôt que deux releases plus tard."
    sections:
      - title: Catégories de vérité
        rule: définies et disjointes
      - title: Modèle de statuts et progression
      - title: Règles financières structurantes
        rule: revues par le critic de domaine
      - title: Règle de propagation
        rule: un calcul n'améliore jamais le statut de vérité de ses entrées
      - title: Modèle dérivé
        rule: "entités, champs, relations extraits du schéma exécuté — régénéré, jamais rédigé à la main"
      - title: Table de liaison
        rule: "chaque entité et chaque champ résout vers un terme du glossaire et une catégorie de vérité — un élément non résolu est une dérive sémantique"
      - title: Classement du noyau
        rule: "chaque entité et chaque champ du noyau étiqueté CORE INVARIANT ou EXTENSION par rayon d'impact, figé en G0"
      - title: Journal des migrations
        rule: "chaque migration rattachée à la slice et à la story qui la motive ; une migration orpheline est un changement de socle non déclaré"
    completion: "Catégories disjointes. Règle de propagation écrite et non contournable. Revue par le critic de domaine. Modèle dérivé régénéré depuis le schéma exécuté et non édité. Zéro élément non résolu dans la table de liaison. Toute modification d'un élément CORE INVARIANT hors C1 porte une exception EX déclarée, sinon K4 bloque."
    specimen: |-
      Catégories de vérité  (disjointes)
        CONSTATÉ   relevé sur site, daté, avec auteur
        ENGAGÉ     contractualisé, non encore constaté
        ESTIMÉ     calculé à partir d'ENGAGÉ ou d'ESTIMÉ
      
      Propagation  ESTIMÉ + CONSTATÉ = ESTIMÉ.  Jamais CONSTATÉ.
