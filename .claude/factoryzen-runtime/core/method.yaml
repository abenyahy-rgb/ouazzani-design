    name: Backlog et carte des slices
    entry: "Prototype validé et périmètre stabilisé ; solution design et carte des dépendances disponibles (activité 16). Sans elles, BLOCKED — input manquant."
    task: "Transformer la release en epics, stories et AC traçables ; qualifier valeur, risques, dépendances ; ordonner la release en slices verticales S-nn — chacune un résultat utilisateur démontrable, qui livre ensemble données, API, écrans et tests. Aucune slice de plateforme : le travail technique vit dans la slice qui en a besoin. Première release : une Slice 0 de fondation, petite, qui prouve le chemin de bout en bout. Avant elle, arrêter la POLITIQUE DE PLATEFORME DE RELEASE — plateformes acceptées en v1, plateformes conservées par l'architecture mais hors acceptation — et le CANAL DE VALIDATION de l'acceptation produit, qui peut différer du canal de distribution. Les slices en héritent ; la preuve physique d'une plateforme hors v1 est REPORTÉE, jamais PASS."
    verification: "Chaque story trace vers un parcours et un écran. Chaque AC vérifiable. Couverture à 100 % (K3). Dépendances et tiers repris du livrable de l'activité 16, jamais réinventés ici. Chaque story affectée à une slice ou explicitement reportée. Ordre des slices : dépendances, puis valeur pour l'utilisateur, risque levé, apprentissage — une seule slice en cours à la fois. Chaque point ouvert rattaché à la PREMIÈRE slice qui en a besoin, et CLASSÉ : à décider avant le contrat · à décider avant l'acceptation · hors v1 · technique."
