    - id: impeccable
      source: impeccable
      path: vendor/impeccable/impeccable
      gate: DÉCLARÉ
      role: "Plancher de métier de la conception d'interface. Quatre modes de surface — Persuade, Operate, Read, Experience — vingt-trois playbooks dont critique, audit, polish, layout, typeset, adapt et harden, et un plancher de craft à lire immédiatement avant toute édition d'interface. C'est la capacité qui manquait : la méthode contrôlait la SUBORDINATION d'un livrable de conception — tokens exportables, sept états, contraste AA, aucun écran mort — et jamais sa QUALITÉ. Un socle conforme aux huit contrôles pouvait être laid, et l'a été."
      bound_to:
        - activité 8 — critère de vérification
        - activité 10 — critère de vérification
        - activité 15 — critère de vérification
        - activité 17 — critère de vérification
        - activité 20 — critère de vérification
      context_cost:
        skill_md_tokens: 3313
        accepted_because: "3313 tokens contre un plafond de 2000. Le dépassement est ACCEPTÉ, pas corrigé : la copie est verbatim, et redescendre le détail d'un SKILL.md externe en references/ serait un fork. Le coût est facturé aux seules activités qui retiennent le skill — 6, 8, 13, 15, 19 — jamais aux vingt et une autres. Il est mesuré et non estimé : K6 confronte cette valeur à l'octet du fichier vendoré, si bien qu'une montée de version qui alourdit le SKILL.md fait échouer le contrôle au lieu de passer inaperçue."
      audit:
        writes: "PRODUCT.md, DESIGN.md et son sidecar, briefs de surface, configuration et hook de projet — à des chemins QU'IL DÉFINIT LUI-MÊME, absents du registre. C'est le motif exact qui a fait rejeter domain-modeling. La réserve est levée autrement : les commandes qui écrivent ces fichiers — init, document, doctor, hooks, live, pin — sont hors périmètre d'adoption, et le contexte produit comme la vérité visuelle restent tenus par les livrables déclarés (design-brief.md, WP-08, WP-11, WP-19), que l'agent lit à leur place. Un fichier écrit hors registre fait échouer K2 : le garde-fou reste le contrôle, jamais la consigne."
        state: "Aucun état persistant hors session dans le périmètre adopté. Le seul porteur d'état — le lanceur, son cache, sa configuration et son sidecar — n'est pas livré."
        dependencies: "Un binaire de moteur déterministe téléchargé depuis les Releases GitHub au premier appel : non livré, inatteignable ici. Quatre sous-agents de finition : non livrés, leurs équivalents dégradés sont dans reference/degraded/. Aucune dépendance npm, aucune dépendance de skill."
        verdict: "ADOPTÉ AVEC RÉSERVE — la guidance est adoptée, l'exécution ne l'est pas. Le détecteur déterministe manque : ce que la méthode gagne est un plancher de JUGEMENT, pas un contrôle. Il ne remplace donc aucun des huit contrôles, n'entre dans aucun pack de preuves, et un verdict rendu sous ce skill reste une appréciation humaine ou d'agent, jamais un PASS."
      method_gap: "Trois écarts, portés par les critères des activités et jamais par un fork du skill. (1) Son plancher de vérification est « passes bornées, jamais en boucle » ; la méthode y ajoute les captures multi-device et le classement des findings dans SA taxonomie unique — le scoring heuristique de critique.md n'est pas une taxonomie de findings. (2) Il autorise la refonte à remplacer le monde visuel et DESIGN.md ; la méthode le refuse après G0 dès qu'un CORE INVARIANT est touché — navigation, IA ou vocabulaire passent par EX3, jamais par une refonte. (3) Il ne connaît pas les étiquettes d'evidence : un contenu « représentatif » qu'il juge acceptable reste ici une donnée inventée présentée comme réelle s'il ne porte pas sa catégorie de vérité."
