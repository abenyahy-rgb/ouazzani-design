        rule: "pour chaque activité clé : les compétences techniques, humaines et métier qu'elle exige, qui les couvre, et les manques ; l'expérience de création d'entreprise de l'équipe ; un manque se nomme, il se finance par la demande du pitch"
      - title: Structure de coûts
        rule: les postes qui décident, avant le premier revenu
      - title: Avantage difficile à copier
        rule: une raison, ou « aucun pour l'instant »
      - title: Indicateurs clés
        rule: deux ou trois nombres mesurables sans rien construire
      - title: Journal d'atelier
        rule: question · réponse · qui · tranché ou HYP-nn UNVALIDATED
    completion: "Chaque bloc porte une réponse de l'humain ou une HYP-nn UNVALIDATED avec ce qui la trancherait. Premier segment nommé. Aucune décision technique. Confirmé en un récapitulatif unique."
    specimen: |-
      Revenus — ~15 €/mois par chantier actif, payé par le gérant
        ·  UNVALIDATED → HYP-02 : 3 gérants sur 5 l'acceptent au pilote
    base: "C1.1-initialisation/canvas/"
    files:
      - business-model-canvas.md
  - id: SOC-01
    name: Registre canonique et configuration projet
    interne: "Élément du socle technique, écrit et déclaré par l'activité 0 automatique. Il gouverne le dépôt ; il ne se présente à personne : ni fiche, ni gabarit Office, ni ligne dans les livrables montrés au business owner."
    category: reg
    cadence: C1
    step: C1.1
    activity: "0"
    controlled_at: tout gate
    baseline: produit
    lifecycle: vivant
    responsible_accountable: factory-lead / Product Owner
    purpose: "Déclare tous les chemins d'artefacts du projet et la configuration qui spécialise la méthode générique. Rien n'existe hors de ce fichier."
    sections:
      - title: Entrées d'artefacts
        rule: "clé logique · chemin · catégorie · activité productrice · gate · niveau de baseline · cumulatif ou figé · structure"
      - title: Mapping d'arborescence
        rule: si le dépôt a déjà une convention, elle prévaut et se déclare ici
      - title: Mapping d'identifiants
        rule: si une nomenclature existe, la méthode impose la chaîne, pas le vocabulaire
      - title: Autorités de gate
        rule: qui décide G0 à G4, et qui ne peut pas déléguer
      - title: Store d'état du backlog
        rule: un seul, déclaré ici
      - title: Correspondance classe de capacité → modèle
        rule: vit dans l'adaptateur, référencée ici
      - title: Identité du produit
        rule: "nom, date d'ouverture, emplacement de la racine de l'espace de travail. C'est l'activité 1 qui la RECUEILLE auprès d'un humain, jamais un opérateur qui la tape en ligne de commande : un produit dont le nom vient d'ailleurs que de son activité d'ouverture n'a pas été ouvert par la méthode."
      - title: Carte de l'espace de travail
        rule: "identifiants des pages d'étape, des pages de gate et des bases — c'est ce qui rend la synchronisation idempotente et le pointeur bidirectionnel résoluble"
      - title: Rôles de la méthode vers personnes
        rule: "les rôles du registre sont génériques ; sans association à des personnes nommées, les colonnes Responsible et Accountable sont du texte mort"
      - title: RUN MODE — équipe ou solo
        rule: >-
          Déclaré à l'ouverture, une valeur parmi ÉQUIPE et SOLO, avec le nombre d'humains
          réellement disponibles. ÉQUIPE est le mode par défaut et la méthode telle qu'écrite.
          SOLO ne relâche AUCUN contrôle déterministe, aucune autorité de gate et aucune règle
          de séparation des devoirs : il change uniquement le traitement de l'input manquant,
          selon EX2. Il se déclare, il ne s'improvise pas : une méthode conçue pour des parties
          prenantes nommées, exécutée par une seule personne, produit des lettres de délégation
          qui contournent la méthode par en dessous — ce qui est arrivé, et ce qu'un mode déclaré
          rend inutile.
    completion: "Tout chemin cité par une activité existe au registre, et tout chemin du registre est produit par exactement une activité (K2). Le RUN MODE est déclaré : son absence est un défaut, pas un défaut de défaut."
    specimen: |-
      release-scope:
        path: releases/{release-id}/scope.md
        category: décision
        produced_by: 12
        controlled_at: G1
        baseline: release
        lifecycle: figé
        sections: [perimetre, exclusions, etapes-couvertes, trois-tests]
    base: "C1.1-initialisation/governance/"
    files:
      - artifact-schema.yaml
      - project.yaml
      - workspace-map.yaml
  - id: SOC-02
    name: Contexte et contraintes de l'existant
    interne: "Élément du socle technique, écrit et déclaré par l'activité 0 automatique. Il gouverne le dépôt ; il ne se présente à personne : ni fiche, ni gabarit Office, ni ligne dans les livrables montrés au business owner."
    category: dec
