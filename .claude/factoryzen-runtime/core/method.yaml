# Registre canonique de l'Autonomous Product Factory.
# SOURCE UNIQUE. Le codex, les fragments servis aux agents et le référentiel
# exécutif en sont des projections générées — jamais des copies maintenues.
# Généré une fois depuis le modèle du codex ; édité ici désormais.

schema_version: 1
method:
  name: Autonomous Product Factory
  version: "5.0"
  status: CIBLE — spécification complète, contrôles déterministes non encore implémentés
  language: "Prose en français. Identifiants, noms d'agents, noms d'artefacts et chemins en anglais, sans traduction. Normatif."
categories:
  dec:
    name: Décision
    recevabilite: Nomme l'autorité, le motif, et ce que la décision exclut.
  spec:
    name: Spécification
    recevabilite: Chaque énoncé est testable. Un énoncé non vérifiable est un défaut.
  des:
    name: Design
    recevabilite: Exécutable. Un design non exécutable n'est pas une baseline.
  pre:
    name: Preuve
    recevabilite: Porte sa date, sa version figée par commit et son niveau d'evidence.
  reg:
    name: Registre
    recevabilite: Validable par schéma. Lisible par machine avant de l'être par un humain.
cadences:
  - id: C1
    name: Vision produit et socle
    frequence: 1× par produit
    fige: Spine Baseline et architecture de releases
    steps:
      - C1.1
      - C1.2
      - C1.3
      - C1.4
      - C1.5
    gates:
      - G0
  - id: C2
    name: Cycle release
    frequence: 1× par release
    fige: Release Baseline, backlog et carte des slices
    steps:
      - C2.1
      - C2.2
      - C2.3
      - C2.4
    gates:
      - G1
  - id: C3
    name: Boucle de slices
    frequence: une slice à la fois, N par release
    fige: Contrat de slice, slice acceptée en QA
    steps:
      - C3.1
      - C3.2
      - C3.3
    gates:
      - K1
      - G3
  - id: C4
    name: Mise en production
    frequence: 1..n× par release
    fige: Déploiement autorisé et vérifié
    steps:
      - C4.1
    gates:
      - G4
activities:
  - id: 0
    cadence: C1
    step: C1.1
    name: Socle technique automatique
    automatique: "Exécutée par la tour à l'ouverture du projet — par le launchpad à la création, ou au premier lancement de session. Personne ne l'ouvre, personne n'y répond : elle n'apparaît pas dans le parcours de l'humain, qui commence à l'activité 1."
    entry: "Run autorisé ; dépôt identifié ; aucune arborescence /product non sauvegardée ; NOM DU PRODUIT recueilli auprès d'un humain ; connecteur d'espace de travail et emplacement de la racine fournis — chacun absent produit BLOCKED, jamais deviné ni dérivé du nom du dépôt."
    task: "Calculer, sans question : arborescence, conventions, registre des chemins, Run Ledger et espace de travail se déduisent du registre ; l'existant, s'il y en a un, se lit dans le dépôt. Les questions que seul un humain tranche — autorités de gate, rôles — sont consignées en réserves, jamais posées ici."
    verification: "Bootstrap idempotent rejoué à vide : aucun artefact écrasé. Deux sources par contrainte de l'existant. Aucune question posée à l'humain."
    exit: "/product et /runs initialisés ; artifact-schema.yaml validé ; unknowns listés ; espace de travail instancié selon le plan calculé — « apf notion plan » en donne le compte — et sa carte enregistrée dans SOC-01."
    responsible: factory-lead
    accountable: Product Owner
    skill: bootstrap-product
    work_products:
      - SOC-01
      - SOC-02
  - id: 1
    cadence: C1
    step: C1.1
    name: Atelier produit
    entry: "Socle posé par l'activité 0, automatique ; NOM DU PRODUIT recueilli auprès d'un humain ; le porteur du produit disponible pour l'atelier."
    task: "Conduire avec le porteur un atelier produit, une question à la fois : ce qu'on veut en faire, pour qui, quel problème, quelle valeur, comment elle arrive et se paie, ce qui la rend difficile à copier, à quoi on saura que ça marche — le canevas du produit, sur le modèle du Business Model Canvas. Aucune question technique : ce qui est technique est déjà calculé, ou attend son activité."
    verification: "Chaque bloc du canevas porte une réponse du porteur, ou une hypothèse HYP-nn étiquetée UNVALIDATED avec ce qui la trancherait. Le premier segment est nommé. Aucune question technique posée. Les deux familles d'acteurs sont nommées : les clients externes — qui paie, qui utilise — et les opérateurs internes qui font tourner le service — coach, préparateur, support, administrateur ; « aucun opérateur » est une décision motivée, jamais un oubli."
    exit: "Canevas confirmé par le porteur en un récapitulatif unique. L'activité 2 part du canevas : elle ne repose aucune question qu'il a tranchée."
    responsible: product-lead
    accountable: Product Owner
    skill: atelier-produit
    work_products:
      - WP-01
  - id: 2
    cadence: C1
    step: C1.2
    name: Thèse produit et outcomes
    entry: "Sponsor disponible ; activité 1 terminée — canevas du produit (WP-01) confirmé par le porteur ; source d'opportunité identifiée."
    task: "Approfondir le canevas en thèse opposable : problème, cible, proposition de valeur, outcomes chiffrés et hypothèses critiques, au niveau du produit entier. Ce que le canevas a tranché est repris, jamais reposé ; l'interrogatoire porte sur ce qu'il laisse ouvert ou UNVALIDATED."
    verification: "Chaque claim matériel porte source et niveau d'evidence. L'intention a été interrogée jusqu'à épuisement des décisions implicites. Verdict critic(product) rendu."
    exit: "AUCUNE hypothèse critique ne sort non résolue : chaque branche est tranchée avec motif, ou nommée HYP-nn étiquetée UNVALIDATED avec critère de falsification et point de test à l'activité 18."
    responsible: product-lead
    accountable: Product Owner
    skill: interrogatoire, grill-me
    work_products:
      - WP-02
  - id: 3
    cadence: C1
    step: C1.2
    name: Domaine et critic métier
    capabilities:
      - harness-web-research
    capabilities_note: "Sources approuvées du domaine, règles métier et usages non écrits : des faits extérieurs, que le sponsor ne détient pas."
    entry: Industrie identifiée ; accès aux sources réglementaires ou professionnelles.
    task: Qualifier l'industrie et ses règles, puis instancier le critic de domaine depuis le gabarit.
    verification: "Chaque règle cite une source datée — absence de source = UNKNOWN, jamais fait. Le critic cite des sources externes, pas la mémoire du modèle. Définition revue par un humain."
    exit: Critic déployé et éprouvé sur un cas connu dont la réponse est vérifiable indépendamment.
    responsible: product-lead puis factory-lead
    accountable: Product Owner
    skill: domain-critic
    work_products:
      - WP-03
  - id: 4
    cadence: C1
    step: C1.3
    name: Recherche et synthèse utilisateur
    capabilities:
      - harness-web-research
    capabilities_note: "Ce que les gens font réellement. Une recherche utilisateur sans acces à l'extérieur n'est pas une recherche."
    mode: >-
      DOCUMENTAIRE PAR DÉFAUT, CONDUITE PAR L'AGENT. Le porteur n'a pas à recruter ni à
      interroger : l'agent va lire ce que les utilisateurs réels écrivent déjà — avis
      d'applications et de services concurrents, forums et communautés, questions-réponses,
      études et rapports publics, statistiques officielles — et en tire personas, empathy maps
      et parcours as-is. Le TERRAIN (entretiens, observations) s'ajoute quand des humains sont
      disponibles ; il n'est plus une condition d'entrée. Ce que le documentaire ne peut pas
      trancher n'est pas deviné : c'est une hypothèse HYP-nn, testée plus tard.
    entry: "Thèse approuvée (WP-02) ; profil de domaine et sources approuvées (WP-03). Mode terrain seulement : consentement des participants obtenu."
    task: "Écrire le plan de recherche AVANT la collecte : questions à trancher, segments visés, sources et requêtes prévues, biais attendus. Puis collecter, sur l'ensemble du parcours et avant tout découpage, des verbatims d'utilisateurs réels dans des sources publiques — chacun avec adresse, date de consultation et citation littérale ; plusieurs plateformes, pour ne pas épouser le biais d'une seule. En dériver en une passe des insights, des proto-personas PER-nn, leurs empathy maps et leurs journeys as-is avec irritants."
    verification: "Chaque verbatim porte adresse, date de consultation et citation littérale ; sans les trois, il est UNVALIDATED et ne fonde rien. Chaque trait de persona trace vers ≥ 2 verbatims de sources INDÉPENDANTES — deux messages du même fil ou trois pages citant la même étude sont une source. Aucune donnée démographique, aucun chiffre, aucune citation inventés ou reformulés en citation. Échantillon et biais déclarés : qui écrit en ligne, sur quelle plateforme, ce que cela exclut. Niveau d'evidence étiqueté sur chaque résultat — DOCUMENTARY pour le documentaire, EMPIRICAL pour le terrain seul. Les questions que seule une observation tranche sont listées en HYP-nn. Les personas couvrent les deux familles : chaque opérateur déclaré au canevas a son persona, recherché comme un client — son travail d'aujourd'hui, ses outils, ses mots."
    exit: "Corpus commité ; niveau d'evidence étiqueté sur chaque résultat ; hypothèses à tester listées, avec l'activité qui les testera."

    responsible: product-designer
    accountable: Product Owner
    skill: user-evidence
    work_products:
      - WP-04
  - id: 5
    cadence: C1
    step: C1.3
    name: Squelette de parcours cible
    entry: Journeys as-is et personas disponibles.
    task: "Nommer et ordonner l'intégralité des étapes du parcours cible — un parcours par famille d'acteur : celui du client, et celui de chaque opérateur déclaré au canevas (préparer, opérer, suivre, corriger) —, sans en concevoir le détail."
    verification: "Chaque étape nommée avec le vocabulaire de l'utilisateur, pas celui du métier. Enchaînement validé par le critic de domaine. Chaque opérateur du canevas a son parcours au squelette : ses étapes deviendront des écrans du produit, jamais un hors-périmètre implicite (K1)."
    exit: Squelette exhaustif commité ; aucune étape du parcours réel absente.
    responsible: product-designer
    accountable: Product Owner
    skill: journey-skeleton
    work_products:
      - WP-05
  - id: 6
    cadence: C1
    step: C1.3
    name: Corpus réel et provenance
    capabilities:
      - harness-web-research
    capabilities_note: "Le corpus est constitué de FAITS EXTÉRIEURS que ni le sponsor ni le modèle ne détiennent. Sans accès aux sources approuvées, il ne reste que deux issues : tout rendre en UNKNOWN, ou fabriquer une fixture et la présenter comme un contenu. La seconde est le défaut que cette activité existe pour rendre impossible."
    entry: "Sources approuvées du domaine disponibles (WP-03) ; squelette de parcours arrêté (WP-05) — il donne le périmètre minimal que le corpus doit couvrir. L'un des deux absent produit BLOCKED."
    task: "Acquérir le corpus réel minimal suffisant pour parcourir le squelette de bout en bout, depuis les seules sources approuvées. Écrire la provenance enregistrement par enregistrement et la catégorie de vérité champ par champ. Mesurer la couverture contre le squelette et NOMMER ce qui manque."
    verification: "Chaque enregistrement porte adresse, date de lecture et citation littérale — sans les trois il est UNVALIDATED, jamais une valeur plausible. Deux sources indépendantes sur tout fait structurant ; trois pages qui citent le même communiqué sont UNE source. Aucun enregistrement fabriqué, sous aucun prétexte de déblocage d'aval. Un champ non sourçable est rendu ABSENT et l'interface le dira, jamais rempli d'une valeur vraisemblable. La couverture est MESURÉE contre le squelette, pas appréciée. Verdict de recevabilité rendu par critic(domaine), jamais par le producteur du corpus."
    exit: "C1.3-parcours/corpus/ commité, provenance complète, couverture chiffrée et écarts nommés. Aucune fixture ne subsiste sur un chemin servi à un livrable de design ou de produit."
    responsible: data-steward
    accountable: Product Owner
    skill: real-corpus
    work_products:
      - WP-06
  - id: 7
    cadence: C1
    step: C1.3
    name: Tests de marché et apprentissages
    capabilities:
      - harness-web-research
    capabilities_note: "Les prix et les offres des alternatives, et les communautés où la cible se trouve, sont des faits extérieurs : ils se cherchent, ils ne se supposent pas."
    entry: "Hypothèses critiques nommées et classées, chacune avec sa carte de test (WP-02) ; recherche utilisateur et personas (WP-04) ; squelette de parcours (WP-05) — il donne la promesse que les tests exposent. L'un d'eux absent produit BLOCKED."
    task: "AVANT DE CONSTRUIRE LE SOCLE, mettre les hypothèses critiques à l'épreuve du marché réel, par les tests les moins chers qui les tranchent (INSEAD NBV, Lean Startup) : page d'atterrissage au VRAI prix et liste d'attente, fausse porte, acompte ou précommande, service rendu à la main, entretiens sans pitch. Préparer chaque test — page, message, ciblage, budget —, le faire DÉCIDER par le porteur avant toute publication ou dépense, le mener, et consigner chaque résultat en carte d'apprentissage : nous pensions, nous avons fait, nous avons observé, à quel échelon de fiabilité, donc nous décidons."
    verification: "Chaque carte d'apprentissage cite son hypothèse HYP-nn, son critère de réussite écrit AVANT le test, l'observation brute et sa source E-nn — export d'analytics, réponses de formulaire, paiements, notes d'entretien datées. L'échelon de fiabilité est celui de l'observation : un propos (« j'achèterais ») n'est jamais un acte, une inscription n'est jamais un paiement. Aucun résultat SYNTHETIC ni DOCUMENTARY ne tranche une hypothèse ici. Une hypothèse infirmée se dit infirmée, et route vers WP-02."
    exit: "Au moins une hypothèse critique tranchée à l'échelon de l'acte (inscription, clic d'achat) ou du paiement, ou l'impossibilité de le faire écrite en réserve avec sa raison. Les cartes d'apprentissage commitées ; la thèse (WP-02) reprise sur chaque hypothèse infirmée avant le socle."
    responsible: product-lead
    accountable: Product Owner
    skill: market-tests
    work_products:
      - WP-07
  - id: 8
    cadence: C1
    step: C1.4
    name: Fondations du Design System
    entry: "Squelette arrêté ; design-brief.md renseigné ; contraintes d'accessibilité, de langue et d'usage déclarées ; STACK DE CONCEPTION arrêtée par ADR — framework, base de composants, moteur de styles, cible de déploiement, outillage de conception assistée. Son absence produit BLOCKED : décider la stack après la première décision visuelle n'est plus une décision, c'est une justification."
    task: "PARTIR DU DESIGN SYSTEM DE DÉPART servi par la tour : l'appliquer à un vrai écran du produit, le montrer, puis poser UNE question à l'humain qui répond du produit — on le garde, on l'adapte, ou on l'écarte. Gardé : il devient la direction retenue. Adapté : on en garde la structure et on change ce qui a été nommé. Écarté : faire CONCOURIR au moins trois directions construites, dont il peut rester une. Puis en dériver tokens, couleurs, typographies, espacements, grilles, responsive, accessibilité, composants, variantes et états."
    point_de_depart:
      nom: "Départ standard"
      fichier: templates/design-system/DESIGN-demarrage.md
      fichiers:
        - chemin: templates/design-system/tokens.json
          role: "Tokens au format W3C Design Tokens (DTCG) — couleurs et rôles, polices, typographie, espacements, rayons, ombres, surfaces. Gardé ou adapté : il devient la source tokens.json du projet."
        - chemin: templates/design-system/variables.css
          role: "Les mêmes tokens en variables CSS (:root), avec l'échelle typographique nommée et les rayons par composant — à régénérer depuis tokens.json, jamais à tenir à côté."
        - chemin: templates/design-system/theme.css
          role: "Le thème Tailwind v4 (@theme), si la stack de conception retient Tailwind."
      question: "Ce design system de départ, appliqué à notre écran principal : on le garde, on l'adapte, ou on l'écarte ?"
      options:
        - "Garder — il devient la direction retenue, tel quel"
        - "Adapter — on garde la structure, on change ce que je nomme (couleurs, typographie, formes)"
        - "Écarter — on construit trois directions concurrentes"
      garde_fous:
        - "Un point de départ, jamais une marque : ni nom, ni logo, ni illustration repris d'une source dans le produit."
        - "Une seule famille, Inter : 400 à 700 pour le texte, 900 pour l'affichage. Aucune police propriétaire — la référence d'origine en portait une, elle a été retirée des fichiers."
        - "Le contraste WCAG AA se revérifie sur NOS paires de couleurs : le lime ne sert jamais de texte sur fond clair."
        - "Les fichiers sont une extraction : --section-gap et --element-gap portent des intervalles (64-80px, 8-12px) qui ne sont pas des valeurs CSS. Trancher une valeur, ou retirer, avant d'en faire les tokens du projet."
        - "L'échelle typographique tient en DIX tailles nommées — micro, caption, body-sm, body, body-lg, subheading, heading-sm, heading, heading-lg, display —, les mêmes dans les trois fichiers. Une onzième se justifie par un écran, jamais par commodité."
    verification: "Le brief de conception est renseigné AVANT la première décision visuelle, et son absence produit BLOCKED — jamais une direction devinée : c'est l'emplacement du goût et des contraintes de l'humain, et une direction décidée sans lui se fait refuser après coup, deux fois s'il le faut. Le design system de départ a été montré sur un vrai écran et la décision — gardé, adapté ou écarté — est consignée avec qui l'a prise. Écarté, au moins TROIS directions distinctes sont CONSTRUITES — vraies pages, vrai contenu, chacune engagée à fond — et présentées à l'arbitrage : une direction unique non choisie n'est pas un choix, c'est la première idée venue. La direction retenue porte un ADR nommant les alternatives écartées, ou la décision de garder le départ, et ce qui a tranché. Contraste WCAG AA vérifié par outil. Tokens exportables en CSS et JSON. Chaque composant expose les 7 états. Catalogue exécutable. Mode de surface déclaré. Plancher de craft lu immédiatement avant toute édition d'interface, et ses bans absolus vérifiés un à un : une fondation qui les enfreint n'est pas une variante de goût."
    exit: "C1.4-socle/design-system/ commité ; catalogue navigable ; brief de conception et ADR de direction présents ; explorations écartées conservées, jamais supprimées — c'est la preuve qu'un choix a eu lieu."
    responsible: product-designer
    accountable: Product Owner
    skill: spine-build, impeccable
    work_products:
      - WP-08
  - id: 9
    cadence: C1
    step: C1.4
    name: Navigation, IA, terminologie et sémantique
    entry: Squelette arrêté ; domaine qualifié.
    task: "Figer la navigation, l'architecture de l'information, le vocabulaire utilisateur, les catégories de vérité, les statuts et les règles financières."
    verification: "Chaque terme unique, non ambigu, et ÉPROUVÉ par la campagne SUX du socle (activité 12, SYNTHETIC · SUX) — un terme non compris retourne à WP-09 avant le gel. La navigation couvre toutes les étapes. Chaque catégorie de vérité est disjointe. Un calcul n'améliore jamais le statut de vérité de ses entrées. La table de liaison résout chaque entité et chaque champ du noyau vers un terme du glossaire."
    exit: "Figés par tag Git. Noyau du modèle de données classé CORE INVARIANT ou EXTENSION, élément par élément. Toute évolution ultérieure du noyau rouvre G0."
    responsible: product-designer et product-lead
    accountable: Product Owner
    skill: spine-build, living-data-model
    work_products:
      - WP-09
      - WP-10
  - id: 10
    cadence: C1
    step: C1.4
    name: Socle exécutable
    entry: "Fondations, composants, navigation, IA et sémantique disponibles. CORPUS RÉEL recevable (WP-06) : son absence produit BLOCKED, et jamais un jeu de fixtures écrit pour débloquer l'activité."
    task: "Produire le socle navigable en très haute fidélité structurelle, alimenté par le corpus réel, et le DÉPLOYER derrière une URL que le métier ouvre sans rien installer."
    verification: "Se parcourt de bout en bout sans écran mort. Chaque étape atteignable. Le contenu affiché vient de WP-06 : AUCUNE fixture, et le point est éliminatoire — un socle sur fixtures est une maquette, il ne prouve pas que le produit dit quelque chose de vrai. Un champ ABSENT au corpus est rendu comme absent par l'interface, jamais comblé. Le socle est déployé et l'URL répond. Plancher de craft lu avant toute édition. Vérification en passes bornées : une inspection groupée desktop et mobile, une correction en lot, une confirmation, puis arrêt — un auto-QA en boucle coûte plus qu'il ne trouve."
    exit: "Ouvrable hors environnement de développement, à une URL déployée, sur corpus réel."
    responsible: product-designer
    accountable: Product Owner
    skill: spine-build, living-design, impeccable
    work_products:
      - WP-11
  - id: 11
    cadence: C1
    step: C1.4
    name: Socle technique et choix structurants
    capabilities:
      - harness-web-research
    capabilities_note: "Faisabilité, coût et licences des dépendances candidates : vérifiables, donc à vérifier plutôt qu'à supposer."
    entry: "Squelette de parcours arrêté ; sémantique des données figée ; contraintes de l'existant établies."
    task: "PARTIR DU DÉPART D'ARCHITECTURE servi par la tour : le confronter au squelette et aux contraintes, puis poser UNE question à l'autorité Tech — on le garde, on l'adapte, ou on le remplace. Arrêter l'architecture cible : frontières d'intégration, modèle de persistance, topologie de déploiement, architecture de sécurité, contraintes non fonctionnelles. Trancher les décisions structurantes — build ou achat, socle technologique — et les enregistrer en ADR."
    point_de_depart:
      nom: "Départ d'architecture standard"
      fichier: templates/architecture/ARCHITECTURE-demarrage.md
      fichiers:
        - chemin: templates/architecture/adr/
          role: "Neuf ADR au format de WP-13. Gardée, une ADR est reprise dans decisions/adr/ ; adaptée, réécrite ; écartée, remplacée par une ADR qui dit pourquoi."
        - chemin: templates/architecture/environnements.yaml
          role: "DEV → QA → PROD, PREPROD sur preuve : isolation, données, portes de promotion, migrations."
        - chemin: templates/architecture/fitness-functions.yaml
          role: "Les vérifications qui tiennent le départ en CI, chacune rattachée à son ADR."
        - chemin: templates/architecture/ci/
          role: "Un chemin d'or CI en exemple : construit une fois, promu en QA par empreinte, mis en production sur décision humaine."
      question: "Ce départ d'architecture, confronté à notre squelette et à nos contraintes : on le garde, on l'adapte, ou on le remplace ?"
      options:
        - "Garder — ses ADR deviennent les nôtres, chacune revérifiée"
        - "Adapter — on garde la forme, on change ce que je nomme (stack, hébergement, environnements)"
        - "Remplacer — on arrête une autre architecture, ADR à l'appui"
      garde_fous:
        - "Un départ gardé n'exempte d'aucune vérification de l'activité : couverture du squelette, classement, alternative rejetée, verdict critic(engineering)."
        - "Toute divergence avec le départ est une ADR : ce qui change, pourquoi, ce que cela exclut."
        - "Le départ ne chiffre rien et n'épingle aucune version : contraintes et versions se fixent sur NOTRE produit, documentation du jour."
        - "Plus simple gagne : si le produit tient avec moins, le remplacer est la bonne réponse."
    verification: "La décision sur le départ d'architecture — gardé, adapté ou remplacé — est consignée avec qui l'a prise. Chaque décision structurante porte au moins une alternative rejetée avec son motif. Chaque élément est classé CORE INVARIANT ou EXTENSION par rayon d'impact, jamais par nature apparente. L'architecture supporte l'intégralité du squelette, y compris les étapes des releases lointaines. ARCHITECTURE LA PLUS SIMPLE qui supporte le produit en sûreté : ce qui n'est PAS en v1 est listé, l'infrastructure croît sur usage mesuré et jamais sur charge hypothétique, une question juridique ou d'hébergement est une décision DIFFÉRÉE avec son déclencheur, jamais un bloquant de conception. Verdict critic(engineering) rendu — toute infrastructure au-delà du besoin mesuré y est un finding."
    exit: "Socle technique commité et figé par tag Git. Les CORE INVARIANT ne sont plus modifiables hors cadence C1 (K4, EX3)."
    responsible: principal-engineer
    accountable: autorité Tech
    skill: solution-architecture
    work_products:
      - WP-12
      - WP-13
  - id: 12
    cadence: C1
