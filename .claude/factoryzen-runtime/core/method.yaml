      pinned_commit: 2149fcce39a90bb409df5f16515f316a76dc6199
      pinned_date: "2026-09-14"
      licence: "Apache-2.0. La licence du tiers et son NOTICE sont livrés dans l'arbre vendoré, comme sa clause 4 l'exige — une copie verbatim sans sa licence serait une violation, pas un raccourci."
      vendor:
        root: vendor/impeccable
        strategy: "Copie verbatim du commit épinglé, jamais éditée — la GUIDANCE seule : SKILL.md et reference/. Le lanceur et son moteur déterministe ne sont PAS copiés. Le binaire du moteur se télécharge depuis les Releases GitHub au premier appel, inatteignable depuis cet environnement, et exécuter du code extérieur ferait passer l'adoption en AUDITÉ — approbation humaine enregistrée, indisponible sous délégation. Le skill prévoit lui-même ce cas et lit le contexte projet directement. L'intégrité est recalculée à chaque contrôle : une modification locale, même d'un octet, fait échouer K6."
        discovery: "plugin.json → skills, second arbre. Le dossier de skill est vendor/impeccable/impeccable ; LICENSE et NOTICE.md sont à la racine de l'arbre, hors du dossier de skill, donc livrés sans jamais être chargés en contexte."
