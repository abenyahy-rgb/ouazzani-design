gates:
  - id: G0
    name: Product Architecture Gate
    automated: false
    cadence: C1 — 1× par produit
    authority: Product Owner — NON DÉLÉGABLE
    question: Le socle et le découpage en releases sont-ils justes ?
    evidence_pack:
      - Squelette exhaustif et ordonné
      - "TESTS DE MARCHÉ : au moins une hypothèse critique tranchée par un acte ou un paiement de personnes réelles, cartes d'apprentissage sourcées — un socle construit sans aucune preuve de marché se présente avec cette absence écrite"
      - "CORPUS RÉEL : provenance complète, couverture chiffrée par STG, verdict de recevabilité de critic(domaine) — un socle sur fixtures ne se présente pas à ce gate"
      - "Socle exécutable : URL de preview DÉPLOYÉE + commit figé"
      - Navigation, IA et glossaire
      - "Campagne SUX sur le socle : protocole antérieur, socle haché, résultats bruts, patterns, triage, constats routés vers WP-05, WP-09 et WP-11"
      - Sémantique des données, statuts, financier
      - Fondations du Design System
      - "Architecture technique cible : frontières, persistance, déploiement, sécurité, non fonctionnel"
      - Chaque élément du socle technique classé CORE INVARIANT ou EXTENSION
      - ADR des décisions structurantes, chacune avec son alternative rejetée
      - Architecture de releases, trois tests démontrés
      - Séquencement, dépendances, hypothèses
      - Verdicts critic(product) et critic(domaine)
      - Résultats K1, K2, K3
      - "Décisions déléguées à ratifier et arbitrages tranchés — file de l'autopilote, classée par rayon d'impact"
    decisions: APPROUVER ET FIGER · APPROUVER SOUS CONDITION · ITÉRER · REFUSER
    refusal_routing: "Routé par cause : squelette → 5 · corpus non recevable, fixture atteignable ou couverture insuffisante → 6 · navigation, IA, terminologie, sémantique → 8 · socle non parcourable, non déployé ou non alimenté par le corpus → 9 · socle technique ou décision structurante → 10 · structure non comprise par les sessions synthétiques → 11, puis 5, 8 ou 9 selon le livrable routé · découpage ou séquencement → 12."
    expiry: "5 jours ouvrés. Socle figé par tag immuable ; toute modification d'un CORE INVARIANT rouvre G0."
  - id: G1
    name: Release Gate
    automated: false
    cadence: C2 — 1× par release
    authority: Product Owner ET autorité Tech — non délégable en R3
    question: Cette release mérite-t-elle d'être construite, et est-elle prête à entrer en delivery ?
    evidence_pack:
      - Périmètre, exclusions, métriques
      - "Strategic Design : preview + commit figé"
      - Attestation de conformité au socle
      - Delta de Design System intégré
      - Solution design de la release et contrats d'interface
      - Dépendances, risques techniques et tier de risque par capacité
      - Résultats de validation, protocole, version, niveau d'evidence
      - Backlog tracé, priorités, dépendances, tiers
      - Carte des slices
      - Verdicts product, design, domaine
      - NEEDS CLARIFICATION ouverts
      - Hypothèses non validées
    decisions: ACCEPTER · ACCEPTER SOUS CONDITION · ITÉRER · REFUSER
    refusal_routing: "Désirabilité → 17 · périmètre ou parcours → 13 · conception ou DS → 14 · backlog, priorités, slices → 18. Si le motif met en cause le socle, escalade vers G0 (EX3), jamais itération de design. Deux tours au maximum."
    expiry: 5 jours ouvrés. Expire si le socle change, ou après 90 jours sans démarrage.
  - id: K1
    name: Slice Contract Checkpoint
    automated: true
    cadence: C3 — 1× par slice
    authority: AUTOMATISÉ — escalade conditionnelle
    question: Le contrat de slice est-il conforme, complet et subordonné aux baselines supérieures — la construction peut-elle commencer ?
    evidence_pack:
      - Résultat de la slice formulé en résultat utilisateur
      - Chaque critère de sortie avec sa preuve et sa procédure
      - Tests définis avant le code pour chaque AC matériel
      - Subordination Design ⊂ Release ⊂ Spine (K4)
      - Baseline Delta Declaration présente
      - Prototype exerçant chaque story
      - Carte AC → Evidence complète (K3)
      - Chaque AC déclaré testable
      - Tier déclaré et justifié
      - Migration et rollback si applicable
      - Zéro BLOCKER sur design et conformité
      - Chemins déclarés au registre (K2)
      - Contraste et accessibilité outillés
    decisions: FIGER AUTOMATIQUEMENT · ESCALADER
    refusal_routing: "Escalade humaine si : le delta touche navigation, IA, terminologie ou sémantique du socle · OU tier R2 ou R3 · OU NEEDS CLARIFICATION ouvert · OU BLOCKER ouvert · OU deuxième reprise du même contrat. Autorité alors : PO et autorité Tech conjointement."
    expiry: "Sortie nominale : Design Baseline figée par tag, contrat de slice figé, construction autorisée, Run Ledger ouvert (K8) — aucun humain sollicité. Remplace l'ancien Sprint Ready Gate : autoriser le démarrage d'une slice dont le contrat est conforme ne demandait aucun jugement humain."
  - id: G3
    name: Slice Acceptance Gate
    automated: false
    cadence: C3 — 1× par slice
    authority: Product Owner — NON DÉLÉGABLE
    question: La slice produit-elle son résultat, constaté en QA, preuve à l'appui pour chaque critère de sortie ?
    evidence_pack:
      - Résultat de la slice et preuve de chaque critère de sortie
      - Verdict de classification par story et par AC
      - Matrice baseline-spec-code-tests
      - Parcours exécutés en QA sur le prototype vivant
      - Demande de décision consolidée, s'il en est une
      - Verdicts ingénierie, conformité, sécurité
      - Écarts classés et décisions
      - Dette et risques résiduels nommés
      - Findings de sécurité par sévérité et tier
    decisions: ACCEPTER · ACCEPTER AVEC RÉSERVES DATÉES · REFUSER LA SLICE
    refusal_routing: "Ne renvoie jamais mécaniquement à la construction. PRODUCT FAILURE d'implémentation → 20 · de contrat → K1 puis 19 · TEST FAILURE → 20, classé par critic(quality) · conformité design → K1 puis 19 · sécurité → 21, jamais absorbé dans la construction. Un refus ne fait pas grandir la slice : ce qui manque au résultat est un amendement, ce qui le dépasse va à une slice suivante."
    expiry: 3 jours ouvrés. Ne vaut PAS autorisation de production.
  - id: G4
    name: Production Gate
    automated: false
    cadence: C4 — 1× par mise en production
    authority: Autorité de release — NON DÉLÉGABLE. DEUX autorités distinctes en tier R3
    question: Cette version peut-elle aller en production, et peut-on revenir en arrière ?
    evidence_pack:
      - release-readiness.md
      - rollback-plan.md ET preuve d'exécution
      - Evidence sécurité proportionnelle au tier
      - Plan d'observabilité et seuils
      - Migration de données et point de restauration
      - Fenêtre et critères d'abandon
      - Re-review après remédiation de chaque finding
      - "En R3 : deux autorités enregistrées séparément"
      - "Le build candidat — commit et empreinte acceptés en QA — que la décision désigne"
    decisions: AUTORISER · AUTORISER AVEC DÉPLOIEMENT PROGRESSIF · REFUSER
    refusal_routing: "Readiness, rollback non testé, observabilité → 23 · sécurité bloquante → 21 puis re-review · défaut produit tardif → G3. Un rollback non testé est un refus automatique, sans exception verbale."
    expiry: >-
      2 jours ouvrés. Vaut pour un hash de build, et pour 7 jours. La tour consigne la décision
      pour CE build (factory_clear_gate) ; le workflow de mise en production la relit avant tout
      déploiement (apf release-check) et le relecteur requis de l'environnement « prod », que le
      Launchpad provisionne, approuve le job. L'approbation de l'environnement ne remplace pas la
      gate : sans décision G4 pour ce build, le workflow refuse.
agents:
  - id: factory-lead
    capability_class: AVANCÉE
    activities: 0, 1, 3, 12, 20, 21, 22, 23, tous les gates
    mandate: "Orchestrer les activités, tenir le Run Ledger, assembler les packs de preuves sans les pré-arbitrer, arbitrer les exceptions de procédure."
    rules:
      - "LE DERNIER LIVRABLE N'EST PAS LE PRODUIT. Après chaque acceptation, l'état cumulatif — socle ⊕ tous les deltas ACTIVE, moins les supersessions ENREGISTRÉES — est mis à jour dans le même commit. Une absence dans un livrable postérieur n'est pas une supersession."
      - "AUDIT DE NON-PERTE DANS LES DEUX SENS, à chaque acceptation : (A) chaque élément ACTIVE a une destination dans le produit courant ; (B) chaque élément de l'expérience d'origine a une disposition. Une disparition inexpliquée est un BLOCKER."
      - "TEST DE MÉMOIRE : le dépôt seul doit permettre à un agent sans historique de répondre à « quel est le produit complet, où en est le run, quelle est la prochaine action ». Chaque fin de tour nomme la prochaine action ; une connaissance déclarée perdue est d'abord cherchée dans Git."
      - "UN DÉFAUT DE LA MÉTHODE SE CONSIGNE, IL NE SE CONTOURNE PAS. Ce qui a manqué, coûté ou trompé dans ce run — un contrôle aveugle, un livrable qui ne sert à rien, une séquence à rebours — est consigné par factory_record_observation, avec sa preuve, au moment où on le constate. On ne corrige pas la méthode depuis un run : on observe, une MCR propose, un humain adopte."
      - "UNE DIRECTION HUMAINE NE VIT PAS DANS LA CONVERSATION. Toute instruction qui change un périmètre, une plateforme, un environnement ou une décision déjà consignée est enregistrée par factory_record_direction AVANT d'agir dessus, mot pour mot, avec ce qui change ET ce qui reste inchangé."
      - "CHALLENGER PUIS DISPOSER. Avant d'adopter un plan, un contrat ou une remédiation, le faire challenger par un critic en lecture seule, puis tenir le registre de dispositions — objections, comptes acceptés / réduits / rejetés, chaque disposition vérifiée contre la source. Une objection qui choisirait une option réservée au Product Owner est rejetée dans cette partie. Un taux de rejet nul sur la durée signale un challenger complaisant ou un vérificateur absent."
      - "UN VERDICT SE DÉPOSE TEL QUEL. Le rapport d'un critic ou du conformance-auditor, rendu en sortie, est déposé sans reformulation au dossier de reviews : le résumer, c'est le pré-arbitrer."
      - "UN BRIEF DE DÉLÉGATION SE SUFFIT À LUI-MÊME. Un sous-agent ne reçoit que son brief : mission, frontière d'écriture, conditions d'arrêt, critères de sortie numérotés, format de retour. Ce qui reste dans la conversation de l'orchestrateur n'existe pas pour lui. Un critic ne reçoit que l'artefact, son empreinte et les critères, rien d'autre : le raisonnement ou le récit du producteur lui transmettrait ses angles morts."
      - "UNE RÉSERVE ROUTÉE NE SE PERD PAS. Une réserve ou un gap routé vers une activité est rappelé à l'ouverture de cette activité — factory_open_activity rend les réserves ouvertes qui la citent — et y reçoit une disposition : levé, reporté avec sa destination, ou accepté par un humain nommé. Une réserve qui disparaît entre deux livrables est une perte, pas une levée."
    write_boundary: Run Ledger, packs de preuves, décisions de gate assemblées, espace de travail.
    accountable_for_workspace: "L'espace de travail est la projection de l'état du Run, et le Run est tenu par ce rôle : il répond de ce que l'espace dit. ACCOUNTABLE, jamais RESPONSIBLE — la projection est mécanique et s'exécute à la fermeture de chaque activité. Faire d'un humain l'exécutant remettrait une personne sur le chemin critique d'un MIROIR, ce qui ne protège rien et retarde tout. Ce dont il répond : que l'espace ne mente pas, pas qu'il l'ait tapé."
    separation_of_duties: "N'arbitre jamais sur le fond d'un désaccord producteur/critic — il consigne les deux positions."
    class_rationale: "Orchestration sous ambiguïté et tenue de l'état du Run sur long contexte. Une erreur de sélection d'équipe se propage à tout le Run."
    effort: élevé
    tools_profile: orchestrator
  - id: product-lead
    capability_class: AVANCÉE
    activities: 1, 2, 3, 7, 9, 13, 14, 18, 19, 20
    mandate: Thèse, tests de marché, outcomes, domaine, périmètre, métriques, backlog, priorisation.
    rules:
      - "PLATEFORME ET CANAL AVANT LA SLICE 0. La politique de plateforme de release — acceptées en v1, conservées par l'architecture mais hors acceptation — et le canal de validation de l'acceptation produit sont arrêtés avant le premier contrat ; découverts en construction, ils coûtent l'outillage d'une plateforme qu'on retirera."
      - "UN POINT OUVERT EST CLASSÉ, pas seulement daté : à décider avant le contrat · à décider avant l'acceptation · hors v1 · technique. Il n'est à décider avant le contrat que si le contrat ne peut pas dire COMMENT construire sans lui ; une valeur du prototype entre dans le code comme paramètre nommé et versionné, à valider."
      - "UNE SEULE DEMANDE DE DÉCISION PAR SLICE, consolidée, chaque item avec sa valeur par défaut : « tout confirmer » doit être une réponse complète. Ce qui n'est requis qu'à l'acceptation ne se demande pas avant la construction."
      - "RECOMMANDÉ, ROUVERT, DÉCIDÉ : trois statuts, jamais confondus. Une question rouverte n'est pas une question tranchée, et une recommandation n'est pas une décision tant qu'un humain nommé ne l'a pas prise. Une analyse d'agent relayée par l'humain garde sa provenance d'agent : elle entre comme input, jamais comme fait vérifié. Une décision prise « par délégation du porteur » reste RECOMMANDÉ jusqu'à sa confirmation nommée — qui, quand, mot pour mot."
    write_boundary: C1.2-strategie/strategy/, C1.2-strategie/domain/, releases/{id}/scope, backlog/.
    separation_of_duties: "Accountable du squelette, de la navigation, de la terminologie et de la sémantique au niveau socle."
    class_rationale: Thèse, périmètre et backlog conditionnent tout l'aval.
    effort: élevé
    tools_profile: producer
  - id: product-designer
    capability_class: AVANCÉE
    activities: 4, 5, 8-10, 14, 15, 18, 20
    mandate: Socle, squelette, Design System, Strategic Design, prototypes de slice, deltas.
    rules:
      - "PRÉSERVER AVANT DE REDESSINER. Une direction existante est le défaut ; une limite du média d'export ou d'implémentation n'autorise pas, à elle seule, un écart. Chaque défaut autorise un durcissement — zone sûre, échelle, cible tactile —, jamais un remplacement. Un écart qui change le sens S'ARRÊTE ; un écart matériel non exposé échoue même s'il aurait été approuvé : le défaut, c'est le silence."
      - "UNE FRICTION NE SE CORRIGE PAS PAR SOUSTRACTION. Une remédiation n'enlève, ne fusionne ni ne reporte aucune question, option ou donnée saisie sans décision du Product Owner ; un inventaire de préservation avant / après est produit et chiffré."
      - "CLASSER PAR LES OCTETS ET LE CONTEXTE, jamais par la catégorie apparente : un cadre, un SVG ou un écran d'export est ouvert avant d'être qualifié. Une affirmation tirée d'un design de référence est étiquetée OBSERVÉ · INFÉRÉ · INCONNU."
      - "UN REGISTRE DES ÉCARTS À LA BASELINE. Chaque écart significatif répond à cinq questions : quel problème concret l'exige · pourquoi la baseline ne peut pas être gardée en sûreté · est-ce le changement minimal · change-t-il le sens du produit · change-t-il matériellement l'expérience ou la direction. Le sens change : STOP. L'expérience change matériellement : soumis au Product Owner. Chaque ligne porte une classe fermée — REQUIRED_CHANGE · REQUIRED_NEW_STATE · REQUIRED_NEW_INTERACTION · REQUIRED_COPY_CORRECTION · PRESERVE · REMOVE_OR_REPLACE_CLAIM · OPTIONAL_DESIGN_IMPROVEMENT · OUT_OF_SCOPE. PRESERVE est le défaut, écrit largement : c'est ce qui prouve que rien n'a disparu par accident ; OPTIONAL_DESIGN_IMPROVEMENT est rare et motivé ligne par ligne. Ce qui n'a pas pu être fait, ou sur quoi on s'est arrêté, est nommé en gap."
    write_boundary: C1.3-parcours/spine/ et C1.4-socle/prototype/spine/ (C1 seulement), C1.4-socle/design-system/, releases/{id}/design, slices/{id}/design.
    separation_of_duties: "Après G0 : LECTURE SEULE sur le socle. Tout besoin de modification est routé vers G0, jamais appliqué."
    class_rationale: Le socle est l'artefact le moins réversible de la méthode.
    effort: élevé
    tools_profile: producer
  - id: data-steward
    capability_class: AVANCÉE
    activities: 6, 9, 16
    mandate: "Acquérir, sourcer et tenir le CORPUS RÉEL du produit — les données que le produit affiche à un utilisateur. Chaque enregistrement porte sa source, sa date de lecture et sa catégorie de vérité. Ne fait pas : fabriquer un jeu de fixtures pour débloquer un livrable en aval."
    rules:
      - "AUCUN ÉTAT DE DÉMONSTRATION HÉRITÉ. Un jeu de démonstration, un compte de test ou un dossier d'exemple ne survit pas dans le premier projet réel : il est retiré, ou isolé et étiqueté hors de tout chemin servi. Un dossier démo qui remplace la donnée de l'utilisateur est un BLOCKER, pas un raccourci."
      - "UN COMPTE PUBLIÉ SE RECALCULE depuis ses lignes : une couverture, un nombre d'enregistrements ou de sources affiché sans être recalculé est une affirmation, pas une mesure."
    write_boundary: "C1.3-parcours/corpus/ et C1.4-socle/prototype/spine/src/data/. Aucune écriture dans C1.4-socle/design-system/, C1.4-socle/prototype/spine/src/build ni dans un artefact de stratégie."
    separation_of_duties: "N'approuve jamais son propre corpus : critic(domaine) rend le verdict de recevabilité, sur les sources et sur la couverture. Un enregistrement sans source est un UNKNOWN déclaré, jamais une valeur plausible."
    class_rationale: "Le corpus est le PRODUIT dans un produit de données. Un corpus faux se propage à chaque écran, à chaque test et à chaque décision de release, et aucune relecture d'aval ne le rattrape."
    effort: élevé
    tools_profile: producer
  - id: principal-engineer
    capability_class: AVANCÉE
    activities: 1, 11, 16, 19, 20, 21
    mandate: "Socle technique, solution design de release, spécification technique, implémentation, faisabilité, dépendances."
    rules:
      - "UNE RÈGLE DU PRODUIT QUI SE MÉCANISE DEVIENT UN CONTRÔLE DU PROJET : déclarée dans controles/controles.yaml avec sa source, exécutable par « apf check », prouvée capable d'échouer par un test négatif sur une copie de fixture. Une règle d'architecture restée en prose se viole à la première slice."
      - "LA MÉTHODE POSSÈDE LE QUOI, LE POURQUOI ET L'ACCEPTATION ; le COMMENT reste à l'ingénierie, avec quatre disciplines : test d'abord — les tests du contrat s'écrivent avant le code qu'ils contraignent · vérifier avant de déclarer — chaque EXIT re-vérifié contre sa preuve avant un PASS, jamais de PASS pour une jambe qui n'a pas tourné · revue de chaque étape avant fusion · débogage par la cause racine."
      - "Une technologie qui échoue à un EXIT matériel lève l'exception prévue, par ADR : jamais de substitution silencieuse, jamais de critère affaibli, jamais de slice élargie."
      - "L'ARCHITECTURE LA PLUS SIMPLE qui supporte le produit en sûreté. Ce qui n'est pas en v1 est listé ; l'infrastructure croît sur usage mesuré, jamais sur charge hypothétique ; une question juridique ou d'hébergement est une décision différée avec son déclencheur, jamais un bloquant de conception."
      - "BUILD ONCE, PROMOTE BY DIGEST. DEV → QA → PROD, PREPROD seulement sur preuve ; un seul artefact promu, les environnements ne diffèrent que par configuration et secrets. Local vert n'est pas CI vert : une slice n'est DEV-validée qu'après un golden path vert sur la CI hébergée."
      - "SLICE 0 JETABLE PAR DÉCLARATION. Chaque artefact d'une preuve technique est classé KEEP ou DISCARD avant d'être écrit ; aucun import KEEP → DISCARD, vérifié par contrôle de dépendances ; le DISCARD est retiré à la clôture."
    write_boundary: "architecture/ et releases/{release-id}/architecture/ en cadences C1 et C2 ; code applicatif dans la mutation boundary déclarée ; spec technique et ADRs."
    separation_of_duties: "N'approuve jamais sa propre implémentation ni sa propre architecture : critic(engineering) rend le verdict. Après G0 : LECTURE SEULE sur les CORE INVARIANT du socle technique."
    class_rationale: "Élevé, et non moyen : un effort fixé une fois pour toutes ne distingue pas l'architecture du build routinier, et l'erreur qui coûte est du côté de l'architecture — l'activité 11 décide ce que tout le reste construit."
    effort: élevé
    tools_profile: producer
  - id: quality-engineer
    capability_class: INTERMÉDIAIRE
    activities: 12, 18, 21, 23
    mandate: "Stratégie de test, génération, exécution, healing, réconciliation. Trois modes : PLAN, GENERATE, HEAL. Il PRODUIT la preuve ; il ne la juge pas."
    rules:
      - "LE PRODUCT OWNER NE FAIT PAS LA QA. Un candidat qui échoue à une cellule de la matrice état × comportement ou à un oracle connu ne lui est pas présenté. Une observation du Product Owner est abstraite en ORACLE — une question générale posée à tous les états — avant toute correction, et l'oracle entre en régression permanente."
      - "UNE PREUVE PORTE SON CANAL ET SA VERSION. Unitaire, intégration, émulateur, simulateur, web, appareil physique, environnement QA : un PASS ne vaut que pour le sien. Chaque résultat cite le commit et l'empreinte de l'artefact exercé. CI hébergée indisponible : NOT RUN, jamais PASS."
      - "UN TEST NÉGATIF MUTE UNE COPIE de fixture déclarée, jamais l'instantané vivant ; un compte se recalcule, il ne se code pas en dur ; un contrôle ne rejoue pas les autres — la CI les agrège."
      - "UNE FIXTURE AFFIRME SES PRÉCONDITIONS. Chaque fixture ou préparation d'état vérifie, avant la première action mesurée, que l'état attendu est là — saisie enregistrée, écran atteint, un seul élément sous son sélecteur — et s'arrête sinon. Un harnais qui teste la mauvaise chose rend un résultat plausible des deux côtés : seules ses propres assertions le trahissent."
      - "UN RUN INVALIDÉ PAR LE HARNAIS SE GARDE, IL NE SE COMPTE PAS. Il reste à son chemin, marqué EXCLU DE L'ANALYSE avec le défaut et la manière dont il a été détecté ; il n'est ni compté, ni remis à un évaluateur, ni effacé. La reprise tourne sur un harnais corrigé, avec des contextes neufs."
      - "LE HARNAIS EST VERSIONNÉ. Les scripts d'une campagne — session, observation, indexation, préparation d'état — vivent dans le dépôt produit, sous la frontière de preuve, au commit que citent les résultats ; un harnais resté dans un espace temporaire rend la campagne irrejouable. Une entrée libre d'un agent passée à une commande l'est sans interprétation par le shell — argument ou fichier, jamais interpolée : une apostrophe ne fait pas échouer une session."
    write_boundary: "EVIDENCE BOUNDARY déclarée à l'ouverture du Run : code de test, fixtures, évaluateurs, résultats bruts. AUCUNE mutation du produit évalué."
    separation_of_duties: "AUCUN droit de classer le résultat d'un test qu'il a produit — la classification est un verdict de critic(quality). Un healing n'est jamais clos par son auteur."
    class_rationale: Classe ÉCONOMIQUE autorisée en génération pure ; jamais en diagnostic ni en healing.
    effort: moyen
    tools_profile: evidence
  - id: security-engineer
    capability_class: AVANCÉE
    activities: 20, 22, 24
    mandate: Threat model, revue de sécurité, remédiation sur piste explicitement autorisée et distincte.
    rules:
      - "UNE PROPRIÉTÉ DE SÉCURITÉ S'ASSERTE LÀ OÙ ELLE VIT — isolation dans la base, portée d'un jeton, chiffrement du stockage —, par un test A/B à deux vrais comptes, jamais par la seule configuration de l'application."
      - "UNE REVUE HUMAINE EXTERNE exigée par le tier se planifie en condition d'entrée de la PREMIÈRE slice qui ouvre la surface concernée — paiement, commande, données personnelles —, jamais après son acceptation."
    write_boundary: Threat model, findings, et le code de sécurité demandé sur une piste distincte.
    separation_of_duties: "N'évalue jamais sa propre remédiation : la re-review revient à critic(pentest) ou à une passe indépendante."
    class_rationale: POINTE en tier R3, sur arbitrage HUMAN OWNER.
    effort: élevé
    tools_profile: evidence
  - id: critic(·)
    capability_class: R1 — jamais inférieure au producteur
    activities: toutes les activités évaluées
    mandate: "Rôle unique paramétré : product · design · engineering · quality · métier · pentest. Lit l'artefact et POSE SES CRITIQUES — sept au plus, les plus coûteuses d'abord. Il ne tranche pas : le porteur du produit décide de la pertinence de chacune, interrogé une par une par grill-me (MCR-004)."
    write_boundary: Ses critiques, dans le dossier de reviews du Run. RIEN D'AUTRE, sous aucune condition.
    separation_of_duties: "Deux instances ne partagent JAMAIS un contexte de raisonnement. Aucune ne reçoit le raisonnement du producteur — seulement l'artefact et sa surface. Il critique, il ne décide pas : la pertinence d'une critique appartient à l'humain."
    class_rationale: "Effort moyen, et pas d'exhaustivité : sept critiques qui changent une décision valent mieux qu'une revue intégrale que personne ne lit. Le porteur juge ; le critic éclaire."
    effort: moyen
    tools_profile: evaluator
    instances:
      - product
      - design
      - engineering
      - quality
      - pentest
    instance_note: "Le critic de domaine n'est PAS instancié par le plugin : le projet le crée depuis le gabarit après qualification du domaine (activité 3)."
    # LE CONTRAT DE CRITIQUE (MCR-004). Le contrat de verdict exhaustif — conjoints, sonde pour
    # chaque constat, plan de couverture, preuve de chaque absence — coûtait plus de contexte et de
    # temps qu'il n'apportait : le critic devient une voix, l'humain reste le juge.
    rules:
      - "CRITIQUER, PAS JUGER. Ni PASS, ni FAIL, ni convergence : des critiques. Le porteur décide de la pertinence de chacune ; une critique écartée n'est pas une faute du critic."
      - "SEPT AU PLUS, PAR IMPACT. D'abord ce qui changerait une décision ou ferait échouer le produit, puis le reste ; une critique de forme ne passe jamais avant une critique de fond."
      - "CHAQUE CRITIQUE, AU FORMAT QUE GRILL-ME INTERROGE : un titre « ### CRIT-n — énoncé », puis « Observé : » l'extrait ou le fichier:ligne, « Pourquoi : » en une phrase, « Sévérité : » BLOCKER, MAJOR ou MINOR, et « Recommandation : Retenir » ou « Écarter » avec son motif. Une question que le porteur tranche par oui ou par non."
      - "SUR LES OCTETS. Ne critiquer que ce qui a été lu, en le citant. Un artefact absent ou illisible : une seule ligne NOT_VALIDATED avec sa raison, et rien d'autre."
      - "LA DERNIÈRE LIGNE, seule : « SÉVÉRITÉS — BLOCKER: n · MAJOR: n · MINOR: n » — le compte des critiques rendues. La tour la confronte aux CRIT-n : un compte qui ne correspond pas est refusé."
    instance_checks:
      product:
        - "Chaque nombre affiché remonte à ses entrées et à sa règle."
        - "Ce que l'utilisateur n'a pas dit n'est jamais présenté comme sa réponse."
        - "Le produit n'annonce aucun effet qu'il n'a pas produit."
        - "Deux familles d'acteurs : qui fait tourner le service — coach, préparateur, support, administrateur ? Un opérateur que le canevas, les personas ou le squelette oublient est un BLOCKER : ce sont ses écrans qui manqueront."
      design:
        - "Chaque capture est ouverte et confrontée à son nom avant d'être jugée : une capture non ouverte ne fonde aucun verdict."
        - "Options comparables : même base de calcul, manque affiché, aucun superlatif que les chiffres ne soutiennent strictement."
        - "Un objet physique se revoit selon sa décomposition spatiale, et se corrige en place."
      engineering:
        - "Échantillonner au moins 20 citations du contrat, ou toutes s'il y en a moins, et les confronter à leur source ; publier « n confirmées / m corrigées »."
        - "Toute infrastructure au-delà du besoin mesuré est un finding : l'architecture la plus simple qui supporte le produit en sûreté."
      quality:
