completion_declaration:
  contract: "DÉCLARER N'EST PAS ACHEVER. La tour ne peut pas CALCULER la complétude — le critère est en prose, aucune machine ne le vérifie. Elle EXIGE donc qu'on se prononce : « complet » ou « partiel », jamais tacite."
  defect_it_closes: "L'avancement se calculait sur le NOMBRE DE DÉCLARATIONS. Un livrable déposé avec ses réserves comptait autant qu'un livrable fini, et une étape s'affichait « Terminée · 5 / 5 » alors que l'un de ses livrables disait lui-même que son critère de vérification n'était pas satisfait. Le tableau de bord était PLUS OPTIMISTE que le livrable qu'il résumait — exactement la divergence que la méthode existe pour empêcher, produite par l'outil de la méthode."
  values: [complet, partiel]
  on_absence: "REFUS. Supposer « complet » rendrait le défaut à l'identique ; supposer « partiel » ferait porter au producteur une réserve qu'il n'a pas émise. Refuser coûte une phrase à celui qui sait, au moment où elle est la moins chère. Le refus REND le critère de complétude, pour que la réponse soit jugée et non devinée."
  partiel_sans_reserve: "REFUS. Un « partiel » sans réserve nommée est un « complet » qui n'ose pas le dire : il ne dit à personne ce qui reste à faire."
  complet_avec_reserve: "REFUS. Un livrable complet n'a pas de réserve — c'est une contradiction, pas une nuance."
  last_wins: "La DERNIÈRE déclaration d'un livrable fait foi. Un livrable repris et achevé passe de partiel à complet, sinon une réserve devient une condamnation."
  step_status: "Une étape n'est TERMINÉE que si chacun de ses livrables instanciables est déclaré COMPLET. Un seul partiel la laisse en cours."
  reserves_remontent: "Les réserves apparaissent sur la ligne d'étape et dans le corps de la ligne de projet. Une réserve qu'il faut ouvrir un fichier pour voir est une réserve que personne ne lit."
  opposable: "« Complet » est une affirmation opposable au gate : un critic la confronte au critère de complétude du registre. Ce n'est pas une case à cocher, c'est un engagement."
handover:
  contract: "Rendre la main n'est pas déclarer fini : c'est laisser un dépôt que les contrôles ont lu dans l'état où il sera jugé. Rendu dans chaque SKILL.md, sous « Vérification avant handover »."
  passes: "Exécuter `apf check` TROIS fois : sur l'arbre indexé, après le commit, puis sur main après la fusion — un contrôle ne voit que la population qu'il lit, index ou commit. Toute édition après un passage le rouvre."
  project_checks: "Pour les contrôles écrits par le projet : un test négatif mute une COPIE de fixture déclarée, jamais l'instantané vivant ; un compte publié se recalcule depuis ses lignes ; un contrôle ne rejoue pas les autres — la CI les agrège."
  defect_it_closes: "« Exécuter apf check avant de rendre la main » : un seul passage, sans dire sur quel état du dépôt. Les contrôles qui lisent l'index et ceux qui lisent le commit ne voient pas la même population, et une édition faite après le passage n'était jamais revue."
  # LE CONTRAT D'ENTRÉE D'UN SOUS-AGENT, PAR PROFIL (MCR-003). Le générateur écrivait le même
  # texte à tous les agents — « poser une seule salve de quatre questions » —, critics compris :
  # il contredisait NOT_VALIDATED, et un sous-agent ne peut pas attendre la réponse de l'humain.
  # Chaque profil d'outillage porté par un agent a le sien ; K6 refuse un profil sans contrat.
  agent_entry:
    producer: &entree_producteur
      - "Vérifier que les artefacts d'entrée déclarés par l'activité existent avant de produire quoi que ce soit. Si un input requis manque, retourner `BLOCKED — input manquant` et s'arrêter. Ne jamais reconstruire un input par inférence : produire sur un matériau deviné donne un résultat plausible et invérifiable, ce que la méthode existe pour empêcher."
      - "Si un input est présent mais **sous-spécifié** : s'arrêter et le dire, ne pas choisir. Rendre `BLOCKED — input manquant` en nommant ce qui manque, ou procéder sous hypothèses nommées et étiquetées `UNVALIDATED`, chacune devenant un point de test en aval — jamais une décision produit que l'entrée ne donne pas. Un trou nommé se rattrape ; une décision inventée, personne en aval ne peut la distinguer d'une décision humaine."
      - "Les questions, quatre au plus, sont RENDUES à l'appelant dans le format de retour, chacune avec sa réponse recommandée — jamais posées : un sous-agent ne peut pas attendre la réponse de l'humain. L'appelant les porte en une seule salve (EX2)."
    evidence: *entree_producteur
    orchestrator: *entree_producteur
    evaluator: &entree_juge
      - "Vérifier que l'artefact à juger, son empreinte et les critères sont fournis. Un artefact absent, non livré, illisible, ou dont l'empreinte diffère de celle annoncée rend `NOT_VALIDATED` avec sa raison — TOOL_ACCESS, NON_LIVRÉ, AMBIGU, NON_TENTÉ — et le verdict s'arrête là. Jamais BLOCKED, jamais FAIL, jamais d'hypothèse : un juge qui suppose juge sa supposition."
      - "Ce rôle ne pose aucune question, ni à l'humain ni au producteur. Un critère ambigu rend ce critère `NOT_VALIDATED · AMBIGU`, et la question est nommée au verdict pour l'appelant."
    auditor: *entree_juge
  # LE RAPPORT DE RETOUR (MCR-003). Seul ce rapport atteint l'appelant : ce qui n'y est pas
  # reste dans la tête du sous-agent, c'est-à-dire nulle part.
  return_format:
    intro: "Un sous-agent rend la main par un rapport, et seul ce rapport atteint l'appelant. Il porte, dans cet ordre :"
    items:
      - "**Livrables** — chaque chemin écrit et le commit qui le porte. Un fichier non commité n'est pas rendu."
      - "**Vérifications exécutées** — la commande, sa sortie et son canal : local, CI hébergée, environnement QA, appareil. Un PASS ne vaut que pour son canal."
      - "**NOT RUN** — chaque vérification prévue qui n'a pas tourné, avec sa raison. Jamais omise, jamais PASS."
      - "**Complétude** — complet ou partiel ; un partiel nomme ses réserves."
      - "**Gaps** — ce qui n'a pas pu être fait, chaque arrêt sur un input manquant ou sous-spécifié, et ce qu'il faudrait pour le lever. Un gap nommé est un succès ; un gap comblé en silence ne l'est pas."
      - "**Questions** pour l'appelant, quatre au plus, chacune avec sa réponse recommandée."
      - "**Prochaine action** — une seule, nommée."
    evaluators: "Un rôle sans écriture n'a pas de livrable à chemin : ce qu'il rend — critiques d'un critic, verdict d'un auditeur — EST le livrable, rendu en sortie et déposé tel quel. « Complétude » y devient ce qui a été lu et ce qui ne l'a pas été — pour un auditeur, le plan de couverture et le résultat de chacune de ses unités (MCR-004)."
    defect_it_closes: "Les rapports de retour se terminaient par « tâche terminée » : ce qui n'avait pas tourné n'était pas dit, et un trou comblé en silence se lisait comme un succès (BatiZen, CLAUDE-DESIGN-BRIEF §M.4 ; S0 closeout-record : « hosted_ci: NOT RUN »)."
autopilote:
  contract: >-
    Avant G0, l'humain est AU-DESSUS de la boucle, pas dedans. La tour calcule l'action
    suivante — ouvrir, produire, juger, reprendre, gate — et le harness l'enchaîne sans qu'on
    lui dise « continue ». Les agents valident entre eux : un livrable n'avance qu'avec le
    verdict CONVERGÉ de son critic. L'humain n'est sollicité que pour ce qui lui revient — son
    intention (activités 1 et 2), une décision irréductible, un désaccord que deux tours n'ont
    pas résolu — et il ratifie en G0, en une fois, ce qui a été délégué.
  portee: C1
  demarrage: "Après l'atelier produit et la thèse (activités 1 et 2) : l'intention se recueille avec l'humain, une question à la fois ; tout le reste s'enchaîne. L'activité 0 est automatique et s'enchaîne aussi. En mode décideur (MCR-007), l'intention vient du mandat : rien n'attend l'humain avant le premier point de passage."
  satisfaction:
    regle: "Un livrable est satisfaisant quand son critic n'a rendu aucune critique, ou quand le porteur a trié chacune et que celles qu'il a RETENUES sont traitées dans une version redéclarée après son tri. Le critic ne tranche rien (MCR-004)."
    ligne: "Les critiques déposées se terminent par « SÉVÉRITÉS — BLOCKER: n · MAJOR: n · MINOR: n ». La tour lit chaque CRIT-n dans le fichier déposé et vérifie que le compte correspond : elle ne prend pas la parole de l'orchestrateur."
    depot: "runs/reviews/<WP>/<critic>-r<n>.md — les critiques telles que le critic les a rendues, sans reformulation."
    tri: "Chaque critique entre en file comme décision CRITIQUE — Retenir ou Écarter, avec la recommandation du critic. Le porteur les tranche par grill-me, une question à la fois, à la fin de chaque étape de C1 où il en reste, ou quand il le veut (/factory-tri, Launchpad). L'autopilote poursuit les livrables qui n'attendent pas de tri."
  critics:
    regle: "Le critic d'un livrable est celui que l'activité ou le critère de complétude nomme ; à défaut, celui de la dimension du producteur."
    par_producteur: { product-lead: critic-product, product-designer: critic-design, principal-engineer: critic-engineering, data-steward: "critic(domaine)", quality-engineer: critic-quality }
    sans_critic: [SOC-01, SOC-02]
  delegations:
    - { activite: 3, objet: "Définition du domaine et sources approuvées — revue humaine différée en G0", rayon: 9 }
    - { activite: 8, objet: "Design system de départ : la recommandation (garder) appliquée", depart: true, rayon: 8 }
    - { activite: 11, objet: "Départ d'architecture : la recommandation (garder) appliquée", depart: true, rayon: 8 }
  gels: "Sous autopilote, factory-lead gèle un socle à TITRE PROVISOIRE, sous la délégation du run ; le gel est une décision DÉLÉGUÉE, ratifiée en G0. Avant G0, rien n'est irréversible : c'est précisément ce que G0 décide."
  bloquant: "Trois décisions arrêtent l'autopilote, quel que soit le mode : une DÉCISION que seul l'humain peut prendre (intention, arbitrage de périmètre, critère d'abandon), un input dont l'absence rendrait une erreur irréversible, et le CORPUS RÉEL. Elles entrent en file comme décisions BLOQUANTES."
  ratification:
    regle: "G0 ne se franchit qu'une fois chaque arbitrage et chaque décision bloquante tranchés ; le franchissement par une autorité nommée RATIFIE les décisions déléguées. Une décision déléguée que l'humain tranche autrement rouvre l'activité qui l'a appliquée."
    affiches: 10
    ordre: "Par rayon d'impact décroissant : ce qui invalide le plus d'aval en premier."
  reponses: "Une réponse arrive par la tour (factory_answer_decision) ou par le Launchpad, qui l'écrit en fichier dans runs/decisions/DEC-nn.reponse.yaml : un fichier ajouté, jamais un état réécrit. La tour l'ingère à l'action suivante."
  relance:
    mecanisme: "Le hook Stop du harness refuse la fin de tour tant que l'autopilote a une action à exécuter et qu'il progresse. Il laisse finir quand l'action est un arrêt, un interrogatoire avec l'humain, ou quand rien n'a progressé depuis la dernière relance — une boucle qui tourne à vide est arrêtée, pas relancée."
    max_relances: 200
  mode_decideur:
    contrat: >-
      MCR-007. Le porteur est un DÉCIDEUR, pas l'équipe. Il donne un mandat ; l'équipe d'agents
      cherche, compare, conçoit et prototype sans lui poser de question ; elle ne le sollicite
      qu'aux points de passage, en une salve où chaque décision porte la recommandation de
      l'équipe en premier. Le mode se choisit au démarrage de l'autopilote (mode : decideur) ;
      sans choix, le run reste en atelier, une question à la fois.
    mandat:
      recueil: "À la création du projet, par le Launchpad ou par le premier message du porteur. Chaque ligne entre au Journal d'atelier de WP-01 comme une réponse du porteur : l'équipe ne la repose jamais."
      champs:
        - "l'idée, telle qu'il l'écrit"
        - "l'ambition et l'horizon"
        - "ses ressources : temps, énergie, budget"
        - "les canaux exclus ou imposés"
        - "les personnes clés : rôle, langues, capacité"
        - "la géographie et les langues visées"
        - "les lignes rouges"
    points_de_passage:
      - { id: PP1, nom: Mandat, quand: "à la création du projet", tranche: "l'idée et les contraintes du porteur" }
      - { id: PP2, nom: Options et tests, avant_activite: 8, tranche: "l'option stratégique et le marché de lancement, les budgets des tests de marché, les critiques des étapes C1.1 à C1.3" }
      - { id: PP3, nom: G0, gate: G0, tranche: "le dossier décideur, les critiques restantes, la ratification des délégations" }
    activites:
      "1": "Atelier produit en mode décideur : rédiger le canevas entier depuis le mandat et la recherche documentaire ; chaque bloc que le mandat ne tranche pas devient une HYP-nn ; le récapitulatif se présente au point de passage PP2, pas avant."
      "2": "Thèse en mode décideur : au moins trois options stratégiques mutuellement exclusives — modèle, canal, marché de lancement —, passées aux mêmes filtres pondérés, chacune avec son verdict ; l'option recommandée est appliquée, les autres restent en file avec elle (factory_queue_decision, la recommandée en premier)."
    delegation: "Une décision d'intention qui a des options est appliquée par défaut sur la recommandée, DÉLÉGUÉE, et présentée au point de passage suivant ; tranchée autrement, elle rouvre l'activité qui l'avait appliquée. Restent bloquantes : ce qui ENGAGE le porteur — dépense, publication en son nom, irréversible —, le corpus réel, et une décision sans option."
    salve: "Mode décideur : présenter en UNE salve, dans cet ordre, les décisions engageantes, les choix appliqués par défaut à confirmer, puis les critiques en attente — chacune avec la recommandation de l'équipe en premier et son motif en une ligne. « Ta reco » vaut la recommandation pour toutes. Consigner chaque réponse : factory_answer_decision {id, by, choix}. Puis reprendre la boucle."
    mesure: "Le coût humain du run se compte (P7) : sollicitations du décideur et décisions tranchées avant G0. Cible : trois points de passage."
  controlled_by: K8

web_research:
  contract: "SOURCER, jamais INFÉRER. Un agent qui va lire une source extérieure et rapporte ce qu'elle dit produit un FAIT ; un agent qui produit une affirmation plausible parce qu'elle sonne juste produit une fiction confiante. La méthode interdit le second et a besoin du premier : sans lui, tout ce qui n'est pas connu de l'humain sort en UNVALIDATED, et les activités 3 et 4 ne peuvent pas faire leur travail."
  capability: harness-web-research
  naming: "Le noyau nomme la CAPACITÉ. L'outil qui la satisfait est déclaré par l'adaptateur. Le plugin lui-même ne fait toujours AUCUN appel réseau — c'est l'agent qui en fait, et la distinction tient : un contrôle déterministe ne doit jamais dépendre d'un tiers."
  recevabilite:
    rule: "Une affirmation issue d'une recherche n'est recevable QUE si elle porte les trois : adresse de la source, date de consultation, et citation littérale de ce qui la fonde."
    why: "« J'ai cherché sur Internet » produit une affirmation aussi invérifiable qu'une invention — et plus dangereuse, parce qu'elle est plus confiante. Sans les trois, un tiers ne peut ni rejouer ni contredire : ce n'est pas une source, c'est un souvenir."
    fields: [url, consulted_at, verbatim]
    on_missing: "L'affirmation est rétrogradée en UNVALIDATED et porte un HYP-nn. Elle n'est jamais effacée : ce qu'un agent a cru savoir est une information sur l'agent."
    independence: "Deux sources ne sont indépendantes que si la seconde ne dérive pas de la première. Trois pages qui citent le même communiqué sont UNE source."
  who:
    granted_at: [3, 4, 6, 7, 11, 14]
    scope: ACTIVITÉ
    why_activity_not_role: >-
      La capacité est accordée à des ACTIVITÉS, jamais à des rôles. product-lead porte les
      activités 2, 3, 14, 18, 19 et 20 : lui accorder la recherche par son PROFIL la lui
      donnerait aussi en activité 20, où il rédige le contrat de slice — précisément le cas où
      chercher sert à justifier ce qu'on vient d'écrire. Une restriction d'outillage qui ne
      sait pas distinguer les moments du même rôle n'est pas une restriction.
    granted_for: "Activité 3 — qualification du domaine et des sources approuvées. Activité 4 — recherche utilisateur. Activité 7 — tests de marché : prix et offres des alternatives, communautés où la cible se trouve. Activité 14 — discovery ciblée de la release, commitée avant le périmètre qu'elle détermine. Activité 11 — inventaire des dépendances et des choix structurants. Activité 6 — acquisition du corpus réel : sans accès aux sources approuvées, il ne reste qu'à fabriquer le contenu du produit, ce que la méthode interdit partout ailleurs."
    refused_to: "TOUTE activité évaluée par un critic ou un conformance-auditor, et toute activité de rédaction — spécification, backlog, plan."
    why_refused: "Un évaluateur qui peut aller chercher des faits ira en chercher pour étayer le verdict qu'il a déjà formé ; un rédacteur de spécification, pour justifier ce qu'il vient d'écrire. Une capacité de recherche accordée partout devient une machine à confirmer."
    control: "K6 confronte cette liste aux activités qui la déclarent. Un écart dans un sens comme dans l'autre est un FAIL : une liste annoncée et non recalculée est déjà fausse."
  never: "La recherche ne remplace JAMAIS un input que seul l'humain détient — intention produit, critère d'abandon, arbitrage de périmètre. Chercher sur Internet ce qu'un sponsor doit décider est la même faute que l'inventer, avec une source en plus."
tools_profiles:
  - id: researcher
    writes: true
    reads_web: true
    rule: "Écriture dans la mutation boundary de l'activité en cours, ET lecture de sources extérieures. Toute affirmation qui en découle porte adresse, date et citation littérale — voir web_research.recevabilite. Ce profil n'est JAMAIS attaché à un agent : il est pris le temps d'une activité qui déclare la capacité, et rendu à sa fermeture."
  - id: evaluator
    writes: false
    rule: "Aucun outil d'écriture. La restriction est appliquée par le harness, pas par le texte du prompt — c'est ce qui distingue un contrôle d'une consigne."
  - id: auditor
    writes: false
    executes: ["apf:*"]
    rule: "Lecture, plus exécution des SEULES commandes de contrôle de la méthode — un mandat « exécuter les contrôles K » sans le droit de les lancer était une consigne de les supposer. Aucune écriture : le rapport est rendu en sortie et déposé tel quel par l'orchestrateur, sans reformulation. La commande est restreinte deux fois : par la liste d'outils du harness, et par la garde, qui refuse à un évaluateur toute commande qui n'est pas un appel simple à apf."
  - id: evidence
    writes: true
    rule: "Écriture autorisée, mais confinée à l'EVIDENCE BOUNDARY déclarée à l'ouverture du Run. Une liste d'outils ne sait pas restreindre par chemin : la frontière est tenue par un hook en prévention et par K6 en détection."
  - id: producer
    writes: true
    rule: Écriture dans la mutation boundary de l'activité en cours.
  - id: orchestrator
    writes: true
    rule: "Écriture sur le Run Ledger, les packs de preuves et les décisions de gate. Ne produit aucun artefact produit."
notion_workspace:
  contract: "PROJECTION, jamais source. Ce qu'un gate gèle vit dans Git et se projette ici ; ce qui vit entre les gates — backlog, risques — s'écrit ici et se fige dans Git au gate. Un type d'objet a exactement un domicile, jamais les deux : deux domiciles, c'est la divergence que P4 interdit."
  shape: "Le produit est une LIGNE de projet dans une base de projets que l'organisation possède déjà, et non une page autonome. Un produit gouverné qui n'apparaît pas là où l'organisation regarde ses projets est gouverné à côté d'elle. Étapes et livrables sont des bases RATTACHÉES à cette ligne : c'est ce qui rend l'avancement visible d'un coup d'œil et les livrables parcourables par vue plutôt que par navigation."
  never_blocks: "Une indisponibilité de l'espace de travail ne bloque JAMAIS un GATE. Y adosser un contrôle mettrait un service tiers sur le chemin critique de la gouvernance. Les huit contrôles restent sur Git ; « apf notion status » rapporte, il ne refuse pas."
  may_block_an_activity: "La clause ci-dessus porte sur les gates, PAS sur les activités. L'activité 1 a l'espace de travail pour sortie : connecteur absent, elle rend BLOCKED — input manquant, comme n'importe quel input requis (P5, EX2). Arrêter une activité n'est pas empêcher une décision humaine. Confondre les deux ferait d'une obligation une décoration."
  execution: "Le noyau CALCULE le plan — déterministe, hors ligne, rejouable, donc vérifiable. L'adaptateur l'EXÉCUTE : lui seul détient l'accès. Aucun jeton et aucun appel réseau dans le plugin ni dans l'intégration continue."
  connector:
    capability: harness-notion-connector
    required_operations: [lire une base, créer une ligne, mettre à jour une ligne, créer une base, créer une vue]
    preflight: "Vérifié AVANT la première écriture, jamais pendant. Une instanciation à moitié faite laisse un espace incohérent que le rejeu ne sait pas distinguer d'un espace complet."
    on_absence: "BLOCKED — input manquant. Ne jamais improviser un emplacement, ne jamais produire une arborescence partielle, ne jamais se rabattre sur un export de fichiers."
    naming: "Le noyau nomme la CAPACITÉ. Les outils qui la satisfont sont déclarés par l'adaptateur, à côté des tables classe→modèle et profil→outillage. Un nom d'outil dans le registre serait une dépendance de la méthode à un produit."
  product_identity:
    required_at: Activité 1
    what: "Le nom du produit. Il titre la ligne de projet et se lit dans chaque page ; le changer après coup renomme un espace que des gens ont déjà mis en favori."
    collected_by: "L'activité 1, auprès d'un humain, dans la salve unique de quatre questions au maximum (EX2). Jamais un argument de ligne de commande passé par un opérateur : un produit dont le nom ne vient pas de son activité d'ouverture n'a pas été ouvert par la méthode."
    on_absence: BLOCKED — input manquant. Jamais inventé, jamais dérivé du nom du dépôt.
    recorded_in: SOC-01 — governance/project.yaml
  root_location:
    required_at: Activité 1
    what: "La BASE DE PROJETS de l'organisation, dans laquelle créer la ligne du produit. Le plan calcule la structure, jamais son point d'ancrage : une ligne de projet se crée toujours dans une base qui préexiste et qui ne nous appartient pas."
    shape: "identifiant de source de données. La méthode n'en connaît ni le nom ni le schéma — elle exige seulement une propriété titre et une propriété de statut, et déclare comment elle les remplit."
    on_absence: BLOCKED — input manquant. Jamais deviné.
    recorded_in: SOC-01, section Carte de l'espace de travail
  project_row:
    rationale: "La ligne vit dans une base que l'organisation possède. La méthode y écrit DEUX propriétés et pas une de plus : titre et statut. Toute autre colonne appartient à l'organisation — y écrire ferait de la méthode une seconde autorité sur un schéma qui n'est pas le sien."
    title_from: product_identity.name
    status_property: "la propriété de statut de la base d'accueil, nommée à l'activité 1 avec son emplacement"
    status_mapping:
      - when: aucune gate franchie
        value: le premier statut « en préparation » de la base d'accueil
      - when: G0 franchie
        value: le statut « en cours » de la base d'accueil
      - when: G4 franchie
        value: le statut « terminé » de la base d'accueil
    status_driven_by: "événements de la tour — GATE_CLEARED. Jamais une case cochée à la main : un statut déclaratif est un tableau de suivi, pas un état."
    on_schema_mismatch: "BLOCKED. Si la base d'accueil n'a pas de propriété de statut, la méthode ne la crée pas : modifier le schéma d'une base qui sert à d'autres projets est une décision de l'organisation, pas d'un agent."
    body:
      why: "Le statut de la ligne ne bouge qu'aux gates — trois valeurs pour vingt-six activités. Entre le bootstrap et G0, la ligne reste donc INERTE pendant les cinq étapes de la cadence 1 : qui lit la base de projets de l'organisation voit « en préparation » et ne sait pas si rien n'a commencé ou si tout est presque fini."
      where: "Dans le CORPS de la page de la ligne, jamais dans une propriété. Les colonnes appartiennent à l'organisation et la méthode n'en écrit que deux ; le corps de la page est celui de la page, et la méthode y pose déjà ses bases. Y écrire l'avancement ne fait pas de la méthode une seconde autorité sur un schéma qui n'est pas le sien."
      carries: [étape courante, avancement de chaque étape, gates franchies et gates ouvertes, commit de la projection]
      refreshed_at: "à la fermeture de chaque activité, et à chaque GATE_CLEARED. Calculé depuis le journal de la tour — jamais saisi."
      accountable: factory-lead
  page_body:
    mode: miroir complet
    rule: "Le corps de la page d'une ligne reproduit intégralement le contenu du fichier Git, front-matter retiré. Le comité lit le livrable entier sans ouvrir un dépôt — c'est la raison d'être de l'espace."
    banner: "Chaque page s'ouvre sur « Page GÉNÉRÉE depuis Git. Toute édition sera écrasée à la prochaine synchronisation. Commentez plutôt qu'éditer. »"
    comments: "Un commentaire est une ENTRÉE de l'activité suivante, jamais le livrable. C'est ce qui permet à la page d'être écrasable sans rien perdre."
  execution_order:
    rule: "Un nœud dont la clé figure déjà dans la carte est LAISSÉ INTACT, jamais recréé. C'est ce qui rend le rejeu idempotent, comme le bootstrap Git."
    phases:
      - id: 1
        name: ligne de projet
        note: créée dans la base d'accueil fournie ; sans elle, BLOCKED
      - id: 2
        name: bases
        note: créées dans la page de la ligne de projet, avant toute ligne
      - id: 3
        name: lignes d'étapes
        note: avant les livrables, car un livrable référence son étape
      - id: 4
        name: lignes de livrables
        note: seulement celles dont ni la base ni les fichiers ne sont paramétrés
      - id: 5
        name: vues
        note: dernières — une vue filtre des lignes qui doivent exister
  navigation:
    principle: "Aucune arborescence. L'ÉTAPE est une constante de la méthode, la RELEASE et la SLICE sont des variables du projet ; une variable dans une arborescence rend un espace illisible en six mois. Les étapes sont donc des LIGNES et non des pages, et l'on parcourt les livrables par VUE — filtrée, groupée, triée — plutôt qu'en descendant des dossiers."
    fixed_nodes: 0
    fixed_nodes_definition: "dossiers et pages de navigation. Zéro par construction : tout est ligne ou vue. Recalculé par « apf notion plan » et confronté ici par K6 — un chiffre annoncé et non recalculé est déjà faux."
    browse: "les vues de la base des livrables sont le seul chemin d'accès : par étape, par gate, par propriétaire, et ce qui bloque."
    growth: "aucune — le nombre de bases ne bouge pas, quel que soit le nombre de releases, de slices et de versions"
  property_types:
    contract: "Vocabulaire CLOS. Une propriété déclare son type, et le plan est confronté à ce type : sans cela, « selection » n'est qu'un mot et rien n'empêche d'y écrire une phrase ou une valeur composite. Les deux se sont produits."
    vocabulary:
      titre: "exactement une par base — c'est elle qui nomme la ligne"
      texte: valeur libre
      nombre: numérique
      date: date ou intervalle
      case: booléen
      selection: "une valeur ATOMIQUE parmi un ensemble. Une valeur composite est un type faux, pas une donnée exotique."
      selection multiple: "zéro à n valeurs. Une étape C3 sort par K1 ET G3 : la déclarer en sélection simple a fait refuser l'écriture par le connecteur."
      relation: "vers une base déclarée, nommée après le type"
  databases:
    - id: etapes
      role: projection
      writes: Git vers espace de travail
      source: steps
      parent: ligne de projet
      properties:
        identifiant: titre
        libelle: texte
        cadence: selection
        ordre: nombre
        activites: texte
        gate_de_sortie: selection multiple
        statut: selection
        avancement: texte
      status_values: [Non commencée, En cours, Terminée]
      status_driven_by: "événements de la tour — WP_DECLARED, GATE_CLEARED. Une étape est terminée quand tous ses livrables le sont, jamais parce qu'on l'a cochée."
      views: [par cadence, avancement]
      rationale: "Les treize étapes sont la colonne vertébrale de la méthode. En lignes, elles portent un statut et se filtrent ; en pages, elles ne portaient rien."
    - id: livrables
      role: projection
      writes: Git vers espace de travail
      source: work_products
      parent: ligne de projet
      properties:
        identifiant: titre
        nom: texte
        cadence: selection
        etape: relation etapes
        activite: texte
        categorie: selection
        controle_en: selection
        cycle_de_vie: texte
        responsible_accountable: texte
        statut: selection
        critere_de_completude: texte
        chemin_git: texte
        commit: texte
      status_values: [À produire, En cours, Produit, Gelé au gate]
      status_driven_by: "événements de la tour — WP_DECLARED, GATE_CLEARED. Jamais une case cochée à la main : un statut déclaratif est un tableau de suivi, pas un état."
      views: [par étape, par gate, par propriétaire, ce qui bloque]
    - id: squelette
      role: projection
      writes: Git vers espace de travail
      source: entités STG et leurs liens de release
      parent: ligne de projet
      properties:
        identifiant: titre
        libelle: texte
        ordre: nombre
        introduces: texte
        enriches: texte
        depends_on: texte
      views: [ordre du parcours, par release]
      rationale: "l'objet que le métier comprend le mieux, et la vue qui rend K1 visuel"
    - id: gates
      role: projection
      writes: Git vers espace de travail
      grain: "une ligne par PASSAGE, pas par gate — K1 et G3 se rejouent à chaque slice"
      parent: ligne de projet
      properties:
        passage: titre
        gate: selection
        instance: texte
        decision: selection
        autorite_nommee: texte
        date: date
        commit: texte
        pack_complet: case
    - id: journal
      role: projection
      writes: Git vers espace de travail, append-only
      source: runs/ledger.ndjson
      parent: ligne de projet
      properties:
        horodatage: titre
        evenement: selection
        activite: texte
        acteur: texte
        livrable: texte
        chemin: texte
        commit: texte
      rationale: la preuve de ce qui est passé par la tour de contrôle
    - id: backlog
      role: natif
      writes: espace de travail vers Git, figé au gate
      grain: EPC · STO · AC
      parent: ligne de projet
      properties:
        identifiant: titre
        type: selection
        libelle: texte
        parent: texte
        etape: relation etapes
        critere_acceptation: texte
        statut: selection
        priorite: selection
      frozen_at: "G1 — export commité, contrôlé par K3. Sans ce gel, la chaîne de traçabilité ne serait plus vérifiable hors ligne et la CI cesserait d'être la preuve."
    - id: risques
      role: natif
      writes: espace de travail vers Git, figé au gate
      grain: HYP-nn avec critère de falsification, point de test, porteur
      parent: ligne de projet
      properties:
        identifiant: titre
        hypothese: texte
        critere_de_falsification: texte
        point_de_test: texte
        porteur: texte
        statut: selection
        impact: selection
      frozen_at: G0 puis G1
  templates:
    rule: "Le template de page d'un livrable a POUR TITRES DE SECTION son plan de contenu au registre, la règle de chaque section en légende, et l'extrait du registre en exemple quand il existe. Un template dessiné à la main serait la première projection non générée du système : il divergerait au troisième livrable."
    source: "work_products.sections, .completion et .specimen"
  instantiation:
    at: Activité 1 — bootstrap
    creates: ligne de projet, bases rattachées, lignes d'étapes, lignes des livrables à chemin NON paramétré, et vues
    defers: les livrables à chemin paramétré, matérialisés à l'existence de la release, de la slice ou de la version
    rationale: "Même règle que le bootstrap Git : un chemin paramétré ne se matérialise pas à vide. Des lignes fantômes préempteraient des décisions que G0 n'a pas prises."
    idempotent: Rejoué, il complète et n'écrase rien.
  front_matter:
    contract: "Un livrable produit porte un front-matter, et c'est lui qui le rend PROJETABLE. Sans lui, le fichier existe, il est déclaré à la tour, et il reste invisible à « apf notion page », à « apf notion link » et au rapport de liaison — sans qu'aucun message ne dise pourquoi."
    required:
      work_product: "identifiant du livrable — WP-nn. C'est par lui que la projection retrouve le fichier."
    optional:
      id: "identifiant d'entité, pour un livrable qui EST une entité tracée — release, étape de squelette, story."
      notion: "adresse de la ligne dans l'espace de travail. Écrite par « apf notion link », jamais à la main."
    rationale: "Ce contrat était implicite dans le code et n'était déclaré nulle part : un producteur ne pouvait pas le connaître, et un livrable conforme au registre restait non projetable."

  pull_projection:
    id: launchpad
    contract: "TIRÉE, jamais poussée. Le launchpad lit le dépôt à chaque commit de la branche par défaut et recalcule tout — étapes, livrables, gates, journal, contrôles — avec les règles de ce registre. L'agent n'écrit qu'une fois, dans Git ; il n'y a ni page à relier, ni projection à dater : la page EST le commit."
    defect_it_closes: "Une projection POUSSÉE exige cinq opérations de la tour — link, sync, where, drift, status — pour rester honnête, et la dérive arrêtait l'activité 1 dès le bootstrap : le premier livrable existait avant qu'aucune page puisse le porter. Le premier produit gouverné n'a jamais pu ouvrir son activité 1 sur l'espace de travail poussé."
    declared_in: "SOC-01 — governance/project.yaml → workspace_kind: launchpad. Recueilli au lancement, comme le nom : un humain a saisi les deux."
    drift: "Calculée par la plateforme, affichée avec le commit ingéré. La comparaison hors ligne « apf notion drift » rend ok et LE DIT — un contrôle qui se tait est indistinguable d'un contrôle qui ne marche pas."
    link_and_sync: "Sans objet, et rapportés tels quels : relier ou dater une projection tirée serait une seconde vérité sur sa fraîcheur."
    never_blocks: "Même clause que l'espace poussé : une indisponibilité de la plateforme n'arrête jamais une gate, et n'arrête plus une activité — la projection ne dépend plus d'un acte de l'agent."
    layout: launchpad/

  link:
    shape: "pointeur bidirectionnel — le front-matter du livrable porte « notion », la ligne de l'espace de travail porte le chemin Git et le commit"
    recorded_at: front-matter de l'artefact, et carte des identifiants dans SOC-01
    verified_by: "apf notion status — rapport, jamais refus"
    rationale: "Un livrable lisible d'un seul côté n'est relié à rien : depuis l'espace de travail on ne retrouve pas la preuve, depuis Git on ne retrouve pas le lecteur."

observability:
  contract: >-
    La TRACE est le compte rendu de ce que les agents ont réellement FAIT ; le Run Ledger
    reste le compte rendu de ce qui a été DÉCIDÉ. Deux objets, deux durées de vie : le
    ledger est versionné et opposable, la trace est locale, éphémère et remplaçable. La
    trace n'entre dans aucun contrôle K et ne franchit aucune gate — l'y adosser ferait
    d'un fichier non versionné une preuve, ce que P4 interdit.
  defect_it_closes: >-
    Entre deux événements du Run Ledger, la méthode ne voyait RIEN : ni les outils appelés,
    ni les fichiers touchés, ni le modèle réellement servi, ni les refus de la garde, ni le
    coût. Un run se jugeait donc sur ses seules déclarations, c'est-à-dire sur la parole de
    l'agent — exactement ce que la méthode existe pour ne pas avoir à croire. R1 et R3
    parlaient de classes de capacité que personne ne pouvait confronter au modèle servi.
  emitted_by: >-
    Les hooks de cycle de vie du harness, seuls à voir un appel d'outil, et la tour de
    contrôle pour ses propres opérations. Le plugin n'instrumente aucun modèle et
    n'intercepte aucun réseau.
  events:
    - id: session_start
      means: Une session s'ouvre sur le dépôt — démarrage, reprise ou après compaction.
    - id: prompt
      means: Une instruction humaine est soumise. C'est l'origine d'un tour, donc de tout ce qui suit.
    - id: tool
      means: "Un appel d'outil REPLIÉ — la paire avant/après rendue en une ligne, avec sa durée et son issue."
    - id: guard
      means: "Un verdict de la garde : autorisé, question remontée à l'humain, ou refus motivé."
    - id: subagent
      means: Un sous-agent s'achève. C'est la seule trace qu'un rôle a été convoqué.
    - id: tower
      means: "Une opération de la tour — ouverture, déclaration, gate. C'est la couture entre la trace et le ledger."
    - id: turn_end
      means: "Fin d'un tour d'assistant, avec le modèle RÉELLEMENT servi et les tokens consommés."
    - id: notice
      means: "Un fait du poste lui-même — appairage, jeton renouvelé. Jamais un fait du produit."
  local_file: runs/trace.ndjson
  versioned: false
  versioned_rationale: >-
    Versionner la trace ferait grossir le dépôt d'un flux que personne ne relit, et la
    rendrait citable comme preuve. Elle est ignorée par Git, comme un journal de build.
  session_brief: >-
    À l'ouverture d'une session — démarrage, reprise, après compaction —, le hook rend au
    harness un RÉSUMÉ de l'état gouverné : activité ouverte, livrables qui lui manquent,
    dernière décision de gate et dernière direction humaine, prochaine action calculée,
    réserves ouvertes. Il est lu dans runs/tower.json, jamais dans la trace, et ne dit que ce
    que la tour sait : les BLOCKER vivent dans les verdicts de revue, que la tour ne tient
    pas, et le résumé ne prétend donc pas les compter. Une session qui reprend ne reconstruit
    plus l'état depuis sa mémoire. Rien à résumer, ou un résumé en échec : la session s'ouvre
    sans lui.
  fail_open: >-
    Une trace en échec — disque plein, réseau absent, poste non appairé — n'arrête JAMAIS
    une session ni une écriture. La garde refuse à sûreté INVERSE parce qu'elle DÉCIDE ; la
    trace OBSERVE, et un observateur qui bloque ce qu'il observe est un défaut, pas un
    contrôle.
  push:
    to: "le launchpad — notion_workspace.pull_projection.id"
    contract: >-
      POUSSÉE, et c'est l'exception assumée à la projection tirée. L'état de référence reste
      TIRÉ du commit ; la trace est un FLUX, et un flux ne se tire pas depuis un commit qui
      n'existe pas encore. Les deux ne se contredisent jamais : la trace disparue, l'état
      gouverné est intact, parce qu'il n'a jamais été calculé à partir d'elle.
    authentication:
      mechanism: device flow
      what: >-
        Le poste s'appaire UNE fois : le CLI affiche un code, l'humain l'approuve dans le
        launchpad où il est déjà authentifié, le serveur scelle un jeton de poste. Aucun
        secret n'est saisi à la main, aucun fichier de configuration n'est édité, et le
        dépôt produit n'en porte aucune trace.
      scope: >-
        ÉCRITURE DE TRACE SEULEMENT, sur les projets dont l'humain répond déjà. Le jeton ne
        lit pas le miroir, n'écrit aucun livrable, ne déclare rien à la tour et ne franchit
        aucune gate.
      revocation: "Dans le launchpad, poste par poste, avec expiration par défaut."
      rationale: >-
        Un secret partagé déposé dans le dépôt produit aurait été plus simple et strictement
        pire : il se copie, il ne s'expire pas, et personne ne sait quel poste l'a employé.

project_controls:
  contract: >-
    Les huit contrôles K sont la liste CLOSE de la méthode : ils disent si la méthode est tenue,
    pas si le PRODUIT tient ses propres règles. Celles-là — fonctions de vérification de
    l'architecture, invariants du produit, règles de données, interdits de formulation — vivent
    dans le projet, au manifeste controles/controles.yaml, et la méthode leur donne un cadre.
  rules:
    - "Chaque contrôle PC-nn cite sa SOURCE — l'ADR, le terme, le critère ou la décision qui l'impose — et sa COMMANDE, une liste d'arguments, jamais une ligne de shell."
    - "Chaque contrôle porte au moins un TEST NÉGATIF : une mutation appliquée à une COPIE d'une fixture déclarée doit le faire échouer, et la fixture intacte doit passer. Un contrôle qu'on n'a jamais vu échouer ne prouve pas qu'il le peut ; une fixture modifiée en place est une réparation à refaire à chaque version."
    - "« apf check » les exécute sur le poste et en intégration continue ; la tour les exécute avant de déclarer une gate prête — une gate n'est pas prête sur un produit qui viole ses propres règles. Le résultat est consigné dans runs/controles-projet.json."
    - "Le Launchpad ne les exécute JAMAIS : il rejoue les contrôles de méthode sur un instantané du dépôt, et y exécuter le code d'un projet ferait tourner du code tiers sur la plateforme. Il vérifie la forme du manifeste (K7) et affiche le dernier résultat consigné."
  implemented_by: lib/controles-projet.mjs
  written_at: "Activité 11 — fonctions de vérification de l'architecture ; activité 21 — invariants du produit, à chaque slice"

governance_budget:
  contract: >-
    Le budget de gouvernance d'un projet, mesuré et affiché par le Launchpad à chaque
    synchronisation (lib/cout.mjs), jamais saisi. Deux mesures : les jours entre l'ouverture du
    run et la première ouverture de l'activité de construction, et la part des artefacts de
    méthode (product/, runs/) dans les octets du dépôt hors outillage. Un dépassement est une
    ALERTE au Product Owner, jamais un blocage.
  premier_code:
    activite: Construction et tests
  jours_avant_premier_code: 15
  part_gouvernance_max: 0.8
  rationale: >-
    Seuils PROVISOIRES, tirés d'un seul run : BatiZen a mis vingt jours avant la première ligne
    de code et l'a jugé trop lent, au point d'écrire « le produit tire la factory, la factory ne
    retarde pas le produit ». Quinze jours laissent C1 et une première release ; au-delà de
    80 % d'octets de gouvernance une fois le code commencé, la méthode pèse plus que ce
    qu'elle protège. À recalibrer sur les runs suivants — un seuil non recalibré au bout de
    trois runs est retiré (P6).

method_evolution:
  contract: >-
    La méthode évolue par PREUVE, jamais par conviction. Trois niveaux, et on ne saute pas de
    marche : un constat ne devient pas une règle parce qu'il est convaincant, ni parce qu'il se
    répète dans un seul run. C'est le chaînon qui manquait entre P6 (une règle sans contrôle
    est retirée) et la MCR (seule voie de modification) — repris du run BatiZen, où chaque
    invariant porte le défaut prouvé qui l'a imposé et où « rien ne se bâtit sur une seule
    observation ».
  levels:
    - id: OBSERVATION
      definition: "Un constat d'un run, daté et prouvé — ce qui a manqué, coûté ou trompé — consigné par factory_record_observation, ou d'office par une direction humaine d'impact MÉTHODE."
      consequence: "Aucun effet sur la méthode. Remonte au Launchpad avec les constats des autres projets, où les récurrences se voient."
    - id: PROPOSÉE
      definition: "Une MCR écrite — constat, décision, ADR avec l'alternative rejetée et ce qu'elle exclut —, qui cite les observations dont elle procède."
      consequence: "Applicable aux projets qui l'adoptent sur décision de leur Product Owner, consignée par factory_record_direction. Ne lie aucun autre projet."
    - id: ADOPTÉE
      definition: "Une MCR entrée au registre : activités, livrables, contrôles, tests. Elle porte son ORIGINE — les observations et les runs qui l'ont prouvée."
      consequence: "Lie tous les projets, à la numérotation qu'elle fixe. Soumise à P6 : une règle adoptée sans contrôle déterministe dans les 90 jours est retirée."
  rule: "Une MCR ADOPTÉE sans origine est refusée par K2 ; un document de MCR absent du registre aussi. Un agent n'adopte rien : il observe, il propose ; l'adoption est une décision humaine."
  changes:
    - id: MCR-001
      title: Test d'expérience par utilisateurs synthétiques aveugles (SUX), avant G0
      statut: ADOPTÉE
      numerotation: 6
      document: core/mcr/MCR-001-sux-avant-g0.md
      on: '2026-10-09'
      origine:
        - "Run TennisCoach, pré-G0, 8/8 contrôles verts : la seule revue par persona était postérieure à G0 et connaissait l'intention ; le squelette, la navigation et le glossaire se figeaient sans avoir été compris par un utilisateur ; 13 termes sur 22 restaient « à tester en entretien »."
        - "Run BatiZen Factory Run 1 : protocole SUX exécuté (SUX-01), validateurs EE1–EE7 et tests négatifs."
    - id: MCR-002
      title: Autopilote de la cadence C1 — l'humain au-dessus de la boucle avant G0
      statut: ADOPTÉE
      document: core/mcr/MCR-002-autopilote-c1.md
      on: '2026-10-09'
      origine:
        - "Direction du porteur de la méthode, 9 octobre 2026, sur son usage des runs : « je voulais que la phase avant G0 soit autonome et boucle jusqu'à ce que ce soit satisfaisant entre les agents, mais mes interventions sont à chaque étape »."
        - "Constat de l'audit de la méthode, même jour : trois natures d'intervention confondues — CONTINUATION (aucun enchaînement d'une activité à la suivante), VALIDATION (boucle producteur ↔ critic décrite au registre, exécutée par rien) et DÉCISION ; seule la troisième revient à l'humain."
    - id: MCR-003
      title: "Le métier des sous-agents : contrat d'entrée par profil, rapport de retour, règles du run BatiZen 1"
      statut: ADOPTÉE
      document: core/mcr/MCR-003-metier-des-sous-agents.md
      on: '2026-10-09'
      origine:
        - "Run BatiZen Factory Run 1 — factory/run-001/aligned-design/pass-01/CLAUDE-DESIGN-BRIEF.md (l.8, §C.0, §C.4, §M.3, §M.4), aligned-design/checkpoints/DC-05.1/validation-result.yaml (PO_GATE), aligned-design/forbidden-claims.yaml (canary), slice-contracts/S0/evidence/closeout-record.yaml, product-state/METHODOLOGY-CORRECTION.yaml, product-state/FABLE-ADJUDICATION.yaml (ref 8), acceptance/SUX-01/run/SUX-01-EXECUTION-MANIFEST.yaml (EXCLUDED_FROM_ANALYSIS)."
        - "BatiZen factory-os — factory/factory-os/invariants.yaml (FI-04, FI-04.6, validation_events.each_event_binds), methodology/experience-evidence/AXR-PROTOCOL.md (§1, §2, §6, §7), EVIDENCE-MODEL.yaml (AXR.cannot_prove)."
        - "Run TennisCoach — product/C1.4-socle/experience/sux/resultats/SUX-03/synthese.md, section Limites : apostrophe qui fait échouer la commande du téléphone, clip de test daté 13:40, préparation de S05 échouée sur un sélecteur du harnais ; aucun script de harnais versionné dans le dépôt (commit ae9fcd0)."

    - id: MCR-004
      title: Critics allégés, sur le modèle unique de l'adaptateur ; le porteur tranche chaque critique
      statut: ADOPTÉE
      document: core/mcr/MCR-004-critics-allegees-et-tri-humain.md
      on: '2026-10-10'
      origine:
        - "Direction du porteur de la méthode, 10 octobre 2026 : les critics consomment trop de contexte et de temps ; aucun agent ne reste sur le modèle le plus coûteux ; le critique pose des critiques, c'est le porteur qui juge de leur pertinence, par grill-me."
        - "Constat mesuré le même jour : les cinq critics étaient les seuls agents sur le modèle le plus coûteux de l'adaptateur, en effort élevé, et les plus lourds des fichiers d'agents ; leur contrat exigeait une revue exhaustive."
    - id: MCR-005
      title: "Tests de marché avant le socle, et une thèse au standard du New Business Venturing"
      statut: ADOPTÉE
      numerotation: 7
      document: core/mcr/MCR-005-tests-de-marche-avant-le-socle.md
      on: '2026-10-12'
      origine:
        - "Direction du porteur de la méthode, 12 octobre 2026 : un G0 testé sur le marché, pertinent, qui gagne de l'argent ; appliquer au pack G0 les principes du New Business Venturing d'INSEAD (workbook de juillet 2023)."
        - "Constat de l'analyse d'écart du même jour : avant G0, la méthode construit le Design System, le socle exécutable et l'architecture (activités 7 à 10 de la numérotation 6) sans qu'aucune personne réelle n'ait agi ni payé ; les hypothèses critiques pouvaient rester UNVALIDATED jusqu'au pilote, après G0 ; le pack de G0 ne portait aucune preuve de marché."
    - id: MCR-006
      title: "Deux familles d'acteurs : les clients externes et les opérateurs internes"
      statut: ADOPTÉE
      document: core/mcr/MCR-006-clients-et-operateurs.md
      on: '2026-10-13'
      origine:
