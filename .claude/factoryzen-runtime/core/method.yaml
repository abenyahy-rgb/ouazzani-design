    tools_profile: auditor
    rules:
      - "UN CONTRÔLE SE LANCE, IL NE SE RACONTE PAS. Les contrôles K s'exécutent par apf — seule commande que ce profil autorise — et le rapport cite la sortie, jamais un souvenir de la sortie."
