    capabilities_note: "L'agent utilisateur pilote le VRAI socle déployé, une capture par action : une session racontée n'est pas une preuve."
    mode: "SYNTHETIC · SUX — test AVEUGLE, protocole repris du run BatiZen sans affaiblissement. Cinq rôles séparés : l'orchestrateur (quality-engineer) prépare et lance ; l'agent utilisateur, en contexte FRAIS, ne reçoit que son persona, sa mission et le point d'entrée du socle DÉPLOYÉ ; l'observateur annote une session, à l'aveugle d'abord ; le chercheur agrège les patterns, sans gravité ni recommandation ; le triage (factory-lead) classe et route. Rien ne revient à un agent utilisateur."
    entry: "Socle exécutable DÉPLOYÉ et figé — commit et sha256 du build connus (WP-11) ; glossaire et navigation (WP-09) ; squelette (WP-05) ; personas PER-nn et verbatims (WP-04). Sans socle déployé : BLOCKED, jamais un test sur un fichier local."
    task: "Écrire le protocole et le plan de campagne AVANT toute session : personas en fiches de faits de vie tirées des PER-nn et de leurs verbatims, rendues en prose ; missions dites avec les mots de l'utilisateur, avec leur arrêt naturel ; liste fermée du vocabulaire interne construite depuis WP-09 (termes TRM-nn, écrans) et WP-05 (étapes). Écrire le manifeste de pare-feu haché AVANT chaque session. Lancer les sessions, une par persona × mission, en contexte frais ; annoter (passe aveugle O1 figée, puis O2) ; agréger les patterns (R1 figée, puis R2) ; trier et ROUTER chaque constat vers WP-05, WP-09 ou WP-11 avant le gel."
    verification: "LE TEST PORTE SUR LA STRUCTURE : trouver son chemin, comprendre les mots, réussir les parcours d'argent et de droits — payer, changer d'avis, arrêter, faire une pause. Le contenu pédagogique est hors champ ; une session qui bute sur un champ ABSENT du corpus enregistre un ARRÊT ATTENDU, pas un défaut. Ni persona ni mission ne contient un mot de l'interface (filtre déterministe sur la liste fermée). Observations immuables, liées au sha256 du socle testé ; une correction produit un NOUVEAU candidat, et la régression tourne sur lui, avec les MÊMES personas et missions. Aucun score ni seuil tant qu'un run ne les a pas fixés sur preuve. Toujours « N sessions synthétiques », jamais « N utilisateurs » ; les sessions sur le même modèle sont déclarées CORRÉLÉES. Une revue experte qui connaît l'intention présentée comme ce test est un BLOCKER. K7 rejoue SUX1 à SUX6 sur les octets de la campagne."
    exit: "Campagne SUX commitée : protocole antérieur aux sessions, socle haché, résultats bruts, annotations, patterns, triage ; chaque constat routé vers WP-05, WP-09 ou WP-11 et traité AVANT le gel — un terme non compris retourne à WP-09, une étape introuvable à WP-05, un parcours d'argent ou de droits raté à WP-11. Un candidat corrigé est re-testé."
