  - id: 18
    cadence: C2
    step: C2.3
    name: Validation utilisateurs et convergence
    mode: >-
      AUTONOME PAR DÉFAUT, EN QUATRE PREUVES ÉTIQUETÉES, jamais confondues. (1) Revue
      experte — SYNTHETIC · AXR : critic(product), qui n'a pas conçu le prototype mais CONNAÎT
      l'intention, le parcourt dans la posture de chaque persona PER-nn, tâche par tâche, sur
      la version figée ; elle trouve des défauts de conformité et de conception, elle
      n'établit aucun fait sur un utilisateur. (2) Test aveugle — SYNTHETIC · SUX : campagne
      d'utilisateurs synthétiques qui IGNORENT l'intention, sur le prototype de release figé,
      même protocole qu'avant G0 (activité 12) — pare-feu, manifeste haché, liste fermée,
      interaction réelle, sessions corrélées, aucun seuil. (3) Confrontation DOCUMENTARY :
      chaque choix de conception est confronté aux comportements documentés en WP-04 et dans
      la recherche de release, verbatims cités. (4) Mesure en production : une hypothèse de
      COMPORTEMENT que seule l'observation tranche n'est pas déclarée validée ; elle reçoit
      sa mesure — métrique, événement instrumenté par la release, seuil, décision prise si le
      seuil n'est pas atteint — et devient EMPIRICAL quand les usages réels la tranchent. Un
      test avec de vrais participants s'ajoute s'il en existe ; il n'est jamais requis.
    entry: "Prototype QA-clean et figé par commit, déployé ; personas PER-nn documentés (WP-04) ; participants réels seulement s'il en existe, explicitement identifiés."
    task: "Écrire le protocole AVANT le test ; figer la version testée ; conduire la revue experte AXR par persona, PUIS la campagne SUX aveugle sur la même version figée, et la confrontation documentaire ; traiter les résultats — une correction produit un nouveau candidat, et la régression SUX rejoue les mêmes personas et missions sur lui — ; stabiliser le périmètre ; donner à chaque hypothèse de comportement non tranchée sa mesure en production."
