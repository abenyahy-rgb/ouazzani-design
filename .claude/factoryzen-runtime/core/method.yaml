  - id: conformance-auditor
    capability_class: INTERMÉDIAIRE
    activities: 17, 20, 22, 23, K1
    mandate: "Exécuter et interpréter les huit contrôles déterministes ; vérifier la subordination des baselines et la conformité design/code."
    write_boundary: Son rapport de conformité, ses diffs visuels, les résultats des contrôles K.
    separation_of_duties: "LECTURE SEULE sur le prototype et sur toutes les baselines. Un écart socle est un BLOCKER, jamais un delta autorisable au niveau release."
