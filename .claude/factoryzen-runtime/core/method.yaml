        Décrire le contexte d'un existant qui n'existe pas n'est pas de la rigueur, c'est du
        remplissage — et un remplissage exigé finit toujours par être rempli de plausible.
      when_false: >-
        SANS OBJET, consigné comme tel avec le fait qui le tranche. Les contraintes du
        produit neuf se déclarent là où elles naissent : la stack en WP-13, le socle
        technique en WP-12, le corpus en WP-06.

  - id: WP-02
    name: Thèse produit, outcomes et hypothèses critiques
    category: dec
    cadence: C1
    step: C1.2
    activity: "2"
    controlled_at: G0
    baseline: produit
    lifecycle: vivant sous contrôle
    responsible_accountable: product-lead / Product Owner
    purpose: "L'argument stratégique du produit, en un seul endroit : ce qu'on croit, ce qui doit bouger et chiffré, et ce qui reste à vérifier. Les trois se répondaient sans jamais être lus ensemble — un outcome sans thèse est un chiffre orphelin, une hypothèse sans outcome ne se teste contre rien."
    sections:
      - title: Problème
        rule: de qui · comment on le sait · ce qu'ils font aujourd'hui · ce que ça leur coûte
      - title: Cible
        rule: une personne descriptible, pas un segment. Combien. Comment on l'atteint. Le segment qui paie le plus, nommé, avec ce qu'il paie aujourd'hui pour le substitut
      - title: Proposition de valeur
        rule: ce qui change le lendemain · ce que la personne arrête de faire
      - title: Alternative et statu quo
        rule: ce qui se passe si on ne fait rien · qui d'autre résout ça · pourquoi celle-ci gagne
      - title: Grille concurrentielle
        rule: "directe · indirecte · future · le statu quo, toujours présent ; trois à cinq dimensions qui comptent pour la cible ; chaque case avec sa source et la qualité de sa preuve ; là où le produit gagne, là où il perd"
      - title: Modèles économiques alternatifs
        rule: "deux modèles écrits avant de retenir le principal — qui paie, pour quoi, comment ; pourquoi le principal est retenu, et ce qui ferait basculer vers un autre. Le marché de lancement se choisit de même : pays, ville et segment candidats passés aux mêmes filtres pondérés — volonté de payer et prix du substitut, taille du segment, langue et capacité des personnes clés, réglementation, coût d'acquisition, concurrence — ; le retenu, la vague suivante, ce qui est écarté et pourquoi (MCR-007)"
      - title: Évaluation du modèle économique
        rule: "les sept forces du modèle — coûts de changement, revenus récurrents, encaisser avant de dépenser, structure de coûts, d'autres font le travail, scalabilité, protection — chacune faible · moyenne · forte avec son motif ; la force de la proposition de valeur : douleur, fréquence, urgence, volonté de payer, chacune sourcée"
      - title: Économie unitaire
        rule: "revenu et coût par client, marge de contribution, attrition, valeur vie client calculée, coût d'acquisition tiré des tests de marché, LTV / CAC et délai de récupération calculés ; chaque chiffre avec son origine — porte le format « economie-unitaire »"
      - title: Critère d'abandon
        rule: quel résultat ferait renoncer, qui le prononce, à quelle date on regarde
      - title: Journal d'interrogatoire
        rule: branches tranchées, branches basculées en UNVALIDATED
      - title: OUT-nn — énoncé
      - title: Nombre suivi
      - title: Valeur actuelle
        rule: si inconnue, c'est la première mesure à faire
      - title: Valeur cible et échéance
      - title: Méthode de mesure et source de donnée
      - title: HYP-nn — énoncé
      - title: Trace vers OUT
      - title: Critère de falsification
        rule: "écrit au futur observable : « si l'on observe X, c'est faux »"
      - title: Étiquette
        rule: EMPIRICAL · DOCUMENTARY · SYNTHETIC · UNVALIDATED
      - title: Point de test et porteur
        rule: obligatoires pour toute UNVALIDATED
    completion: "La thèse tient sans le produit : chaque claim matériel porte source et niveau d'evidence. Chaque outcome est mesurable avec ce qui existe aujourd'hui, sans rien construire — un outcome non instrumentable est rejeté, pas reformulé. Chaque hypothèse critique est tranchée avec motif, ou nommée HYP-nn étiquetée UNVALIDATED avec son critère de falsification et son point de test. La concurrence est typée et le statu quo y figure ; deux modèles économiques alternatifs sont écrits ; le format « economie-unitaire » est vérifié."
    specimen: |-
      Problème — Un conducteur de travaux suivant 3 à 8 chantiers
      reconstitue l'avancement par téléphone chaque matin.
        source : 11 entretiens, mars 2026  ·  FAIT
        coût observé : 4 à 6 h/semaine  ·  FAIT
        généralisable au segment ?  ·  UNVALIDATED → HYP-03
    base: "C1.2-strategie/strategy/"
    files:
      - product-thesis.md
      - outcomes.md
      - assumptions.md
  - id: WP-03
    name: Profil de domaine, sources approuvées et recevabilité
