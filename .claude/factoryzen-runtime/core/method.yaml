  harness_native:
    - id: harness-design-skills
      note: "Canvas d'artboards et skills de conception fournis par le harness. Natifs, donc hors porte d'adoption — mais nommés, pour que l'obligation ne cite pas une périphrase. Ils ne portent AUCUN plancher de qualité : c'est ce qui a laissé passer un socle conforme et laid. Le plancher est porté par la capacité impeccable, et ces natifs ne sont plus que le support d'exécution."
    - id: harness-assisted-design
      note: >-
        Conception d'interface assistée fournie par l'adaptateur — génération d'une direction
        et de surfaces exécutables depuis un brief, importables dans le dépôt, et déploiement
        d'une preview. Native, donc hors porte d'adoption, mais NOMMÉE : c'est son absence du
        registre qui a laissé la méthode mandater de fait le tout-à-la-main. Le noyau ne nomme
        aucun produit ni aucune API : il nomme la CAPACITÉ, et l'adaptateur déclare l'outil qui
        la satisfait. Elle ne remplace ni le brief de conception, ni la concurrence de trois
        directions, ni le plancher de craft d'impeccable, ni le contrôle d'accessibilité : elle
        change ce qu'il faut ÉCRIRE pour les satisfaire, jamais ce qu'il faut PROUVER.
    - id: harness-preview-deploy
      note: >-
        Déploiement d'une preview à une URL ouvrable sans installation. Natif, hors porte
        d'adoption. Exigé par les critères de sortie des activités 10, 15 et 20 : un livrable de
        design que le métier doit cloner pour voir n'est pas relu, et un livrable non relu ne
        prouve rien. Le plugin ne déploie rien lui-même — c'est l'agent qui appelle, et la
        distinction tient : aucun contrôle déterministe ne dépend d'un tiers.
    - id: harness-hooks
      note: "Interception en boucle avant écriture. Accélérateur : fait passer K6 de la détection à la prévention. Le plancher reste la CI."
    - id: harness-telemetry
      note: >-
        Hooks de cycle de vie du harness — ouverture de session, soumission d'instruction,
        appel d'outil avant et après, fin de sous-agent, fin de tour — et le transcript qu'il
        écrit déjà. Natifs, donc hors porte d'adoption, mais NOMMÉS : leur absence du registre
        laissait l'exécution des agents entièrement hors de vue, et un run se jugeait alors sur
        la parole de celui qui l'avait exécuté. Le plugin n'instrumente aucun modèle et
        n'intercepte aucun réseau : il lit ce que le harness donne déjà à ses hooks, et il
        échoue en OUVRANT — observability.fail_open. Le transcript est la SEULE source qui dise
        quel modèle a réellement servi, ce sans quoi R1 et R3 restent invérifiables.
    - id: harness-model-mapping
      note: Table classe de capacité → modèle, propre à l'adaptateur. Le noyau ne nomme aucun modèle.
    - id: harness-questions
      note: "Mécanisme de questions structurées du harness. Sert la salve unique du brief de conception, et l'interrogatoire de l'activité 2, une question par appel. Natif, donc hors porte d'adoption."
    - id: harness-web-research
      note: "Lecture de sources extérieures par l'adaptateur — recherche et consultation de pages. Le plugin ne fait toujours AUCUN appel réseau : c'est l'AGENT qui en fait, et la distinction tient, car un contrôle déterministe ne doit jamais dépendre d'un tiers. Accordée à des ACTIVITÉS (3, 4, 6, 10, 13) et jamais à des rôles : un même rôle cherche légitimement en activité 3 et abusivement en activité 21, où chercher sert à justifier ce qu'on vient d'écrire. Toute affirmation qui en découle porte adresse, date et citation littérale, sans quoi elle est rétrogradée en UNVALIDATED."
    - id: harness-browser
      note: "Pilotage d'un navigateur réel — Playwright et Chromium, ou équivalent — par l'agent : une action, une capture. Natif, hors porte d'adoption, et MÉCANISME CANDIDAT, jamais canonique : le protocole SUX exige une interaction réelle avec le socle déployé, pas un outil. Le plugin ne pilote rien lui-même ; il contrôle les octets que la session laisse (SUX4)."
    - id: harness-notion-connector
      note: "Connecteur d'espace de travail de l'adaptateur. Le PLAN est calculé par le noyau — déterministe, hors ligne, vérifiable ; son EXÉCUTION appartient à l'adaptateur, qui seul détient l'accès. Le noyau ne nomme aucune API."
