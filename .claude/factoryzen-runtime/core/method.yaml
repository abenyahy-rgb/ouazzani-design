    purpose: "La preuve la plus forte disponible sur le comportement des utilisateurs, étiquetée pour ce qu'elle est. Sans participants : revue synthétique par persona, confrontation documentaire, et mesure en production pour ce que seule l'observation tranche. Le livrable le plus abusable de la méthode."
    sections:
      - title: Protocole
        rule: "écrit AVANT le test, identique entre personas simulés comme entre participants"
      - title: Version testée
        rule: figée par commit, citée
      - title: Participants
        rule: "personas PER-nn de la revue experte, étiquetés SYNTHETIC · AXR, et l'agent qui les incarne ; sessions de la campagne SUX, étiquetées SYNTHETIC · SUX, comptées en « sessions synthétiques » ; participants réels s'il en existe — recrutement, nombre, biais"
      - title: Résultats bruts
        rule: non filtrés, y compris ceux qui contredisent la thèse
      - title: Niveau d'evidence
        rule: "EMPIRICAL · DOCUMENTARY · SYNTHETIC · AXR · SYNTHETIC · SUX · UNVALIDATED — étiquette obligatoire"
      - title: Hypothèses UNVALIDATED confrontées
        rule: "chacune tranchée par des participants réels, ou reportée avec sa mesure en production — métrique, événement, seuil, décision"
      - title: Corrections
        rule: "chacune traçant vers un constat étiqueté — SYNTHETIC · AXR, SYNTHETIC · SUX, DOCUMENTARY ou EMPIRICAL"
      - title: Revue experte (AXR)
        rule: "critic(product), qui connaît l'intention et n'a pas conçu le prototype : plan de couverture écrit avant, résultat par unité, constats observés et reproduits — jamais présentée comme un test d'utilisateur"
      - title: Campagne SUX
        rule: "utilisateurs synthétiques aveugles sur le prototype de release figé, même protocole qu'avant G0 : pare-feu, manifeste haché, résultats bruts, patterns, triage ; la campagne vit sous sux/"
    completion: "Protocole antérieur au test. Version figée par commit. Résultats non filtrés. Revue experte AXR et campagne SUX séparées, chacune étiquetée ; K7 rejoue la campagne SUX sans constat. Niveau d'evidence étiqueté — une revue synthétique ou documentaire présentée comme empirique est un BLOCKER, une revue experte présentée comme un test d'utilisateur aussi. Chaque hypothèse de comportement non tranchée par des participants réels porte sa mesure en production."
    specimen: |-
      Protocole  écrit le 04/06, avant le test — 3 tâches
      Version    commit 7f2a91c, gelée
      Panel      PER-01 et PER-03 simulés · SYNTHETIC
                  incarnés par critic(product), qui n'a pas
                  conçu le prototype
      Niveau     SYNTHETIC · DOCUMENTARY
      HYP-02     fragilisée — PER-01 bute sur « ESTIMÉ » ;
                  S-07 le confirme. Libellé corrigé (C-2).
      HYP-04     reportée — mesure en production : relevés
                  par chef et par jour, seuil 0,8 à 4 semaines,
                  sous le seuil → relevé hebdomadaire.
    base: releases/{release-id}/research/tests/
    files:
      - test-plan.md
      - sux/
  - id: WP-24
    name: Backlog de la release et carte des slices
    category: reg
    cadence: C2
    step: C2.4
    activity: "19"
    controlled_at: G1 puis K1
    baseline: release
    lifecycle: vivant
    responsible_accountable: product-lead / Product Owner et autorité Tech
    purpose: "Ce qui reste à faire, dans quel ordre, et ce qui doit être vrai pour commencer. Mettre le backlog en ordre EST la carte des slices : chaque slice est un résultat utilisateur démontrable, vertical — données, API, écrans et tests ensemble —, une seule en cours à la fois. Les jalons sont des slices nommées, pas des dates."
    sections:
      - title: EPC-nn epics
        rule: trace vers JRN et REL
      - title: STO-nn stories
        rule: trace vers EPC et un écran du Strategic Design
      - title: AC-nn.n acceptance criteria
        rule: chacun vérifiable et non ambigu
      - title: Priorités
        rule: par valeur et par risque
      - title: Dépendances
        rule: validées par principal-engineer, aucune vers une release postérieure
      - title: Tier de risque par capacité
      - title: Carte des slices
        rule: "S-nn ordonnées — dépendances, valeur, risque levé, apprentissage ; chacune un résultat utilisateur démontrable, verticale ; aucune slice de plateforme ; une seule en cours à la fois"
      - title: Affectation des stories
        rule: chacune affectée à une slice ou explicitement reportée
      - title: Baseline manifest
        rule: Release Baseline, socle, Design System — versions et commits
      - title: NEEDS CLARIFICATION ouverts
        rule: "porteur, échéance, la PREMIÈRE slice qui en a besoin, et une CLASSE : À DÉCIDER AVANT LE CONTRAT · À DÉCIDER AVANT L'ACCEPTATION — la valeur du prototype est la proposition par défaut, portée comme paramètre nommé et versionné · HORS V1 · TECHNIQUE ; un point n'est à décider avant le contrat que si le contrat ne peut pas dire COMMENT construire sans lui"
    completion: "Couverture de la release à 100 %. Chaque story trace vers un parcours et un écran. Chaque AC vérifiable (K3)."
    specimen: |-
      STO-014  Consulter l'avancement d'un chantier
        epic     EPC-03  ·  parcours JRN-07  ·  écran S-12
        tier     R2
        AC-014.1  L'avancement affiché porte sa catégorie de vérité
        AC-014.2  Un ESTIMÉ n'est jamais présenté comme CONSTATÉ
        AC-014.3  Données de plus de 24 h signalées comme telles
    base: releases/{release-id}/
    files:
      - backlog/epics/
      - backlog/stories/
      - backlog/traceability.md
      - backlog/priorities.md
      - backlog/dependencies.md
      - backlog/risk-map.md
      - planning/slice-map.md
      - handoff/delivery-readiness.md
      - handoff/baseline-manifest.md
  - id: WP-25
    name: Décision G1 et fermeture d'apprentissage
    category: pre
    cadence: C2
    step: C2.4
    activity: gate
    controlled_at: G1
    baseline: release
    lifecycle: figé
    responsible_accountable: factory-lead / Product Owner et autorité Tech
    purpose: "L'assemblage est DÉRIVÉ, il ne se recopie plus. Les éléments de charte viennent des livrables qui les portent, les résultats de contrôle des contrôles eux-mêmes, les verdicts des critics, et la décision — motif, autorité, date, commit — du Run Ledger où la tour l'a inscrite au franchissement. Recopier à la main ce que la machine sait déjà produisait un document qui pouvait CONTREDIRE ses propres sources, et c'est le seul document qu'un gate lit. Reste ici ce qu'aucune machine ne sait écrire : ce que ce passage nous a appris."
    sections:
      - title: Fermeture d'apprentissage
    completion: "Chaque élément de la charte présent (K7). K3 vert. Zéro BLOCKER. Release Baseline figée par tag Git immuable."
    base: gates/
