      - title: Reprise de la stack de conception
        rule: >-
          La STACK DE CONCEPTION est arrêtée en WP-08, à l'ouverture de l'activité 8 : elle
          conditionne la première décision visuelle et ne peut pas attendre l'activité 11.
          Elle est REPRISE ici pour être classée CORE INVARIANT ou EXTENSION et confrontée à
