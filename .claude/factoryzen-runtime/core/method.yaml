      - release-baseline.yaml
  - id: WP-26
    name: Contrat de slice
    category: spec
    cadence: C3
    step: C3.1
    activity: "20"
    controlled_at: K1
    baseline: slice
    lifecycle: par slice
    responsible_accountable: product-lead, product-designer, principal-engineer / Product Owner et autorité Tech
    purpose: "Ce que la slice doit produire, et la preuve qui dira qu'elle l'a produit — écrite AVANT le code. Une slice est verticale : données, API, écrans et tests livrés ensemble, pour un résultat qu'un utilisateur voit. Le contrat réunit ce que trois livrables de sprint séparaient — objectif, design, spécification — parce qu'on ne les lisait jamais l'un sans l'autre."
    sections:
      - title: Résultat de la slice
        rule: "un résultat utilisateur en une phrase, démontrable en QA ; l'acceptation se prononce contre lui"
      - title: Périmètre et budget
        rule: "stories retenues et exclusions ; ce qu'aucun critère de sortie n'exige est reporté — la slice ne grandit pas"
      - title: Critères de sortie et preuves
        rule: "EXIT-n, chacun avec sa preuve : mode (automatique · manuel · mixte), CANAL (unitaire · intégration · émulateur · simulateur · web · appareil physique · environnement QA), procédure, réussite, échec, artefact retenu ; une preuve ne vaut que pour son canal, et une jambe non exécutée est REPORTÉE à une gate nommée, ou HORS PÉRIMÈTRE — jamais PASS"
      - title: Tests définis avant le code
        rule: "chaque AC matériel → ≥ 1 test nommé ; changer un test, c'est amender le contrat"
      - title: Baseline Delta Declaration
        rule: "MUST PRESERVE avant toute modification ; chaque delta justifié par une story ; écart de socle → EX3"
      - title: Écrans et prototype
        rule: "chaque story exercée sur le prototype vivant, trois largeurs, états vides, erreur et chargement"
      - title: Delta de Design System
        rule: "justifié story par story ; aucune modification silencieuse d'un composant existant"
      - title: Règles, données, API, migrations
        rule: "chaque règle cite sa source ; migrations numérotées avec leur rollback"
      - title: Tier de risque et sécurité
        rule: "le plus haut tier des stories retenues ; R2 ou R3 → escalade humaine en K1"
      - title: Points ouverts
        rule: "NEEDS CLARIFICATION résolus ou routés — un NC ouvert ne passe pas K1 ; au plus une demande de décision au Product Owner, consolidée, avant l'acceptation"
      - title: Amendements
        rule: "un écart découvert en construction est un amendement daté, jamais une croissance : ce qui dépasse va à une slice suivante"
      - title: Conditions d'entrée
        rule: "ENTRY-n, chacune avec son statut MET · PENDING · DEFERRED et ce qui la lève ; inclut les prérequis EXTERNES — capacité de créer le dépôt, identifiants d'hôtes, adhésion aux stores et signature, chaîne d'outils imposée par le SDK, compte QA stable du Product Owner, dont il fixe lui-même le mot de passe hors Git et hors chat — et chaque apprentissage « material » de la slice précédente. Un prérequis externe n'est pas une décision produit, mais il se vérifie AVANT le GO"
      - title: KEEP / DISCARD
        rule: "Slice 0 et toute preuve technique : chaque artefact classé KEEP ou DISCARD AVANT d'être écrit ; aucun import KEEP → DISCARD, vérifié par contrôle de dépendances ; le DISCARD est retiré à la clôture, migration forward-only comprise. Autre slice : « sans objet » et pourquoi"
    completion: "Résultat formulé en résultat utilisateur. Chaque critère de sortie porte sa preuve et son canal. Chaque AC matériel a son test, défini avant le code. Baseline Delta Declaration produite avant toute modification. Chaque condition d'entrée porte son statut et ce qui la lève. Citations échantillonnées et « n confirmées / m corrigées » inscrit. Aucun NEEDS CLARIFICATION ouvert. Run Ledger ouvert (K8)."
    specimen: |-
      S-02  Un conducteur repère un écart et le signale sans appeler
        EXIT-1   l'écart apparaît en tête de liste       automatique · e2e/ecart-tri.spec
        EXIT-2   le signalement arrive au chef en < 1 min  mixte · e2e + relecture QA
        EXIT-3   aucun ESTIMÉ présenté comme CONSTATÉ   automatique · unit/propagation.test
        budget   tri secondaire, photos → S-04 ; la slice ne grandit pas
        tier     R2 → escalade K1
    base: releases/{release-id}/slices/{slice-id}/
    files:
      - slice-contract.md
      - design/scope.yaml
      - design/prototype/
      - design/design-system-delta/
      - spec/acceptance-criteria.md
      - spec/technical-spec.md
  - id: WP-27
    name: Construction et preuves
    category: pre
    cadence: C3
    step: C3.2
    activity: "21"
    controlled_at: G3
    baseline: slice
    lifecycle: par slice
    responsible_accountable: principal-engineer · quality-engineer produit · critic(quality) classe / autorité Tech
    purpose: "Ce qui a été construit contre le contrat, et la preuve de chaque critère de sortie. Rend visible tout écart entre le contrat et le code : l'absorption silencieuse est le défaut que ce livrable existe pour empêcher. La classification d'un test rouge est rendue par critic(quality), jamais par celui qui a écrit le test ou le code."
    sections:
      - title: Écarts contrat / implémentation
        rule: "classés : manquant · partiel · contredit · non demandé · intentionnellement superseded — chacun décidé ou routé"
      - title: Résultats par critère de sortie
        rule: "par EXIT et par AC : test, VERT ou ROUGE, date, commit — fait observable, sans interprétation"
      - title: VERDICT DE CLASSIFICATION
        rule: "PASS · PRODUCT FAILURE · TEST FAILURE · CANNOT VERIFY, par test rouge, rendu par critic(quality) uniquement"
      - title: Healing et re-vérifications
        rule: "uniquement pour TEST FAILURE, chaque healing re-vérifié par une passe indépendante ; un défaut produit n'est jamais healed"
      - title: Matrice contrat — code — tests — décisions
        rule: "une ligne par story ; chaque écart classé, rien d'absorbé"
      - title: Parcours exécutés en QA
        rule: "joués sur le prototype vivant recomposé — une seule URL et son commit —, pas seulement en test automatisé"
      - title: Dette et risques résiduels acceptés
        rule: nommés, avec porteur et échéance
      - title: Matrice état × comportement
        rule: "un élément d'inventaire touché par la slice par ligne ; atteint · avant · Back · restauré · édité · persistant · reste inchangé · aval ; PASS ou N/A motivé — jamais vide ; jouée en QA, sur la version déployée"
      - title: Oracles et causes racines
        rule: "chaque oracle : la question générale, les états balayés, les touches ; les touches regroupées par cause racine — corriger le mécanisme, jamais l'instance ; un oracle entre en régression permanente"
      - title: Identité de la version
        rule: "commit, empreinte de l'artefact, version de migration, empreinte de configuration, versions épinglées ; l'artefact validé en DEV est celui promu en QA — même empreinte, vérifiée par /version ; golden path de la CI hébergée : VERT, ou NOT RUN avec sa raison — jamais PASS"
    completion: "Chaque critère de sortie porte sa preuve retenue, avec son canal. Tout écart classé (EX4). Chaque test rouge classé par critic(quality). Aucun PRODUCT FAILURE masqué. Parcours critiques exécutés en QA sur le prototype vivant. Matrice état × comportement sans cellule vide ; oracles connus rejoués sans touche. Version en QA identique, par empreinte, à la version validée en DEV."
    base: releases/{release-id}/slices/{slice-id}/
    files:
      - status.md
      - scope-changes.md
      - quality/test-strategy.md
      - quality/test-healing-decisions.md
      - acceptance/traceability-matrix.md
      - acceptance/preview-report.md
  - id: WP-28
    name: Verdicts de revue indépendante
    category: pre
    cadence: C3
    step: C3.2
    activity: "22"
    controlled_at: G3 puis G4
    baseline: slice
    lifecycle: par passe
    responsible_accountable: critic(engineering), conformance-auditor, security-engineer, critic(pentest) / factory-lead
    purpose: "Quatre voies parallèles, quatre verdicts distincts et indépendants. Aucun évaluateur ne corrige ce qu'il évalue."
    sections:
      - title: Revue d'ingénierie
        rule: adossée au diff réel ; carte AC → Evidence vérifiée effective, pas seulement présente
      - title: Conformité design
        rule: comparaison écran par écran, visual diffs, écarts classés
      - title: Revue de sécurité
        rule: threat model ; secrets, auth, accès données, dépendances ; aucun secret en clair
      - title: Pentest proportionnel
        rule: si tier R2 ou R3 — findings démontrés, pas supposés ; aucune action destructive
      - title: Findings
        rule: "classés selon la taxonomie unique, rattachés à leur tier de surface ; chacun porte un DOMAINE — PRODUIT, défaut de l'artefact jugé, ou CONTRÔLE, défaut d'un gabarit, d'un contrôle K, d'un validateur —, ce qu'il BLOQUE — cette gate · l'acceptation · la mise en production · dette — et son ÉCHÉANCE ; l'éligibilité produit se calcule sur PRODUIT seul — un CONTRÔLE BLOCKER bloque la transition qui dépend du contrôle cassé, jamais la gate produit"
      - title: Dispositions
        rule: "une ligne par finding et par objection : ACCEPTÉ (changement fait, commit) · RÉDUIT (partie retenue, partie routée en point ouvert) · REJETÉ (motif et preuve) · NON VÉRIFIÉ (pointeur, sans effet) ; chaque disposition est vérifiée contre la source canonique par un autre que l'émetteur, et SEUL ce qui est vérifié change l'état du produit ou de la méthode ; comptes acceptés / réduits / rejetés publiés"
    completion: "Zéro BLOCKER de domaine PRODUIT. Chaque finding rattaché à son entité, à son domaine et à ce qu'il bloque. Chaque finding et chaque objection porte sa disposition. Aucun finding corrigé par son propre juge — la fermeture exige une nouvelle passe du critic émetteur."
    base: releases/{release-id}/slices/{slice-id}/
    files:
      - reviews/engineering-review.md
      - reviews/design-conformance.md
      - security/security-review.md
      - security/threat-model.md
      - security/pentest-summary.md
  - id: WP-29
    name: Acceptation de la slice et fermeture d'apprentissage
    category: pre
    cadence: C3
    step: C3.3
    activity: gate
    controlled_at: G3
    baseline: slice
    lifecycle: figé
    responsible_accountable: factory-lead / Product Owner
    purpose: "L'assemblage est DÉRIVÉ, il ne se recopie plus. Les éléments de charte viennent des livrables qui les portent, les résultats de contrôle des contrôles eux-mêmes, les verdicts des critics, et la décision — motif, autorité, date, commit — du Run Ledger où la tour l'a inscrite à l'acceptation. Reste ici ce qu'aucune machine ne sait écrire : le script que le Product Owner joue, ce que l'acceptation laisse intact, ce que cette slice nous a appris, et ce qui vient ensuite."
    sections:
      - title: Fermeture d'apprentissage
        rule: "ce qui a coûté, surpris, aurait dû être détecté — rattaché et routé ; chaque apprentissage « material » devient une condition d'entrée de la slice suivante"
      - title: Script d'acceptation
        rule: "au plus une page : parcours à jouer, canal, URL, version (/version), compte QA STABLE du Product Owner, résultat attendu par parcours ; seulement les moments que la machine ne sait pas juger ; la demande de décision consolidée en tête, chaque item avec sa valeur par défaut — « tout confirmer » est une réponse complète"
      - title: Audit de non-perte
        rule: "sens A — chaque élément ACTIVE a une destination dans le produit courant ; sens B — chaque élément de l'expérience d'origine a une disposition ; les deux chiffrés, zéro disparition inexpliquée — une absence dans un livrable postérieur n'est pas une supersession"
      - title: Prochaine action
        rule: "une ligne : l'activité suivante, son entrée manquante, qui la lève"
    completion: "Zéro BLOCKER, y compris de sécurité. Slice acceptée en QA par le Product Owner, verdict consigné mot pour mot. Audit de non-perte à zéro disparition inexpliquée. Prochaine action écrite. Ne vaut PAS autorisation de production : G3 et G4 sont distincts."
    base: gates/
    files:
      - g3-{slice-id}.md
  - id: WP-30
    name: Readiness de mise en production et plan de rollback
    category: spec
    cadence: C4
    step: C4.1
    activity: "24"
    controlled_at: G4
    baseline: déploiement
    lifecycle: par version
    responsible_accountable: release-engineer / autorité de release
    purpose: "Un rollback documenté n'est pas un rollback. La preuve de son exécution est un motif de refus automatique quand elle manque."
    sections:
      - title: Qualité, sécurité, migrations, observabilité, documentation
      - title: Plan de rollback ET preuve de son exécution
        rule: testé, pas seulement décrit
      - title: Evidence sécurité proportionnelle au tier
        rule: pentest si R2 ou R3
      - title: Verdict de re-review
        rule: pour chaque finding corrigé depuis la dernière passe
      - title: Plan d'observabilité et seuils d'alerte
      - title: Fenêtre de déploiement et critères d'abandon
      - title: "En tier R3 : deux autorités humaines distinctes"
        rule: enregistrées séparément
    completion: "Rollback testé. Observabilité en place. Un rollback non testé est un refus automatique, sans exception verbale."
    base: deployments/{version}/
    files:
      - release-readiness.md
      - rollback-plan.md
  - id: WP-31
    name: Enregistrement de déploiement et vérification
    category: pre
    cadence: C4
    step: C4.1
    activity: "25"
    controlled_at: —
    baseline: déploiement
    lifecycle: par version
    responsible_accountable: release-engineer / autorité de release puis HUMAN OWNER
    purpose: "Ferme la boucle : ce qui a été déployé, ce qui a été observé, et ce que ça dit de l'outcome visé."
    sections:
      - title: Stratégie progressive appliquée
        rule: point de rollback vérifié AVANT bascule
      - title: DEP-vX.Y — stories livrées
      - title: Vérification post-déploiement
        rule: santé, métriques, erreurs, parcours critiques, sur la fenêtre définie
      - title: Décision garder / rollback
        rule: enregistrée
      - title: Signaux confrontés aux métriques de succès
        rule: conclusions distinguées des données
      - title: Décision produit
        rule: poursuivre · corriger · redécouper · pivoter · arrêter
    completion: "Point de rollback vérifié avant bascule. Signaux confrontés aux métriques de la release. Backlog et architecture de releases actualisés."
    base: deployments/{version}/
    files:
      - deployment-record.md
      - post-deploy-verification.md
    also:
