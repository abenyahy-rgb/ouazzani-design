        - "Constat du même jour : le canevas, les personas, le squelette et la navigation ne connaissaient qu'une famille d'acteurs ; l'exemple padel lui-même décrivait le club et le joueur, mais pas celui qui relance, livre et encaisse."
    - id: MCR-007
      title: "Le décideur au-dessus de la boucle : mandat, points de passage, dossier décideur"
      statut: ADOPTÉE
      document: core/mcr/MCR-007-le-decideur-au-dessus-de-la-boucle.md
