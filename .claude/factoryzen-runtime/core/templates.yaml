# Gabarits de rédaction des livrables de l'Autonomous Product Factory.
#
# SUBORDONNÉ à core/method.yaml, jamais parallèle. Le registre déclare, pour chaque
# livrable, ses sections, la règle de chaque section et son critère de complétude.
# Ce fichier n'en recopie AUCUN : il ajoute, section par section, un GUIDE de rédaction
# et un EXEMPLE rempli. Un test vérifie que les titres de section sont identiques
# caractère pour caractère à ceux du registre, dans le même ordre : un gabarit qui
# divergerait du registre est refusé, pas toléré.
#
# « apf template <WP-nn> » fusionne registre + gabarit et rend le squelette Markdown
# que l'agent remplit : front-matter, un H2 par section, la règle et le guide en
# commentaire, le critère de complétude en clôture. « --example » y joint l'exemple.
#
# L'exemple est filé de bout en bout sur un produit fictif, « ChantierClair » : un outil
# pour conducteurs de travaux suivant 3 à 8 chantiers. Les identifiants se répondent
# d'un livrable à l'autre (OUT-01 → MET-01, STG-04 → JRN-07 → EPC-03 → STO-014 → AC-014.2).

schema_version: 1

contract: >-
  Un gabarit dit COMMENT remplir une section que le registre a déclarée. Il ne crée
  jamais une section, n'en supprime jamais, n'en reformule jamais le titre. Le titre
  d'une section est une clé lisible par machine : c'est ce qui permettra à K7 de
  confronter un fichier produit à son plan de contenu.

front_matter:
  required: [id, produced_by, controlled_at, completion]
  optional: [instance, evidence_level, reserves, exhibits, commit, workspace_page, workspace_synced_at]
  rule: >-
    id = WP-nn du registre · produced_by = numéro d'activité · controlled_at = gate ·
    completion ∈ {complet, partiel}, identique à la déclaration faite à la tour ;
    partiel exige reserves. instance nomme la release, la slice ou la version pour
    un livrable à chemin paramétré. commit et workspace_* sont posés par l'outillage
    (« apf notion link / sync »), jamais tapés par l'agent.

artifact_form:
  contract: >-
    Un livrable est lisible par machine avant de l'être par un humain. Chaque section
    déclarée au registre vit dans UN fichier du livrable (clé « file » du gabarit) ;
    un fichier Markdown la porte comme H2 au titre identique ; une collection (chemin
    terminé par /) la porte comme fichiers ; un fichier YAML, HTML ou source la porte
    par son existence. La tour confronte le livrable à cette forme à la déclaration ;
    K7 le rejoue sur le dépôt.
  markdown_section: "un titre H2 ou H3 « <titre> », identique au registre caractère pour caractère, suivi d'un contenu non vide ; un champ de fiche peut aussi être un libellé en gras — « **Nombre suivi** | … » dans une table ou en tête de ligne"
  fiche: "une section dont le titre commence par un identifiant à motif — OUT-nn, HYP-nn, STO-nn, AC-nn.n, REL-nom — est satisfaite par tout titre portant un identifiant réel : « OUT-01 · … » vaut « OUT-nn — énoncé »"
  collection: "le dossier existe et contient au moins un fichier"
  file: "le fichier existe ; un .yaml doit être parsable"
  on_missing: "déclaration « complet » REFUSÉE, la section manquante est nommée ; « partiel » est accepté et le manque est consigné"
  on_empty: "un H2 sans contenu, ou dont le contenu est le tiret d'attente du squelette, vaut section manquante"
  on_extra: "un H2 hors plan est une OBSERVATION consignée, jamais un refus — enrichir le plan est une MCR, pas une initiative"
  front_matter: "chaque fichier Markdown atomique du livrable porte le front-matter requis ; id = le WP, completion = celle déclarée"
  collections_are_free: "les fichiers d'une collection (STO-nn.md, PER-nn.md, ADR-nn.md) sont libres de forme : ce sont des entités, pas des sections"

conventions:
  identifiants: "OUT-nn · HYP-nn · PER-nn · STG-nn · TRM-nn · REL-nom · JRN-nn · EPC-nn · STO-nn · AC-nn.n · DSN-nn · ADR-nn · EVD-nn · FND-nn · DEP-vX.Y · IRR-nn (irritant) · INS-nn (insight) · MET-nn (métrique) · NC-nn (needs clarification)"
  niveau_evidence: [EMPIRICAL, DOCUMENTARY, SYNTHETIC, UNVALIDATED]
  echelle_epistemique: [FAIT, PRATIQUE, ABSTRACTION, INFÉRENCE, INCONNU]
  severite: [BLOCKER, MAJOR, MINOR, OBSERVATION]
  tier: [R0, R1, R2, R3]
  categories_du_socle: [CORE INVARIANT, EXTENSION]
  ecarts: [manquant, partiel, contredit, non demandé, intentionnellement superseded]
  classification_test: [PASS, PRODUCT FAILURE, TEST FAILURE, CANNOT VERIFY]
  source_web: "toute affirmation issue d'une recherche porte url · consulted_at · verbatim, sinon elle est UNVALIDATED"

formats:
  markdown: "un fichier Markdown, un H2 par section, front-matter YAML"
  yaml: "un fichier YAML validé par schéma ; le squelette rendu est une check-list, pas le fichier"
  executable: "code ou build ; le squelette rendu est une check-list de ce que chaque section doit prouver"
  mixed: "plusieurs fichiers ; « layout » dit quelle section vit dans quel fichier"

# ───────────────────────────── Standard de rédaction ─────────────────────────────
#
# UN LIVRABLE S'ÉCRIT POUR ÊTRE PRÉSENTÉ PAR UN CONSULTANT À SON CLIENT. Le plan de
# sections du registre reste la clé que la machine contrôle ; ce bloc dit comment la
# porter sans la faire subir au lecteur. Appliqué d'abord aux livrables de C1.

redaction:
  contrat: >-
    Le lecteur lit le titre, la phrase et l'essentiel en vingt secondes, et sait ce que le
    livrable établit. Chaque section du registre garde son titre exact comme clé et y
    accole sa réponse après un tiret cadratin : « ## Problème — quatre à six heures par
    semaine perdues au téléphone ». Les identifiants de méthode (livrable, activité)
    n'apparaissent qu'en « Repères de méthode », à la fin. Ce qui n'est pas établi se dit
    en « Ce qui reste à vérifier », jamais au fil du texte.
  portee: [C1]
  ouverture:
    phrase: "En une phrase."
    phrase_guide: "La réponse du livrable, en une phrase qu'un dirigeant peut répéter. Un chiffre si possible, jamais le sujet."
    essentiel: "L'essentiel"
    essentiel_guide: "Trois puces lisibles en vingt secondes : ce qu'il faut retenir, pas un sommaire."
    puces: [2, 4]
  titre_reponse: " — "
  cloture:
    verifier: "Ce qui reste à vérifier"
    verifier_guide: "Ce qui n'est pas établi, pourquoi cela compte, et ce qu'il faut pour le savoir. Obligatoire quand le livrable est partiel."
    reperes: "Repères de méthode"
    reperes_guide: "Le seul endroit où vivent les identifiants de méthode : livrable, activité, gate, liens de traçabilité."
  annexes_admises: ["Sources"]
  codes_interdits:
    - { motif: '\bWP-\d{2}\b', nom: "identifiant de livrable" }
    - { motif: '\b[Aa]ctivité \d+\b', nom: "numéro d'activité" }

# ───────────────────────────── Formats de présentation ─────────────────────────────
#
# UN LIVRABLE SE PRÉSENTE DANS LE FORMAT QUI FAIT RÉFÉRENCE POUR SA QUESTION.
# Le registre déclare ce qu'un livrable doit établir ; le gabarit dit comment l'écrire ;
# ce bloc dit comment il se MONTRE à un client — et ce que la machine vérifie avant de
# le montrer. Un format ne crée aucune section et ne change aucune règle de méthode :
# il lit des DONNÉES STRUCTURÉES que le livrable porte dans son front-matter, sous la
# clé « exhibits », et il en dérive ce qu'un consultant calculerait à la main.
#
# Trois engagements, tenus par lib/exhibits.mjs :
#   1. Ce qui se calcule est calculé. Le texte annonce, la machine vérifie ; au-delà de
#      la tolérance, le texte est faux et la planche est refusée.
#   2. Une donnée manquante n'est jamais remplie. La planche n'est pas émise, et le
#      défaut est nommé dans le pack.
#   3. Un format est porté par UN fichier déclaré au registre (clé « porte »). Un
#      format sans porteur, ou porté ailleurs, est refusé par K7.

exhibits:
  contract: >-
    Un format de présentation lit les données déclarées sous « exhibits » dans le
    front-matter du fichier qui le porte, les contrôle, calcule ce qui se calcule et
    produit une planche. Il ne remplace ni les sections du livrable ni sa prose : il en
    est la projection chiffrée. Un livrable déclaré complet doit porter chacun de ses
    formats ; un livrable partiel qui n'en porte pas voit le manque consigné.
  tolerance: 0.15
  tolerance_motif: >-
    Un chiffre présenté est arrondi pour être lu. Au-delà de 15 % d'écart avec le calcul,
    ce n'est plus un arrondi : c'est un autre chiffre, et le texte doit être corrigé.
  commun:
    champs: [format, titre]
    titre: >-
      La RÉPONSE, en une phrase — jamais le nom du format ni le sujet. « Pour 30 000 MAD
      de marge, il faut plus de quatre terrains par club » est un titre ; « Compte de
      résultat inversé » n'en est pas un.
  formats:

    - id: persona
      nom: "Persona"
      reference: "A. Cooper, The Inmates Are Running the Asylum, 1999 ; pratique du service design — personas tirés de la recherche, pas de l'imagination"
      question: "Qui est cette personne, ce qu'elle cherche à faire, ce qui l'en empêche — et sur quelles paroles réelles chaque trait repose-t-il ?"
      porte: { wp: WP-04, file: personas/ }
      exige_a: complet
      champs: [id, famille, nom, archetype, citation, objectifs, frustrations, comportements, contexte]
      max_elements: 4
      max_mots_element: 16
      regles:
        - "Une planche par persona : un fichier PER-nn, un front-matter, une planche."
        - "Deux familles, chacune déclarée : client (qui paie, qui utilise) ou operateur (qui fait tourner le service — coach, préparateur, support), avec le nom de l'opérateur du canevas qu'il incarne. Chaque opérateur du canevas a son persona : un opérateur qu'on n'a pas regardé travailler, ce sont des écrans qu'on oubliera."
        - "La citation est un verbatim LITTÉRAL, avec sa source S-nn ou E-nn. Une phrase écrite pour le persona n'est pas une citation."
        - "Chaque trait — objectif, frustration, comportement, contexte — cite au moins deux sources indépendantes, ou se déclare hypothèse avec sa référence HYP-nn."
        - "Aucune donnée démographique, aucun âge, aucun chiffre sans source. Le prénom est fictif et le dit."
        - "Les curseurs de comportement placent la personne entre deux pôles, chacun avec ses sources : ils montrent ce qui la distingue des autres personas."
        - "Quatre éléments au plus par bloc, seize mots au plus : un persona est un outil de décision, pas une biographie."
      exemple:
        format: persona
        titre: "Karim pilote six chantiers depuis sa voiture : il ne manque pas de données, il manque de savoir où on en est"
        id: PER-01
        famille: client
        nom: "Karim — prénom fictif"
        archetype: "Le conducteur de travaux multi-chantiers"
        niveau: DOCUMENTARY
        citation: { texte: "Si le chef ne me l'a pas dit, je ne le sais pas.", source: S-03 }
        objectifs:
          - { texte: "Savoir chaque matin où en est chaque chantier", sources: [S-03, S-07] }
          - { texte: "Voir un écart avant qu'il ne coûte", sources: [S-07, S-11] }
        frustrations:
          - { texte: "Une matinée de téléphone pour reconstituer l'avancement", sources: [S-03, S-07] }
          - { texte: "Les applications demandent des formulaires que personne ne remplit", sources: [S-01, S-02] }
        comportements:
          - { texte: "Rappelle chaque chef de chantier avant neuf heures", sources: [S-03, S-07] }
          - { texte: "Consulterait un écran hors des appels", statut: hypothèse, ref: HYP-05 }
        contexte:
          - { texte: "Trois à huit chantiers, travaille depuis sa voiture ou sur site", sources: [S-03, S-07] }
          - { texte: "Dit « où on en est », « l'écart », jamais « reporting »", sources: [S-03, S-11] }
        curseurs:
          - { gauche: "Papier et téléphone", droite: "Outils numériques", position: 0.3, sources: [S-01, S-03] }
          - { gauche: "Réagit aux écarts", droite: "Anticipe", position: 0.25, sources: [S-07, S-11] }

    - id: empathy-map
      nom: "Empathy map"
      reference: "D. Gray, XPLANE, 2010 — révision « Updated Empathy Map Canvas », 2017"
      question: "Que dit, fait, pense et ressent cette personne dans sa situation — et qu'est-ce qui lui coûte ou lui rapporterait ?"
      porte: { wp: WP-04, file: empathy-maps/ }
      exige_a: complet
      champs: [persona, dit, pense, fait, ressent, douleurs, gains]
      max_elements: 4
      max_mots_element: 16
      regles:
        - "Une planche par persona, rattachée à son PER-nn."
        - "« Dit » ne contient que des citations littérales, chacune avec sa source."
        - "« Fait » ne contient que ce que les sources rapportent qu'elle fait — jamais ce qu'elle ferait."
        - "« Pense » et « Ressent » sont des inférences : chacune cite au moins deux sources dont elle est tirée, ou se déclare hypothèse HYP-nn."
        - "Douleurs et gains ferment la carte : ce que la situation lui coûte, ce qu'un changement lui rapporterait — sourcés de même."
        - "Un cadran que rien ne fonde reste vide et le dit : un cadran rempli d'imagination est pire qu'un cadran vide."
      exemple:
        format: empathy-map
        titre: "Karim ne se plaint pas de saisir : il se plaint de ne pas savoir, et il paie ce doute en heures de téléphone"
        persona: PER-01
        dit:
          - { texte: "« Le lundi, je passe ma matinée au téléphone. »", sources: [S-03] }
          - { texte: "« Encore une appli à remplir. »", sources: [S-01] }
        fait:
          - { texte: "Rappelle chaque chef le matin, depuis sa voiture", sources: [S-03, S-07] }
          - { texte: "Abandonne les applications au bout de quelques semaines", sources: [S-01, S-02] }
        pense:
          - { texte: "Un chiffre qu'on ne sait pas expliquer ne vaut rien", sources: [S-07, S-11] }
        ressent:
          - { texte: "Pilote à l'aveugle entre deux appels", sources: [S-03, S-11] }
          - { texte: "Méfiance face à un avancement estimé", statut: hypothèse, ref: HYP-05 }
        douleurs:
          - { texte: "Découvre les écarts plusieurs jours après", sources: [S-07, S-11] }
        gains:
          - { texte: "Une matinée rendue au chantier", sources: [S-03, S-07] }

    - id: journey-map
      nom: "Journey map"
      reference: "Pratique du service design — parcours et courbe émotionnelle ; M. Stickdorn et al., This Is Service Design Doing, 2018"
      question: "Par quelles étapes passe cette personne aujourd'hui, où sont ses hauts et ses bas — et quel moment le produit doit-il changer ?"
      porte: { wp: WP-04, file: journeys/as-is/ }
      exige_a: complet
      champs: [persona, etapes]
      min_etapes: 3
      max_etapes: 8
      regles:
        - "Une planche par persona : le parcours d'aujourd'hui, pas celui que le produit promet."
        - "Trois à huit étapes, nommées avec les mots de la personne. Chaque étape dit ce qu'elle fait, par où elle passe, ce qu'elle pense, et ses sources."
        - "L'émotion de chaque étape est un entier de −2 à +2, tiré des sources : la machine trace la courbe, nomme le point haut et le point bas, et mesure l'amplitude."
        - "Le point le plus bas est le moment de vérité : il porte au moins un irritant et une opportunité, chacun sourcé ou déclaré HYP-nn."
        - "Une étape qu'aucune source ne décrit est marquée inconnue — jamais imaginée pour compléter la courbe."
      exemple:
        format: journey-map
        titre: "La journée de Karim touche le fond en milieu d'après-midi, quand il découvre sur site un écart vieux de plusieurs jours"
        persona: PER-01
        etapes:
          - { nom: "Avant le départ", fait: "Liste les chantiers à appeler", contact: "Carnet, téléphone", pense: "« Qui ne répondra pas ce matin ? »", emotion: 0, sources: [S-03, S-07] }
          - { nom: "Le point du matin", fait: "Appelle chaque chef depuis la voiture", contact: "Téléphone", pense: "« Si le chef ne me l'a pas dit, je ne le sais pas. »", emotion: -1, sources: [S-03, S-07], irritants: ["Plusieurs chefs injoignables avant le milieu de matinée"] }
          - { nom: "Sur le premier chantier", fait: "Constate l'avancement et règle les urgences", contact: "Visite, échanges sur site", pense: "« Ici au moins je sais. »", emotion: 1, sources: [S-07, S-11] }
          - { nom: "L'écart découvert", fait: "Voit sur site un retard que personne n'a signalé", contact: "Visite", pense: "« Ça date de quand ? »", emotion: -2, sources: [S-07, S-11], irritants: ["L'écart a plusieurs jours, découvert par hasard"], opportunites: [{ texte: "Signaler l'écart le jour où il apparaît", ref: HYP-04 }] }
          - { nom: "Le compte rendu du soir", fait: "Reconstitue la journée pour le gérant", contact: "Courriel, tableur", pense: "« Encore une heure pour dire ce que j'ai vu. »", emotion: -1, sources: [S-03, S-11] }

    - id: communique
      nom: "Communiqué écrit avant le produit"
      reference: "Amazon, Working Backwards — C. Bryar et B. Carr, 2021"
      question: "Quelle promesse, pour quel client, et pourquoi elle tient ?"
      porte: { wp: WP-02, file: product-thesis.md }
      exige_a: complet
      champs: [date, ecrit_le, titre_communique, sous_titre, paragraphes, citation, appel]
      max_mots: 200
      regles:
        - "Le corps tient en 200 mots : une promesse qui ne tient pas en une page n'est pas encore une promesse."
        - "La citation déclare son statut, « visée » ou « obtenue ». Une citation visée est affichée comme telle."
        - "« oblige » nomme ce que le communiqué force à trancher — facultatif, mais c'est ce qui en fait un outil de décision."
      exemple:
        format: communique
        titre: "Le point du matin disparaît : la promesse tient en une phrase, pour le conducteur comme pour le gérant"
        date: "Lyon, 15 octobre 2026"
        ecrit_le: "2 mars 2026"
        titre_communique: "Les conducteurs de travaux n'appellent plus leurs chantiers à 7 heures"
        sous_titre: "ChantierClair montre chaque matin l'avancement daté de chaque chantier, sans une saisie de plus pour le conducteur."
        paragraphes:
          - "Un conducteur de travaux suit trois à huit chantiers. Chaque matin, il les appelle un par un pour savoir où ils en sont : quatre à six heures par semaine."
          - "Avec ChantierClair, le chef de chantier fait un geste par jour. À 7 heures, le conducteur lit l'avancement de ses chantiers, daté et qualifié."
        citation: { texte: "J'ai récupéré mes matinées.", auteur: "Conducteur de travaux d'une PME pilote", statut: visée }
        appel: "Trois PME pilotes, à partir d'avril 2026."
        oblige:
          - { titre: "Le client est le conducteur.", texte: "Le gérant achète, mais c'est la matinée du conducteur qui change." }

    - id: bmc
      nom: "Business Model Canvas"
      reference: "A. Osterwalder et Y. Pigneur, Business Model Generation, 2010"
      question: "Comment le produit crée, délivre et capte de la valeur — et quels blocs ne tiennent encore qu'à une hypothèse ?"
      porte: { wp: WP-01, file: business-model-canvas.md }
      exige_a: complet
      champs: [segments, proposition, canaux, relations, revenus, ressources, activites, partenaires, couts]
      max_elements: 5
      max_mots_element: 12
      regles:
        - "Les neuf blocs sont renseignés. Un bloc vide est une question que le cadrage n'a pas posée."
        - "Chaque élément déclare son statut : établi (sourcé), décision (tranchée par le porteur), hypothèse (à tester, avec sa référence H-n) ou inconnu."
        - "Cinq éléments au plus par bloc, douze mots au plus par élément : un canvas est une synthèse, pas un inventaire."
        - "La machine signale tout bloc qui ne repose que sur des hypothèses ou des inconnus — c'est là que le modèle peut tomber."
        - "Deux familles d'acteurs : les segments disent les clients ; « operateurs » dit qui fait tourner le service — nom, activité clé portée, ce qu'il voit et fait dans le produit. « sans_operateur » se motive. Un canevas qui ne dit ni l'un ni l'autre est refusé."
      exemple:
        format: bmc
        titre: "Un abonnement vendu au gérant pour le temps du conducteur : le revenu ne tient encore qu'à une hypothèse d'usage"
        segments:
          - { texte: "PME du second œuvre, 20 à 100 salariés", statut: établi }
          - { texte: "Conducteurs de travaux suivant 3 à 8 chantiers", statut: établi }
        proposition:
          - { texte: "Le point du matin disparaît", statut: décision }
          - { texte: "Avancement daté et qualifié, sans saisie pour le conducteur", statut: hypothèse, ref: HYP-01 }
        canaux:
          - { texte: "Trois PME pilotes, par le réseau du sponsor", statut: décision }
        relations:
          - { texte: "Un geste par jour du chef de chantier", statut: hypothèse, ref: HYP-01 }
        revenus:
          - { texte: "Abonnement par conducteur, payé par le gérant", statut: hypothèse, ref: HYP-02 }
        ressources:
          - { texte: "Relevés quotidiens des chantiers pilotes", statut: décision }
        activites:
          - { texte: "Former les chefs de chantier sur site", statut: décision }
        partenaires:
          - { texte: "PME pilotes, co-conceptrices", statut: décision }
        couts:
          - { texte: "Formation sur site, trois PME", statut: décision }
          - { texte: "Coût d'acquisition d'une PME", statut: inconnu }
        operateurs:
          - { nom: "Accompagnateur terrain", activite: "Former les chefs de chantier sur site", voit_fait: "Chantiers sans relevé ; relancer, activer une PME", statut: décision }
          - { nom: "Support", activite: "Répondre aux gérants", voit_fait: "Compte d'une PME et historique de ses relevés", statut: hypothèse, ref: HYP-12 }

    - id: dimensionnement
      nom: "Dimensionnement par le bas"
      reference: "Estimation ascendante — pratique des cabinets de conseil en stratégie"
      question: "Quelle taille, reconstruite à partir de ce qui s'observe ?"
      porte: { wp: WP-02, file: product-thesis.md }
      exige_a: complet
      champs: [chaine]
      regles:
        - "La chaîne part d'une grandeur observable et enchaîne des opérations × ou ÷ ; une étape « = » nomme un résultat."
        - "Chaque facteur déclare son origine : sourcé, hypothèse ou règle. Un chiffre sourcé sans source est une hypothèse."
        - "Une hypothèse peut porter une fourchette ; la machine propage les fourchettes jusqu'au résultat."
        - "Un résultat « attendu » est comparé au calcul : au-delà de la tolérance, la planche est refusée."
      exemple:
        format: dimensionnement
        titre: "18 000 conducteurs et environ 22 M€ par an : un marché de niche, qui se gagne PME par PME"
        chaine:
          - { valeur: 6000, libelle: "PME du second œuvre de 20 à 100 salariés", origine: sourcé, source: "exemple fictif — à remplacer par la source réelle" }
          - { op: "×", valeur: 3, fourchette: [2, 4], libelle: "conducteurs de travaux par PME", origine: hypothèse }
          - { op: "=", libelle: "conducteurs de travaux", attendu: 18000 }
          - { op: "×", valeur: 1200, fourchette: [900, 1500], libelle: "€ par conducteur et par an", origine: hypothèse }
          - { op: "=", libelle: "€ par an : le marché adressable", attendu: 21600000 }

    - id: reservoirs
      nom: "Réservoirs de valeur"
      reference: "O. Gadiesh et J. Gilbert, « Profit Pools », HBR 1998 — adapté au chiffre d'affaires"
      question: "Où est la valeur, et laquelle personne ne prend ?"
      porte: { wp: WP-03, file: domain-profile.md }
      exige_a: complet
      champs: [reservoirs, attributs]
      regles:
        - "Chaque réservoir porte un chiffre d'affaires annuel, en valeur ou en fourchette, et dit qui l'occupe — ou qu'il est libre."
        - "Chaque réservoir renseigne tous les attributs déclarés : une comparaison à trous n'en est pas une."
        - "Tant qu'aucune marge n'est connue, la planche le dit : c'est un pool de chiffre d'affaires, pas encore de profit."
        - "« rapport » facultatif : deux valeurs unitaires dont la machine calcule le quotient."
      exemple:
        format: reservoirs
        titre: "Les suites de gestion occupent le grand réservoir ; le relevé quotidien d'avancement n'est servi par personne"
        unite: "€ par an"
        attributs: ["Qui achète", "Fréquence d'usage", "Qui le cible"]
        reservoirs:
          - nom: "Suites de gestion de chantier"
            ca: [40000000, 60000000]
            occupe_par: "trois éditeurs"
            valeurs: { "Qui achète": "Le gérant", "Fréquence d'usage": "Hebdomadaire, au bureau", "Qui le cible": "Trois éditeurs installés" }
          - nom: "Relevé quotidien d'avancement"
            ca: [8000000, 12000000]
            valeurs: { "Qui achète": "Le gérant, pour le conducteur", "Fréquence d'usage": "Chaque matin, sur site", "Qui le cible": "Personne — WhatsApp, sans structure" }

    - id: compte-inverse
      nom: "Compte de résultat inversé"
      reference: "R. McGrath et I. MacMillan, « Discovery-Driven Planning », HBR 1995"
      question: "Que faut-il qui soit vrai pour atteindre la cible ?"
      porte: { wp: WP-02, file: assumptions.md }
      exige_a: complet
      champs: [cible, chaine, exige, reference]
      regles:
        - "On part de la cible et on divise ou multiplie jusqu'à une grandeur opérationnelle : ce qu'il faut exiger du terrain."
        - "La référence est ce qui s'observe pour cette grandeur. La machine confronte l'exigence à la référence."
        - "Quand l'exigence dépasse la référence, la machine calcule ce que devrait valoir chaque levier pour fermer l'écart, et ce que la cible rapporte à la référence."
        - "Un levier borné (une part ne dépasse pas 100 %) qui devrait sortir de sa borne est déclaré impossible, pas proposé."
      exemple:
        format: compte-inverse
        titre: "Pour 250 000 € de revenu récurrent, il faut signer six PME par mois — trois fois le rythme des pilotes"
        cible: { valeur: 250000, libelle: "€ de revenu récurrent annuel à dix-huit mois", origine: cible }
        chaine:
          - { op: "÷", valeur: 1200, libelle: "€ par conducteur et par an", origine: hypothèse, levier: "Facturer", donne: "conducteurs abonnés" }
          - { op: "÷", valeur: 3, libelle: "conducteurs par PME", origine: hypothèse, levier: "Viser des PME à", donne: "PME clientes" }
          - { op: "÷", valeur: 12, libelle: "mois de commercialisation", origine: règle, donne: "PME signées par mois" }
        exige: "PME signées par mois"
        reference: { valeur: 2, libelle: "PME signées par mois pendant les pilotes", source: "trois pilotes signés en six semaines, mars-avril 2026" }

    - id: test-cards
      nom: "Cartes de test"
      reference: "Strategyzer — D. Bland et A. Osterwalder, Testing Business Ideas, 2019"
      question: "Que faut-il qui soit vrai, et comment saura-t-on que ce ne l'est pas ?"
      porte: { wp: WP-02, file: assumptions.md }
      exige_a: complet
      champs: [cartes]
      regles:
        - "Chaque carte porte : ce que l'on croit, comment on le vérifie, quand on a tort, avant quelle date, son rang."
        - "« Nous avons tort si » contient un seuil chiffré. Un seuil sans nombre ne réfute rien."
        - "Le rang ordonne les tests par ce qui peut tout arrêter, puis par coût — pas par numéro."
      exemple:
        format: test-cards
        titre: "Deux hypothèses décident du projet, et la première se tranche en quatre semaines de pilote"
        cartes:
          - { id: HYP-01, rang: 1, enjeu: "Toute la proposition", croyons: "Le chef de chantier saisit un relevé une fois par jour.", verifions: "Pilote de quatre semaines dans trois PME.", tort_si: "Moins de 60 % des jours ouvrés portent un relevé.", avant: "15 mai 2026" }
          - { id: HYP-04, rang: 2, enjeu: "La taille du marché", croyons: "La France compte 18 000 conducteurs de travaux en PME du second œuvre.", verifions: "Croisement avec les effectifs publiés par branche.", tort_si: "Moins de 10 000 conducteurs.", avant: "30 avril 2026" }

    - id: metriques
      nom: "Métriques d'entrée et de sortie"
      reference: "Amazon — controllable input metrics, lettres aux actionnaires"
      question: "Quels chiffres, et quels gestes les font bouger ?"
      porte: { wp: WP-02, file: outcomes.md }
      exige_a: complet
      champs: [resultats, entrees]
      regles:
        - "Un résultat est intermédiaire ou final ; il dit sa valeur actuelle, sa cible et sa date."
        - "Une entrée est un geste contrôlable ; elle dit quels résultats elle alimente."
        - "Chaque résultat final est atteint par au moins une entrée. Un résultat que rien n'alimente ne se pilote pas."
        - "Une entrée sans cible est consignée : c'est un vœu, pas encore une métrique."
      exemple:
        format: metriques
        titre: "Un geste par jour sur le chantier fait disparaître le point du matin — et se mesure dès la deuxième semaine"
        resultats:
          - { id: OUT-02, nom: "Chantiers relevés en moins de 48 h", aujourdhui: "non mesuré", cible: "60 %", quand: "à 90 jours", niveau: intermediaire, alimente: [OUT-01], avant_vente: true }
          - { id: OUT-01, nom: "Reporting téléphonique par conducteur", aujourdhui: "4 à 6 h par semaine", cible: "moins d'une heure", quand: "à 90 jours", niveau: final }
        entrees:
          - { nom: "Chefs de chantier formés sur site", cible: "3 par semaine", alimente: [OUT-02] }
          - { nom: "Relances des relevés manquants", alimente: [OUT-02] }

    - id: pitch
      nom: "Pitch investisseurs"
      reference: "Y Combinator — How to build your seed round pitch deck (YC Startup Library) ; K. Hale, How to Design a Better Pitch Deck, YC, 2015 ; INSEAD, New Business Venturing Lab Workbook, 2023"
      question: "Pourquoi ce produit, pourquoi maintenant, pourquoi cette équipe — qu'avons-nous prouvé, et combien faut-il pour prouver le reste ?"
      porte: { wp: WP-16, file: investor-deck.md }
      exige_a: complet
      champs: [entreprise, accroche, mantra, positionnement, planches]
      ordre: [probleme, solution, traction, apprentissages, intuition, modele, marche, concurrence, equipe, demande]
      max_points: 3
      max_mots_point: 12
      max_mots_accroche: 14
      regles:
        - "Onze planches : l'ouverture, puis l'ordre du seed deck de Y Combinator — problème, solution, traction, intuition singulière, modèle économique, marché, concurrence, équipe, la demande —, avec, après la traction, ce que les tests nous ont appris (INSEAD NBV)."
        - "L'ouverture porte l'accroche YC, le mantra de deux à quatre mots, et le positionnement en deux phrases (INSEAD NBV) : « Pour [cible] qui [besoin], [produit] est un [catégorie] qui [bénéfice]. Contrairement à [alternative principale], [différence]. » La machine compose les deux phrases."
        - "Lisible, simple, évident (K. Hale) : une idée par planche, et le titre EST l'idée. Trois points au plus, douze mots au plus, un seul grand chiffre."
        - "Rien n'est inventé pour le pitch : chaque chiffre et chaque point cite le livrable, la source ou la décision qui le fonde (WP-nn, S-nn, E-nn, DEC-nn, MET-nn), ou se déclare hypothèse HYP-nn."
        - "Le problème se raconte par UNE personne : son histoire, rattachée à un persona PER-nn de la recherche. La solution dit son résultat pour le client — de l'argent, du temps, de la facilité ou une possibilité nouvelle."
        - "La traction suit l'échelle de fiabilité (INSEAD NBV) : un propos (« j'achèterais ») < un intérêt observé sans pitcher < un acte (inscription) < un paiement (acompte, précommande). Un propos n'est jamais de la traction, une preuve SYNTHETIC non plus. La machine nomme le plus haut échelon atteint. La traction se tire des tests de marché de WP-07, jamais d'une estimation."
        - "Les apprentissages sont des cartes : nous pensions — nous avons observé — donc nous décidons, chacune rattachée à son hypothèse HYP-nn et à la fiabilité de l'observation — reprises des cartes d'apprentissage de WP-07."
        - "Le modèle économique montre son économie unitaire — valeur vie client et coût d'acquisition, déclarés et sourcés — et ses forces parmi les sept de l'évaluation NBV : coûts de changement, revenus récurrents, encaisser avant de dépenser, structure de coûts, d'autres font le travail, scalabilité, protection."
        - "Le marché se dimensionne par le bas : son chiffre vient du dimensionnement de WP-02."
        - "La concurrence est typée : directe, indirecte, future, et le statu quo — ce que la cible fait aujourd'hui sans le produit, toujours présent. L'intuition dit l'avantage déloyal : ce que les concurrents ne peuvent pas copier."
        - "L'équipe se lit par activité clé couverte, et nomme ses manques : un manque se finance par la demande."
        - "La demande est une décision du porteur : le montant, ce qu'il finance, le jalon, et les hypothèses critiques HYP-nn que cet argent va trancher."
      exemple:
        format: pitch
        titre: "ChantierClair rend au conducteur de travaux la matinée qu'il passe au téléphone — et lève 600 k€ pour le prouver sur 50 PME"
        entreprise: "ChantierClair"
        accroche: "L'avancement de chaque chantier, chaque matin, sans un appel"
        mantra: "Savoir sans appeler"
        positionnement:
          pour: "les conducteurs de travaux des PME du second œuvre"
          qui: "reconstituent chaque matin l'avancement au téléphone"
          produit: "ChantierClair"
          categorie: "un suivi de chantier en un geste"
          benefice: "montre chaque écart le jour même"
          contrairement_a: "les logiciels de chantier complets"
          difference: "il ne demande qu'un geste par jour au chef de chantier"
        planches:
          - cle: probleme
            titre: "Un conducteur passe le tiers de sa semaine à reconstituer où en sont ses chantiers"
            chiffre: { valeur: "4 à 6 h", libelle: "d'appels par semaine et par conducteur", source: WP-04 }
            histoire: { persona: PER-01, texte: "Lundi, 8 h : Karim appelle six chefs depuis sa voiture ; à 15 h il découvre sur site un retard de trois jours.", source: S-03 }
            points:
              - { texte: "Les écarts se découvrent plusieurs jours après", statut: établi, source: WP-04 }
          - cle: solution
            titre: "Un geste par jour du chef de chantier remplace le point du matin"
            resultat: { type: temps, texte: "Une matinée par semaine rendue au chantier", statut: hypothèse, ref: HYP-01 }
            points:
              - { texte: "Le chef relève l'avancement en trente secondes sur site", statut: hypothèse, ref: HYP-01 }
              - { texte: "Le conducteur voit chaque écart le jour même", statut: décision, source: WP-02 }
          - cle: traction
            titre: "11 % des visiteurs inscrits au prix affiché, trois PME prêtes à verser un acompte"
            chiffre: { valeur: "11 %", libelle: "d'inscription sur la page de prix", source: MET-03, fiabilite: action }
            points:
              - { texte: "Trois PME pilotes ont versé un acompte de 500 €", statut: établi, source: DEC-04, fiabilite: paiement }
              - { texte: "Aucun revenu récurrent : le pilote démarre en janvier", statut: établi, source: WP-15 }
          - cle: apprentissages
            titre: "Le frein n'était pas le prix mais la saisie : nous avons réduit le relevé à un geste"
            cartes:
              - { pensions: "Les gérants refuseraient 1 200 € par an", observe: "Aucun refus sur le prix en entretiens", decidons: "Garder le prix, tester l'acompte", ref: HYP-02, fiabilite: interet, source: WP-04 }
              - { pensions: "Les chefs rempliraient un formulaire", observe: "Deux applications abandonnées en trois semaines", decidons: "Un seul geste, sans formulaire", ref: HYP-01, fiabilite: action, source: S-01 }
          - cle: intuition
            titre: "Personne ne refuse de saisir : tout le monde refuse de ne pas savoir"
            avantage: { texte: "Douze ans de conduite de travaux : nous parlons la langue du chantier", statut: établi, source: SOC-01 }
            points:
              - { texte: "Les outils échouent sur la saisie, pas sur la valeur", statut: établi, source: WP-04 }
          - cle: modele
            titre: "Un abonnement par conducteur, payé par le gérant, rentable dès le dixième client"
            chiffre: { valeur: "1 200 €", libelle: "par conducteur et par an", statut: hypothèse, ref: HYP-02 }
            economie:
              ltv: { valeur: 3600, statut: hypothèse, ref: HYP-08 }
              cac: { valeur: 900, statut: hypothèse, ref: HYP-09 }
            forces: [revenus_recurrents, couts_de_changement]
          - cle: marche
            titre: "18 000 conducteurs en France, environ 22 M€ par an, gagnés PME par PME"
            chiffre: { valeur: "≈ 22 M€", libelle: "par an, dimensionné par le bas", source: WP-02 }
          - cle: concurrence
            titre: "Le vrai concurrent est le téléphone, pas les logiciels de chantier"
            points:
              - { texte: "Téléphone, tableur et visites", type: statu_quo, statut: établi, source: WP-04 }
              - { texte: "Logiciels de chantier : complets, abandonnés en quelques semaines", type: direct, statut: établi, source: S-01 }
              - { texte: "Messageries de groupe des équipes", type: indirect, statut: établi, source: S-02 }
          - cle: equipe
            titre: "Un ancien conducteur de travaux et un ingénieur qui a déjà livré du terrain"
            points:
              - { texte: "Douze ans de conduite de travaux en second œuvre", activite: "Vente aux PME", statut: établi, source: SOC-01 }
              - { texte: "Deux applications terrain livrées, 40 000 utilisateurs", activite: "Produit et terrain", statut: établi, source: SOC-01 }
            manques: ["Un responsable commercial PME, recruté avec la levée"]
          - cle: demande
            titre: "600 k€ pour prouver la rétention sur 50 PME en 18 mois"
            chiffre: { valeur: "600 k€", libelle: "pré-amorçage, 18 mois de piste", statut: décision, source: DEC-09 }
            points:
              - { texte: "60 % produit et terrain, 25 % commercial, 15 % structure", statut: décision, source: DEC-09 }
              - { texte: "Jalon : 50 PME payantes, rétention à 90 jours", statut: décision, source: WP-15 }
            tranche: [HYP-01, HYP-08]
    - id: investisseurs
      nom: "Liste d'investisseurs ciblés"
      reference: "INSEAD, New Business Venturing Lab Workbook, 2023 — chapitre 4, Identify suitable investors"
      question: "À qui présenter ce pitch, et pourquoi chacun est-il le bon investisseur pour ce produit ?"
      porte: { wp: WP-16, file: investor-shortlist.md }
      exige_a: complet
      champs: [cible, investisseurs]
      min_investisseurs: 3
      max_investisseurs: 8
      regles:
        - "Des PERSONNES, pas des structures (INSEAD NBV) : un associé d'un fonds ou un business angel, nommé par son prénom et son nom, avec sa structure à côté."
        - "Quatre critères par personne, chacun jugé oui, partiel ou non, avec la preuve qui le montre et sa source datée — profil public, base de levées, annonce : son parcours rejoint-il le secteur et le modèle économique ; est-il actif sur la géographie du produit ; son portefeuille ressemble-t-il au produit sans compter de concurrent direct ; a-t-il aidé ses participations à croître, jusqu'à une sortie ?"
        - "Un concurrent direct en portefeuille disqualifie : la personne n'a pas sa place dans la liste."
        - "Le ticket habituel se compare au montant demandé, et l'accès se déclare : chaud (une introduction, par qui) ou froid."
        - "La machine classe par adéquation et signale une liste sans trois personnes bien placées, ou sans aucune introduction chaude."
        - "Rien n'est inventé : une personne, un fonds, un ticket ou une sortie sans source n'entre pas dans la liste."
      exemple:
        format: investisseurs
        titre: "Trois investisseurs connaissent le second œuvre et les PME : deux sont joignables par introduction"
        cible: { tour: "pré-amorçage", montant: 600000, geographie: "France", secteur: "logiciel pour le bâtiment" }
        investisseurs:
          - nom: "Alice Exemple"
            structure: "Fonds Exemple Seed — exemple fictif"
            profil: S-21
            secteur: { adequation: oui, preuve: "A dirigé un éditeur de logiciel pour artisans", source: S-21 }
            geographie: { adequation: oui, preuve: "Investit en France depuis 2019", source: S-22 }
            portefeuille: { adequation: oui, preuve: "Deux SaaS pour PME du bâtiment, aucun suivi de chantier", source: S-22, concurrents: [] }
            performance: { adequation: partiel, preuve: "Une participation rachetée, les autres en croissance", source: S-23 }
            ticket: { min: 100000, max: 400000, source: S-22 }
            acces: { type: chaud, via: "ancien associé du sponsor pilote" }
          - nom: "Bruno Exemple"
            structure: "business angel — exemple fictif"
            profil: S-24
            secteur: { adequation: oui, preuve: "Vingt ans dans la distribution de matériaux", source: S-24 }
            geographie: { adequation: oui, preuve: "Actif en France et en Belgique", source: S-24 }
            portefeuille: { adequation: partiel, preuve: "Investit surtout dans la logistique", source: S-25, concurrents: [] }
            performance: { adequation: oui, preuve: "Deux sorties connues", source: S-25 }
            ticket: { min: 25000, max: 100000, source: S-25 }
            acces: { type: chaud, via: "un gérant de PME pilote" }
          - nom: "Chloé Exemple"
            structure: "Fonds Exemple Ventures — exemple fictif"
            profil: S-26
            secteur: { adequation: partiel, preuve: "Investit dans le SaaS vertical", source: S-26 }
            geographie: { adequation: oui, preuve: "Bureau à Paris", source: S-26 }
            portefeuille: { adequation: oui, preuve: "SaaS verticaux pour métiers de terrain", source: S-27, concurrents: [] }
            performance: { adequation: oui, preuve: "Trois participations ont levé leur série A", source: S-27 }
            ticket: { min: 300000, max: 1000000, source: S-27 }
            acces: { type: froid }
    - id: apprentissages
      nom: "Cartes d'apprentissage"
      reference: "INSEAD, New Business Venturing Lab Workbook, 2023 — tests de marché, échelle de fiabilité de la preuve ; Strategyzer — D. Bland et A. Osterwalder, Testing Business Ideas, 2019 — Learning Card"
      question: "Qu'ont FAIT des personnes réelles devant le produit — et quelle hypothèse critique cela tranche-t-il, à quel échelon de preuve ?"
      porte: { wp: WP-07, file: learning-cards.md }
      exige_a: complet
      champs: [hypotheses, cartes]
      regles:
        - "Les hypothèses critiques viennent des cartes de test de WP-02 : celles qui peuvent tout arrêter. Chacune dit son enjeu."
        - "Une carte par test : nous pensions · nous avons fait · nous avons observé · donc nous décidons — avec son hypothèse HYP-nn et sa source E-nn, l'export ou la réponse brute sous results/."
        - "Le critère de réussite est écrit AVANT le test, daté : un critère écrit après l'observation la confirme toujours."
        - "Chaque observation se place sur l'échelle de fiabilité : un propos (« j'achèterais ») < un intérêt observé sans pitcher < un acte (inscription, clic d'achat) < un paiement (acompte, précommande). Un propos ne confirme jamais une hypothèse ; une preuve SYNTHETIC n'est pas une observation."
        - "La machine calcule, pour chaque hypothèse critique, le plus haut échelon qui l'a tranchée, et signale quand aucune n'atteint l'acte : le socle se construirait sur des paroles."
        - "Une hypothèse infirmée n'est pas un échec : la carte dit ce que l'on décide, et la thèse WP-02 est reprise."
      exemple:
        format: apprentissages
        titre: "Le prix tient — 11 % d'inscriptions et trois acomptes — mais le formulaire tue l'usage : le relevé passe à un geste"
        hypotheses:
          - { id: HYP-02, enjeu: "Le prix : 1 200 € par conducteur et par an", critique: true }
          - { id: HYP-01, enjeu: "Le chef de chantier relève chaque jour", critique: true }
          - { id: HYP-07, enjeu: "Les gérants lisent un résumé hebdomadaire", critique: false }
        cartes:
          - id: LC-01
            ref: HYP-02
            pensions: "Les gérants accepteront 1 200 € par conducteur et par an"
            fait: "Page de prix publiée, 400 gérants ciblés sur un réseau professionnel, quatre semaines"
            critere: { texte: "Au moins 5 % des visiteurs s'inscrivent au prix affiché", ecrit_le: 2026-04-01 }
            teste_le: 2026-04-08
            observe: "44 inscriptions sur 400 visiteurs : 11 %"
            fiabilite: action
            verdict: confirmée
            decidons: "Garder le prix ; tester l'acompte auprès des inscrits"
            source: E-14
            decision: DEC-04
          - id: LC-02
            ref: HYP-02
            pensions: "Un inscrit sur dix versera un acompte"
            fait: "Acompte de 500 € proposé aux 44 inscrits"
            critere: { texte: "Au moins trois acomptes en deux semaines", ecrit_le: 2026-04-29 }
            teste_le: 2026-05-02
            observe: "Trois PME ont versé l'acompte"
            fiabilite: paiement
            verdict: confirmée
            decidons: "Ouvrir le pilote payant avec les trois PME"
            source: E-15
            decision: DEC-05
          - id: LC-03
            ref: HYP-01
            pensions: "Les chefs rempliront un formulaire quotidien"
            fait: "Maquette cliquable confiée à six chefs de chantier pendant trois semaines"
            critere: { texte: "Au moins 60 % des jours ouvrés portent un relevé", ecrit_le: 2026-04-10 }
            teste_le: 2026-04-14
            observe: "22 % des jours portent un relevé ; quatre chefs ont cessé en semaine deux"
            fiabilite: action
            verdict: infirmée
            decidons: "Un seul geste, sans formulaire — la thèse WP-02 est reprise"
            source: E-16
    - id: economie-unitaire
      nom: "Économie unitaire"
      reference: "INSEAD, New Business Venturing Lab Workbook, 2023 — économie unitaire, LTV / CAC ; D. Skok, « SaaS Metrics 2.0 », For Entrepreneurs, 2013"
      question: "Un client rapporte-t-il plus qu'il ne coûte à gagner — et en combien de temps l'argent de son acquisition revient-il ?"
      porte: { wp: WP-02, file: product-thesis.md }
      exige_a: complet
      champs: [unite, periode, revenu, cout_service, attrition, cac]
      regles:
        - "Pour UN client, sur une période déclarée (le mois ou l'année) : le revenu, le coût de le servir, l'attrition par période, le coût de l'acquérir."
        - "Chaque chiffre dit son origine — sourcé avec sa source, hypothèse avec sa référence HYP-nn, ou règle. Un coût d'acquisition sourcé cite une preuve E-nn des tests de marché ; tant qu'il n'est pas mesuré, il reste une hypothèse, et la planche le dit."
        - "La machine calcule la marge de contribution, la durée de vie (l'inverse de l'attrition), la valeur vie client, le rapport LTV / CAC et le délai de récupération. Un chiffre annoncé qui s'écarte du calcul de plus de la tolérance est refusé."
        - "Les repères — LTV / CAC d'au moins 3, récupération en moins de douze mois — se signalent ; ils ne bloquent pas. Une marge négative bloque : chaque client creuse la perte."
        - "Avec la trésorerie et la consommation mensuelle déclarées, la machine calcule la piste en mois."
      exemple:
        format: economie-unitaire
        titre: "Un conducteur abonné rapporte plus de trois fois son acquisition en marge, et la rembourse en onze mois"
        unite: "conducteur abonné"
        periode: mois
        revenu: { valeur: 100, libelle: "€ par mois, payés par le gérant", origine: hypothèse, ref: HYP-02 }
        cout_service: { valeur: 18, libelle: "€ par mois : hébergement, support, paiement", origine: hypothèse, ref: HYP-10 }
        attrition: { valeur: 0.028, libelle: "des abonnés partent chaque mois", origine: hypothèse, ref: HYP-08 }
        cac: { valeur: 900, libelle: "€ par conducteur gagné — page de prix et campagne ciblée", origine: sourcé, source: E-14 }
        tresorerie: { valeur: 600000, libelle: "€ levés", origine: règle }
        consommation: { valeur: 32000, libelle: "€ par mois", origine: hypothèse, ref: HYP-11 }
        annonce: { ltv: 2900, ratio: 3.2, recuperation: 11 }
office:
  contrat: >-
    Chaque gabarit se livre en fichier Office, celui que le lecteur ouvre déjà : PowerPoint
    quand le livrable se présente à une autorité pour qu'elle décide ou s'engage — thèse,
    parcours, périmètre et architecture de releases, design de release, restitution
    utilisateurs, résultat de slice, décisions de passage ; Word quand il se consulte et
    fait référence — spécifications, registres, preuves, règles, décisions d'architecture.
    Le Markdown reste la source que la machine contrôle ; le fichier Office en est le rendu,
    jamais une seconde vérité.
  valeurs: [pptx, docx]
  sortie: dist/gabarits/
  sortie_livrables: >-
    dist/livrables/ du projet — chaque livrable déclaré y est écrit par la tour dans le
    format de son gabarit, calculé depuis le Markdown, jamais tenu à la main.
  consigne_visible: "Consigne"
  exemple_visible: "Exemple — ChantierClair"
  a_supprimer: "Les blocs Consigne et Exemple se suppriment avant diffusion ; les crochets marquent ce qui reste à écrire."

templates:

  # ───────────────────────────── C1.1 · Initialisation ─────────────────────────────

  - id: WP-01
    format: markdown
    office: pptx
    layout: "business-model-canvas.md porte l'intention, les neuf blocs du Business Model Canvas, l'avantage, les indicateurs et le journal d'atelier"
    ouverture:
      "business-model-canvas.md":
        titre: "Le canevas du produit"
        phrase: "ChantierClair donne chaque matin aux conducteurs de travaux de PME l'avancement daté de leurs chantiers, sans appel ; le gérant le paie par chantier actif, et le pari tient si les chefs de chantier font un relevé par jour."
        essentiel:
          - "Le premier segment est nommé : le conducteur qui suit trois à huit chantiers ; c'est son gérant qui paie."
          - "La valeur se dit en ce qu'il arrête : les appels du matin, le tableur personnel, le mail du soir."
          - "Deux blocs restent des paris — le prix et le relevé quotidien — et chacun dit ce qui le tranchera."
        verifier: "Le prix de 15 € par chantier actif vient d'une intuition du sponsor, pas d'un client : il se teste auprès de cinq gérants avant le pilote. Tant qu'il n'est pas tranché, aucun budget ne se décide sur ce revenu."
    sections:
      - title: "Intention"
        file: business-model-canvas.md
        reponse: "que plus aucun conducteur ne passe sa matinée au téléphone"
        guide: "Une phrase sur ce qu'on veut faire du produit, une sur pourquoi maintenant, une sur ce qui dira que c'est réussi. Pas de fonctionnalité : une intention."
        example: |-
          **Ce qu'on veut en faire.** Que le conducteur de travaux sache où en sont ses chantiers avant 7 heures, sans appeler personne.

          **Pourquoi maintenant.** Tous les chefs de chantier ont désormais un téléphone avec appareil photo ; il y a deux ans, la moitié n'en avait pas.

          **Réussi si** les trois PME pilotes ne font plus de point téléphonique du matin au bout de trois mois.
      - title: "Segments de clients"
        file: business-model-canvas.md
        reponse: "le conducteur de travaux qui suit trois à huit chantiers ; le gérant paie"
        guide: "Qui utilise, qui paie s'il n'est pas le même, et le premier segment visé — un seul, nommé. Les autres attendent."
        example: |-
          | | Qui | Pourquoi lui |
          |---|---|---|
          | Utilisateur | Conducteur de travaux, PME du second œuvre, 3 à 8 chantiers | C'est lui qui perd ses matinées |
          | Payeur | Le gérant de la PME | Il paie déjà le logiciel de gestion |
          | Plus tard | Maîtres d'ouvrage | Ils voudront voir l'avancement — pas avant que le conducteur s'en serve |
      - title: "Opérateurs du service"
        file: business-model-canvas.md
        reponse: "l'accompagnateur terrain fait tourner le service ; il a ses écrans"
        guide: "Deux familles d'acteurs, jamais une : les clients — qui paie, qui utilise — et les OPÉRATEURS, qui font tourner le service au quotidien : coach, préparateur, livreur, support, administrateur, partenaire qui opère. Pour chacun : l'activité clé qu'il porte, et ce qu'il doit voir et faire dans le produit. Un opérateur oublié ici, ce sont ses écrans qui manqueront au socle. Ils se déclarent aussi au front-matter, dans le canevas (operateurs : nom, activité, ce qu'il voit et fait) ; « aucun opérateur » est une décision motivée (sans_operateur), jamais un silence."
        example: |-
          | Opérateur | Activité clé qu'il porte | Ce qu'il doit voir et faire dans le produit |
          |---|---|---|
          | Accompagnateur terrain | Former les chefs de chantier sur site | Les chantiers sans relevé du jour ; relancer, activer une PME |
          | Support | Répondre aux gérants | Le compte d'une PME, ses conducteurs, l'historique de ses relevés |
      - title: "Problème"
        file: business-model-canvas.md
        reponse: "l'avancement se reconstitue au téléphone, chaque matin"
        guide: "Les trois problèmes du segment, du plus coûteux au moins coûteux, et ce qu'il fait aujourd'hui à la place. Un coût sans nombre est une opinion : s'il n'y a pas de nombre, l'écrire en hypothèse."
        example: |-
          1. Reconstituer l'avancement au téléphone — quatre à six heures par semaine.
          2. Voir un écart de planning cinq jours après qu'il est apparu.
          3. Tout perdre quand un conducteur part : le suivi est dans sa tête.

          **Aujourd'hui :** des appels entre 6 h 45 et 8 h 30, un tableur personnel, des photos WhatsApp sans date de relevé.
      - title: "Proposition de valeur"
        file: business-model-canvas.md
        reponse: "à 7 heures, l'avancement daté de chaque chantier — et plus d'appels"
        guide: "Ce qui change pour lui le lendemain, et ce qu'il ARRÊTE de faire. Sans arrêt, ce n'est pas une valeur, c'est une fonctionnalité."
        example: |-
          **Le lendemain,** à 7 heures, Karim voit ses six chantiers, chacun avec un avancement daté et la manière dont il a été établi.

          **Il arrête** les appels du matin, le tableur personnel et le mail du soir au gérant.
      - title: "Canaux"
        file: business-model-canvas.md
        reponse: "par le gérant, qui l'impose à ses conducteurs"
        guide: "Comment le segment découvre le produit, l'essaie, l'adopte. Un canal par étape suffit ; « le bouche-à-oreille » n'en est un que s'il a déjà été observé."
        example: |-
          | Découvre | Essaie | Adopte |
          |---|---|---|
          | Le gérant, par son éditeur de logiciel de gestion | Un chantier pilote, un mois, gratuit | Tous les chantiers actifs, décidé par le gérant |
      - title: "Relation client"
        file: business-model-canvas.md
        reponse: "accompagnement du premier mois, puis libre-service"
        guide: "Libre-service, accompagné ou communauté — et ce qui le fait revenir chaque jour. Si rien ne le fait revenir, le dire : c'est le premier risque."
        example: |-
          Le premier mois, une demi-journée sur site avec chaque chef de chantier. Ensuite, libre-service.

          **Ce qui le fait revenir :** la notification de 7 heures — elle remplace le premier appel.
      - title: "Sources de revenus"
        file: business-model-canvas.md
        reponse: "un abonnement par chantier actif, environ 15 € par mois — à tester"
        guide: "Qui paie, combien, à quel rythme. Un prix non testé s'écrit en hypothèse avec ce qui le tranchera. « Pas encore la question » est recevable s'il est dit pourquoi."
        example: |-
          | Qui paie | Combien | Rythme | Statut |
          |---|---|---|---|
          | Le gérant | ~15 € par chantier actif | Mensuel | UNVALIDATED → HYP-02 : 3 gérants sur 5 acceptent ce prix au pilote |
      - title: "Ressources clés"
        file: business-model-canvas.md
        reponse: "l'accès en lecture au logiciel de gestion de chaque PME"
        guide: "Ce sans quoi la valeur ne se produit pas : données, accès, savoir-faire. Pas la liste de tout ce qu'il faut — ce qui manquerait le plus."
        example: |-
          - L'accès en lecture aux numéros de chantier du logiciel de gestion.
          - Un relevé par jour et par chantier — fait par le chef de chantier.
      - title: "Activités clés"
        file: business-model-canvas.md
        reponse: "obtenir le relevé quotidien, et rien d'autre"
        guide: "Ce que l'équipe doit faire excellemment. Une ou deux activités ; le reste se délègue ou attend."
        example: |-
          Faire que le chef de chantier relève chaque jour en moins d'une minute. Tout le reste en dépend.
      - title: "Partenaires clés"
        file: business-model-canvas.md
        reponse: "l'éditeur du logiciel de gestion"
        guide: "Qui apporte ce qu'on ne fera pas soi-même, et ce qu'il y gagne. Sans ce qu'il y gagne, ce n'est pas un partenaire, c'est un espoir."
        example: |-
          | Partenaire | Apporte | Y gagne |
          |---|---|---|
          | Éditeur du logiciel de gestion | L'accès aux chantiers et le premier contact avec les gérants | Une fonctionnalité de suivi qu'il n'a pas |
      - title: "Équipe par activité clé"
        file: business-model-canvas.md
        reponse: "le terrain est couvert ; la vente aux PME est le manque"
        guide: "Pour chaque activité clé du canevas : les compétences qu'elle exige — techniques, humaines, métier —, qui dans l'équipe les couvre, et ce qui manque. Puis l'expérience de création d'entreprise de l'équipe. Un manque se nomme : il se comble par un recrutement, un associé ou un partenaire, et se finance par la demande du pitch. Une équipe sans manque déclaré n'a pas été regardée."
        example: |-
          Expérience de création : une entreprise revendue par l'associé technique ; première création pour le fondateur.

          | Activité clé | Qui la couvre | Manque |
          |---|---|---|
          | Obtenir le relevé quotidien | Le fondateur — douze ans de conduite de travaux | — |
          | Produit et application terrain | L'associé technique — deux applications livrées | — |
          | Vendre aux PME | Personne | **Un commercial PME**, recruté avec la levée |
      - title: "Structure de coûts"
        file: business-model-canvas.md
        reponse: "l'accompagnement terrain coûte plus que le logiciel"
        guide: "Les postes qui décident, et ce qui coûte avant le premier revenu. Des ordres de grandeur suffisent."
        example: |-
          - Accompagnement du premier mois : une demi-journée par chef de chantier — le poste qui décide.
          - Hébergement européen et notifications : faible.
          - Avant le premier revenu : le pilote de trois mois, environ 20 jours-personne.
      - title: "Avantage difficile à copier"
        file: business-model-canvas.md
        reponse: "l'habitude du relevé quotidien, une fois prise"
        guide: "Une raison, pas cinq. « Aucun pour l'instant » est une réponse recevable — et plus utile qu'un avantage inventé."
        example: |-
          Une fois que les chefs de chantier relèvent chaque jour, l'historique daté devient la mémoire du chantier : en changer, c'est la perdre.
      - title: "Indicateurs clés"
        file: business-model-canvas.md
        reponse: "la part de chantiers relevés depuis moins de 48 heures"
        guide: "Les deux ou trois nombres qui diront que ça marche, mesurables sans rien construire. L'activité 2 les chiffre en outcomes."
        example: |-
          | Indicateur | Pourquoi | Mesuré comment |
          |---|---|---|
          | Chantiers relevés depuis moins de 48 h | Sans relevé, rien d'autre ne tient | Comptage au pilote |
          | Heures de téléphone du matin | C'est la valeur promise | Journal du conducteur, deux semaines avant et après |
      - title: "Journal d'atelier"
        file: business-model-canvas.md
        reponse: "chaque question posée, sa réponse et son issue"
        guide: "Une ligne par question : la question, la réponse retenue, qui l'a dite, l'issue — tranché ou HYP-nn UNVALIDATED. L'activité 2 le relit et ne repose rien de ce qui est tranché."
        example: |-
          | # | Question | Réponse retenue | Qui | Issue |
          |---|---|---|---|---|
          | 1 | Qu'est-ce qu'on veut en faire ? | Plus de matinée au téléphone | Sponsor | tranché |
          | 2 | Qui paie ? | Le gérant, par chantier actif | Sponsor | tranché |
          | 3 | À quel prix ? | ~15 € par mois | Sponsor | HYP-02 UNVALIDATED |

  - id: SOC-01
    format: yaml
    layout: "artifact-schema.yaml porte les entrées d'artefacts et les mappings · project.yaml porte autorités, store, correspondance classe→modèle, identité, rôles · workspace-map.yaml porte la carte de l'espace de travail"
    sections:
      - title: "Entrées d'artefacts"
        file: artifact-schema.yaml
        guide: "Une entrée par livrable du registre, clé logique en kebab-case. Ne rien inventer : chaque chemin vient de work_products.base + files. Un chemin absent ici n'existe pas (K2)."
        example: |-
          artefacts:
            release-scope:
              path: releases/{release-id}/scope.md
              category: décision
              produced_by: 13
              controlled_at: G1
              baseline: release
              lifecycle: figé
              sections: [perimetre-desirable, exclusions, etapes-couvertes, trois-tests, metriques]
      - title: "Mapping d'arborescence"
        file: artifact-schema.yaml
        guide: "Si le dépôt a déjà une convention (monorepo, dossier docs/), la déclarer ici plutôt que la contourner. Sinon, écrire « aucune convention préexistante »."
        example: |-
          arborescence:
            racine_produit: product/
            convention_preexistante: aucune
      - title: "Mapping d'identifiants"
        file: artifact-schema.yaml
        guide: "Si l'organisation impose une nomenclature (tickets JIRA, codes projet), déclarer la correspondance préfixe méthode → préfixe local. La chaîne de traçabilité reste celle de la méthode."
        example: |-
          identifiants:
            STO: { local: CC-, exemple: "STO-014 ↔ CC-214" }
            AC:  { local: —, note: "aucun équivalent local, préfixe méthode conservé" }
      - title: "Autorités de gate"
        file: project.yaml
        guide: "Une personne nommée par gate, avec la mention non délégable quand le registre l'impose. « L'équipe » n'est pas une autorité."
        example: |-
          gates:
            G0: { authority: "A. Benyahya (Product Owner)", delegable: false }
            G1: { authority: ["A. Benyahya (PO)", "N. Rami (autorité Tech)"], delegable_R3: false }
            G4: { authority: "N. Rami (autorité de release)", second_authority_R3: "S. Alaoui (HUMAN OWNER)" }
      - title: "Store d'état du backlog"
        file: project.yaml
        guide: "Un seul. Nommer l'outil et l'identifiant de la base. Deux stores, c'est deux vérités."
        example: |-
          backlog_store: { kind: notion-database, id: "2f9a…c41e", declared_at: 2026-03-02 }
      - title: "Correspondance classe de capacité → modèle"
        file: project.yaml
        guide: "Ne pas recopier la table : référencer l'adaptateur qui la porte. Le noyau ne nomme aucun modèle."
        example: |-
          capability_classes: { source: adapter, ref: build/build-adapter.mjs#MODEL }
      - title: "Identité du produit"
        file: project.yaml
        guide: "Nom recueilli auprès d'un humain à l'activité 1, date d'ouverture, emplacement racine de l'espace de travail. Jamais dérivé du nom du dépôt. Les clés sont à la RACINE du fichier, telles que le bootstrap les écrit et que la tour les relit — les enfouir sous « product: » donnerait deux formes pour une même identité."
        example: |-
          name: ChantierClair
          opened_at: 2026-03-02
          method: Autonomous Product Factory v5.0
          collected_by: "A. Benyahya"
          workspace_kind: launchpad
          workspace_root_location: "https://launchpad.example/projects/chantierclair"
      - title: "Carte de l'espace de travail"
        file: workspace-map.yaml
        guide: "Identifiants des pages d'étape, de gate et des bases, écrits par « apf notion map ». Ne jamais éditer à la main : c'est ce qui rend le rejeu idempotent."
        example: |-
          map:
            step:C1.1: "page-8a1…"
            gate:G0:  "page-8a2…"
            db:livrables: "db-77c…"
      - title: "Rôles de la méthode vers personnes"
        file: project.yaml
        guide: "Un rôle générique → une personne nommée, ou un agent nommé. Un rôle sans personne rend les colonnes Responsible et Accountable inopérantes."
        example: |-
          roles:
            Product Owner: "A. Benyahya"
            autorité Tech: "N. Rami"
            HUMAN OWNER: "S. Alaoui"
            factory-lead: "agent factory-lead (plugin)"
      - title: "RUN MODE — équipe ou solo"
        file: project.yaml
        guide: "ÉQUIPE ou SOLO, avec le nombre d'humains réellement disponibles et la date de déclaration. SOLO ne relâche aucun contrôle ni aucune autorité de gate : il ne change que le traitement de l'input absent (EX2). Le déclarer coûte une ligne ; ne pas le déclarer coûte une lettre de délégation hors cadence."
        example: |-
          run_mode:
            value: SOLO
            humans_available: 1
            declared_at: 2026-03-02
            declared_by: "A. Benyahya (Product Owner)"
            note: "BLOCKED conservé sur les décisions de sponsor, les baselines figées et le corpus réel."

  - id: SOC-02
    format: mixed
    layout: "existing-system.md porte périmètre d'inspection, architecture et dépendances · constraints.md porte contraintes structurantes et unknowns"
    ouverture:
      "existing-system.md":
        titre: "Le système en place"
        phrase: "ChantierClair se greffe sur un logiciel de gestion qui porte déjà les numéros de chantier et la facturation : on le lit, on ne le remplace pas."
        essentiel:
          - "Le logiciel de gestion est la seule source des numéros de chantier ; ChantierClair les reprend tels quels."
          - "La comptabilité reçoit un export chaque nuit : rien de ce que nous ajoutons ne doit le casser."
          - "L'application mobile archivée n'a pas pu être ouverte : des usages de terrain peuvent nous échapper."
        verifier: "L'application mobile v1 n'a pas été inspectée (accès refusé). Elle a été utilisée deux ans sur les chantiers : si elle portait un relevé terrain abandonné, savoir pourquoi vaut une matinée. Accès demandé au gérant le 3 mars."
      "constraints.md":
        titre: "Ce qui ne se négocie pas"
        phrase: "Deux règles s'imposent au produit quoi que l'on décide — les numéros de chantier de la comptabilité et l'hébergement en Europe — et une inconnue peut en changer la taille : le nombre réel de chantiers actifs."
        essentiel:
          - "Les numéros de chantier viennent de la comptabilité et ne changent pas : ChantierClair ne crée pas de chantier."
          - "Aucune donnée ne quitte l'Union européenne, par contrat et par politique interne."
          - "Personne ne sait combien de chantiers sont actifs en même temps : c'est la première mesure à faire."
        verifier: "Le nombre de chantiers actifs par PME n'est pas connu : il dimensionne la lecture du matin. Un export anonymisé est demandé au directeur financier ; sans lui, les écrans seront conçus pour six chantiers, ce qui reste une hypothèse."
    sections:
      - title: "Périmètre d'inspection déclaré"
        file: existing-system.md
        reponse: "le logiciel de gestion et le contrat d'hébergement, pas l'application mobile"
        guide: "Dire ce qui a été lu et ce qui ne l'a pas été, avec la raison. Le lecteur doit savoir sur quoi reposent les contraintes qui suivent — et où elles peuvent être fausses."
        example: |-
          | | Lu | Non lu, et pourquoi |
          |---|---|---|
          | Logiciels | Logiciel de gestion, version du 2 mars 2026 | Application mobile v1 — archivée, accès refusé |
          | Documents | Contrat d'hébergement 2025 | Exports comptables — non transmis |
      - title: "Architecture et dépendances existantes"
        file: existing-system.md
        reponse: "un logiciel de gestion unique, dont la comptabilité dépend chaque nuit"
        guide: "Décrire ce qui existe, en mots qu'un gérant comprend : ce que fait chaque brique, qui en dépend, jusqu'à quand. Ce qui est souhaité n'a pas sa place ici."
        example: |-
          Tout passe par un seul logiciel de gestion, écrit en PHP sur une base MySQL. Il tient les chantiers, les devis et les factures.

          Chaque nuit à 2 heures, il envoie un fichier à la comptabilité. C'est la seule dépendance qui ne peut pas casser : une nuit sans export, et les situations de travaux partent en retard.

          Les SMS aux clients passent par un prestataire, sous contrat jusqu'au 31 décembre 2026.
      - title: "Contraintes structurantes"
        file: constraints.md
        reponse: "deux règles que le produit ne peut pas contourner"
        guide: "Une contrainte par ligne, dite comme une règle, avec ce qu'elle impose au produit et ses deux sources indépendantes. Une seule source : c'est une piste à confirmer, pas une contrainte."
        example: |-
          | La règle | Ce qu'elle impose au produit | Sources |
          |---|---|---|
          | Un chantier porte le numéro à six chiffres de la comptabilité | ChantierClair lit les chantiers, il n'en crée jamais | Schéma de la base · entretien avec le directeur financier, 3 mars |
          | Aucune donnée hébergée hors de l'Union européenne | Hébergeur européen, sans exception pour les photos | Contrat d'hébergement, article 4 · politique RGPD interne |
      - title: "Unknowns"
        file: constraints.md
        reponse: "une inconnue, qui fixe la taille de la lecture du matin"
        guide: "Ce qui n'a pas pu être établi, pourquoi cela compte, et comment le savoir. Une inconnue ne se comble jamais par une estimation : elle s'écrit inconnue."
        example: |-
          | Ce qu'on ne sait pas | Pourquoi ça compte | Comment le savoir |
          |---|---|---|
          | Combien de chantiers un conducteur suit réellement en même temps | Trois ou huit ne donnent pas le même écran du matin | Export anonymisé des chantiers actifs, demandé le 3 mars |

  # ───────────────────────────── C1.2 · Stratégie produit ─────────────────────────────

  - id: WP-02
    format: markdown
    office: pptx
    layout: "product-thesis.md"
    ouverture:
      "product-thesis.md":
        titre: "La thèse produit"
        phrase: "Les conducteurs de travaux perdent quatre à six heures par semaine à reconstituer l'avancement de leurs chantiers au téléphone ; ChantierClair le leur donne chaque matin à 7 heures, sans une saisie de plus de leur part."
        essentiel:
          - "Le coût est mesuré : quatre à six heures par semaine, sur onze entretiens et quatre matinées observées."
          - "La seule alternative réellement utilisée est WhatsApp, sans structure ; les suites de gestion ne servent pas au suivi quotidien."
          - "Le projet s'arrête si, à 90 jours, moins de 60 % des chantiers pilotes portent un relevé de moins de 48 heures."
        verifier: "La taille du marché — environ 18 000 conducteurs en France — vient d'une source non datée. Elle ne change pas la thèse, mais elle décide de l'ambition : à vérifier avant tout budget au-delà des pilotes."
      "outcomes.md":
        titre: "Ce que le produit doit changer"
        phrase: "Deux changements mesurables chez le conducteur : le point du matin disparaît, et un écart de planning se voit en deux jours au lieu de cinq."
        essentiel:
          - "Le premier résultat se mesure en heures de téléphone, pas en utilisation de l'outil."
          - "Le second se mesure au délai entre l'apparition d'un écart et sa découverte."
          - "Les deux se lisent dès la fin du pilote, avant toute question de prix."
        verifier: "Le délai de découverte d'un écart (cinq jours) repose sur deux cas observés seulement. Il faut le mesurer sur les trois PME pilotes pendant les deux premières semaines, avant de fixer la cible."
      "assumptions.md":
        titre: "Ce qui pourrait nous donner tort"
        phrase: "Deux hypothèses décident du projet ; la première — le chef de chantier fait un relevé par jour — se tranche en quatre semaines de pilote."
        essentiel:
          - "Si le chef de chantier ne relève pas chaque jour, rien d'autre ne tient : c'est la première hypothèse à tester."
          - "Chaque hypothèse porte le seuil qui la réfuterait, écrit avant la réponse."
          - "Aucune ne demande de développement pour être testée : un formulaire et un pilote suffisent."
        verifier: "Les seuils de réfutation sont posés par le sponsor, pas calculés. Ils doivent être assumés par le Product Owner avant la première réponse du pilote, sinon ils seront discutés après."
    sections:
      - title: "Problème"
        file: product-thesis.md
        reponse: "quatre à six heures par semaine perdues à téléphoner"
        guide: "Quatre réponses, chacune sourcée : qui a le problème, comment on le sait, ce qu'il fait aujourd'hui, ce que cela lui coûte. Un coût sans nombre est une opinion."
        example: |-
          Un conducteur de travaux suit trois à huit chantiers. Chaque matin, entre 6 h 45 et 8 h 30, il appelle ses chefs de chantier un par un pour savoir où en est chacun. Deux ou trois ne répondent pas avant 8 h 30.

          | | |
          |---|---|
          | Ce que cela coûte | Quatre à six heures par semaine — onze entretiens, mars 2026 |
          | Ce que cela cause | Un écart de planning est vu cinq jours après être apparu — deux cas observés |
          | Comment on le sait | Onze entretiens et quatre matinées suivies en voiture ; biais : tous recrutés par le réseau du sponsor |
      - title: "Cible"
        file: product-thesis.md
        reponse: "le conducteur qui suit trois à huit chantiers, atteint par son gérant"
        guide: "Une personne que l'on peut décrire, un nombre avec sa source, un canal pour l'atteindre. « Les PME du bâtiment » n'est pas une cible."
        example: |-
          Karim, 41 ans, conducteur de travaux dans une PME du second œuvre, suit six chantiers et n'a pas de bureau fixe : il travaille depuis sa voiture ou sur site.

          Il n'achète pas : c'est son gérant qui paie. Trois PME partenaires ouvrent le pilote. En France, ils seraient environ 18 000 — chiffre à vérifier.
      - title: "Proposition de valeur"
        file: product-thesis.md
        reponse: "à 7 heures, l'avancement daté de chaque chantier — et plus d'appels"
        guide: "Deux phrases : ce qui change le lendemain de la mise en service, et ce que la personne ARRÊTE de faire. Sans arrêt, il n'y a pas de valeur, il y a une fonctionnalité."
        example: |-
          **Le lendemain,** à 7 heures, Karim voit ses six chantiers, chacun avec un avancement daté et la manière dont il a été établi : constaté sur place, déclaré au téléphone ou estimé.

          **Il arrête** les appels du matin, le tableur personnel et le mail du soir au gérant.
      - title: "Alternative et statu quo"
        file: product-thesis.md
        reponse: "WhatsApp suffit — jusqu'au départ d'un conducteur"
        guide: "Ce qui se passe si l'on ne fait rien, et à quel moment le coût devient visible ; qui d'autre résout le problème, avec l'usage observé ; pourquoi celle-ci gagne — une raison, pas cinq."
        example: |-
          | | Ce qui se passe | Pourquoi ça ne suffit pas |
          |---|---|---|
          | Ne rien faire | Le coût reste absorbé par le conducteur | Il devient visible au premier départ : tout le suivi part avec lui |
          | Suites de gestion de chantier | Trois PME sur onze en ont une | Aucune ne s'en sert pour l'avancement quotidien |
          | WhatsApp | Onze sur onze l'utilisent | Des photos sans date de relevé ni statut : on ne sait pas ce qui est vrai |

          **Pourquoi ChantierClair gagne :** un seul geste par jour pour le chef de chantier, aucune saisie pour le conducteur.
      - title: "Grille concurrentielle"
        file: product-thesis.md
        reponse: "le vrai concurrent est le téléphone ; nous perdons sur la complétude"
        guide: "Les alternatives typées — directe, indirecte, future, et le statu quo, ce que la cible fait aujourd'hui sans le produit, toujours présent. Trois à cinq dimensions qui comptent POUR LA CIBLE, pas pour l'équipe. Chaque case dit sa source et la qualité de sa preuve : observée, déclarée, supposée. La grille dit où le produit gagne et où il perd ; une grille où il gagne partout n'a pas été remplie honnêtement."
        example: |-
          Futur : le module de l'éditeur, inconnu — supposé. **Nous gagnons** sur l'effort et la fraîcheur ; **nous perdons** sur la complétude, par choix.

          | | Statu quo : téléphone | Direct : suites de gestion | Indirect : tableur |
          |---|---|---|---|
          | Effort du chef | Aucun — observé | Formulaire abandonné — observé | Le soir — déclaré |
          | Fraîcheur | Le matin, partielle — observé | Variable — déclaré | J+1 — déclaré |
          | Complétude | Faible — observé | **Forte** — observé | Moyenne — déclaré |
      - title: "Modèles économiques alternatifs"
        file: product-thesis.md
        reponse: "l'abonnement par conducteur, devant le prix par chantier et la licence éditeur"
        guide: "Deux modèles au moins, écrits AVANT de retenir le principal : qui paie, pour quoi, comment. Puis pourquoi le principal l'emporte, et ce qui ferait basculer vers un autre. Un modèle choisi sans alternative n'a pas été choisi."
        example: |-
          | Modèle | Qui paie | Ce qui le ferait retenir |
          |---|---|---|
          | **Retenu — 100 € par conducteur et par mois** | Le gérant | Récurrent, aligné sur la valeur |
          | 15 € par chantier actif et par mois | Le gérant | Si un conducteur a peu de chantiers |
          | Licence à l'éditeur du logiciel de gestion | L'éditeur | Si l'acquisition directe coûte trop |
      - title: "Évaluation du modèle économique"
        file: product-thesis.md
        reponse: "fort sur le récurrent et le changement ; faible sur la protection"
        guide: "Les sept forces du modèle, chacune faible, moyenne ou forte, avec son motif : coûts de changement, revenus récurrents, encaisser avant de dépenser, structure de coûts, d'autres font le travail, scalabilité, protection. Puis la force de la proposition de valeur — la douleur, sa fréquence, son urgence, la volonté de payer —, chacune sourcée. Ce tableau dit où le modèle est fragile, pas qu'il est bon."
        example: |-
          Proposition de valeur : douleur forte et quotidienne — onze entretiens ; volonté de payer observée — trois acomptes.

          | Force | Note | Motif |
          |---|---|---|
          | Revenus récurrents | Forte | Abonnement mensuel |
          | Coûts de changement | Moyenne | L'historique reste dans l'outil |
          | Protection | **Faible** | L'avance est l'usage, pas la technique |
      - title: "Économie unitaire"
        file: product-thesis.md
        reponse: "plus de trois fois l'acquisition en marge, remboursée en onze mois"
        guide: "Pour un client : le revenu, le coût de le servir, la marge de contribution, l'attrition — d'où la durée de vie et la valeur vie client, calculées —, le coût d'acquisition, tiré des tests de marché dès qu'ils l'ont mesuré, puis le rapport LTV / CAC et le délai de récupération, calculés. Chaque chiffre dit son origine : sourcé, hypothèse HYP-nn ou règle. Les repères — LTV / CAC d'au moins 3, récupération en moins de douze mois — se signalent, ils ne se cachent pas."
        example: |-
          | Pour un conducteur abonné | Valeur | Origine |
          |---|---|---|
          | Revenu − coût de service | 100 − 18 = 82 € par mois | HYP-02 · HYP-10 |
          | Durée de vie · valeur vie client | ≈ 36 mois · ≈ 2 900 € | HYP-08 · calcul |
          | Coût d'acquisition | 900 € | Sourcé — tests de marché |
          | LTV / CAC · récupération | 3,3 · 11 mois | Calcul |
      - title: "Critère d'abandon"
        file: product-thesis.md
        reponse: "moins de 60 % de chantiers relevés à 90 jours, et on arrête"
        guide: "Un résultat observable, un seuil, une date de lecture et la personne qui prononce. Écrit avant de construire, pour ne pas être réécrit après."
        example: |-
          > **Si, à 90 jours, moins de 60 % des chantiers pilotes portent un relevé constaté de moins de 48 heures, le point du matin n'a pas disparu, et le projet s'arrête.**

          Lu le 15 octobre 2026, prononcé par le Product Owner, sans report.
      - title: "Journal d'interrogatoire"
        file: product-thesis.md
        reponse: "cinq questions posées au sponsor, deux restent à tester"
        guide: "Chaque question posée pour faire apparaître une décision implicite, la réponse retenue et qui l'a dite, et son issue : tranchée, ou devenue une hypothèse à tester. Aucune question sans issue."
        example: |-
          | Question | Réponse retenue | Issue |
          |---|---|---|
          | Le chef de chantier saisira-t-il sur site ? | « Je pense que oui, une fois par jour » — le sponsor | À tester — HYP-01 |
          | Gérer le planning, ou le constater ? | Le constater d'abord | Tranchée — trois PME sur onze ont déjà un outil de planning |
          | Quel résultat ferait renoncer ? | Moins de 60 % de chantiers relevés à 90 jours | Tranchée — le sponsor, 6 mars |
      - title: "OUT-nn — énoncé"
        file: outcomes.md
        fiche: "OUT-01"
        reponse: "Le point d'avancement du matin disparaît"
        guide: "Un changement observable chez l'utilisateur, dit en résultat et jamais en fonctionnalité : « le point du matin disparaît », pas « un tableau de bord ». Une fiche par résultat ; ses champs suivent en tableau."
        example: |-
          Aujourd'hui, le conducteur appelle ses chefs de chantier chaque matin. Demain, il lit.
      - title: "Nombre suivi"
        file: outcomes.md
        champ: true
        guide: "Une grandeur, une unité, une population. Sans unité, ce n'est pas un nombre."
        example: |-
          Heures par semaine passées à reconstituer l'avancement au téléphone, par conducteur
      - title: "Valeur actuelle"
        file: outcomes.md
        champ: true
        guide: "Mesurée, avec sa source et sa date. Inconnue : l'écrire, et en faire la première mesure du plan de recherche."
        example: |-
          Quatre à six heures — onze entretiens, mars 2026
      - title: "Valeur cible et échéance"
        file: outcomes.md
        champ: true
        guide: "Un seuil et une date. La cible doit pouvoir être ratée."
        example: |-
          Moins d'une heure, 90 jours après le démarrage des pilotes
      - title: "Méthode de mesure et source de donnée"
        file: outcomes.md
        champ: true
        guide: "Qui mesure, comment, où le chiffre se lit. Une métrique qu'on ne sait pas instrumenter n'en est pas une."
        example: |-
          Journal d'appels du téléphone professionnel, relevé par le conducteur une semaine sur quatre
      - title: "HYP-nn — énoncé"
        file: assumptions.md
        fiche: "HYP-01"
        reponse: "Le chef de chantier fait un relevé par jour"
        guide: "Ce qui est supposé, dit comme un fait à vérifier. Une fiche par hypothèse ; ses champs suivent en tableau. Classer les hypothèses par ce qui peut tout arrêter, pas par numéro."
        example: |-
          Tout le produit repose sur ce geste : sans relevé quotidien, le conducteur n'a rien à lire à 7 heures.
      - title: "Trace vers OUT"
        file: assumptions.md
        champ: true
        guide: "Le résultat qui tombe si l'hypothèse est fausse."
        example: |-
          OUT-01 — sans relevé quotidien, le point du matin ne disparaît pas
      - title: "Critère de falsification"
        file: assumptions.md
        champ: true
        guide: "Le résultat chiffré qui prouverait que l'hypothèse est fausse. Un seuil sans nombre ne réfute rien."
        example: |-
          Moins de 60 % des jours ouvrés portent un relevé, sur trois PME pendant quatre semaines
      - title: "Étiquette"
        file: assumptions.md
        champ: true
        guide: "Ce que l'on sait aujourd'hui de cette hypothèse : vérifiée, observée une fois, ou seulement déclarée."
        example: |-
          Non vérifiée — déclarée par le sponsor, jamais observée
      - title: "Point de test et porteur"
        file: assumptions.md
        champ: true
        guide: "Où et quand elle sera tranchée, et la personne qui porte le test."
        example: |-
          Pilote de quatre semaines, avril 2026 — porté par le Product Owner

  - id: WP-03
    format: mixed
    office: docx
    layout: "domain-profile.md porte le profil · sources.md porte les sources approuvées · rules.md porte les règles métier, les usages non écrits, les sanctions et l'autorité"
    ouverture:
      "domain-profile.md":
        titre: "Le marché et ses règles"
        phrase: "Le second œuvre est un marché de PME à marges fines, où l'on facture à l'avancement constaté : c'est ce qui rend un avancement faux coûteux, et un avancement daté précieux."
        essentiel:
          - "Des PME de dix à soixante salariés, des chantiers de deux à neuf mois, des marchés privés en majorité."
          - "Une situation de travaux se facture sur l'avancement constaté, jamais sur une estimation."
          - "Aucune autorisation n'est requise pour un outil de suivi ; la seule contrainte forte porte sur les données personnelles."
        verifier: "La part des marchés publics dans la cible n'est pas connue : elle changerait les règles de facturation. À demander aux trois PME pilotes."
      "sources.md":
        titre: "Les sources sur lesquelles on s'appuie"
        phrase: "Trois sources font autorité pour ce produit — une norme technique, la convention collective et le contrat de marché type — et chacune a une date de lecture."
        essentiel:
          - "Une source sans date de consultation est périmée par défaut."
          - "Chaque source dit pour quoi elle fait foi, et pour quoi elle ne fait pas foi."
          - "Aucune règle de ce dossier ne repose sur la mémoire de quelqu'un."
        verifier: "Le contrat de marché type a été fourni par une seule PME : il faut vérifier qu'il est représentatif des deux autres."
      "rules.md":
        titre: "Les règles du métier"
        phrase: "Deux règles écrites et un usage non écrit gouvernent l'avancement d'un chantier ; le produit doit respecter les trois, sous peine de refus de paiement."
        essentiel:
          - "Une situation se facture sur l'avancement constaté : un avancement estimé ne peut pas être facturé."
          - "Les délais se comptent en jours ouvrés du chantier, pas en jours calendaires."
          - "Sur le terrain, un chef ne déclare « fini » qu'après le passage du conducteur."
        verifier: "Le taux de retenue de garantie n'a pas de source trouvée : il ne sera pas affiché tant qu'une source ne le fixe pas."
      "critic-definition.md":
        titre: "Le contrôleur métier"
        phrase: "Le contrôleur métier juge chaque livrable contre les règles sourcées du domaine, jamais contre sa propre mémoire — et il a été éprouvé sur un cas dont on connaissait la réponse."
        essentiel:
          - "Chaque affirmation qu'il rend porte son niveau de preuve : sourcée, observée, déduite ou inconnue."
          - "Il a trouvé l'erreur volontairement glissée dans un périmètre de test."
          - "Un contrôleur qui n'a pas été éprouvé n'est pas utilisé."
        verifier: "Il n'a été éprouvé que sur un cas. Un second cas, sur la règle des jours ouvrés, est prévu avant la première release."
      "critic-sources.md":
        titre: "Les sources du contrôleur métier"
        phrase: "Le contrôleur métier ne s'appuie que sur les trois sources approuvées du domaine, chacune datée ; tout ce qu'il affirme au-delà est marqué inconnu."
        essentiel:
          - "Trois sources, les mêmes que celles du profil de domaine."
          - "Une affirmation sans source est rendue « inconnue », jamais présentée comme un fait."
          - "La liste se relit à chaque nouvelle release."
        verifier: "Le contrat de marché type ne vient que d'une PME : le contrôleur ne peut pas encore généraliser la règle de facturation aux deux autres."
    sections:
      - title: "Profil de l'industrie"
        file: domain-profile.md
        reponse: "un marché de PME à marges fines, qui facture à l'avancement"
        guide: "Le secteur en trois paragraphes qu'un dirigeant reconnaît : qui sont les acteurs et leur taille, comment l'argent circule, qui fixe les règles. Chaque chiffre porte sa source et sa date."
        example: |-
          Le second œuvre du bâtiment réunit surtout des PME de dix à soixante salariés. Un chantier dure deux à neuf mois ; la plupart sont des marchés privés.

          L'argent circule par situations de travaux : chaque mois, l'entreprise facture la part réalisée. C'est pourquoi un avancement faux coûte cher — il est facturé, contesté, puis corrigé.

          Les règles viennent du Code de la construction et des normes techniques du métier (legifrance.gouv.fr, consulté le 10 mars 2026).
      - title: "Sources approuvées"
        file: sources.md
        reponse: "trois sources font foi, chacune datée"
        guide: "Une ligne par source : son autorité, son adresse, sa date de consultation et ce pour quoi elle fait foi. Une source non datée est périmée par défaut."
        example: |-
          | Source | Autorité | Fait foi pour | Consultée le |
          |---|---|---|---|
          | Norme de pose du carrelage | Réglementaire | Les jalons de pose | 10 mars 2026 |
          | Convention collective du bâtiment | Professionnelle | Jours ouvrés, astreintes | 10 mars 2026 |
          | Contrat de marché type d'une PME pilote | Contractuelle | Facturation par situation | 12 mars 2026 |
      - title: "Règles métier"
        file: rules.md
        reponse: "deux règles écrites que le produit doit respecter"
        guide: "Une règle par ligne, dite simplement, avec sa source et la date de sa dernière évolution. Une règle sans source est inconnue, jamais un fait."
        example: |-
          | La règle | Source | Dernière évolution |
          |---|---|---|
          | Une situation de travaux se facture sur l'avancement constaté, jamais estimé | Contrat de marché type | Janvier 2024 |
          | Les délais se comptent en jours ouvrés du chantier | Convention collective | Juin 2023 |
          | Le taux de retenue de garantie… | **Inconnu** — aucune source trouvée | — |
      - title: "Usages non écrits"
        file: rules.md
        reponse: "un chef ne dit « fini » qu'après le passage du conducteur"
        guide: "Les pratiques que personne n'écrit mais que tout le monde applique : qui les connaît, et comment on les a recueillies."
        example: |-
          Un chef de chantier ne déclare une tâche terminée qu'après le passage de son conducteur. Recueilli dans deux entretiens, le 8 mars 2026. Conséquence pour le produit : « fini » n'est pas un statut que le chef peut poser seul.
      - title: "Sanctions et autorité"
        file: rules.md
        reponse: "un avancement faux se paie en refus de paiement"
        guide: "Ce qui arrive quand une règle est violée, et qui l'applique. C'est ce qui dit au client pourquoi la règle compte."
        example: |-
          | Si l'on viole… | Ce qui arrive | Qui l'applique |
          |---|---|---|
          | La facturation sur constaté | Le maître d'ouvrage refuse de payer la situation | Le contrat de marché |
          | Le décompte en jours ouvrés | Des pénalités de retard mal calculées | Le tribunal de commerce, en cas de litige |
      - title: "Sources adossées et échelle épistémique"
        file: critic-definition.md
        reponse: "chaque affirmation dit comment on la sait"
        guide: "Pour chaque affirmation du contrôleur, son niveau de preuve : établie par une source datée, pratique observée, généralisation, déduction ou inconnue. Il cite ses sources, jamais sa mémoire."
        example: |-
          | Affirmation | Niveau de preuve |
          |---|---|
          | « Une situation se facture sur l'avancement constaté » | Établie — contrat de marché type |
          | « Les chefs déclarent fini après la visite du conducteur » | Pratique observée — deux entretiens |
          | « Le client refusera un avancement estimé » | Déduction — à ne pas présenter comme un fait |
      - title: "Cas de test connu"
        file: critic-definition.md
        reponse: "il a trouvé l'erreur que l'on avait glissée"
        guide: "Un document dont la conformité est connue d'avance, la réponse attendue, la réponse rendue, la date. C'est ce qui autorise à s'en servir."
        example: |-
          | | |
          |---|---|
          | Le cas | Un périmètre de release contenant volontairement une métrique sur avancement estimé |
          | Attendu | Refus, sur la règle de facturation au constaté |
          | Rendu | Refus, sur la bonne règle — 14 mars 2026, revu par le Product Owner |

  # ───────────────────────────── C1.3 · Parcours et tests de marché ─────────────────────────────

  - id: WP-04
    format: mixed
    office: pptx
    layout: "research-plan.md · interviews/ (un fichier par source S-nn — fil de forum, page d'avis, étude — ou par entretien E-nn en mode terrain) · insights.md · personas/PER-nn.md · empathy-maps/PER-nn.md · journeys/as-is/PER-nn.md"
    ouverture:
      "research-plan.md":
        titre: "Ce qu'il faut apprendre, et où le lire"
        phrase: "Les conducteurs de travaux écrivent déjà ce qui leur coûte — dans les avis des applications de chantier, sur les forums du métier, dans les enquêtes de la fédération. On les lit avant de leur proposer quoi que ce soit."
        essentiel:
          - "Recherche documentaire, conduite par l'agent : aucun recrutement, aucun entretien préalable."
          - "Quatre familles de sources, pour ne pas épouser le biais d'une seule : avis d'applications, forums, études publiques, statistiques."
          - "Ce que la lecture ne tranche pas devient une hypothèse, testée au pilote."
        verifier: "Ceux qui écrivent en ligne sont les plus mécontents et les plus équipés : le conducteur qui n'utilise aucune application n'y figure pas. Ce manque est écrit, et c'est la première hypothèse à tester."
      "insights.md":
        titre: "Ce que la recherche a appris"
        phrase: "Le coût n'est pas la saisie, c'est la reconstitution : le conducteur ne saisit rien, il téléphone — et c'est ce temps-là que le produit doit supprimer."
        essentiel:
          - "Le conducteur ne se plaint pas de saisir, il se plaint de ne pas savoir."
          - "Les applications abandonnées le sont pour leurs formulaires, pas pour leur prix."
          - "Un chiffre dont on ne sait pas comment il a été établi n'est pas cru."
        verifier: "Tout est DOCUMENTARY : des paroles lues, pas des comportements observés. Que le chef de chantier fasse un relevé par jour reste une hypothèse (HYP-04), testée au pilote."
    sections:
      - title: "Plan de recherche"
        file: research-plan.md
        reponse: "quatre familles de sources, deux questions à trancher, documentaire d'abord"
        guide: "Écrit et daté AVANT la collecte : les questions à trancher, les segments visés, les sources et les requêtes prévues, les biais attendus de chaque plateforme, et le mode — documentaire par défaut, terrain si des participants existent (consentement alors). Un plan écrit après coup justifie ce qu'on a trouvé."
        example: |-
          Écrit le 24 février 2026.

          | | |
          |---|---|
          | Ce qu'on veut trancher | Combien de temps coûte le point du matin ? Pourquoi les applications de suivi de chantier sont-elles abandonnées ? |
          | Qui | Conducteurs suivant trois à huit chantiers, et leurs chefs de chantier |
          | Mode | Documentaire, conduit par l'agent ; terrain au pilote |
          | Sources et requêtes | Avis des cinq applications de chantier les plus notées ; deux forums du métier (« point du matin », « suivi de chantier ») ; enquête annuelle de la fédération ; statistiques publiques du secteur |
          | Biais prévu | Les avis en ligne sur-représentent les mécontents et les plus équipés ; les forums, les entreprises de plus de vingt salariés |
      - title: "Verbatims tracés"
        file: interviews/
        guide: "Un fichier par source (S-nn) — ou par entretien (E-nn) en terrain. Chaque verbatim : adresse, date de consultation, citation LITTÉRALE entre guillemets, profil de l'auteur tel qu'il le déclare. Sans les trois premiers, le verbatim est UNVALIDATED et ne fonde rien. Jamais de paraphrase présentée en citation, jamais de citation inventée. Plateformes, échantillon réel et biais sont déclarés en tête."
        example: |-
          S-03 — forum du métier, fil « Le point du matin vous prend combien ? »
          Adresse : https://forum.exemple-btp.fr/t/point-du-matin/4812 — consulté le 2 mars 2026.
          Auteurs : conducteurs de travaux déclarés, entreprises de 10 à 80 salariés.

          > « Si le chef ne me l'a pas dit, je ne le sais pas. » — conducteur, 6 chantiers
          > « Le lundi, je passe ma matinée au téléphone. » — conductrice, gros œuvre
      - title: "Insights"
        file: insights.md
        reponse: "le coût est la reconstitution, pas la saisie"
        guide: "Un enseignement par ligne, dit en une phrase qu'un dirigeant retient, avec les verbatims qui le fondent et leur niveau d'evidence. Un enseignement fondé sur une seule source est marqué faible ; ce que la lecture ne tranche pas devient une HYP-nn."
        example: |-
          | Ce que l'on a appris | Fondé sur | Niveau · solidité |
          |---|---|---|
          | Le coût n'est pas la saisie, c'est la reconstitution : le conducteur téléphone | S-03, S-07, S-11 (forum, avis, enquête) | DOCUMENTARY · forte |
          | Les applications sont abandonnées pour leurs formulaires | S-01, S-02 (avis de deux applications) | DOCUMENTARY · moyenne |
          | Le chef fera un relevé par jour | — | HYP-04 · à tester au pilote |
      - title: "PER-nn personas"
        file: personas/
        guide: "Un proto-persona par fichier, et une planche par persona : son contexte matériel, ce qu'il doit faire, ce qu'il fait aujourd'hui, ce qui le freine, ses mots. Chaque trait cite au moins deux verbatims de sources indépendantes. Aucune donnée démographique inventée : un âge ou un chiffre sans source n'est pas écrit. Ce qui n'a été lu nulle part est dit inconnu. Étiqueté DOCUMENTARY tant qu'aucun terrain ne l'a confirmé. La planche se déclare dans le front-matter du fichier, format « persona » : citation, objectifs, frustrations, comportements, contexte et curseurs de comportement."
        example: |-
          PER-01 — le conducteur de travaux multi-chantiers · DOCUMENTARY

          Il suit plusieurs chantiers et travaille depuis sa voiture ou sur site (S-03, S-07). Il dit « où on en est », « l'écart », « à l'aveugle » — jamais « reporting » (S-03, S-11).

          Inconnu : s'il consulterait un écran en dehors des appels ; aucune source ne le dit.
      - title: "Empathy maps"
        file: empathy-maps/
        guide: "Quatre cadrans — ce qu'il dit, fait, pense, ressent — puis ses douleurs et ses gains, chaque élément avec les verbatims qui le fondent. « Dit » ne contient que des citations littérales ; « Fait » que ce que les sources rapportent qu'il fait ; « Pense » et « Ressent » sont des inférences, et chacune cite les verbatims dont elle est tirée. Ce qui n'est écrit nulle part ne va dans aucun cadran : il est dit inconnu, ou devient une HYP-nn. Une planche par persona, format « empathy-map » au front-matter."
        example: |-
          | Dit | Fait |
          |---|---|
          | « Je passe ma matinée au téléphone » (S-03) | Rappelle chaque chef le matin (S-03, S-07) |
          | **Pense** | **Ressent** |
          | « Encore une appli à remplir » (S-01, S-02) | Inconnu face à un chiffre estimé — HYP-05 |
      - title: "Journeys as-is et irritants"
        file: journeys/as-is/
        guide: "Une journée type par portrait, étape par étape, reconstituée depuis les sources : ce qu'il fait, par où il passe, ce qu'il pense, et son émotion de −2 à +2 — la courbe dit où sont les hauts et les bas. Chaque irritant est sourcé et rattaché au résultat qu'il empêche ; le point le plus bas est le moment de vérité que le produit doit changer. Une étape qu'aucune source ne décrit est marquée inconnue, pas imaginée. Une planche par persona, format « journey-map » au front-matter."
        example: |-
          | Moment | Ce qu'il fait | Ce qui coince | Source |
          |---|---|---|---|
          | Début de matinée | Appels aux chefs, depuis la voiture | Plusieurs chefs ne répondent pas avant le milieu de matinée | S-03, S-07 |
          | Après-midi | Découvre un écart sur site | L'écart date de plusieurs jours ; il l'a vu par hasard | S-07, S-11 |

  - id: WP-05
    format: markdown
    office: pptx
    layout: "journey-skeleton.md (récit et sections) · stages/STG-nn.md (une entité par étape, front-matter type: stage)"
    ouverture:
      "journey-skeleton.md":
        titre: "Le parcours client"
        phrase: "Sept étapes, dites avec les mots des conducteurs et des chefs de chantier ; le produit en couvre cinq, les deux autres sont exclues par décision."
        essentiel:
          - "Le cœur est au milieu du parcours : le chef constate, le conducteur sait où il en est, un écart est signalé."
          - "Chaque étape sert un résultat attendu ; une étape qui n'en sert aucun n'a pas sa place."
          - "La facturation et l'appel d'offres sont exclus, et la décision est écrite."
        verifier: "Le vocabulaire des étapes a été testé auprès de deux conducteurs et d'un chef seulement. Un chef de plus, sur un autre métier du second œuvre, dira s'il tient."
    sections:
      - title: "STG-nn — étapes nommées et ordonnées"
        file: journey-skeleton.md
        fiche: "STG-04"
        reponse: "« Je sais où en est mon chantier »"
        guide: "Une fiche par étape, dans l'ordre vécu, dite à la première personne avec les mots de l'utilisateur — pas ceux du métier ni ceux de l'éditeur. Ses champs suivent en tableau."
        example: |-
          C'est l'étape du matin : le conducteur ouvre ChantierClair à la place de son téléphone.
      - title: "Jalons de chaque étape"
        file: journey-skeleton.md
        champ: true
        guide: "Trois à cinq verbes, dans l'ordre. Ce seront les futurs écrans ; ne pas les dessiner ici."
        example: |-
          Consulter · comparer au planning · repérer comment l'avancement a été établi
      - title: "Trace vers PER et OUT"
        file: journey-skeleton.md
        champ: true
        guide: "Qui vit cette étape — un client ou un opérateur, déclaré au front-matter de la fiche (famille: client ou operateur ; operateur: son nom) — et quel résultat elle sert. Une étape sans résultat interroge son existence."
        example: |-
          Karim et le gérant — sert OUT-01, le point du matin disparaît
      - title: "Parcours des opérateurs"
        file: journey-skeleton.md
        reponse: "l'accompagnateur a son parcours : voir, relancer, activer"
        guide: "Le parcours de CHAQUE opérateur déclaré au canevas, en étapes STG-nn de famille operateur : ce qu'il prépare, opère, suit et corrige. Ses étapes sont des écrans du produit, au même titre que celles du client : un back-office découvert en construction est un socle incomplet. La machine refuse un opérateur du canevas sans étape (K1)."
        example: |-
          | Étape de l'accompagnateur terrain | Jalons — futurs écrans |
          |---|---|
          | « Je vois qui n'a pas relevé ce matin » | Filtrer les chantiers sans relevé · ouvrir le chantier |
          | « Je relance un chef de chantier » | Envoyer le rappel · noter l'appel |
          | « J'active une nouvelle PME » | Créer la PME · inviter ses conducteurs et ses chefs |
      - title: "Étapes hors périmètre du produit"
        file: journey-skeleton.md
        reponse: "la facturation et l'appel d'offres, exclus par décision"
        guide: "Les étapes réelles que le produit ne couvrira pas, avec la décision qui les exclut. C'est ce qui prouve que le parcours est complet, pas tronqué."
        example: |-
          | Étape réelle | Pourquoi elle n'est pas à nous |
          |---|---|
          | « Je facture la situation de travaux » | Déjà couverte par le logiciel de gestion — décision ADR-02 |
          | « Je réponds à l'appel d'offres » | En amont du chantier, hors de la cible |

  - id: WP-06
    format: mixed
    office: docx
    layout: "corpus-scope.md (périmètre) · provenance.yaml (sources et provenance par enregistrement) · truth-map.yaml (catégorie de vérité par champ) · coverage.md (couverture et écarts) · records/ (un fichier par REC-nn)"
    completion_note: "Le verdict de recevabilité appartient à critic(domaine). Le producteur du corpus ne le rend jamais — un corpus est exactement le genre d'artefact dont l'auteur ne peut pas voir les trous."
    ouverture:
      "corpus-scope.md":
        titre: "Les données réelles"
        phrase: "Le socle se construit sur les chantiers réels des trois PME pilotes — quarante-deux chantiers et leurs relevés de mars — et sur aucune donnée inventée."
        essentiel:
          - "Quarante-deux chantiers suffisent à parcourir toutes les étapes du produit de bout en bout."
          - "Les chantiers clos avant 2025 sont hors périmètre ; ils entreront avec l'historique."
          - "Les données de test existent, mais n'atteignent jamais un écran montré au client."
        verifier: "Une PME pilote n'a transmis que la moitié de ses chantiers. Tant qu'elle n'a pas complété, l'étape « je rends compte au gérant » n'est couverte qu'à 60 %."
      "coverage.md":
        titre: "Ce que les données couvrent"
        phrase: "Les données réelles couvrent six étapes sur sept à plus de 90 % ; la septième attend une PME pilote."
        essentiel:
          - "La couverture se mesure étape par étape, en nombre d'enregistrements, jamais en appréciation."
          - "L'étape « je rends compte au gérant » n'est couverte qu'à 60 %."
          - "La date de fin prévue est absente chez deux PME : elle s'affiche comme absente, pas comme vide."
        verifier: "La PME B doit transmettre ses vingt chantiers restants ; relance faite le 18 mars."
    sections:
      - title: "Périmètre du corpus"
        file: corpus-scope.md
        reponse: "quarante-deux chantiers réels, et le minimum pour tout parcourir"
        guide: "Le minimum qui rend le parcours praticable de bout en bout, dérivé des étapes et non d'une ambition d'exhaustivité ; ce qui est volontairement exclu, et quand il entrera. Un corpus qui vise l'exhaustivité ne sort jamais."
        example: |-
          | | |
          |---|---|
          | Couvre | Les étapes 1 à 7 : quarante-deux chantiers actifs des trois PME pilotes, et leurs relevés de mars 2026 |
          | Exclut | Les chantiers clos avant 2025 — ils entreront avec la release « historique » |
      - title: "Sources retenues et écartées"
        file: provenance.yaml
        guide: "Chaque source rattachée aux sources approuvées du domaine, avec sa date de lecture ; ce qui a été écarté, et pourquoi. Deux documents qui recopient la même source sont UNE source."
        example: |-
          SRC-01: { source: "export du logiciel de gestion, PME A", approved_in: sources.md, consulted_at: 2026-03-11, role: chantiers et numéros }
          SRC-02: { source: "relevés photo WhatsApp, PME A", approved_in: sources.md, consulted_at: 2026-03-11, role: avancement constaté }
          écartée: { source: "tableur personnel d'un conducteur", motif: "recopie SRC-01 — pas une seconde source" }
      - title: "Provenance par enregistrement"
        file: provenance.yaml
        guide: "Pour chaque enregistrement : la source, la date de lecture et la citation exacte. Les trois, ou l'enregistrement n'est pas vérifié et le reste."
        example: |-
          REC-014: { source: SRC-01, consulted_at: 2026-03-11, verbatim: "Chantier 204518 — Rénovation cage d'escalier — début 06/01/2026", corroborated_by: SRC-02 }
      - title: "Catégorie de vérité par champ"
        file: truth-map.yaml
        guide: "Pour chaque champ : sourcé, dérivé ou absent. Aucune quatrième valeur, et surtout pas une valeur vraisemblable. Un champ dérivé nomme sa règle et ses entrées."
        example: |-
          numero_chantier: "SOURCÉ — SRC-01"
          avancement:      "DÉRIVÉ — dernier relevé constaté, calculé depuis des relevés SOURCÉS"
          date_fin_prevue: "ABSENT — non saisie par deux PME sur trois, affichée comme absente"
      - title: "Couverture mesurée contre le squelette"
        file: coverage.md
        reponse: "six étapes sur sept couvertes à plus de 90 %"
        guide: "Chiffrée par étape : combien d'enregistrements chaque étape doit afficher, combien elle en a. « Le corpus est suffisant » n'est pas une mesure."
        example: |-
          | Étape | Couvert | Taux |
          |---|---|---|
          | « Je sais où en est mon chantier » | 42 / 42 | 100 % |
          | « Je signale un écart » | 38 / 42 | 90 % |
          | « Je rends compte au gérant » | 25 / 42 | 60 % — PME B incomplète |
      - title: "Écarts et champs non sourçables"
        file: coverage.md
        reponse: "un champ absent se montre absent, il ne se comble pas"
        guide: "Chaque écart nommé, avec la source qui manquerait pour le lever. Un champ absent est une information sur le monde : il se publie tel quel, et l'écran le dit."
        example: |-
          | Écart | Pourquoi | Ce qui le lèverait |
          |---|---|---|
          | Date de fin prévue, deux PME sur trois | Jamais saisie dans leur logiciel | Rien à court terme : affichée « non renseignée » |
          | Vingt chantiers de la PME B | Export incomplet | Le second export, relancé le 18 mars |
      - title: "Fixtures de test et leur confinement"
        file: corpus-scope.md
        reponse: "des données de test existent, et n'atteignent aucun écran client"
        guide: "S'il existe des données inventées pour les tests, dire où elles vivent et prouver qu'aucun écran montré au client ne les atteint. L'étiquette « fictif » n'a jamais empêché une donnée de circuler ; le confinement, si."
        example: |-
          Les données de test vivent dans le dossier des tests et ne sont lues que par les suites de test. Le build vérifie qu'aucune n'est présente dans les données servies au socle : zéro à ce jour.

  - id: WP-07
    format: mixed
    office: pptx
    layout: "test-plan.md (plan de tests et décisions du porteur) · learning-cards.md (cartes d'apprentissage et ce qu'elles changent ; porte le format « apprentissages ») · results/ (exports et réponses bruts, un fichier par test)"
    completion_note: "Le porteur décide chaque publication, chaque message envoyé en son nom, chaque euro dépensé : l'agent prépare le test, il ne le lance jamais seul. Une preuve SYNTHETIC — un utilisateur simulé, une réponse écrite par un agent — ne tranche aucune hypothèse."
    ouverture:
      "test-plan.md":
        titre: "Ce que nous testons, et à quel prix"
        phrase: "Trois tests, 600 € et cinq semaines tranchent les deux hypothèses qui peuvent tout arrêter : le prix et le relevé quotidien."
        essentiel:
          - "Chaque test a son critère de réussite écrit avant d'être lancé, et daté."
          - "Le test le moins cher qui tranche passe en premier : une page de prix avant un pilote."
          - "Rien n'est publié ni dépensé sans la décision du porteur."
        verifier: "Le test du relevé quotidien porte sur six chefs d'une seule PME. Un second métier du second œuvre dira si le résultat tient."
      "learning-cards.md":
        titre: "Ce que le marché nous a appris"
        phrase: "Le prix tient jusqu'au paiement ; le formulaire quotidien, non : le relevé devient un geste, et la thèse est reprise."
        essentiel:
          - "Trois PME ont versé un acompte : l'hypothèse du prix est tranchée par un paiement."
          - "22 % des jours portent un relevé, contre 60 % exigés : l'hypothèse du formulaire est infirmée par l'acte."
          - "Le résumé hebdomadaire des gérants n'est pas encore testé : il reste à valider."
        verifier: "Trois acomptes ne font pas une rétention. Le pilote payant dira si les PME restent après le premier mois."
    sections:
      - title: "Plan de tests"
        file: test-plan.md
        reponse: "trois tests, 600 € et cinq semaines pour les deux hypothèses critiques"
        guide: "Les trois à cinq hypothèses les plus critiques, reprises des cartes de test de WP-02 : celles qui peuvent tout arrêter. Pour chacune, le test le moins cher qui la tranche — page de prix, liste d'attente, faux bouton d'achat, maquette cliquable, acompte, service à la main —, son coût, sa durée, et son critère de réussite écrit avant le lancement. Un test sans critère écrit avant ne prouve rien : on lit toujours le résultat qu'on espérait."
        example: |-
          | Hypothèse | Test | Coût | Durée | Critère écrit avant (le) |
          |---|---|---|---|---|
          | HYP-02 — le prix tient | Page de prix, 400 gérants ciblés | 350 € | 4 semaines | ≥ 5 % d'inscriptions (1er avril) |
          | HYP-02 — l'inscrit paie | Acompte de 500 € aux inscrits | 0 € | 2 semaines | ≥ 3 acomptes (29 avril) |
          | HYP-01 — le chef relève | Maquette cliquable, six chefs | 250 € | 3 semaines | ≥ 60 % des jours relevés (10 avril) |
      - title: "Décisions du porteur"
        file: test-plan.md
        reponse: "chaque page, chaque message, chaque euro décidé par le porteur"
        guide: "Ce que le porteur a décidé pour que les tests soient lancés : la page publiée et où, le message envoyé en son nom et à qui, le budget engagé — chacun avec sa décision DEC-nn datée. L'agent prépare, le porteur lance : aucun test ne parle au marché au nom du porteur sans lui."
        example: |-
          | Décision | Ce qu'elle autorise | Par | Le |
          |---|---|---|---|
          | DEC-04 | Publier la page de prix, 350 € de campagne ciblée | Le porteur | 31 mars 2026 |
          | DEC-05 | Proposer l'acompte de 500 € aux inscrits | Le porteur | 28 avril 2026 |
      - title: "Cartes d'apprentissage"
        file: learning-cards.md
        reponse: "le prix tranché par un paiement, le formulaire infirmé par l'acte"
        guide: "Une carte par test : nous pensions · nous avons fait · nous avons observé · échelon de fiabilité · donc nous décidons. L'échelon se lit sur l'échelle de la preuve : un propos (« j'achèterais ») < un intérêt observé sans pitcher < un acte (inscription, clic d'achat) < un paiement (acompte, précommande). Un propos ne confirme rien ; une réponse simulée par un agent n'est pas une observation. Chaque carte cite son hypothèse HYP-nn et sa source E-nn."
        example: |-
          LC-01 · HYP-02 · acte
            Nous pensions — les gérants accepteront 1 200 € par conducteur et par an.
            Nous avons fait — une page de prix, 400 gérants ciblés, quatre semaines.
            Nous avons observé — 44 inscriptions sur 400 visiteurs : 11 %, pour 5 % exigés. (E-14)
            Donc nous décidons — garder le prix, et tester l'acompte.
      - title: "Résultats bruts"
        file: results/
        reponse: "chaque chiffre a son export sous results/"
        guide: "Les exports, réponses et paiements tels qu'ils sont sortis de l'outil — un fichier par test, daté, sous results/, référencé E-nn au registre de preuves. Jamais seulement le chiffre résumé : un chiffre sans son export ne se revérifie pas."
        example: |-
          results/
            2026-04-08-page-de-prix.csv        E-14 · 400 visites, 44 inscriptions
            2026-05-02-acomptes.csv            E-15 · 3 paiements de 500 €
            2026-04-14-releves-maquette.csv    E-16 · 90 jours ouvrés, 20 relevés
      - title: "Ce que les tests changent"
        file: learning-cards.md
        reponse: "la thèse est reprise sur le relevé, le prix est gardé"
        guide: "Chaque hypothèse infirmée est routée vers la thèse, qui est reprise ; chaque hypothèse non tranchée reste non validée, avec son prochain test et sa date. Le socle ne se construit que sur ce que les tests ont laissé debout."
        example: |-
          | Hypothèse | Verdict | Plus haut échelon | Conséquence |
          |---|---|---|---|
          | HYP-02 — le prix | Confirmée | Paiement | Gardée ; le pilote payant démarre |
          | HYP-01 — le formulaire quotidien | Infirmée | Acte | La thèse est reprise : un seul geste par jour |
          | HYP-07 — le résumé des gérants | Non tranchée | — | Testée pendant le pilote, avant le 30 juin |

  # ───────────────────────────── C1.4 · Socle produit ─────────────────────────────

  - id: WP-08
    format: executable
    office: docx
    layout: "design-brief.md · explorations/ (une direction construite par dossier) · surface-briefs/ (un brief par surface) · tokens.css · tokens.json · fonts/ · icons/ · components/ (un dossier par composant) · component-catalog.html"
    ouverture:
      "design-brief.md":
        titre: "Le brief de conception"
        phrase: "ChantierClair se lit d'un coup d'œil, au soleil, sur un téléphone Android, en trente secondes : c'est la barre, et elle a été fixée avec le Product Owner avant la première maquette."
        essentiel:
          - "Le public prioritaire est le conducteur ; quand ses besoins contredisent ceux du gérant, le conducteur l'emporte."
          - "La référence de qualité est une application bancaire mobile, pas un logiciel de gestion."
          - "On est parti du départ standard, adapté : l'accent lime, illisible au soleil, a été assombri."
        verifier: "La lisibilité au soleil n'a été vérifiée que sur un modèle de téléphone. À tester sur les appareils des trois PME pilotes."
    sections:
      - title: "Brief de conception"
        file: design-brief.md
        reponse: "lisible au soleil, en trente secondes, sur un téléphone"
        guide: "Rempli avec la personne qui répond du produit, en quatre questions au plus, avant la première décision visuelle : le public prioritaire quand deux publics se contredisent, la barre de qualité, la référence à égaler, ce qui est interdit. Aucune des quatre ne se devine."
        example: |-
          | | |
          |---|---|
          | Public prioritaire | Le conducteur, avant le gérant |
          | Barre de qualité | Lisible au soleil, compris en trente secondes, sans formation |
          | Référence à égaler | Une application bancaire mobile |
          | Interdit | Un écran qui ressemble à un logiciel de gestion |
      - title: "Design system de départ et décision"
        file: design-brief.md
        reponse: "le départ standard adapté : on garde la structure, on change l'accent"
        guide: "Le départ servi par la tour, appliqué à un vrai écran du produit avant toute autre exploration, puis une seule question à la personne qui répond du produit : on le garde, on l'adapte, on l'écarte. Consigner la décision, ce qui change s'il est adapté, qui a tranché et quand. Un départ n'est jamais une marque : ni nom, ni logo, ni illustration, ni police propriétaire de la référence."
        example: |-
          | | |
          |---|---|
          | Départ | « Départ standard » — servi par la tour |
          | Montré sur | Le fil du matin, avec les quarante-deux chantiers réels |
          | Décision | **Adapté** — Product Owner, 18 mars 2026 |
          | Gardé | Vert forêt dominant, formes en pilule, titres très gras, surfaces plates sans ombre |
          | Changé | L'accent lime devient un vert plus sombre : au soleil, le lime ne se lit pas sur fond clair |
          | Retiré | Les illustrations de la référence ; la typographie reste en Inter, 900 pour les titres |
      - title: "Stack de conception et base de composants"
        file: design-brief.md
        reponse: "une base de composants accessible achetée, un seul écran sur mesure"
        guide: "Arrêtée avant la première décision visuelle : l'outil de conception, la base de composants accessibles, la cible de la preview. Puis la ligne qui compte : ce que la base fournit, et ce qu'il faudra dessiner soi-même."
        example: |-
          Application web mobile, bibliothèque de composants accessibles open source, preview déployée à chaque modification.

          **Ce que la base fournit :** listes, formulaires, navigation, états d'erreur. **Ce qu'on dessine :** le relevé de chantier, seul écran propre au métier.
      - title: "Directions concurrentes et direction retenue"
        file: explorations/
        guide: "Départ gardé : il est la direction retenue, et l'ADR le dit en une ligne. Adapté ou écarté : un dossier par direction, au moins trois — le départ compris —, chacune poussée à fond sur les mêmes données réelles. Les directions écartées sont conservées : un dossier vide prouve qu'aucun choix n'a eu lieu."
        example: |-
          Départ adapté : trois directions construites sur les mêmes quarante-deux chantiers — « Départ standard » tel quel, « Départ standard » à accent sombre, « carte des chantiers ».

          Retenue : l'accent sombre — c'est la seule lisible au soleil. Les deux autres sont conservées avec le motif de leur rejet.
      - title: "Brief de surface et contrat de direction"
        file: surface-briefs/
        guide: "Un fichier par écran important : l'idée qu'il porte et ce qu'il refuse, son langage visuel, ce que l'utilisateur doit comprendre, ce qui est interdit."
        example: |-
          **Le fil du matin.** Une ligne par chantier, du plus en retard au plus avancé. Refuse le tableau de bord à jauges. L'utilisateur comprend en trente secondes lequel appeler. Interdit : un chiffre sans sa date de relevé.
      - title: "Tokens"
        file: tokens.json
        guide: "Dérivés du départ retenu, au format W3C Design Tokens ($value, $type, $description) : chaque couleur avec son rôle, polices, typographie, espacements, rayons, ombres, surfaces ; puis grilles et points de rupture. Gardé ou adapté : partir du tokens.json du départ, retirer ce qui n'est pas une valeur (intervalles, échelles d'extraction) et remplacer la police propriétaire. Une source (tokens.json) et des exports générés — tokens.css, et le thème Tailwind si la stack le retient —, jamais deux fichiers tenus à la main."
        example: |-
          tokens.json  "color": {
                         "green-900": { "$value": "#163300", "$type": "color", "$description": "Texte fort, surfaces sombres — repris du départ" },
                         "accent":     { "$value": "#2F6B12", "$type": "color", "$description": "Action principale — remplace le lime, illisible au soleil" } },
                       "font": { "display": { "$value": "Inter", "$type": "fontFamily", "$description": "Titres en 900 — repris du départ" } },
                       "radius": { "button": { "$value": "9999px", "$type": "dimension" } }
          tokens.css   --color-green-900: #163300;  (généré depuis tokens.json)
          Repris du départ : les dix tailles nommées, de micro (12px) à display (105px). Retiré : --section-gap « 64-80px » (pas une valeur CSS).
      - title: "Composants et variantes"
        file: components/
        guide: "Chaque composant montre ses sept états : normal, survol, focus, erreur, vide, chargement, désactivé. Une variante est justifiée par un parcours, pas par un goût."
        example: |-
          Ligne de chantier — sept états, deux variantes : « à jour » et « relevé de plus de 48 heures », justifiée par le résultat « un écart vu en deux jours ».
      - title: "Accessibilité"
        file: component-catalog.html
        guide: "Contraste WCAG AA vérifié par outil sur chaque paire fond/texte, résultat joint. Le nom de l'outil et la date font partie de la preuve."
        example: |-
          axe-core 4.9 · 2026-03-22 · 0 violation · contraste minimal mesuré 4,6:1 (badge ESTIMÉ sur fond carte)
      - title: "Catalogue navigable"
        file: component-catalog.html
        guide: "Un fichier HTML statique qui s'ouvre sans serveur ni build, listant chaque composant dans ses 7 états. Si Storybook, exporter en statique."
        example: |-
          C1.4-socle/design-system/component-catalog.html · ouvrable en double-clic · 14 composants · 98 états rendus

  - id: WP-09
    format: mixed
    office: docx
    layout: "navigation.md · information-architecture.md · glossaire-utilisateur.md (TRM-nn et trace TRM → STG)"
    ouverture:
      "navigation.md":
        titre: "La navigation"
        phrase: "Trois entrées suffisent — le fil du matin, un chantier, les écarts — et chaque étape du parcours est atteignable en deux gestes."
        essentiel:
          - "L'entrée par défaut est le fil du matin : c'est ce que le conducteur ouvre à 7 heures."
          - "Aucune étape du parcours n'est à plus de deux gestes."
          - "Le gérant n'a pas d'entrée à lui au premier cycle : il reçoit un compte rendu."
        verifier: "La navigation n'a été testée qu'en maquette. Le pilote dira si le conducteur cherche une quatrième entrée."
      "information-architecture.md":
        titre: "L'organisation de l'information"
        phrase: "Tout part du chantier : un relevé appartient à un chantier, un écart à un relevé ; il n'y a qu'un endroit pour chaque chose."
        essentiel:
          - "Le chantier est l'objet central ; il vient du logiciel de gestion."
          - "Un relevé n'existe qu'attaché à un chantier, avec sa date et son auteur."
          - "Un écart est accessible depuis le chantier et depuis la liste des écarts — c'est le seul double chemin, et il est voulu."
        verifier: "La place du planning n'est pas tranchée : il est lu dans le logiciel de gestion, mais deux PME le tiennent dans un tableur."
      "glossaire-utilisateur.md":
        titre: "Les mots du produit"
        phrase: "Chaque mot de l'interface est celui que disent les conducteurs et les chefs de chantier ; les mots du métier et de l'éditeur ont été écartés un à un."
        essentiel:
          - "« Où on en est » remplace « avancement » : c'est ce que disent les conducteurs."
          - "« Constaté », « déclaré », « estimé » disent comment un chiffre a été établi."
          - "Un mot qui n'apparaît dans aucune étape du parcours est retiré."
        verifier: "« Écart » est compris par les conducteurs, pas encore testé auprès des chefs de chantier."
    sections:
      - title: "Navigation globale"
        file: navigation.md
        reponse: "trois entrées, et chaque étape à deux gestes"
        guide: "Les entrées de premier niveau, dans leur ordre, chacune rattachée aux étapes du parcours qu'elle sert. Chaque étape doit être atteignable."
        example: |-
          | Entrée | Ce qu'on y fait | Étapes servies |
          |---|---|---|
          | Le fil du matin | Voir tous ses chantiers, du plus en retard au plus avancé | « Je sais où en est mon chantier » |
          | Un chantier | Lire le dernier relevé et son historique | « Je constate », « Je sais où en est mon chantier » |
          | Les écarts | Voir ce qui a été signalé et par qui | « Je signale un écart » |
      - title: "Architecture de l'information"
        file: information-architecture.md
        reponse: "tout part du chantier, chaque chose a un seul endroit"
        guide: "Les objets du produit, leur hiérarchie, leurs liens, et l'endroit où vit chacun. Un objet atteignable par deux chemins est déclaré comme tel."
        example: |-
          | Objet | Appartient à | Où il vit |
          |---|---|---|
          | Chantier | — (vient du logiciel de gestion) | Le fil du matin, la fiche chantier |
          | Relevé | Un chantier | La fiche chantier |
          | Écart | Un relevé | La fiche chantier **et** la liste des écarts — double chemin voulu |
      - title: "TRM-nn glossaire utilisateur"
        file: glossaire-utilisateur.md
        fiche: "TRM-01"
        reponse: "« Où on en est »"
        guide: "Une fiche par terme : sa définition en une phrase, qui l'a validé, les mots écartés qu'il remplace. Chaque terme est unique et sans ambiguïté."
        example: |-
          L'état d'un chantier au dernier relevé, avec sa date. Validé auprès de deux conducteurs ; remplace « avancement » et « reporting ».
      - title: "Trace TRM → STG"
        file: glossaire-utilisateur.md
        champ: true
        guide: "Les étapes du parcours où le terme apparaît. Un terme sans étape est superflu."
        example: |-
          « Je sais où en est mon chantier » · « Je rends compte au gérant »

  - id: WP-10
    format: mixed
    office: docx
    layout: "semantics.md (catégories, propagation, classement) · semantics.yaml (glossaire et catégories, couche machine) · status-model.md · financial-semantics.md · schema.introspected.yaml (schéma exécuté, extrait par le projet) · model.generated.md (généré) · binding.yaml (table de liaison) · migrations.md"
    ouverture:
      "semantics.md":
        titre: "Ce que les chiffres veulent dire"
        phrase: "Chaque avancement affiché dit comment il a été établi — constaté sur place, déclaré au téléphone ou estimé par calcul — et un calcul ne rend jamais un chiffre plus sûr que ses entrées."
        essentiel:
          - "Trois catégories, qui ne se recouvrent pas : constaté, déclaré, estimé."
          - "Un avancement calculé à partir d'un chiffre déclaré reste déclaré, jamais constaté."
          - "La date de relevé fait partie du noyau : la changer invaliderait tout ce qui a été livré."
        verifier: "La catégorie « déclaré » suppose que l'on sait qui a parlé au téléphone. Le pilote dira si le chef accepte de le noter."
      "status-model.md":
        titre: "La vie d'un chantier"
        phrase: "Un chantier passe par quatre états, et seul le conducteur peut le déclarer terminé."
        essentiel:
          - "Quatre états : ouvert, en cours, en retard, terminé."
          - "« En retard » se calcule, il ne se déclare pas."
          - "« Terminé » est un état final ; seul le conducteur le pose, après visite."
        verifier: "La règle « terminé après visite du conducteur » vient de deux entretiens : elle est à confirmer pendant le pilote."
      "financial-semantics.md":
        titre: "Ce qui touche à l'argent"
        phrase: "ChantierClair ne facture rien et n'affiche aucun montant : il donne l'avancement que la facturation utilisera, et c'est précisément pourquoi il doit être constaté."
        essentiel:
          - "Aucun montant n'est affiché au premier cycle."
          - "L'avancement constaté est celui qui peut servir à facturer une situation."
          - "Un avancement estimé porte la mention « ne pas facturer »."
        verifier: "La mention « ne pas facturer » a été validée par le contrôleur métier sur un seul cas."
      "migrations.md":
        titre: "Les évolutions du modèle"
        phrase: "Aucune migration n'a encore eu lieu ; chacune sera rattachée à la demande qui la motive et dira si elle se défait."
        essentiel:
          - "Une migration sans demande à l'origine est un changement de socle non déclaré."
          - "Chaque migration dit si elle est réversible."
          - "Le journal commence vide, et c'est normal avant la première release."
        verifier: "Rien à vérifier tant qu'aucune migration n'a eu lieu."
    sections:
      - title: "Catégories de vérité"
        file: semantics.md
        reponse: "constaté, déclaré, estimé — et rien d'autre"
        guide: "Deux à quatre catégories qui ne se recouvrent pas, chacune définie par la façon dont la donnée a été obtenue, jamais par sa valeur. Montrer qu'elles ne se recouvrent pas."
        example: |-
          | Catégorie | Comment le chiffre a été obtenu |
          |---|---|
          | Constaté | Vu sur place par un humain, photo à l'appui |
          | Déclaré | Dit par quelqu'un, sans que personne l'ait vu |
          | Estimé | Calculé à partir d'autres chiffres |

          Aucun chiffre ne peut être à la fois vu et non vu : les trois ne se recouvrent pas.
      - title: "Modèle de statuts et progression"
        file: status-model.md
        reponse: "quatre états, et seul le conducteur termine un chantier"
        guide: "Les états, les passages autorisés et qui les déclenche. Un état qu'on ne peut pas atteindre est mort ; un état sans sortie est final et doit le dire."
        example: |-
          | De | Vers | Qui déclenche |
          |---|---|---|
          | Ouvert | En cours | Le premier relevé |
          | En cours | En retard | Le calcul, si le relevé dépasse le planning |
          | En cours ou en retard | Terminé | Le conducteur, après visite — état final |
      - title: "Règles financières structurantes"
        file: financial-semantics.md
        reponse: "aucun montant, et un estimé ne se facture pas"
        guide: "Les règles qui touchent l'argent, chacune revue par le contrôleur métier. Si le produit ne manipule pas d'argent, l'écrire."
        example: |-
          | Règle | Revue par le contrôleur métier |
          |---|---|
          | Le produit n'affiche aucun montant au premier cycle | Oui, 14 mars 2026 |
          | Un avancement estimé porte « ne pas facturer » | Oui, 14 mars 2026 |
      - title: "Règle de propagation"
        file: semantics.md
        reponse: "un calcul ne rend jamais un chiffre plus sûr"
        guide: "Une phrase qui ne se contourne pas, et sa table : un calcul n'améliore jamais la catégorie de ses entrées."
        example: |-
          **Un calcul prend la catégorie la plus faible de ses entrées.**

          | Entrées | Résultat |
          |---|---|
          | Constaté + constaté | Constaté |
          | Constaté + déclaré | Déclaré |
          | Tout calcul | Au mieux estimé |
      - title: "Modèle dérivé"
        file: model.generated.md
        guide: "Entités, champs, relations EXTRAITS du schéma exécuté par « apf model ». Ce fichier est généré : l'éditer à la main est une dérive détectée."
        example: |-
          model.generated.md · dérivé de db/schema.sql @ 3c1e0aa · 2026-05-02 · 6 entités, 41 champs
      - title: "Table de liaison"
        file: binding.yaml
        guide: "Chaque entité et chaque champ → un TRM-nn et une catégorie de vérité. Un élément non résolu est listé en tête, jamais omis : c'est une dérive sémantique."
        example: |-
          releve.avancement_pct: { terme: "relevé", verite: CONSTATÉ }
          jalon.date_prevue: { terme: "jalon", verite: ENGAGÉ }
          non_resolus: 0
      - title: "Classement du noyau"
        file: semantics.md
        reponse: "la date de relevé et sa catégorie sont intouchables"
        guide: "Chaque donnée du noyau classée intouchable ou extensible, selon ce qu'invaliderait sa modification. Le classement est figé au passage de porte."
        example: |-
          | Donnée | Classement | Pourquoi |
          |---|---|---|
          | Date du relevé | Intouchable | Tout avancement livré en dépend |
          | Catégorie de vérité | Intouchable | C'est ce que le client croit |
          | Commentaire du chef | Extensible | Rien n'en dépend |
      - title: "Journal des migrations"
        file: migrations.md
        reponse: "vide avant la première release"
        guide: "Une ligne par migration : ce qu'elle change, la demande qui la motive, si elle se défait. Une migration sans demande est un changement de socle non déclaré."
        example: |-
          | Migration | Motivée par | Réversible |
          |---|---|---|
          | — | Aucune migration avant la première release | — |

  - id: WP-11
    format: executable
    office: docx
    layout: "src/ (source) · dist/index.html (build statique) · spine.yaml (STG → écran, commit figé)"
    ouverture:
      "C1.4-socle/prototype/current/unsubordinated.md":
        titre: "Les écrans non autorisés"
        phrase: "Après composition, aucun écran ne sort du parcours ni des évolutions déclarées : la liste est vide, et c'est la cible."
        essentiel:
          - "Un écran qui ne sert aucune étape est un design non autorisé, pas une nouveauté."
          - "La liste se recalcule à chaque composition du prototype."
          - "Elle est vide à ce jour."
        verifier: "Rien à vérifier tant que la liste reste vide."
    sections:
      - title: "Source exécutable"
        file: C1.4-socle/prototype/spine/src/
        guide: "Le code du socle, sur la stack de conception arrêtée en WP-08 et sur la base de composants qu'elle nomme. Un README d'exécution en une commande. Écrire ici ce que le socle réutilise et ce qu'il a fallu écrire : une chaîne de rendu propriétaire pour quinze écrans est un signal, pas un détail d'implémentation."
        example: |-
          C1.4-socle/prototype/spine/src/ · Next.js + shadcn/ui · npm run build · 6 composants réutilisés, 3 écrits
      - title: "Build et URL de preview DÉPLOYÉE"
        file: C1.4-socle/prototype/spine/dist/index.html
        guide: "L'URL DÉPLOYÉE, avec son commit, ouvrable sans rien installer. Un fichier local à ouvrir depuis un clone du dépôt ne vaut pas preview : personne ne le regarde, et un livrable de design que personne ne regarde ne prouve rien."
        example: |-
          preview https://spine-c90f2a7.preview.example @ c90f2a7 · déployée le 2026-03-18
      - title: "Couverture du squelette"
        file: C1.4-socle/prototype/spine/dist/index.html
        guide: "Une table STG → écran d'entrée, prouvant que chaque étape est atteignable depuis la navigation. Une STG sans écran est un défaut bloquant."
        example: |-
          couverture: { etapes_atteignables: "7/7", etapes_cassees: 0 }
      - title: "Liaison au corpus réel"
        file: C1.4-socle/prototype/spine/src/
        guide: "Le chemin de données du socle vers WP-06, nommé et vérifiable. ZÉRO fixture atteignable depuis ce livrable : le point est éliminatoire. Un socle sur données inventées a déjà franchi G0 une fois — il était conforme aux huit contrôles et ne disait rien de vrai, et la cadence entière a été à refaire."
        example: |-
          src/data → data/corpus/records/ (lecture seule) · 214 REC · 0 fixture sur le chemin servi
      - title: "Rendu des champs ABSENTS"
        file: C1.4-socle/prototype/spine/src/
        guide: "Un champ que le corpus ne source pas est rendu comme absent, et l'interface dit pourquoi. Jamais un tiret muet, jamais une valeur vraisemblable. L'absence est une information sur le monde ; la combler est une invention à laquelle l'utilisateur croira."
        example: |-
          portrait: null → « aucun portrait sourcé » · montant: ABSENT → « non publié par la source »
      - title: "Composition"
        file: C1.4-socle/prototype/current/index.html
        guide: "Rien à écrire : la composition est calculée socle ⊕ deltas de release ⊕ deltas de slice. Vérifier seulement que « apf compose » a tourné après le dernier delta."
        example: |-
          apf compose · 2026-05-20 · socle c90f2a7 ⊕ REL-pilotage f08b6d2 ⊕ S-01 2b7e… ⊕ S-02 9d4c…
      - title: "Manifeste de composition"
        file: C1.4-socle/prototype/current/manifest.yaml
        guide: "Commit du socle, baseline de release, liste ordonnée des deltas de slice, horodatage. Généré."
        example: |-
          spine: c90f2a7
          release: rel-pilotage-v1
          slices: [S-01, S-02]
          composed_at: "2026-05-20T17:02Z"
      - title: "Couverture du squelette"
        file: C1.4-socle/prototype/current/manifest.yaml
        guide: "Chaque STG reste atteignable après composition. Une étape devenue inatteignable est un défaut de subordination, listé ici."
        example: |-
          couverture: { etapes_atteignables: "7/7", etapes_cassees: 0 }
      - title: "Écarts non subordonnés"
        file: C1.4-socle/prototype/current/unsubordinated.md
        reponse: "aucun écran hors parcours"
        guide: "Tout écran présent après composition qui ne sert ni une étape du parcours ni une évolution déclarée. Un design non autorisé, pas une nouveauté. La cible est une liste vide."
        example: |-
          Aucun écran hors parcours à la composition du 20 mars 2026.
      - title: "URL de preview courante"
        file: C1.4-socle/prototype/current/manifest.yaml
        guide: "Une seule, celle que le métier ouvre. Toute autre URL de prototype est périmée par définition."
        example: |-
          preview_url: "https://preview.example/current"
          composee_le: "2026-05-20"

  - id: WP-12
    format: mixed
    office: docx
    layout: "target-architecture.md (vue d'ensemble, classement, couverture) · integration-boundaries.md · data-persistence.md · deployment-topology.md · security-architecture.md · non-functional.md"
    ouverture:
      "integration-boundaries.md":
        titre: "Ce que le produit possède, et ce qu'il emprunte"
        phrase: "ChantierClair possède les relevés et en est seul responsable ; il emprunte les chantiers au logiciel de gestion, en lecture seule, chaque nuit."
        essentiel:
          - "Un seul échange avec l'existant : la lecture des chantiers, chaque nuit."
          - "ChantierClair n'écrit jamais dans le logiciel de gestion."
          - "Les photos restent chez nous, jamais dans le logiciel de gestion."
        verifier: "Le logiciel de gestion n'a pas d'interface documentée : la lecture passe par l'export existant, dont le format peut changer sans préavis."
      "data-persistence.md":
        titre: "Où vivent les données"
        phrase: "Les relevés vivent dans une base relationnelle hébergée en Europe, et la catégorie de chaque chiffre y est une colonne, jamais une déduction."
        essentiel:
          - "Une base relationnelle, parce que les relevés se comparent dans le temps."
          - "La catégorie de vérité est stockée, pas recalculée."
          - "Les photos vont dans un stockage d'objets européen."
        verifier: "Le volume de photos par chantier n'est pas connu : il fixe le coût de stockage."
      "deployment-topology.md":
        titre: "Où tourne le produit"
        phrase: "Trois environnements chez un hébergeur européen — développement, recette, production — et un seul artefact, construit une fois et promu de l'un à l'autre."
        essentiel:
          - "Tout est hébergé dans l'Union européenne, conformément au contrat existant."
          - "La recette reçoit, à l'octet près, la version validée en développement ; la production, seulement après deux décisions humaines distinctes."
          - "Aucun serveur n'est administré à la main ; pas de préproduction tant qu'aucune preuve ne la demande."
        verifier: "Le choix de l'hébergeur européen reste à confirmer par le gérant sur le prix."
      "security-architecture.md":
        titre: "Qui peut voir quoi"
        phrase: "Un chef de chantier ne voit que ses chantiers, un conducteur ceux qu'il suit, le gérant tous ceux de son entreprise — et aucune entreprise ne voit les données d'une autre."
        essentiel:
          - "La séparation entre entreprises est la règle la plus sensible."
          - "Les photos de chantier peuvent montrer des personnes : elles sont traitées comme données personnelles."
          - "La connexion se fait par lien envoyé au téléphone, sans mot de passe."
        verifier: "Le traitement des photos montrant des personnes doit être validé par le délégué à la protection des données d'une PME pilote."
      "non-functional.md":
        titre: "Les exigences chiffrées"
        phrase: "Le fil du matin s'affiche en moins de deux secondes sur un réseau 4G de chantier, et le service est disponible de 6 heures à 20 heures, jours ouvrés."
        essentiel:
          - "Deux secondes en 4G, mesurées sur un téléphone d'entrée de gamme."
          - "La disponibilité compte aux heures de chantier, pas la nuit."
          - "Les photos sont conservées cinq ans, la durée de la garantie décennale partielle."
        verifier: "La durée de conservation des photos doit être confirmée par le contrôleur métier."
      "target-architecture.md":
        titre: "L'architecture cible"
        phrase: "L'architecture porte tout le parcours, y compris les étapes des releases lointaines ; seules la date de relevé et la catégorie de vérité sont intouchables."
        essentiel:
          - "Deux éléments sont intouchables : les modifier invaliderait tout ce qui a été livré."
          - "Tout le reste peut évoluer sans rouvrir le socle."
          - "Le compte rendu au gérant, prévu pour une release lointaine, est déjà supporté."
        verifier: "Le compte rendu multi-entreprises n'est supporté que sur le papier ; il n'a pas été prototypé."
    sections:
      - title: "Frontières d'intégration"
        file: integration-boundaries.md
        reponse: "on lit les chantiers, on n'écrit jamais dans l'existant"
        guide: "Ce que le produit possède, ce qu'il emprunte, et le contrat entre les deux : format, fréquence, propriétaire, ce qui se passe en cas de panne. Une intégration sans contrat est un risque."
        example: |-
          | Échange | Sens | Fréquence | Si ça casse |
          |---|---|---|---|
          | Liste des chantiers | Logiciel de gestion → ChantierClair | Chaque nuit | Le fil du matin montre la liste de la veille, datée |
          | Relevés et photos | Restent dans ChantierClair | — | — |
      - title: "Modèle de persistance"
        file: data-persistence.md
        reponse: "une base relationnelle, la catégorie stockée en colonne"
        guide: "Où et comment les données sont stockées, aligné sur les catégories de vérité : la catégorie est stockée, jamais déduite. Justifier le choix contre une alternative."
        example: |-
          Base relationnelle, parce qu'un relevé se compare au précédent. Écartée : une base documentaire, qui rendait la comparaison dans le temps coûteuse. Les photos vont dans un stockage d'objets, hébergé en Europe.
      - title: "Topologie de déploiement"
        file: deployment-topology.md
        reponse: "un artefact construit une fois, promu du développement à la recette puis en production"
        guide: "Les environnements, où ils tournent, ce qui y est déployé et comment : développement, recette, production, et une préproduction seulement si une preuve la demande. Un seul artefact, promu par son empreinte : les environnements ne diffèrent que par configuration et secrets. Accepter en recette et mettre en production sont deux décisions distinctes. Citer les contraintes héritées de l'existant."
        example: |-
          | Environnement | Où | Ce qui y arrive | Qui décide |
          |---|---|---|---|
          | Développement | Hébergeur européen | Chaque modification, tests verts | Automatique |
          | Recette | Hébergeur européen | Le même artefact, promu par son empreinte | Automatique sur contrôles verts |
          | Production | Hébergeur européen | Le même artefact, accepté en recette | Le gérant, puis l'autorité de mise en production |
      - title: "Architecture de sécurité"
        file: security-architecture.md
        reponse: "chacun ne voit que ses chantiers, et aucune entreprise celle d'une autre"
        guide: "Qui accède à quoi, comment on se connecte, où sont les secrets, et ce qui est le plus sensible — dit en mots qu'un gérant comprend."
        example: |-
          | Qui | Voit |
          |---|---|
          | Chef de chantier | Ses chantiers |
          | Conducteur | Les chantiers qu'il suit |
          | Gérant | Tous les chantiers de son entreprise |

          La séparation entre entreprises est le point le plus sensible : c'est lui qui porte le niveau de risque le plus élevé.
      - title: "Contraintes non fonctionnelles"
        file: non-functional.md
        reponse: "deux secondes en 4G, disponible aux heures de chantier"
        guide: "Chaque exigence chiffrée, avec la façon de la mesurer : temps d'affichage, disponibilité, volume, durée de conservation. Sans nombre, ce n'est pas une exigence."
        example: |-
          | Exigence | Seuil | Mesure |
          |---|---|---|
          | Affichage du fil du matin | Moins de 2 secondes en 4G | Test automatique, téléphone d'entrée de gamme |
          | Disponibilité | 99,5 % de 6 h à 20 h, jours ouvrés | Sonde externe |
          | Conservation des photos | Cinq ans | Politique de stockage |
      - title: "Classement de chaque élément"
        file: target-architecture.md
        reponse: "deux éléments intouchables, tout le reste extensible"
        guide: "Chaque élément classé intouchable ou extensible, selon ce qu'invaliderait sa modification — jamais selon sa nature apparente."
        example: |-
          | Élément | Classement | Pourquoi |
          |---|---|---|
          | Stockage de la catégorie de vérité | Intouchable | Tout avancement livré en dépend |
          | Lecture nocturne des chantiers | Extensible | Remplaçable par une interface sans rien casser |
          | Cache du fil du matin | Extensible | Se reconstruit |
      - title: "Couverture du squelette"
        file: target-architecture.md
        reponse: "toutes les étapes sont supportées, même les plus lointaines"
        guide: "Montrer que l'architecture porte toutes les étapes du parcours, y compris celles des releases lointaines."
        example: |-
          | Étape | Release | Supportée par |
          |---|---|---|
          | « Je constate ce qui a été fait » | Terrain | Relevés et photos |
          | « Je rends compte au gérant » | Lointaine | Séparation par entreprise déjà en place |

  - id: WP-13
    format: mixed
    office: docx
    layout: "adr/ADR-nn.md (une décision par fichier, cinq premières sections) · build-vs-buy.md (section Build ou achat)"
    ouverture:
      "build-vs-buy.md":
        titre: "Construire ou acheter"
        phrase: "On ne construit que le relevé de chantier, seul élément qui distingue ChantierClair ; la connexion, l'hébergement, les composants et l'envoi de SMS s'achètent."
        essentiel:
          - "Construire ce qui différencie, acheter tout le reste."
          - "Aucune brique achetée n'enferme le produit : chacune a une alternative nommée."
          - "La stack de conception est reprise telle quelle : aucun écart avec celle de construction."
        verifier: "Le coût de la connexion par SMS au-delà de 500 utilisateurs n'est pas chiffré."
    sections:
      - title: "ADR-nn — la décision"
        file: adr/
        guide: "Un fichier par décision : la décision en une phrase à l'indicatif, son contexte en trois lignes au plus au-dessus. La première ADR consigne le départ d'architecture servi par la tour — gardé, adapté ou remplacé — et qui l'a décidé ; un départ gardé se reprend ADR par ADR, chacune revérifiée sur le produit."
        example: |-
          **On lit le logiciel de gestion, on ne le remplace pas.** Il porte les numéros de chantier et la facturation ; le remplacer ferait du projet une migration.
      - title: "Alternatives rejetées"
        file: adr/
        guide: "Au moins une option écartée, avec le motif. Une décision sans alternative n'a rien décidé."
        example: |-
          Remplacer le logiciel de gestion : écarté, dix-huit mois de migration pour une valeur que le client n'a pas demandée.
      - title: "Ce que la décision exclut"
        file: adr/
        guide: "La contrepartie, dite franchement : ce qu'on ne pourra plus faire sans rouvrir la décision."
        example: |-
          ChantierClair ne pourra pas créer de chantier ni corriger un numéro : tout passe par le logiciel de gestion.
      - title: "Build ou achat"
        file: build-vs-buy.md
        reponse: "on construit le relevé, on achète tout le reste"
        guide: "Pour chaque capacité : construire ou acheter, avec le coût, la licence et le risque d'enfermement. Sources vérifiées et datées."
        example: |-
          | Capacité | Décision | Coût | Risque d'enfermement |
          |---|---|---|---|
          | Relevé de chantier | Construire | — | — |
          | Connexion par lien SMS | Acheter | ~0,05 € par connexion | Faible — deux fournisseurs équivalents |
          | Composants d'interface | Réutiliser, open source | 0 € | Nul |
          | Hébergement | Acheter, en Europe | ~120 € par mois | Faible |
      - title: "Reprise de la stack de conception"
        file: build-vs-buy.md
        reponse: "aucun écart entre la stack de conception et celle de construction"
        guide: "Reprendre la stack arrêtée pour la conception et la confronter à l'architecture : si celle de construction diverge, c'est un écart à traiter, pas un détail."
        example: |-
          La stack de conception — application web mobile, composants open source — est reprise sans changement. Aucun écart.
      - title: "Classement"
        file: adr/
        guide: "Intouchable si la remettre en cause invalide ce qui a été livré, extensible sinon."
        example: |-
          Intouchable : tout le modèle de données repose sur les numéros de chantier de la comptabilité.
      - title: "Conditions de réexamen"
        file: adr/
        guide: "Ce qui, si on l'observe, rouvrirait la décision. Observable, jamais « si besoin »."
        example: |-
          Rouverte si le logiciel de gestion est abandonné par l'entreprise, ou si l'export de nuit échoue plus de deux fois par mois.

  - id: WP-14
    format: mixed
    office: docx
    layout: "protocole.md (protocole, candidat, personas et missions, pare-feu) · plan-de-campagne.yaml · pare-feu.yaml (liste fermée, manifeste haché) · resultats/ (journaux, captures, index.yaml) · annotations/ (O1 puis O2 par session) · synthese.md (résultats, patterns et triage, limites) · patterns.yaml"
    ouverture:
      "protocole.md":
        titre: "Le socle, éprouvé à l'aveugle"
        phrase: "Cinq sessions synthétiques ont tenté, sans rien savoir du produit, de relever une journée de chantier et d'arrêter leur abonnement ; trois termes n'ont pas été compris."
        essentiel:
          - "Les agents ne connaissaient que leur persona, leur mission et l'adresse du socle déployé."
          - "On teste la structure — chemin, mots, argent et droits —, pas le contenu."
          - "Ce sont des sessions synthétiques, corrélées : elles ne disent rien d'une personne réelle."
        verifier: "Aucun chef de chantier réel n'a encore vu le socle : la campagne signale des risques, elle ne valide rien."
      "synthese.md":
        titre: "Ce que les sessions synthétiques ont montré"
        phrase: "« Relevé » et « jalon » ont arrêté trois sessions sur cinq ; l'arrêt de l'abonnement a été trouvé partout, en deux gestes."
        essentiel:
          - "Trois termes retournent au glossaire avant le gel."
          - "Le parcours d'arrêt de l'abonnement tient."
          - "Une session a buté sur un champ absent du corpus : arrêt attendu, pas un défaut."
        verifier: "Les cinq sessions tournent sur le même modèle : leur accord est un signal, pas une majorité."
    sections:
      - title: "Protocole"
        reponse: "les agents ne savaient rien du produit"
        file: protocole.md
        guide: "Écrit AVANT la première session et daté. Version du protocole, les cinq rôles séparés et ce que chacun reçoit et ne reçoit jamais. L'agent utilisateur ne reçoit que son persona, sa mission et le point d'entrée du socle déployé."
        example: |-
          Protocole SUX v0.1, repris du run BatiZen, écrit le 2026-10-09 à 08:00, avant la première session.

          | Rôle | Reçoit | Ne reçoit jamais |
          |---|---|---|
          | Orchestrateur (quality-engineer) | tout ce qu'il faut pour lancer | — |
          | Agent utilisateur | persona, mission, URL du socle | glossaire, squelette, contrat, chemin attendu, constats connus |
          | Observateur | le journal d'une session | l'intention du produit, les autres sessions |
          | Chercheur | journaux anonymisés et annotations O1 | l'intention du produit, les constats connus |
          | Triage (factory-lead) | tout, après le chercheur | — |
      - title: "Candidat testé"
        reponse: "le socle déployé du 9 octobre, inchangé pendant les cinq sessions"
        file: protocole.md
        guide: "Le socle exact : commit, sha256 du build, URL déployée. Toutes les sessions s'ouvrent et se ferment sur lui ; un socle corrigé est un nouveau candidat."
        example: |-
          Commit `72cd3b6`, build `index.html` sha256 `9f2c…e41a`, URL `https://chantierclair-socle.example.app/`. Les cinq sessions se sont ouvertes et fermées sur ce candidat.
      - title: "Personas et missions"
        reponse: "trois chefs de chantier, cinq missions dites avec leurs mots"
        file: protocole.md
        guide: "Une fiche de faits de vie par persona, tirée d'un PER-nn et de ses verbatims, rendue en prose. Une mission par session, dite avec les mots de l'utilisateur, avec son arrêt naturel. Aucun mot de l'interface."
        example: |-
          **P1, tiré de PER-01 (V-03, V-11).** Vous êtes chef de chantier depuis douze ans, vous tenez vos notes dans un carnet et vous détestez ressaisir le soir. Vous avez un téléphone, pas d'ordinateur sur le chantier.

          **M1.** « On vous a parlé d'une application pour ne plus rien ressaisir le soir. Voyez si elle vous fait gagner du temps, et arrêtez-vous quand vous savez si vous la gardez. »
      - title: "Pare-feu"
        reponse: "aucun mot de l'application dans ce que les agents ont reçu"
        file: protocole.md
        guide: "La liste fermée du vocabulaire interne — termes TRM-nn, écrans, étapes — et le manifeste haché des entrées exactes de chaque session, écrit avant elle. Le détail vit dans pare-feu.yaml ; ici, ce qu'il contient et ce qu'il interdit."
        example: |-
          Liste fermée : les 22 termes du glossaire, les 9 écrans du socle, les 7 étapes du parcours. Persona et mission de chaque session passent le filtre ; leurs empreintes sont au manifeste, écrit 5 minutes avant chaque session.
      - title: "Résultats bruts"
        reponse: "cinq sessions menées jusqu'au bout, une capture par geste"
        file: synthese.md
        guide: "Une ligne par session : persona, mission, nombre d'actions, fin (but atteint selon l'agent, abandon, blocage, arrêt attendu), où vivent son journal et ses captures. Les octets sont dans resultats/, à l'empreinte de index.yaml."
        example: |-
          | Session | Persona · mission | Actions | Fin |
          |---|---|---|---|
          | S-01 | P1 · M1 | 23 | but atteint selon l'agent |
          | S-02 | P2 · M1 | 31 | abandon — « je ne sais pas ce qu'est un jalon » |
          | S-03 | P3 · M2 | 12 | arrêt attendu — prix du lot absent du corpus |
      - title: "Patterns et triage"
        reponse: "trois mots retournent au glossaire avant le gel"
        file: synthese.md
        guide: "Chaque pattern : un énoncé, les sessions qui le montrent, celles qui le contredisent, une citation. Le triage route chaque constat vers WP-05, WP-09 ou WP-11, ou le classe arrêt attendu, hors champ, sans suite."
        example: |-
          **PAT-01 — « Jalon » n'est pas compris** (S-02, S-04, S-05 ; contredit par S-01). S-02, tour 14 : « jalon, c'est un poteau ? ». → **glossaire** : le terme est reformulé avant le gel.

          **PAT-02 — L'arrêt de l'abonnement se trouve en deux gestes** (5 sur 5). → sans suite.
      - title: "Limites"
        reponse: "un signal sur la structure, rien sur une personne réelle"
        file: synthese.md
        guide: "Dire ce que la campagne ne prouve pas : « N sessions synthétiques », jamais des personnes ; sessions corrélées ; aucun score ni seuil ; rien sur un utilisateur réel."
        example: |-
          Cinq sessions synthétiques, toutes sur le même modèle et les mêmes gabarits : elles sont corrélées, leur accord est un signal et non une majorité. Aucun score, aucun seuil. Rien n'est établi sur un chef de chantier réel : la mesure en production reste à faire.

  # ───────────────────────────── C1.5 · Architecture de releases ─────────────────────────────

  - id: WP-15
    format: mixed
    office: pptx
    layout: "release-architecture.md (fiches, trois tests, liens typés) · fiches/REL-nom.md (une entité par release, front-matter type: release) · sequencing.md · dependencies.md · risk-map.md"
    ouverture:
      "release-architecture.md":
        titre: "Le plan de releases"
        phrase: "Trois releases, chacune utile seule : le chef relève, puis le conducteur lit, puis le gérant reçoit son compte rendu."
        essentiel:
          - "La première release ne sert que le chef de chantier : sans relevé, rien d'autre n'a de sens."
          - "Chaque étape du parcours est introduite par exactement une release."
          - "La troisième dépend des deux premières et ne se lance pas avant elles."
        verifier: "La première release n'apporte rien au conducteur : elle se justifie seulement si le relevé quotidien tient (HYP-01)."
      "sequencing.md":
        titre: "Dans quel ordre, et pourquoi"
        phrase: "On commence par le relevé parce qu'il porte l'hypothèse qui peut tout arrêter ; le compte rendu au gérant vient en dernier parce qu'il ne vaut rien sans les deux autres."
        essentiel:
          - "L'ordre suit le risque, pas la facilité."
          - "La première release tranche l'hypothèse qui décide du projet."
          - "Chaque release dit pourquoi elle est à sa place."
        verifier: "Si le relevé quotidien échoue au pilote, la deuxième release n'a plus d'objet : l'ordre est à revoir."
      "dependencies.md":
        titre: "Ce qui dépend de quoi"
        phrase: "Chaque release ne dépend que de celles qui la précèdent : il n'y a aucun cycle."
        essentiel:
          - "Pilotage dépend de Terrain ; Gérant dépend des deux."
          - "Aucune release ne dépend d'une release future."
          - "Une dépendance externe : l'export de nuit du logiciel de gestion."
        verifier: "L'export de nuit n'a pas d'engagement de service : s'il change de format, Pilotage s'arrête."
      "risk-map.md":
        titre: "Le risque de chaque release"
        phrase: "La release Gérant porte le risque le plus élevé, parce qu'elle réunit plusieurs entreprises dans un même compte rendu."
        essentiel:
          - "Terrain et Pilotage sont à risque modéré : une seule entreprise, pas d'argent."
          - "Gérant est à risque élevé : une fuite entre entreprises serait grave."
          - "Le niveau de risque décide du niveau de preuve exigé avant mise en production."
        verifier: "Le niveau de risque est pressenti ; il sera confirmé à la conception de chaque release."
    sections:
      - title: "REL-nom — une fiche par release"
        file: release-architecture.md
        fiche: "REL-terrain"
        reponse: "le chef de chantier relève, en un geste"
        guide: "Une fiche par release, au nom parlant : sa promesse en une phrase, les étapes qu'elle couvre, qui elle sert, le résultat visé. Ses champs suivent en tableau."
        example: |-
          Le chef de chantier fait un relevé par jour — photo, pourcentage, statut — depuis son téléphone. Sert le chef de chantier ; vise OUT-01.
      - title: "Les trois tests, démontrés par release"
        file: release-architecture.md
        champ: true
        guide: "Désirable seule, livrable seule, mesurable seule : oui ou non, avec la preuve. Un « non » n'interdit pas la release, il crée une dépendance."
        example: |-
          Désirable seule : oui — le chef cesse d'être appelé · livrable seule : oui · mesurable seule : oui — taux de jours relevés
      - title: "Liens typés vers le squelette"
        file: release-architecture.md
        champ: true
        guide: "Les étapes que la release introduit (une seule release par étape), celles qu'elle enrichit, et les releases dont elle dépend."
        example: |-
          Introduit « Je constate ce qui a été fait » · ne dépend d'aucune release
      - title: "Séquencement"
        file: sequencing.md
        reponse: "le risque d'abord, le confort ensuite"
        guide: "L'ordre des releases, avec pour chacune sa valeur, le risque qu'elle porte et la raison de sa place. Jamais par facilité."
        example: |-
          | Ordre | Release | Ce qu'elle apporte | Pourquoi à cette place |
          |---|---|---|---|
          | 1 | Terrain | Le relevé quotidien | Elle tranche HYP-01, qui peut tout arrêter |
          | 2 | Pilotage | Le fil du matin | Elle n'a de sens qu'avec des relevés |
          | 3 | Gérant | Le compte rendu | Elle agrège les deux premières |
      - title: "Dépendances"
        file: dependencies.md
        reponse: "chaque release ne dépend que des précédentes"
        guide: "Qui dépend de quoi, pour quelle raison, depuis quand. Montrer qu'il n'y a pas de cycle."
        example: |-
          | Release | Dépend de | Pour |
          |---|---|---|
          | Pilotage | Terrain | Les relevés à afficher |
          | Gérant | Terrain et Pilotage | Les avancements à agréger |
          | Pilotage | Export de nuit du logiciel de gestion | La liste des chantiers |
      - title: "Tier de risque pressenti par release"
        file: risk-map.md
        reponse: "une seule release à risque élevé : celle du gérant"
        guide: "Le niveau de risque pressenti de chaque release, et ce qui le justifie. Pressenti : il sera confirmé à la conception de la release."
        example: |-
          | Release | Risque | Pourquoi |
          |---|---|---|
          | Terrain | Modéré | Une seule entreprise, pas d'argent |
          | Pilotage | Modéré | Idem |
          | Gérant | Élevé | Plusieurs entreprises dans un même compte rendu |

  - id: WP-16
    format: mixed
    office: pptx
    layout: "g0-product-architecture.md (les six sections) · investor-deck.md (le pitch investisseurs, format « pitch ») · investor-shortlist.md (les investisseurs ciblés, format « investisseurs ») · spine-manifest.yaml (tags et commits des éléments figés)"
    ouverture:
      "investor-deck.md":
        titre: "Le pitch investisseurs"
        phrase: "Le produit rend une matinée par semaine au conducteur de travaux ; la levée finance la preuve de rétention sur cinquante PME."
        essentiel:
          - "Onze planches : le seed deck de Y Combinator, et les outils du New Business Venturing d'INSEAD."
          - "Chaque chiffre renvoie au livrable qui le fonde ; une hypothèse se dit hypothèse."
          - "Le montant demandé est une décision du porteur, rattachée aux hypothèses qu'il tranche."
        verifier: "Un pitch n'est pas une preuve : il présente ce que les livrables établissent, sans rien y ajouter."
      "investor-shortlist.md":
        titre: "Les investisseurs ciblés"
        phrase: "Trois personnes connaissent le secteur et la géographie du produit ; deux sont joignables par introduction."
        essentiel:
          - "Des personnes, pas des fonds : chacune jugée sur quatre critères, chacun sourcé."
          - "Un concurrent direct en portefeuille disqualifie."
          - "Le ticket se compare au montant demandé ; l'accès se déclare."
        verifier: "Une liste n'est pas un engagement : aucun investisseur n'est contacté au nom du porteur sans son accord."
      "g0-product-architecture.md":
        titre: "La décision de passage"
        phrase: "Le cadrage est prêt à être décidé ; la recommandation est de franchir la porte, sous réserve du pilote de quatre semaines qui tranche le relevé quotidien."
        essentiel:
          - "Tous les livrables du cadrage sont produits ; deux sont partiels, avec leurs réserves écrites."
          - "Rien d'irréversible n'est engagé avant le pilote."
          - "La décision appartient au Product Owner, et à lui seul."
        verifier: "La décision n'est pas prononcée : ce document prépare le passage, il ne le franchit pas."
    sections:
      - title: "Fermeture d'apprentissage"
        file: g0-product-architecture.md
        reponse: "ce qui a coûté, ce qui a surpris, ce qu'on aurait dû voir plus tôt"
        guide: "Trois entrées : ce qui a coûté, ce qui a surpris, ce qu'un contrôle aurait dû détecter plus tôt. Chacune dit où elle est traitée."
        example: |-
          | | Ce qui s'est passé | Où c'est traité |
          |---|---|---|
          | A coûté | Trois semaines pour obtenir l'export des chantiers | Ajouté aux prérequis du cadrage |
          | A surpris | Personne ne se plaint de saisir ; tous se plaignent de ne pas savoir | Thèse produit réécrite |
          | Aurait dû être vu | La taille du marché repose sur une source non datée | Contrôle ajouté sur les sources |
      - title: "Investisseurs ciblés"
        file: investor-shortlist.md
        reponse: "à qui présenter le pitch, et pourquoi chacun"
        guide: "Front-matter, format « investisseurs » : la cible du tour (montant, géographie, secteur) puis trois personnes au moins, chacune jugée sur le secteur, la géographie, le portefeuille et la performance, avec preuve et source. Le corps dit, pour chacune, l'angle du premier message."
        example: |-
          Alice — a dirigé un éditeur de logiciel pour artisans, investit en France, deux SaaS du bâtiment en portefeuille ; introduction par l'ancien associé du sponsor.
          Bruno — vingt ans dans la distribution de matériaux, deux sorties ; introduction par un gérant pilote.
          Chloé — SaaS vertical, bureau à Paris ; accès froid, à préparer.
      - title: "Pitch investisseurs"
        file: investor-deck.md
        reponse: "pourquoi ce produit, pourquoi maintenant, pourquoi cette équipe, combien et pour quel jalon"
        guide: "Front-matter, format « pitch » : l'entreprise, l'accroche, le mantra, le positionnement en deux phrases, puis dix planches — l'ordre YC et les apprentissages. Chaque titre est l'idée ; chaque chiffre cite ce qui le fonde ou se dit HYP-nn. Le corps porte le script de l'orateur."
        example: |-
          Problème — « Un conducteur passe le tiers de sa semaine à reconstituer où en sont ses chantiers. » 4 à 6 h d'appels par semaine, d'après la recherche utilisateur.
          Traction — 11 % des visiteurs inscrits au prix affiché, mesuré par le test de marché. Aucun revenu : le pilote démarre en janvier.
          Demande — 600 k€, 18 mois : 50 PME payantes et la rétention à 90 jours, montant décidé par le porteur.

  # ───────────────────────────── C2 · Cycle release ─────────────────────────────

  - id: WP-17
    format: mixed
    office: pptx
    layout: "scope.md (périmètre, étapes couvertes, trois tests) · exclusions.md · success-metrics.md"
    sections:
      - title: "Périmètre désirable"
        file: scope.md
        guide: "Le plus petit périmètre qui tienne debout seul, en un paragraphe, puis la liste des JRN couverts. Interrogé jusqu'à épuisement (grilling)."
        example: |-
          Le conducteur voit ses chantiers avec un avancement daté et sa catégorie de vérité, l'écart au planning, et signale un écart qualifié. Saisie provisoire par le conducteur.
          JRN-07 Consulter l'avancement · JRN-08 Signaler un écart
      - title: "Exclusions"
        file: exclusions.md
        guide: "Aussi précises que les inclusions : quoi, pourquoi, où ça va (release, backlog, jamais)."
        example: |-
          saisie sur mobile par le chef de chantier — HYP-01 testée en 16, livrée en REL-terrain
          accès gérant, export PDF — REL-compte-rendu
      - title: "Étapes du squelette couvertes"
        file: scope.md
        guide: "Exactement les STG affectées par WP-15 (INTRODUCES et ENRICHES), ni plus ni moins."
        example: |-
          STG-04, STG-05 · aucune autre étape touchée
      - title: "Les trois tests, démontrés"
        file: scope.md
        guide: "Pour cette release : désirable seule, livrable seule, mesurable seule, avec la preuve de chacun."
        example: |-
          désirable seule   9/11 conducteurs citent le point du matin en premier · livrable seule   aucun DEPENDS-ON · mesurable seule   MET-01, MET-02
      - title: "Métriques de succès"
        file: success-metrics.md
        guide: "MET-nn, une par outcome visé : mesure, source de donnée, seuil, échéance. Instrumentable avec ce que la release livre ou avec ce qui existe déjà."
        example: |-
          MET-01 ← OUT-01  heures/semaine d'appels, 9 pilotes · journal déclaratif existant · < 1 h à 90 j
          MET-02 ← OUT-02  délai médian signalé_le → constaté_le · table écarts (livrée) · < 1 j à 90 j

  - id: WP-18
    format: markdown
    office: docx
    layout: "design-brief.md — un brief par parcours ou écran majeur ; les sections NON NÉGOCIABLES sont remplies ou le brief est BLOCKED"
    sections:
      - title: "Sujet concret"
        guide: "Le vernaculaire du métier, pas la catégorie : « la liste des chantiers de Karim à 7 h », pas « un dashboard »."
        example: |-
          La liste des chantiers que Karim ouvre à 7 h dans sa voiture avant son premier passage
        file: design-brief.md
      - title: "Utilisateur et conditions matérielles"
        guide: "PER-nn, appareil, lumière, mains, réseau, durée d'attention. Un écran de chantier au soleil ≠ un tableau de bord de bureau."
        example: |-
          PER-01 · Android milieu de gamme · plein soleil · une main · 3G intermittente · 10 secondes d'attention
        file: design-brief.md
      - title: "Job principal de l'écran ou du parcours"
        guide: "Une phrase : ce que l'utilisateur doit pouvoir décider ou faire en sortant de l'écran."
        example: |-
          Choisir le chantier où aller en premier, sans appeler
        file: design-brief.md
      - title: "Ce que le socle fige déjà"
        guide: "NON NÉGOCIABLE — navigation, glossaire, composants et catégories de vérité concernés, cités par identifiant. La réponse est dans le dépôt, pas dans l'imagination."
        example: |-
          entrée « Mes chantiers » · TRM-03 écart, TRM-07 relevé · badge-verite (7 états) · carte-chantier
        file: design-brief.md
      - title: "Directions rejetées et pourquoi"
        guide: "Ce qu'on a déjà écarté (dans WP-19 ou en amont) pour ne pas le réexplorer."
        example: |-
          carte géographique des chantiers — rejetée : 6 chantiers, aucune décision ne dépend de la distance (S-04, S-09)
        file: design-brief.md
      - title: "Niveau d'evidence sur ce parcours"
        guide: "NON NÉGOCIABLE — EMPIRICAL, DOCUMENTARY, SYNTHETIC ou UNVALIDATED, avec la source."
        example: |-
          DOCUMENTARY · 9 verbatims sur les parcours de la release (S-14..S-18), deux plateformes · aucun terrain
        file: design-brief.md
      - title: "Tier de risque de ce que l'écran manipule"
        guide: "NON NÉGOCIABLE — R0 à R3, repris de WP-21."
        example: |-
          R2 — lecture de données de chantier, accès par PME
        file: design-brief.md
      - title: "Hypothèses posées faute de réponse"
        guide: "Après la salve unique de quatre questions au maximum, ce qui reste sans réponse devient une hypothèse UNVALIDATED avec son point de test."
        example: |-
          « le tri par écart décroissant est le bon tri par défaut » · UNVALIDATED · test activité 18, tâche T-3

        file: design-brief.md
      - title: "Insights de release"
        file: research/insights.md
        guide: "Recherche strictement limitée aux JRN de la release, documentaire par défaut et commitée AVANT le périmètre : verbatims sourcés (adresse, date, citation), deux sources indépendantes par enseignement. Ce qui sort du périmètre est routé au backlog, nommé, pas exploité ici."
        example: |-
          INS-R1-01  lisible d'un coup d'œil, à une main, au soleil — consulté depuis la voiture (S-14, S-16) · DOCUMENTARY → design-brief
          routé      « voir les photos » (S-15, S-17) → backlog REL-terrain
      - title: "JRN-nn parcours cibles"
        file: research/journeys/to-be/
        guide: "Par parcours : STG, REL, PER, déclencheur, fin, puis les étapes numérotées avec écran S-nn et story visée. Le parcours remplit le squelette, il ne le redessine pas."
        example: |-
          JRN-07  Consulter l'avancement d'un chantier · STG-04 · REL-pilotage · PER-01
            1 ouvrir la liste (S-11) → STO-016 · 2 repérer la catégorie de vérité → STO-014 · 3 ouvrir un chantier (S-12) → STO-014, STO-015
      - title: "Conformité au socle attestée"
        file: research/insights.md
        guide: "Ordre des STG et vocabulaire (TRM) inchangés : le dire, avec les identifiants."
        example: |-
          STG-04 puis STG-05, ordre du squelette · termes TRM-03, TRM-07, TRM-11 · aucun terme nouveau
      - title: "Besoins de modification du socle"
        file: research/insights.md
        guide: "Si un parcours exige de toucher navigation, glossaire ou sémantique : finding, routage vers G0 (EX3), jamais appliqué ici. Sinon écrire « aucun »."
        example: |-
          aucun

  - id: WP-19
    format: executable
    office: pptx
    layout: "design/concept/ (alternatives, direction, storyboard) · design/src/ · design/dist/ · design-system-delta/"
    sections:
      - title: "Alternatives explorées"
        file: design/concept/
        guide: "≥ 3 alternatives matériellement distinctes (pas trois couleurs), chacune en une planche et trois lignes : parti pris, ce qu'elle optimise, ce qu'elle sacrifie."
        example: |-
          A liste dense triée par écart · B carte par chantier avec jauge · C fil chronologique des relevés
      - title: "Direction retenue"
        file: design/concept/
        guide: "La direction, comparée explicitement aux rejetées avec motif, consignée en ADR de direction (ADR-nn)."
        example: |-
          A retenue · B rejetée : la jauge lisse l'écart (INS-R1-02) · C rejetée : ne répond pas au job « choisir où aller » · ADR-09
      - title: "Storyboard de la release"
        file: design/concept/
        guide: "Écrans S-nn dans l'ordre des JRN, chacun rattaché à son JRN et à sa STG."
        example: |-
          S-11 liste (JRN-07 / STG-04) → S-12 fiche chantier (JRN-07) → S-14 signaler un écart (JRN-08 / STG-05)
      - title: "Source exécutable et build partageable"
        file: design/dist/
        guide: "Source, build statique, URL de preview et commit figé. Le prototype se parcourt de bout en bout sans écran mort."
        example: |-
          design/src @ f08b6d2 · design/dist/index.html · preview https://…/rel-pilotage/f08b6d2 · 0 écran mort sur JRN-07, JRN-08
      - title: "Delta de Design System"
        file: design-system-delta/
        guide: "Chaque ajout justifié par un parcours ou une story, les 7 états couverts, intégré au système global (jamais un fork). Aucun composant du socle modifié silencieusement."
        example: |-
          + carte-chantier/compacte (STO-016) · + jeton --densite-liste (STO-016) · composants du socle modifiés : 0
      - title: "Fixtures"
        file: design/src/
        guide: "Données réalistes marquées FIXTURE, provenance indiquée. Jamais de donnée inventée présentée comme réelle."
        example: |-
          fixtures/rel-pilotage.json · FIXTURE · 8 chantiers, 30 j d'historique, dérivés des observations E-03..E-11

  - id: WP-20
    format: mixed
    office: docx
    layout: "solution-design.md (composants, flux, attestation, écarts) · interface-contracts.md · migration-impact.md"
    sections:
      - title: "Composants touchés et créés"
        file: solution-design.md
        guide: "Liste par composant du socle technique : touché / créé, pour quelle capacité, dans quelle frontière."
        example: |-
          api/releves   créé · lecture et saisie provisoire (EPC-02, EPC-03)
          api/ecarts    créé · signalement (EPC-04)
          auth/tenant   touché · rôle conducteur (existant), aucun CORE INVARIANT modifié
      - title: "Contrats d'interface"
        file: interface-contracts.md
        guide: "Chaque contrat versionné et testable : endpoint ou événement, schéma, propriétaire, test de contrat nommé."
        example: |-
          GET /chantiers?tri=ecart  v1 · schéma ChantierListe · test contrat contracts/chantiers.v1.spec
      - title: "Flux de données"
        file: solution-design.md
        guide: "D'où vient chaque donnée, où elle va, avec sa catégorie de vérité à chaque étape. Un flux qui améliore la catégorie viole la propagation."
        example: |-
          relevé (CONSTATÉ, chef) → api/releves → chantier.avancement (CONSTATÉ) · saisie conducteur → ESTIMÉ, jamais promu
      - title: "Impacts de migration et réversibilité"
        file: migration-impact.md
        guide: "Chaque migration, l'entité touchée, sa classe (CORE / EXTENSION), la réversibilité. Une entité CORE INVARIANT touchée → EX3, pas une migration."
        example: |-
          0041 crée ecart (EXTENSION) · réversible · 0042 ajoute ecart.clos_le (EXTENSION) · réversible · CORE touché : aucun
      - title: "Attestation de conformité au socle technique"
        file: solution-design.md
        guide: "Phrase d'attestation signée par principal-engineer, ou liste des deltas portés en G0."
        example: |-
          S'inscrit dans architecture/ @ d13e884 sans modifier un CORE INVARIANT · principal-engineer · 2026-04-10
      - title: "Écarts au socle"
        file: solution-design.md
        guide: "Routés vers G0 (EX3), jamais appliqués. « Aucun » sinon."
        example: |-
          aucun

  - id: WP-21
    format: mixed
    office: docx
    layout: "dependencies.md (dépendances, absence de cycle) · technical-risks.md · risk-tiers.md (tiers, capacités non faisables)"
    sections:
      - title: "Dépendances par capacité"
        file: dependencies.md
        guide: "Par capacité : dépendances techniques, de donnée, d'apprentissage, chacune nommée et datée. C'est l'entrée de l'activité 19."
        example: |-
          lecture avancement   technique : api/releves · donnée : référentiel chantiers compta (CSV) · daté 2026-04-10
          signalement écart    technique : lecture avancement · daté 2026-04-10
      - title: "Absence de cycle"
        file: dependencies.md
        guide: "Démontrée : ordre topologique des capacités, ou graphe. Pas affirmée."
        example: |-
          saisie provisoire → lecture avancement → signalement écart · ordre topologique valide, 0 cycle
      - title: "Risques techniques"
        file: technical-risks.md
        guide: "Chaque risque avec sa parade ou son acceptation nommée (par qui). Un risque sans porteur n'est pas géré."
        example: |-
          RT-01  CSV compta en retard le matin → avancement affiché périmé · parade : horodatage visible + AC-014.3 · porteur principal-engineer
      - title: "Tier de risque par capacité"
        file: risk-tiers.md
        guide: "R0 à R3, justifié par la surface (données, auth, migration, irréversibilité). Commande l'evidence et les autorités en aval."
        example: |-
          lecture avancement R2 (données de chantier, auth PME) · signalement R2 (écriture métier) · saisie provisoire R1
      - title: "Capacités non faisables dans cette release"
        file: risk-tiers.md
        guide: "Nommées, avec la raison, et routées (release suivante, backlog, G0)."
        example: |-
          notification du chef de chantier — exige un accès chef, introduit par REL-terrain → STO-019 reportée

  - id: WP-22
    format: markdown
    office: docx
    layout: "report.md — un rapport par passe, daté, sur un build identifié"
    sections:
      - title: "Cohérence et conformité au Design System"
        guide: "Écran par écran : composants utilisés vs catalogue, jetons hors système détectés, variantes non déclarées."
        example: |-
          S-11  conforme · S-12  1 couleur hors jetons (#8A6D1F codée en dur) → FND-11 MINOR · S-14  conforme
      - title: "Responsive et états limites"
        guide: "Captures aux points de rupture déclarés (360, 768, 1280), états vide / erreur / loading / données longues."
        example: |-
          360 px : nom de chantier tronqué à 24 caractères sur S-11 → FND-12 MAJOR (AC-016.2 dit 28) · état vide S-11 : OK
      - title: "Accessibilité"
        guide: "Contrôle outillé (outil, version, date), résultat brut joint, pas une déclaration."
        example: |-
          axe-core 4.9 · 2026-04-15 · 1 violation : contraste 3,9:1 badge ESTIMÉ sur carte compacte → FND-13 MAJOR
      - title: "Subordination au socle"
        guide: "PASS ou FAIL avec preuves : navigation, glossaire, catégories de vérité inchangés ; composants du socle non modifiés."
        example: |-
          PASS · navigation inchangée · 0 terme hors glossaire · carte-chantier standard : diff vide
      - title: "Findings"
        guide: "Au format FND-nn : sévérité · règle ou AC · où · démontré par · émis par critic(design) · fermeture par le même critic."
        example: |-
          FND-12  MAJOR · AC-016.2 · S-11 à 360 px · capture qa/360-s11.png · critic(design) passe 1 · ouvert
          BLOCKER 0 · MAJOR 2 · MINOR 1

  - id: WP-23
    format: mixed
    office: pptx
    layout: "test-plan.md — protocole écrit AVANT, puis résultats ajoutés APRÈS, dans le même fichier, sections datées · sux/ — la campagne d'utilisateurs synthétiques aveugles, mêmes sept pièces qu'avant G0 (protocole.md, plan-de-campagne.yaml, pare-feu.yaml, resultats/, annotations/, synthese.md, patterns.yaml)"
    sections:
      - title: "Protocole"
        file: test-plan.md
        guide: "Écrit et daté AVANT le test : tâches T-nn, consignes identiques, critères de réussite par tâche. Identique pour chaque persona simulé comme pour chaque participant réel."
        example: |-
          écrit le 2026-04-04 · T-1 « Trouvez le chantier où aller en premier » · réussite : choix sans retour en arrière · T-2 « Signalez un retard sur le chantier C »
      - title: "Version testée"
        file: test-plan.md
        guide: "Commit figé et URL, cités. Toute correction pendant le test invalide la comparaison."
        example: |-
          f08b6d2 · https://…/rel-pilotage/f08b6d2 · gelée le 2026-04-08
      - title: "Participants"
        file: test-plan.md
        guide: "Sans participants réels : les personas PER-nn simulés, chacun étiqueté SYNTHETIC, et l'agent qui les incarne — jamais celui qui a conçu le prototype. Avec des participants : recrutement, nombre, profils, biais déclarés."
        example: |-
          PER-01 (conducteur multi-chantiers) et PER-03 (gérant) simulés · SYNTHETIC · incarnés par critic(product), qui n'a pas conçu le prototype · aucun participant réel pour cette passe
      - title: "Résultats bruts"
        file: test-plan.md
        guide: "Par persona — ou participant — et par tâche : réussite, point de blocage, raisonnement rapporté. NON filtrés, y compris ce qui contredit la thèse. Chaque blocage est confronté aux verbatims documentés qui le confirment ou l'infirment."
        example: |-
          PER-01 · T-1 · réussi · le premier chantier de la liste est le bon
          PER-01 · T-2 · bloqué · « ESTIMÉ » ne dit pas qui a estimé — confirmé par S-07 (« un chiffre sans origine, je n'y crois pas ») — contredit HYP-02
      - title: "Niveau d'evidence"
        file: test-plan.md
        guide: "EMPIRICAL · DOCUMENTARY · SYNTHETIC · AXR · SYNTHETIC · SUX · UNVALIDATED, obligatoire, par résultat. Une revue synthétique ou une recherche documentaire présentée comme empirique est un BLOCKER ; une revue experte présentée comme un test d'utilisateur aussi."
        example: |-
          SYNTHETIC · AXR (revue experte par persona) · SYNTHETIC · SUX (5 sessions synthétiques aveugles) · DOCUMENTARY (confrontation aux verbatims S-nn)
      - title: "Hypothèses UNVALIDATED confrontées"
        file: test-plan.md
        guide: "Chaque HYP : tranchée par des participants réels, fragilisée ou confortée par la revue — jamais validée par elle —, ou reportée avec sa mesure en production : métrique, événement instrumenté par la release, seuil, décision si le seuil n'est pas atteint."
        example: |-
          HYP-02  fragilisée — PER-01 bute sur ESTIMÉ, S-07 le confirme → libellé « estimé par Karim » (C-2)
          HYP-04  reportée — mesure en production : relevés par chef et par jour (événement releve_cree), seuil 0,8 à 4 semaines ; sous le seuil, relevé hebdomadaire
      - title: "Corrections"
        file: test-plan.md
        guide: "Chaque correction trace vers un constat étiqueté (persona ou participant, tâche, niveau). Pas de correction « par intuition »."
        example: |-
          C-2  afficher l'auteur d'un ESTIMÉ · PER-01 · T-2 · SYNTHETIC + S-07 DOCUMENTARY · portée dans WP-19 @ 2c7d0e1
      - title: "Revue experte (AXR)"
        file: test-plan.md
        guide: "critic(product), qui CONNAÎT l'intention et n'a pas conçu le prototype : plan de couverture écrit avant — parcours, états, chemins négatifs, persistance —, puis un résultat par unité, constats attendu / constaté, reproduits k sur n. Elle ne corrige rien et ne se présente jamais comme un test d'utilisateur."
        example: |-
          Plan écrit le 2026-04-07 : 3 parcours, 14 états, 9 chemins négatifs. 26 unités parcourues, 0 non atteinte.
          AXR-04  « estimé » affiché sans auteur sur S-12 · attendu : auteur nommé (WP-10, propagation) · constaté 3 sur 3 → C-2
      - title: "Campagne SUX"
        file: test-plan.md
        guide: "Les utilisateurs synthétiques aveugles, sur la version figée : le détail vit sous sux/ (mêmes sept pièces qu'avant G0) ; ici, le candidat, le nombre de sessions synthétiques, les patterns retenus et leur triage. K7 rejoue la campagne."
        example: |-
          Candidat f08b6d2 · 5 sessions synthétiques, corrélées (même modèle) · PAT-01 « estimé » lu comme « garanti » (S-02, S-03, S-05 ; contredit par S-01) → C-2 · régression sur le candidat 2c7d0e1 : 0 session sur 5


  - id: WP-24
    format: mixed
    office: docx
    layout: "epics/EPC-nn.md · stories/STO-nn.md (story + AC) · traceability.md · priorities.md · dependencies.md · risk-map.md"
    sections:
      - title: "EPC-nn epics"
        file: backlog/epics/
        guide: "Un epic par parcours ou capacité : nom en verbe utilisateur, JRN, REL, stories contenues, priorité."
        example: |-
          EPC-03  Consulter l'avancement d'un chantier · JRN-07 · REL-pilotage · STO-011..016 · priorité 1 (OUT-01)
      - title: "STO-nn stories"
        file: backlog/stories/
        guide: "Format « En tant que PER-nn, quand …, je …, afin de … ». Trace : epic, JRN, écran S-nn du Strategic Design, dépendances, tier. Une story sans écran n'est pas implémentable."
        example: |-
          STO-014  Consulter l'avancement d'un chantier · EPC-03 · JRN-07 · S-12 · dépend STO-010 · R2
            En tant que conducteur (PER-01), quand j'ouvre un chantier, je vois son avancement avec sa date et sa catégorie de vérité, afin de savoir s'il faut appeler.
      - title: "AC-nn.n acceptance criteria"
        file: backlog/stories/
        guide: "Chacun vérifiable et non ambigu : un observable, un seuil, une condition. Nommer l'evidence planifiée (type de test). « L'écran est clair » n'est pas un AC."
        example: |-
          AC-014.1  L'avancement affiché porte sa catégorie de vérité en libellé texte, pas seulement par la couleur · e2e
          AC-014.2  Un ESTIMÉ n'est jamais présenté comme CONSTATÉ (propagation WP-10) · unit + e2e
          AC-014.3  Un relevé de plus de 24 h est signalé « relevé il y a N jours » · e2e
      - title: "Priorités"
        file: backlog/priorities.md
        guide: "Par valeur (OUT servi) et par risque (HYP levée), ordre total sur les epics, partiel sur les stories."
        example: |-
          1 EPC-03 (OUT-01) · 2 EPC-04 (OUT-02) · 0 EPC-02 (préalable technique)
      - title: "Dépendances"
        file: backlog/dependencies.md
        guide: "Story → story, reprises de WP-21, validées par principal-engineer. Aucune vers une release postérieure."
        example: |-
          STO-014 → STO-010 · STO-015 → STO-014 · STO-017 → STO-014 · validé principal-engineer 2026-04-22
      - title: "Tier de risque par capacité"
        file: backlog/risk-map.md
        guide: "Repris de WP-21, jamais décidé ici. Un désaccord se route vers l'activité 16."
        example: |-
          lecture avancement R2 · signalement R2 · saisie provisoire R1 (WP-21 @ e5a7c31)

      - title: "Carte des slices"
        file: planning/slice-map.md
        guide: "Chaque slice S-nn nommée par son résultat utilisateur — le futur « Résultat de la slice » —, avec ses dépendances, la preuve qui l'acceptera, la démonstration en QA et le tier. Verticale : données, API, écrans et tests ensemble ; aucune slice de plateforme. Ordre : dépendances, puis valeur, risque levé, apprentissage ; une seule en cours à la fois. Première release : S-00 de fondation, petite. Les jalons sont des slices nommées, pas des dates."
        example: |-
          S-00  fondation — le chemin mobile → API → base de bout en bout, isolation par PME prouvée · R2
          S-01  « Un conducteur voit ses chantiers avec un avancement daté et sa catégorie de vérité » · STG-04 · R2 · dépend S-00 · démo : la liste en QA sur un téléphone
          S-02  « Un conducteur repère un écart et le signale sans appeler » · STG-05 · R2 · dépend S-01 · jalon « pilote »
      - title: "Affectation des stories"
        file: planning/slice-map.md
        guide: "Chaque story du backlog : sa slice, ou « reportée » avec la décision (ADR-nn, autorité, date). Aucune story oubliée, aucune nouvelle release créée ici."
        example: |-
          STO-008..014 → S-01 · STO-015..018 → S-02 · STO-019 reportée (ADR-12, PO, 2026-04-22)
      - title: "Baseline manifest"
        file: handoff/baseline-manifest.md
        guide: "Versions et commits : socle (tag), Release Baseline (tag), Design System + delta, socle technique. C'est ce qu'une slice ne peut pas modifier."
        example: |-
          spine-v1 c90f2a7 · rel-pilotage-v1 f08b6d2 · design/system @ c90f2a7 + delta @ f08b6d2 · tech-spine-v1 d13e884
      - title: "NEEDS CLARIFICATION ouverts"
        file: planning/slice-map.md
        guide: "NC-nn : question, ce qu'elle bloque (AC), porteur, échéance, la PREMIÈRE slice qui en a besoin, et sa classe — à décider avant le contrat (seulement si le contrat ne peut pas dire comment construire sans lui), à décider avant l'acceptation (la valeur du prototype est la proposition par défaut, portée comme paramètre nommé), hors v1, technique. Un NC à décider avant le contrat, encore ouvert, empêche le K1 de sa slice."
        example: |-
          NC-02  Un écart clos peut-il être rouvert ? · bloque AC-017.3 · Product Owner · S-02 · à décider avant le contrat · ouvert
          NC-03  Seuil de retard d'un écart · bloque AC-015.2 · Product Owner · S-02 · à décider avant l'acceptation — défaut : 5 jours, paramètre ecart.seuil_jours

  - id: WP-25
    format: mixed
    office: pptx
    layout: "g1-{release-id}.md (les dix sections) · release-baseline.yaml (tags et commits figés)"
    sections:
      - title: "Fermeture d'apprentissage"
        file: g1-{release-id}.md
        guide: "Ce qui a coûté, ce qui a surpris, ce qu'un agent aurait dû détecter — chacun rattaché et routé."
        example: |-
          coûté   2 tours sur WP-19 · surpris   ESTIMÉ incompris sans auteur (P6, P8) · à détecter   critic(design) aurait dû flaguer le badge sans auteur → MCR-03

  # ───────────────────────────── C3 · Boucle de slices ─────────────────────────────

  - id: WP-26
    format: mixed
    office: pptx
    layout: "slice-contract.md (résultat, budget, critères de sortie et preuves, tier, points ouverts, amendements, conditions d'entrée, KEEP / DISCARD) · design/ (Baseline Delta Declaration, prototype, delta de DS) · spec/ (tests définis avant le code, règles, données, API, migrations)"
    sections:
      - title: "Résultat de la slice"
        file: slice-contract.md
        guide: "Un résultat utilisateur en une phrase, démontrable en QA. L'acceptation G3 se prononcera contre cette phrase, pas contre la liste des stories."
        example: |-
          Un conducteur repère un écart et le signale sans appeler.
      - title: "Périmètre et budget"
        file: slice-contract.md
        guide: "Les stories retenues (AC écrits en WP-24) et ce qui est exclu. Règle du budget : ce qu'aucun critère de sortie n'exige est reporté à une slice suivante. La slice ne grandit pas."
        example: |-
          retenues : STO-015 (repérer), STO-016 (trier), STO-017 (signaler) · 11 AC
          exclues : tri secondaire par ancienneté, photos → S-04 — aucun critère de sortie ne les exige
      - title: "Critères de sortie et preuves"
        file: slice-contract.md
        guide: "EXIT-n, chacun avec sa preuve : mode (automatique · manuel · mixte), canal (unitaire · intégration · émulateur · simulateur · web · appareil physique · environnement QA), qui la produit, procédure, condition de réussite, condition d'échec, artefact retenu. Pas de critère sans preuve, pas de preuve sans procédure. Une preuve ne vaut que pour son canal : le simulateur prouve le lancement, pas l'appareil. Une jambe qui ne tournera pas dans cette slice est REPORTÉE à une gate nommée, ou hors périmètre — jamais PASS."
        example: |-
          EXIT-1  l'écart apparaît en tête de liste · automatique · web, QA · e2e/ecart-tri.spec · réussite : 1er rang sur 5 jeux · artefact : rapport e2e
          EXIT-2  le chef reçoit le signalement en < 1 min · mixte · environnement QA · e2e + relecture en QA par release-engineer · échec : > 1 min sur 1 essai sur 5
          EXIT-3  aucun ESTIMÉ présenté comme CONSTATÉ · automatique · unitaire · unit/propagation.test
          EXIT-4  notification reçue sur un téléphone · manuel · appareil physique · REPORTÉE à la gate de readiness mobile
      - title: "Tests définis avant le code"
        file: spec/acceptance-criteria.md
        guide: "Chaque AC matériel → ≥ 1 test nommé (type, fichier), écrit AVANT l'implémentation. Changer un test, c'est amender le contrat — pas l'ajuster au code."
        example: |-
          AC-015.1 → e2e/ecart-tri.spec · AC-017.2 → e2e/signalement.spec, unit/notification.test · 11/11 AC couverts
      - title: "Baseline Delta Declaration"
        file: design/scope.yaml
        guide: "Produite AVANT toute modification : MUST PRESERVE (ce qui ne bouge pas) vs DELTAS AUTORISÉS, chacun justifié par une story. Écart de socle : aucun, sinon EX3."
        example: |-
          MUST PRESERVE   navigation globale · glossaire · catégories de vérité · carte-chantier, états 1 à 7
          DELTAS AUTORISÉS   badge d'écart (STO-015) · bouton signaler (STO-017)
          ÉCART SOCLE   aucun
      - title: "Écrans et prototype"
        file: design/prototype/
        guide: "Pour chaque story, le chemin cliquable qui la démontre sur le prototype vivant, aux trois largeurs, états vides, erreur et chargement compris."
        example: |-
          STO-015 : /chantiers → badge ÉCART en tête · STO-017 : /chantiers/C-03 → Signaler → confirmation · 360 / 768 / 1280
      - title: "Delta de Design System"
        file: design/design-system-delta/
        guide: "Justifié story par story, 7 états par ajout, aucune modification silencieuse d'un composant existant (diff vide sur le socle)."
        example: |-
          + badge-ecart 7/7 états (STO-015) · diff sur design/system existant : vide
      - title: "Règles, données, API, migrations"
        file: spec/technical-spec.md
        guide: "Règles métier citant leur source (baseline, ADR-nn, critic de domaine RG-nn) ; tables, endpoints, migrations numérotées avec la commande de rollback de chacune. Une règle sans source est une invention."
        example: |-
          règle : un écart = relevé ESTIMÉ en retard de plus de 5 jours (ADR-14) · POST /ecarts · migration 0043 create ecart · rollback : drop table
      - title: "Tier de risque et sécurité"
        file: slice-contract.md
        guide: "Le plus haut tier des stories retenues, avec la story qui le porte. R2 ou R3 → escalade humaine en K1."
        example: |-
          R2 (STO-017 notifie un tiers) → K1 escalade PO + autorité Tech
      - title: "Points ouverts"
        file: slice-contract.md
        guide: "NEEDS CLARIFICATION résolus (réponse, qui, quand) ou routés (porteur, échéance). Un NC ouvert ne passe pas K1. Au plus UNE demande de décision au Product Owner, consolidée, posée avant l'acceptation, avec une valeur par défaut — « tout confirmer » doit être une réponse complète."
        example: |-
          NC-02 résolu 2026-05-02 (PO) : un écart clos ne se rouvre pas · demande de décision : seuil de 5 jours — défaut proposé 5
      - title: "Amendements"
        file: slice-contract.md
        guide: "Un écart découvert en construction est un amendement daté — AMD-n : ce qui change, pourquoi, qui l'a accepté —, jamais une croissance. Ce qui dépasse le résultat va à une slice suivante."
        example: |-
          AMD-1  2026-05-06 · EXIT-2 mesuré en QA et non en local · accepté autorité Tech · aucun ajout de périmètre
      - title: "Conditions d'entrée"
        file: slice-contract.md
        guide: "ENTRY-n : ce qui doit être vrai avant le GO, son statut (MET · PENDING · DEFERRED) et ce qui le lève. Y mettre les prérequis EXTERNES — droit de créer le dépôt, identifiants d'hôtes, adhésion aux stores et signature, chaîne d'outils imposée, compte QA stable du Product Owner, dont il fixe lui-même le mot de passe hors Git et hors chat — et chaque apprentissage « material » de la clôture précédente. Un prérequis externe n'est pas une décision produit, mais il se vérifie avant le GO."
        example: |-
          ENTRY-1  S-01 acceptée, clôture lue · MET 2026-05-01
          ENTRY-2  compte QA du conducteur pilote, mot de passe fixé par lui · PENDING — levé par le Product Owner avant le GO
          ENTRY-3  apprentissage S-01-L2 : la notification exige un domaine d'envoi vérifié · MET — DNS vérifié 2026-05-02
      - title: "KEEP / DISCARD"
        file: slice-contract.md
        guide: "Pour la Slice 0 et toute preuve technique : chaque artefact classé KEEP (il entre dans le produit) ou DISCARD (il sert la preuve et sera retiré), AVANT d'être écrit ; le contrôle de dépendances qui interdit KEEP → DISCARD ; ce que la clôture retirera, migration forward-only comprise. Pour une autre slice : « sans objet », et pourquoi."
        example: |-
          sans objet — S-02 n'écrit aucune preuve technique ; tout ce qu'elle produit est KEEP

  - id: WP-27
    format: mixed
    office: docx
    layout: "status.md (identité de la version) · scope-changes.md (écarts classés) · quality/test-strategy.md (résultats, VERDICT, oracles) · quality/test-healing-decisions.md · acceptance/traceability-matrix.md · acceptance/preview-report.md (parcours en QA, matrice état × comportement)"
    sections:
      - title: "Écarts contrat / implémentation"
        file: scope-changes.md
        guide: "Chaque écart classé : manquant · partiel · contredit · non demandé · intentionnellement superseded, avec la décision, l'amendement ou le routage. L'absorption silencieuse est le défaut à empêcher."
        example: |-
          E-01  AC-017.3 (notification hors ligne) · partiel · routé AMD-2, S-03
          E-02  tri secondaire par ancienneté · non demandé · retiré du diff
      - title: "Résultats par critère de sortie"
        file: quality/test-strategy.md
        guide: "Par EXIT et par AC : test, VERT / ROUGE, date, commit. Fait observable, sans interprétation. Produit par quality-engineer."
        example: |-
          EXIT-1  e2e/ecart-tri.spec · VERT · 2026-05-09 · 3c1e0aa
          EXIT-3  unit/propagation.test · ROUGE · 2026-05-09 · 3c1e0aa
      - title: "VERDICT DE CLASSIFICATION"
        file: quality/test-strategy.md
        guide: "PASS · PRODUCT FAILURE · TEST FAILURE · CANNOT VERIFY, par test rouge, rendu par critic(quality) uniquement, avec la cause démontrée."
        example: |-
          EXIT-3  PRODUCT FAILURE — le calcul remonte CONSTATÉ depuis un ESTIMÉ (src/progress.ts:41) · critic(quality) · routé activité 21 · healing interdit (EX4)
      - title: "Healing et re-vérifications"
        file: quality/test-healing-decisions.md
        guide: "Uniquement pour TEST FAILURE : cause (sélecteur, fixture, timing), correction, auteur, puis re-vérification par une passe indépendante. Un défaut produit n'est jamais healed ; trois healings sur le même AC = défaut produit non diagnostiqué."
        example: |-
          AC-016.1  TEST FAILURE — fixture non déterministe · régénérée · re-vérifié critic(quality) 2026-05-10 · VERT
      - title: "Matrice contrat — code — tests — décisions"
        file: acceptance/traceability-matrix.md
        guide: "Une ligne par story : EXIT, AC, fichiers, tests, ADR, amendements. Chaque écart classé. Rien d'absorbé."
        example: |-
          STO-017 · EXIT-2 · AC-017.1..3 · src/api/ecarts, src/web/signaler · e2e/signalement.spec · ADR-14 · AMD-1
      - title: "Parcours exécutés en QA"
        file: acceptance/preview-report.md
        guide: "Parcours JRN joués à la main en QA, sur le prototype vivant recomposé — une seule URL et son commit —, avec résultat et date. Pas seulement en test automatisé."
        example: |-
          JRN-08 joué sur https://qa.example/current @ 2026-05-12 · réussi · release-engineer · composé socle c90f2a7 ⊕ rel-pilotage-v1 ⊕ S-02 3c1e0aa
      - title: "Dette et risques résiduels acceptés"
        file: acceptance/traceability-matrix.md
        guide: "Nommés, avec échéance et porteur. Une dette sans porteur n'est pas acceptée, elle est ignorée."
        example: |-
          D-01  notification hors ligne différée (AC-017.3 partiel) · porteur principal-engineer · échéance S-03
      - title: "Matrice état × comportement"
        file: acceptance/preview-report.md
        guide: "Jouée en QA, sur la version déployée, à la largeur mobile de référence, AVANT toute présentation au Product Owner. Une ligne par élément d'inventaire touché — question, écran, état ; en colonnes : atteint · avant · Back · restauré après rechargement · édité · persistant · reste inchangé · aval. Chaque cellule PASS, ou N/A avec sa raison — jamais vide."
        example: |-
          | Élément | Atteint | Avant | Back | Restauré | Édité | Persistant | Reste inchangé | Aval |
          |---|---|---|---|---|---|---|---|---|
          | Liste des chantiers, badge ÉCART | PASS | PASS | PASS | PASS | N/A — lecture seule | N/A — lecture seule | PASS | PASS |
          | Signaler un écart | PASS | PASS | PASS | PASS | PASS | PASS | PASS | PASS — reçu par le chef |
      - title: "Oracles et causes racines"
        file: quality/test-strategy.md
        guide: "Chaque observation du Product Owner d'une slice précédente devenue ORACLE — une question générale posée à tous les états atteignables. Pour chacun : la question, les états balayés, les touches. Les touches regroupées par cause racine, et la correction faite au mécanisme, jamais à l'instance. Un oracle reste en régression."
        example: |-
          OR-01  « d'où vient ce nombre ? » · 14 états balayés · 0 touche
          OR-02  « le même partout pour le même état ? » · 14 états · 2 touches → cause racine : avancement recalculé côté écran (src/web/progress.ts) · corrigé au calcul partagé · 0 touche au rejeu
      - title: "Identité de la version"
        file: status.md
        guide: "Ce qui tourne derrière l'URL de QA : commit, empreinte de l'artefact, version de migration, empreinte de configuration, versions épinglées. L'artefact validé en DEV est celui promu en QA — même empreinte, lue sur /version. Golden path de la CI hébergée : VERT avec son lien, ou NOT RUN et pourquoi — jamais PASS."
        example: |-
          commit 3c1e0aa · image sha256:9d4c…e1 · migration 0043 · config sha256:51ab…07 · lockfile épinglé
          /version en QA = DEV · CI hébergée : golden path VERT, run 1184

  - id: WP-28
    format: mixed
    office: docx
    layout: "reviews/engineering-review.md · reviews/design-conformance.md · security/security-review.md · security/threat-model.md · security/pentest-summary.md — chaque voie sa propre passe, ses FND au format unique"
    sections:
      - title: "Revue d'ingénierie"
        file: reviews/engineering-review.md
        guide: "Adossée au diff réel (plage de commits, fichiers). Carte AC → Evidence vérifiée EFFECTIVE : chaque evidence exécutée, pas seulement présente."
        example: |-
          diff 7f2a91c..3c1e0aa (14 fichiers) · 23/23 AC avec evidence exécutée · FND-07 MAJOR (voir Findings)
      - title: "Conformité design"
        file: reviews/design-conformance.md
        guide: "Comparaison écran par écran prototype vs implémentation, visual diffs joints, écarts classés."
        example: |-
          S-11 diff 0,4 % (ombre) OBSERVATION · S-12 conforme · S-14 hors périmètre S-01
      - title: "Revue de sécurité"
        file: security/security-review.md
        guide: "Threat model mis à jour, secrets, auth, accès données, dépendances (versions, CVE). Aucun secret en clair : le dire avec l'outil utilisé."
        example: |-
          threat-model.md v2 · gitleaks 0 secret · auth par tenant vérifiée (test contrat) · 0 CVE critique sur 41 dépendances
      - title: "Pentest proportionnel"
        file: security/pentest-summary.md
        guide: "Si tier R2 ou R3 : périmètre, méthode, findings DÉMONTRÉS (requête, réponse), aucune action destructive. Sinon « non requis, tier R1 »."
        example: |-
          R2 · périmètre api/chantiers, api/releves · IDOR testé sur 40 identifiants : 0 fuite · FND-09 MINOR (en-tête serveur verbeux)
      - title: "Findings"
        file: reviews/engineering-review.md
        guide: "FND-nn : sévérité · domaine (PRODUIT, défaut de l'artefact jugé, ou CONTRÔLE, défaut d'un gabarit, d'un contrôle K, d'un validateur) · tier de surface · entité (STO/AC/DSN/ADR) · ce qu'il bloque (cette gate, l'acceptation, la mise en production, ou dette) et son échéance · démontré par · émis par · passe · fermeture par le critic émetteur uniquement. Deux comptes : l'éligibilité produit se lit sur PRODUIT seul."
        example: |-
          FND-07  MAJOR · PRODUIT · R2 · AC-014.2 · bloque l'acceptation de S-02 · diff src/progress.ts:41 · critic(engineering) passe 1 · fermeture : passe 2 requise
          FND-08  MINOR · CONTRÔLE · gabarit de revue sans colonne canal · bloque la prochaine revue, pas G3 · conformance-auditor
          PRODUIT  BLOCKER 0 · MAJOR 1 · MINOR 1 · OBSERVATION 1    CONTRÔLE  MINOR 1
      - title: "Dispositions"
        file: reviews/engineering-review.md
        guide: "Une ligne par finding et par objection d'un challenge : ACCEPTÉ (le changement et son commit) · RÉDUIT (la partie retenue, la partie routée en point ouvert) · REJETÉ (motif et preuve) · NON VÉRIFIÉ (pointeur, sans effet). Chaque disposition vérifiée contre la source par un autre que l'émetteur ; seul ce qui est vérifié change l'état. Publier les comptes."
        example: |-
          FND-07  ACCEPTÉ · calcul déplacé côté serveur · 4be21f0 · vérifié par critic(quality)
          OBJ-03  RÉDUIT · tri par ancienneté retenu, filtre par chef routé NC-05
          OBJ-04  REJETÉ · le seuil de 5 jours est une option du Product Owner, pas une correction
          comptes  3 objections : 1 acceptée · 1 réduite · 1 rejetée

  - id: WP-29
    format: markdown
    office: pptx
    layout: "g3-{slice-id}.md"
    sections:
      - title: "Fermeture d'apprentissage"
        guide: "Ce qui a coûté, surpris, aurait dû être détecté — rattaché et routé. Chaque apprentissage « material » devient une condition d'entrée de la slice suivante."
        example: |-
          coûté   1 PRODUCT FAILURE sur la propagation · à détecter   un test de propagation aurait dû figurer au contrat de slice → MCR-05 (règle : test de propagation obligatoire)
          S-02-L1 material   le domaine d'envoi doit être vérifié avant toute notification → ENTRY-2 de S-03
      - title: "Script d'acceptation"
        guide: "Une page au plus, pour le Product Owner : en tête, la demande de décision consolidée, chaque item avec sa valeur par défaut — « tout confirmer » est une réponse complète ; puis les parcours à jouer, le canal, l'URL, la version lue sur /version, son compte QA stable, et le résultat attendu de chacun. Seulement les moments que la machine ne sait pas juger."
        example: |-
          décision   seuil d'écart : 5 jours (défaut) — confirmer ou corriger
          canal      web mobile · https://qa.example/current · version 3c1e0aa · compte conducteur.pilote
          1  ouvrir la liste : le chantier C-03 porte le badge ÉCART en tête
          2  signaler l'écart : le chef le reçoit en moins d'une minute
      - title: "Audit de non-perte"
        guide: "Après l'acceptation, deux sens, chiffrés. Sens A : chaque élément ACTIVE de la lignée a une destination dans le produit courant. Sens B : chaque élément de l'expérience d'origine a une disposition. Une absence dans un livrable postérieur n'est pas une supersession : seules les supersessions enregistrées retirent un élément. Zéro disparition inexpliquée."
        example: |-
          sens A   41 éléments ACTIVE · 41 avec destination
          sens B   23 éléments d'origine · 22 conservés · 1 superseded par ADR-15 · 0 disparition inexpliquée
      - title: "Prochaine action"
        guide: "Une ligne : l'activité suivante, l'entrée qui lui manque, qui la lève. Un agent sans historique doit pouvoir repartir de là."
        example: |-
          activité 20 — contrat de S-03 · manque ENTRY-2 (domaine d'envoi) · levé par principal-engineer

  # ───────────────────────────── C4 · Mise en production ─────────────────────────────

  - id: WP-30
    format: mixed
    office: docx
    layout: "release-readiness.md (qualité, sécurité, re-review, observabilité, fenêtre, autorités) · rollback-plan.md (plan ET preuve d'exécution)"
    sections:
      - title: "Qualité, sécurité, migrations, observabilité, documentation"
        file: release-readiness.md
        guide: "Une ligne par domaine : preuve (chemin, commit) et état. Pas de case à cocher sans chemin."
        example: |-
          qualité   G3 S-01, S-02 acceptés · sécurité   security-review S-02 @ 9d4c… · migrations   0040..0042 testées sur staging · doc   runbook v1.2
      - title: "Plan de rollback ET preuve de son exécution"
        file: rollback-plan.md
        guide: "Plan (stratégie, commande, durée cible) PUIS preuve : environnement, commit déployé → restauré, durée mesurée, données restaurées, exécuté par, vérifié par un rôle distinct, date, journal brut. Un champ vide = non testé = refus automatique."
        example: |-
          plan     bascule progressive 10 → 50 → 100 %, retour < 5 min
          preuve   staging · 7f2a91c → 3c1e0aa · 4 min 12 s · migration 0042 inversée, point de restauration 2026-06-14T09:00Z vérifié · exécuté release-engineer · vérifié critic(engineering) · journal deployments/v1.2.0/rollback-run.log
      - title: "Evidence sécurité proportionnelle au tier"
        file: release-readiness.md
        guide: "R2/R3 : pentest et threat model à jour, cités. R0/R1 : revue standard citée."
        example: |-
          R2 · pentest-summary S-02 @ 9d4c… · threat-model v2
      - title: "Verdict de re-review"
        file: release-readiness.md
        guide: "Pour chaque finding corrigé depuis la dernière passe : FND, correctif, re-review par le critic émetteur, verdict."
        example: |-
          FND-09  corrigé 2026-06-10 · re-review security-engineer passe 2 · fermé
      - title: "Plan d'observabilité et seuils d'alerte"
        file: release-readiness.md
        guide: "Signaux surveillés, seuils chiffrés, où ils sont visibles, qui est alerté."
        example: |-
          5xx > 0,5 % / 5 min · p95 > 800 ms · relevés / h < 50 % de la médiane · tableau observabilité v1.2 · alerte release-engineer
      - title: "Fenêtre de déploiement et critères d'abandon"
        file: release-readiness.md
        guide: "Fenêtre horaire et critères d'abandon chiffrés, décidés avant, pas pendant."
        example: |-
          mardi 09:00–11:00, hors clôture mensuelle · abandon si un seuil ci-dessus est franchi ou si JRN-07 échoue en prod
      - title: "En tier R3 : deux autorités humaines distinctes"
        file: release-readiness.md
        guide: "Deux noms, deux dates, enregistrés séparément. En R2 ou moins : « non applicable » avec le tier."
        example: |-
          non applicable — tier R2

  - id: WP-31
    format: mixed
    office: docx
    layout: "deployment-record.md (stratégie, DEP, décision garder / rollback) · post-deploy-verification.md (vérification, signaux) · also learning/{release-id}/outcomes.md (décision produit)"
    sections:
      - title: "Stratégie progressive appliquée"
        file: deployment-record.md
        guide: "Paliers réels avec horodatage, et la vérification du point de rollback AVANT la bascule (renvoi à WP-30)."
        example: |-
          point de rollback vérifié 08:52 · 10 % 09:04 · 50 % 09:40 · 100 % 10:25 · 2026-06-16
      - title: "DEP-vX.Y — stories livrées"
        file: deployment-record.md
        guide: "Identifiant de déploiement, hash de build, stories incluses (trace K3 vers G3)."
        example: |-
          DEP-v1.2.0 · build 9d4c… · STO-008..018 (S-01, S-02) · G3 S-01 2026-05-12, G3 S-02 2026-06-09
      - title: "Vérification post-déploiement"
        file: post-deploy-verification.md
        guide: "Sur la fenêtre définie : santé, métriques, erreurs, sécurité, parcours critiques joués en production. Résultats datés."
        example: |-
          fenêtre 48 h · 5xx 0,1 % · p95 620 ms · JRN-07 et JRN-08 joués en prod 2026-06-16 11:00 · 0 alerte sécurité
      - title: "Décision garder / rollback"
        file: deployment-record.md
        guide: "GARDER ou ROLLBACK, motif, autorité, date, heure."
        example: |-
          GARDER · seuils respectés sur 48 h · autorité de release N. Rami · 2026-06-18 10:30
      - title: "Signaux confrontés aux métriques de succès"
        file: post-deploy-verification.md
        guide: "Pour chaque MET-nn : valeur observée, source, écart à la cible. Les conclusions sont séparées des données, explicitement."
        example: |-
          MET-01  observé 2,3 h / sem à 28 j (journal, 9 pilotes) · cible < 1 h à 90 j · donnée : baisse de 4,8 à 2,3 · conclusion : tendance conforme, non atteinte
          MET-02  observé 0,8 j médian · cible < 1 j · atteint
      - title: "Décision produit"
        file: post-deploy-verification.md
        guide: "POURSUIVRE · CORRIGER · REDÉCOUPER · PIVOTER · ARRÊTER, avec motif, autorité (HUMAN OWNER), date, et les mises à jour du backlog et de WP-15 qui en découlent."
        example: |-
          POURSUIVRE · revoir MET-01 à 90 j · HUMAN OWNER S. Alaoui · 2026-07-14 · WP-15 : REL-terrain confirmée en 2e position
